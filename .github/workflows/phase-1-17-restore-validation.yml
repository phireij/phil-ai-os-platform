name: Phase 1.17 Restore Validation
on:
  push:
    branches:
      - ops/phase-1.17-backup-discovery
    paths:
      - '.github/phase-1-17-restore-validation-trigger'
permissions:
  contents: read
jobs:
  restore-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Isolated restore validation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATUS=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/backups/status/latest.json
          test -s "$STATUS"
          BACKUP=$(python3 -c 'import json;print(json.load(open("/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/backups/status/latest.json"))["backup"])')
          test -s "$BACKUP"
          TMPDIR=$(mktemp -d /tmp/phil-ai-os-restore-XXXXXX)
          trap 'rm -rf "$TMPDIR"' EXIT
          RESTORED="$TMPDIR/restored.db"
          python3 - "$BACKUP" "$RESTORED" <<'PY'
import hashlib, sqlite3, sys
from pathlib import Path
src=Path(sys.argv[1]); dst=Path(sys.argv[2])
with sqlite3.connect(f'file:{src}?mode=ro',uri=True) as s, sqlite3.connect(dst) as d:
    s.backup(d)
def qc(p):
    with sqlite3.connect(f'file:{p}?mode=ro',uri=True) as c:
        quick=c.execute('PRAGMA quick_check').fetchone()[0]
        tables=c.execute("select count(*) from sqlite_master where type='table'").fetchone()[0]
        schema='\n'.join(r[0] or '' for r in c.execute("select sql from sqlite_master where sql is not null order by type,name"))
        counts={r[0]:c.execute('select count(*) from "'+r[0].replace('"','""')+'"').fetchone()[0] for r in c.execute("select name from sqlite_master where type='table' and name not like 'sqlite_%' order by name")}
        return quick,tables,hashlib.sha256(schema.encode()).hexdigest(),counts
s=qc(src); r=qc(dst)
assert s[0]=='ok' and r[0]=='ok'
assert s[1]==r[1]
assert s[2]==r[2]
assert s[3]==r[3]
print('source_quick_check='+s[0])
print('restored_quick_check='+r[0])
print('tables='+str(r[1]))
print('schema_sha256='+r[2])
print('row_counts_match=true')
print('restored_size='+str(dst.stat().st_size))
PY
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-monitor.service
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo control_api_health=ok
          echo PHIL_AI_OS_PHASE_1_17_ISOLATED_RESTORE_OK
          REMOTE
