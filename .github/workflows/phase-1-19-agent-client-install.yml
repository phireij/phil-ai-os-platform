name: Phase 1.19 Install Hermes Mission Control Client

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-agent-client-install.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 3; done
          test -s ~/.ssh/known_hosts
      - name: Install and validate Mission Control client
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          CLIENT=/tmp/philaios-mission-control
          cat > "$CLIENT" <<'PY'
          #!/usr/bin/env python3
          import json, os, sys, urllib.request
          token_path=os.getenv('PHIL_AI_OS_CONTROL_API_TOKEN_FILE','/run/philaios/hermes_control_api_token')
          base=os.getenv('PHIL_AI_OS_CONTROL_API_URL','http://phil-ai-os-core-control-api-1:4870')
          commands={'snapshot':'/v1/mission-control/snapshot','approvals':'/v1/approvals/recent','executions':'/v1/execution/recent'}
          if len(sys.argv)!=2 or sys.argv[1] not in commands:
              print('usage: philaios-mission-control <snapshot|approvals|executions>',file=sys.stderr); sys.exit(2)
          token=open(token_path).read().strip()
          req=urllib.request.Request(base+commands[sys.argv[1]],headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(req,timeout=5) as r:
              print(json.dumps(json.load(r),indent=2,sort_keys=True))
          PY
          chmod 755 "$CLIENT"
          docker cp "$CLIENT" "$HERMES:/usr/local/bin/philaios-mission-control"
          rm -f "$CLIENT"
          echo '=== PHASE 1.19 AGENT CLIENT INSTALL ==='
          echo "client=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control && echo installed || echo missing)"
          for cmd in snapshot approvals executions; do
            docker exec "$HERMES" /usr/local/bin/philaios-mission-control "$cmd" >/tmp/p119-client.out
            echo "command=$cmd result=ok"
          done
          echo "execute_client=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-execute && echo ready || echo missing)"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo production_change=client_install_only
          echo PHIL_AI_OS_PHASE_1_19_AGENT_CLIENT_INSTALL_OK
          REMOTE
