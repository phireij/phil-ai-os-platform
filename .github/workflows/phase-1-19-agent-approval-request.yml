name: Phase 1.19 Hermes Approval Request Command

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-agent-approval-request.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 3; done
          test -s ~/.ssh/known_hosts
      - name: Add request command and validate pending state
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          HOST_CLIENT=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/hermes/philaios-mission-control.py
          ROLLBACK="$HOST_CLIENT.phase119-request.rollback"
          cp -a "$HOST_CLIENT" "$ROLLBACK"
          rollback(){ rc=$?; cp -a "$ROLLBACK" "$HOST_CLIENT" || true; echo automatic_rollback=performed; exit "$rc"; }
          trap rollback ERR
          cat > "$HOST_CLIENT" <<'PY'
          #!/usr/bin/env python3
          import json, os, sys, urllib.request
          token_path=os.getenv('PHIL_AI_OS_CONTROL_API_TOKEN_FILE','/run/philaios/hermes_control_api_token')
          base=os.getenv('PHIL_AI_OS_CONTROL_API_URL','http://phil-ai-os-core-control-api-1:4870')
          reads={'snapshot':'/v1/mission-control/snapshot','approvals':'/v1/approvals/recent','executions':'/v1/execution/recent'}
          def request_json(path, payload=None):
              token=open(token_path).read().strip()
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=5) as r: return json.load(r)
          if len(sys.argv)>=2 and sys.argv[1] in reads and len(sys.argv)==2:
              print(json.dumps(request_json(reads[sys.argv[1]]),indent=2,sort_keys=True)); sys.exit(0)
          if len(sys.argv)>=3 and sys.argv[1]=='request':
              task=' '.join(sys.argv[2:]).strip()
              if not task: print('task text required',file=sys.stderr); sys.exit(2)
              body=request_json('/v1/approvals/request',{'task_text':task,'source':'hermes-mission-control','requester':'hermes','requested_by':'hermes'})
              print(json.dumps(body,indent=2,sort_keys=True)); sys.exit(0)
          print('usage: philaios-mission-control <snapshot|approvals|executions|request TASK>',file=sys.stderr); sys.exit(2)
          PY
          chmod 755 "$HOST_CLIENT"
          echo '=== PHASE 1.19 AGENT APPROVAL REQUEST ==='
          test -x "$HOST_CLIENT" && echo host_client=updated
          OUT=$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control request 'PHASE_1_19_HERMES_APPROVAL_REQUEST_TEST')
          APPROVAL_ID=$(printf '%s' "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("approval_id") or "")')
          STATE=$(printf '%s' "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("state") or d.get("status") or "")')
          test -n "$APPROVAL_ID"
          echo "approval_id=$APPROVAL_ID"
          echo "request_state=${STATE:-pending}"
          RECENT=$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals)
          printf '%s' "$RECENT" | grep -q "$APPROVAL_ID"
          echo approval_visible_in_mission_control=yes
          echo self_approval_capability=not_added
          echo execution_invoked=no
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          trap - ERR
          echo provider_call=none
          echo production_change=mission_control_request_command
          echo PHIL_AI_OS_PHASE_1_19_AGENT_APPROVAL_REQUEST_OK
          REMOTE
