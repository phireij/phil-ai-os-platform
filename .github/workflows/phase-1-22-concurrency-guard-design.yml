name: Phase 1.22 Concurrency Guard Design Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-22-concurrency-guard-design.yml'

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3; do
            echo "ssh_preflight_attempt=$attempt"
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then
              echo ssh_preflight=ok
              exit 0
            fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Capture exact execution source and guard insertion surface
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.22 CONCURRENCY GUARD DESIGN PROBE ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          echo production_allowlist=general_only

          docker exec "$CONTROL" python - <<'PY'
          from pathlib import Path
          p=Path('/app/app.py')
          lines=p.read_text(errors='replace').splitlines()
          for start,end,label in [(940,1135,'routed_execute'),(3460,3565,'execute_http_handler'),(1,140,'imports_and_globals')]:
              print('=== '+label+' ===')
              for i in range(start-1,min(end,len(lines))):
                  print(f'{i+1:05d}: {lines[i]}')
          PY

          echo '--- sqlite runtime properties ---'
          docker exec "$CONTROL" python - <<'PY'
          import sqlite3
          p='/app/state/control-plane.db'
          con=sqlite3.connect(p)
          print('journal_mode='+str(con.execute('pragma journal_mode').fetchone()[0]))
          print('busy_timeout='+str(con.execute('pragma busy_timeout').fetchone()[0]))
          print('locking_mode='+str(con.execute('pragma locking_mode').fetchone()[0]))
          print('threadsafety='+str(sqlite3.threadsafety))
          PY

          echo '--- app deployment source/mount mapping ---'
          docker inspect "$CONTROL" --format '{{range .Mounts}}mount={{.Type}}:{{.Source}}->{{.Destination}} rw={{.RW}}{{println}}{{end}}'
          docker inspect "$CONTROL" --format 'image={{.Config.Image}} cmd={{json .Config.Cmd}}'

          echo provider_call=none
          echo production_change=none
          echo routine_activation=false
          echo design_probe=read_only
          echo next_action=PHASE_1_22_CONCURRENCY_GUARD_IMPLEMENTATION
          echo PHIL_AI_OS_PHASE_1_22_CONCURRENCY_GUARD_DESIGN_PROBE_OK
          REMOTE