name: Phase 1.22 Concurrency Guard Implementation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-22-concurrency-guard-implementation.yml'

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3; do
            echo "ssh_preflight_attempt=$attempt"
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then
              echo ssh_preflight=ok
              exit 0
            fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Implement routine single-flight guard in active deployment source
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.22 CONCURRENCY GUARD IMPLEMENTATION V2 ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          ! grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=.*routine' <<<"$ENV"
          echo production_allowlist=general_only

          # Resolve the live Compose project from the running container itself.
          WORKDIR="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          CONFIG_FILES="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
          SERVICE="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
          test -n "$WORKDIR" -a -n "$CONFIG_FILES" -a -n "$SERVICE"
          COMPOSE="${CONFIG_FILES%%,*}"
          if [[ "$COMPOSE" != /* ]]; then COMPOSE="$WORKDIR/$COMPOSE"; fi
          test -f "$COMPOSE"
          case "$WORKDIR" in *backup*|*.bak*|*archive*) echo unsafe_workdir="$WORKDIR"; exit 1;; esac
          echo active_workdir="$WORKDIR"
          echo active_compose="$COMPOSE"
          echo active_service="$SERVICE"

          # Ask Compose for the actual build context used by the live service.
          CONFIG_JSON="$(docker compose -f "$COMPOSE" config --format json)"
          BUILD_CONTEXT="$(printf '%s' "$CONFIG_JSON" | python3 -c 'import json,sys,os; d=json.load(sys.stdin); s=os.environ["SERVICE"]; b=d["services"][s].get("build"); print((b.get("context") if isinstance(b,dict) else b) or "")' SERVICE="$SERVICE" 2>/dev/null || true)"
          # Fallback for shells where env placement above is unsupported.
          if [ -z "$BUILD_CONTEXT" ]; then
            BUILD_CONTEXT="$(SERVICE="$SERVICE" printf '%s' "$CONFIG_JSON" | SERVICE="$SERVICE" python3 -c 'import json,sys,os; d=json.load(sys.stdin); b=d["services"][os.environ["SERVICE"]].get("build"); print((b.get("context") if isinstance(b,dict) else b) or "")' 2>/dev/null || true)"
          fi
          test -n "$BUILD_CONTEXT"
          if [[ "$BUILD_CONTEXT" != /* ]]; then BUILD_CONTEXT="$(cd "$(dirname "$COMPOSE")" && realpath "$BUILD_CONTEXT")"; fi
          case "$BUILD_CONTEXT" in *backup*|*.bak*|*archive*) echo unsafe_build_context="$BUILD_CONTEXT"; exit 1;; esac
          test -d "$BUILD_CONTEXT"
          echo active_build_context="$BUILD_CONTEXT"

          # Select app.py only inside the active build context and require exact live-source identity.
          APP="$(find "$BUILD_CONTEXT" -type f -name app.py -not -path '*/backup*/*' -not -path '*/*.bak*/*' -not -path '*/archive*/*' | head -n1 || true)"
          test -n "$APP" -a -f "$APP"
          grep -q 'def routed_execute' "$APP"
          LIVE_HASH="$(docker exec "$CONTROL" sha256sum /app/app.py | awk '{print $1}')"
          SOURCE_HASH="$(sha256sum "$APP" | awk '{print $1}')"
          echo live_hash="$LIVE_HASH"
          echo source_hash="$SOURCE_HASH"
          test "$LIVE_HASH" = "$SOURCE_HASH"
          echo active_source_identity=verified

          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP="${APP}.phase122-pre-concurrency-${TS}.bak"
          cp -a "$APP" "$BACKUP"
          echo rollback_snapshot="$BACKUP"

          python3 - "$APP" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          marker='PHIL_AI_OS_PHASE_1_22_ROUTINE_SINGLE_FLIGHT_GUARD'
          if marker in s:
              print('guard_source=already_present'); raise SystemExit(0)
          lines=s.splitlines(True); insert=0
          for i,line in enumerate(lines):
              if line.startswith('import ') or line.startswith('from '): insert=i+1
              elif insert and line.strip() and not line.startswith(('import ','from ')): break
          lines.insert(insert,'import threading\n'); s=''.join(lines)
          anchor='def routed_execute('; idx=s.find(anchor)
          if idx < 0: raise SystemExit('routed_execute not found')
          s=s[:idx]+'# PHIL_AI_OS_PHASE_1_22_ROUTINE_SINGLE_FLIGHT_GUARD\n_ROUTINE_EXECUTION_LOCK = threading.Lock()\n\n'+s[idx:]
          idx=s.find(anchor); pos=idx; depth=0; body=None
          while pos < len(s):
              ch=s[pos]
              if ch=='(': depth+=1
              elif ch==')': depth-=1
              elif ch==':' and depth==0:
                  body=s.find('\n',pos)+1; break
              pos+=1
          if body is None: raise SystemExit('signature end not found')
          pa=s.find('_provider_execute(',body)
          if pa < 0: raise SystemExit('provider execution anchor not found')
          line_start=s.rfind('\n',body,pa)+1
          prefix=s[line_start:pa]; indent=prefix[:len(prefix)-len(prefix.lstrip())]
          stmt_start=line_start; i=stmt_start; par=0; quote=None; esc=False; stmt_end=None
          while i < len(s):
              c=s[i]
              if quote:
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c==quote: quote=None
              else:
                  if c in ('\"',"'"): quote=c
                  elif c in '([{': par+=1
                  elif c in ')]}': par-=1
                  elif c=='\n' and par==0: stmt_end=i+1; break
              i+=1
          if stmt_end is None: raise SystemExit('provider statement end not found')
          stmt=s[stmt_start:stmt_end]
          if 'return ' in stmt: raise SystemExit('unsupported direct return provider statement')
          acquire=(f"{indent}__phase122_routine_lock_acquired = False\n"
                   f"{indent}if task_class == 'routine':\n"
                   f"{indent}    __phase122_routine_lock_acquired = _ROUTINE_EXECUTION_LOCK.acquire(blocking=False)\n"
                   f"{indent}    if not __phase122_routine_lock_acquired:\n"
                   f"{indent}        return 409, {{'status':'routine_execution_busy','detail':'routine concurrency limit reached'}}\n"
                   f"{indent}try:\n")
          indented=''.join(indent+'    '+ln[len(indent):] if ln.startswith(indent) else indent+'    '+ln for ln in stmt.splitlines(True))
          release=(f"{indent}finally:\n{indent}    if __phase122_routine_lock_acquired:\n{indent}        _ROUTINE_EXECUTION_LOCK.release()\n")
          p.write_text(s[:stmt_start]+acquire+indented+release+s[stmt_end:])
          print('guard_source=installed')
          PY

          python3 -m py_compile "$APP" || { cp -a "$BACKUP" "$APP"; echo rollback=syntax_failure; exit 1; }
          grep -q 'PHIL_AI_OS_PHASE_1_22_ROUTINE_SINGLE_FLIGHT_GUARD' "$APP"
          echo syntax_validation=ok

          cd "$WORKDIR"
          docker compose -f "$COMPOSE" build "$SERVICE" || { cp -a "$BACKUP" "$APP"; exit 1; }
          docker compose -f "$COMPOSE" up -d --no-deps --force-recreate "$SERVICE"
          for i in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:4870/healthz >/dev/null 2>&1 && break
            sleep 2
            [ "$i" -lt 30 ] || { cp -a "$BACKUP" "$APP"; docker compose -f "$COMPOSE" build "$SERVICE"; docker compose -f "$COMPOSE" up -d --no-deps --force-recreate "$SERVICE"; exit 1; }
          done
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          NEWENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$NEWENV"
          ! grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=.*routine' <<<"$NEWENV"
          docker exec "$CONTROL" grep -q 'PHIL_AI_OS_PHASE_1_22_ROUTINE_SINGLE_FLIGHT_GUARD' /app/app.py
          echo guard_deployed=true
          echo routine_activation=false
          echo provider_call=none
          echo next_action=PHASE_1_22_CONCURRENCY_GUARD_VALIDATION
          echo PHIL_AI_OS_PHASE_1_22_CONCURRENCY_GUARD_IMPLEMENTATION_OK
          REMOTE