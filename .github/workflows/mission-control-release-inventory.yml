name: Mission Control Release Inventory Read-only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      HOSTNAME: miscon.phireij.cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Inventory allowlisted Mission Control components without content access
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          port="${VPS_PORT:-22}"
          remote="$VPS_USER@$VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          opts=(-4 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          workload_fingerprint() { docker ps --format '{{.Names}}|{{.Image}}|{{.State}}' | sort | sha256sum | cut -d' ' -f1; }
          before="$(workload_fingerprint)"
          inventory_component() {
            local name="$1" expected_image="$2"
            if ! docker inspect "$name" >/dev/null 2>&1; then
              echo "component=$name present=false"
              return 0
            fi
            local image running readonly network privileged
            image="$(docker inspect "$name" --format '{{.Config.Image}}')"
            running="$(docker inspect "$name" --format '{{.State.Running}}')"
            readonly="$(docker inspect "$name" --format '{{.HostConfig.ReadonlyRootfs}}')"
            network="$(docker inspect "$name" --format '{{.HostConfig.NetworkMode}}')"
            privileged="$(docker inspect "$name" --format '{{.HostConfig.Privileged}}')"
            [[ "$image" =~ ^"$expected_image"@sha256:[0-9a-f]{64}$ ]]
            test "$privileged" = false
            echo "component=$name present=true image=${image#*@} running=$running readonly_rootfs=$readonly network=$network privileged=$privileged"
          }
          inventory_component phil-ai-os-mission-control-readonly ghcr.io/phireij/phil-ai-os-platform/mission-control-readonly
          inventory_component phil-ai-os-mission-control-google-ceo-session ghcr.io/phireij/phil-ai-os-platform/mission-control-google-ceo-session
          inventory_component phil-ai-os-mission-control-read-model-bridge ghcr.io/phireij/phil-ai-os-platform/mission-control-read-model-bridge
          probe=phil-ai-os-mission-control-google-identity-probe
          inventory_component "$probe" ghcr.io/phireij/phil-ai-os-platform/mission-control-google-identity-probe
          # Route cutover retires this predecessor.  Its absence is acceptable,
          # but an extant container must remain stopped so the inventory cannot
          # treat a dual-route regression as healthy.
          if docker inspect "$probe" >/dev/null 2>&1; then
            test "$(docker inspect "$probe" --format '{{.State.Running}}')" = false
          fi
          echo 'retired_identity_probe_running=false'
          after="$(workload_fingerprint)"
          test "$before" = "$after"
          echo 'mission_control_release_inventory_completed=true existing_workloads_unchanged=true content_accessed=false authority_effect=none'
          REMOTE
          test "$(curl --fail-with-body --silent --show-error --max-time 15 "https://$HOSTNAME/healthz")" = '{"status":"ok","mode":"read_only"}'
          test "$(curl --fail-with-body --silent --show-error --max-time 15 "https://$HOSTNAME/api/healthz")" = '{"status":"ok","mode":"authenticated_control_plane","authority_effect":"none"}'
          test "$(curl --fail-with-body --silent --show-error --max-time 15 "https://$HOSTNAME/auth/google/healthz")" = 'session_ready;conversation_authority=enabled'
          echo 'public_component_health=green authority_effect=none'
