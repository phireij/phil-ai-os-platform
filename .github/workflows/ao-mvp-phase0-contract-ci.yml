name: AO-MVP Phase 0 Contract CI

on:
  pull_request:
    paths:
      - "docs/AO_MVP_PHASE_0_*.md"
      - "ops/project-registry/**"
      - "scripts/validate_ao_mvp_phase0.py"
      - "scripts/reconcile_ao_project_state.py"
      - "scripts/test_reconcile_ao_project_state.py"
      - "scripts/ao_mvp_patch_mission_control_project_read_model.py"
      - "scripts/test_ao_mvp_mission_control_project_read_model.py"
      - "ops/project-state/**"
      - "ops/autonomous-work-queue/**"
      - "scripts/validate_ao_mvp_work_queue.py"
      - ".github/workflows/ao-mvp-phase0-contract-ci.yml"
  push:
    branches:
      - "ao-mvp/**"
    paths:
      - "docs/AO_MVP_PHASE_0_*.md"
      - "ops/project-registry/**"
      - "scripts/validate_ao_mvp_phase0.py"
      - "scripts/reconcile_ao_project_state.py"
      - "scripts/test_reconcile_ao_project_state.py"
      - "scripts/ao_mvp_patch_mission_control_project_read_model.py"
      - "scripts/test_ao_mvp_mission_control_project_read_model.py"
      - "ops/project-state/**"
      - "ops/autonomous-work-queue/**"
      - "scripts/validate_ao_mvp_work_queue.py"
      - ".github/workflows/ao-mvp-phase0-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate A0-inert AO-MVP contracts
        run: |
          python scripts/validate_ao_mvp_phase0.py
          python scripts/test_reconcile_ao_project_state.py
          python scripts/test_ao_mvp_mission_control_project_read_model.py
          python scripts/validate_ao_mvp_work_queue.py
