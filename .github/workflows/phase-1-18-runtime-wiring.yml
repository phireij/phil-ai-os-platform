name: Phase 1.18 Runtime Wiring Discovery
on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-runtime-wiring-trigger'
      - '.github/workflows/phase-1-18-runtime-wiring.yml'
permissions:
  contents: read
jobs:
  discover-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only runtime wiring classification
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          test -n "$HERMES"
          CMD=$(docker inspect "$HERMES" --format '{{json .Config.Cmd}}')
          ENTRY=$(docker inspect "$HERMES" --format '{{json .Config.Entrypoint}}')
          EXEC_PROC=$(docker exec "$HERMES" sh -lc "ps -eo args 2>/dev/null | grep -F '/usr/local/bin/philaios-execute' | grep -v grep | wc -l" | tr -d ' ')
          ADVISORY_PROC=$(docker exec "$HERMES" sh -lc "ps -eo args 2>/dev/null | grep -F '/usr/local/bin/philaios-advisory' | grep -v grep | wc -l" | tr -d ' ')
          CONFIG_REFS=$(docker exec "$HERMES" sh -lc "grep -RIl 'philaios-execute' /opt/data /etc 2>/dev/null | head -n 20 | wc -l" | tr -d ' ')
          SHELL_REFS=$(docker exec "$HERMES" sh -lc "grep -RIl 'philaios-execute' /usr/local/bin /opt/hermes 2>/dev/null | head -n 50 | wc -l" | tr -d ' ')
          echo '=== PHASE 1.18 RUNTIME WIRING ==='
          echo "container_cmd=$CMD"
          echo "container_entrypoint=$ENTRY"
          echo "philaios_execute_running_refs=$EXEC_PROC"
          echo "philaios_advisory_running_refs=$ADVISORY_PROC"
          echo "active_config_file_refs=$CONFIG_REFS"
          echo "code_or_wrapper_refs=$SHELL_REFS"
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo PHIL_AI_OS_PHASE_1_18_RUNTIME_WIRING_OK
          REMOTE
