name: Phase 2.1O O4 Production Correlation Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1o-o4-production-correlation-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"; : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts; sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Production read-only correlation proof
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service

          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('/app/state/control-plane.db')
          c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          registry=[tuple(r) for r in c.execute('select agent_id,authority_ceiling,enabled,assignable from agent_registry order by agent_id')]
          assert registry==[('hermes','L3',1,1)]

          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          for t in ('task_lifecycle_events','approval_requests','execution_audit','task_plans'):
              assert t in tables, ('missing_table',t)

          def cols(t):
              return [r['name'] for r in c.execute(f'pragma table_info({t})')]
          schemas={t:cols(t) for t in ('task_lifecycle_events','approval_requests','execution_audit','task_plans')}
          print('correlation_schemas='+json.dumps(schemas,sort_keys=True))

          # Established production identifiers only. Do not invent execution_id/audit_id
          # when the durable production schema does not expose them.
          assert {'task_id','stage','occurred_at'} <= set(schemas['task_lifecycle_events'])
          assert {'task_id','approval_id','state','consumed_at','consumed_by'} <= set(schemas['approval_requests'])
          assert {'task_id','approval_id','response_id','outcome','occurred_at'} <= set(schemas['execution_audit'])
          assert {'task_id','status','created_at'} <= set(schemas['task_plans'])

          audited={r['task_id']:dict(r) for r in c.execute("select task_id,stage,occurred_at from task_lifecycle_events where stage='AUDITED' order by occurred_at")}
          proof=[]
          ambiguous=[]
          for task_id,life in audited.items():
              approvals=[dict(r) for r in c.execute('select approval_id,state,consumed_at,consumed_by from approval_requests where task_id=? order by created_at',(task_id,))]
              audits=[dict(r) for r in c.execute('select task_id,approval_id,response_id,outcome,occurred_at from execution_audit where task_id=? order by occurred_at',(task_id,))]
              plans=[dict(r) for r in c.execute('select task_id,status,created_at from task_plans where task_id=? order by created_at',(task_id,))]

              valid_audits=[]
              for a in audits:
                  if a.get('task_id')!=task_id: continue
                  if not a.get('approval_id') or not a.get('response_id'): continue
                  if a.get('outcome') not in {'succeeded','failed','cancelled','rejected'}: continue
                  valid_audits.append(a)

              # Strong correlation requires exactly one valid execution audit row,
              # exactly one matching approval id, and that approval must be consumed.
              row={'task_id':task_id,'lifecycle':'AUDITED','approval_count':len(approvals),'execution_audit_count':len(audits),'plan_count':len(plans)}
              if len(valid_audits)==1:
                  a=valid_audits[0]
                  matches=[x for x in approvals if x.get('approval_id')==a.get('approval_id')]
                  unique_response=c.execute('select count(*) from execution_audit where response_id=?',(a['response_id'],)).fetchone()[0]==1
                  unique_pair=c.execute('select count(*) from execution_audit where task_id=? and approval_id=?',(task_id,a['approval_id'])).fetchone()[0]==1
                  consumed=len(matches)==1 and matches[0].get('consumed_at') is not None and matches[0].get('consumed_by') is not None
                  row.update({'approval_id':a['approval_id'],'response_id':a['response_id'],'outcome':a['outcome'],'unique_response_id':unique_response,'unique_task_approval_pair':unique_pair,'matching_consumed_approval':consumed})
                  if unique_response and unique_pair and consumed:
                      row['classification']='closed_proven'
                  else:
                      row['classification']='closure_indeterminate'
                      ambiguous.append(task_id)
              else:
                  row['classification']='closure_indeterminate'
                  ambiguous.append(task_id)
              proof.append(row)

          print('audited_task_correlation_proof='+json.dumps(proof,sort_keys=True))
          print('audited_task_indeterminate='+json.dumps(sorted(ambiguous)))

          # Current worker workload remains fail-closed unless every relevant
          # historical AUDITED task has unique closure proof and no current Hermes
          # latest lifecycle is ASSIGNED/PLANNED.
          latest=c.execute('''
            select e.task_id,e.stage,e.assigned_agent_id,e.occurred_at
            from task_lifecycle_events e
            join (select task_id,max(occurred_at) mx from task_lifecycle_events group by task_id) x
              on x.task_id=e.task_id and x.mx=e.occurred_at
            order by e.task_id
          ''').fetchall()
          latest=[dict(r) for r in latest]
          active=[r for r in latest if r.get('assigned_agent_id')=='hermes' and r.get('stage') in {'ASSIGNED','PLANNED'}]
          complete=(len(ambiguous)==0)
          print('latest_hermes_open_work='+json.dumps(active,sort_keys=True))
          print('correlation_evidence_complete='+str(complete).lower())
          if complete:
              print('derived_active_task_count='+str(len(active)))
              print('derived_active_states='+json.dumps([r['stage'] for r in active]))
          else:
              print('derived_active_task_count=null')
              print('derived_active_states=null')
          PY

          curl -fsS http://127.0.0.1:4881/api/read-model >/tmp/o4-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o4-model.json'))
          assert d['schema_version']=='2.1n.v1'
          r=d['worker_readiness']
          assert r['agent_id']=='hermes'
          assert r['task_class_scope']=='general'
          assert r['authority_effect']=='none'
          assert r['automatic_assignment'] is False
          assert r['automatic_retry'] is False
          assert r['automatic_reroute'] is False
          assert r['automatic_execution'] is False
          print('current_worker_readiness='+r['readiness'])
          print('current_readiness_reason='+r['reason_code'])
          PY
          rm -f /tmp/o4-model.json
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://hermes-agent-whow.srv1833510.hstgr.cloud/phil-ai-os/operator/)" = 401

          echo production_change=none
          echo lifecycle_mutation=none
          echo assignment_mutation=none
          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo authority_expansion=none
          echo execution_allowlist=general
          echo agent_registry=hermes_L3_only
          echo PHIL_AI_OS_PHASE_2_1O_O4_PRODUCTION_CORRELATION_PROOF_OK
          REMOTE
