name: Phase 2.1F Read Model Canonical Persistence Validation

on:
  push:
    branches: [main]
    paths:
      - 'ops/phase-2.1f/build-read-model-canonical-persistence.py'
      - '.github/workflows/phase-2-1f-read-model-canonical-persistence-validation.yml'
      - '.github/phase-2-1f-read-model-validation-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and compile read model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/phase-2.1f/build-read-model-canonical-persistence.py
          python3 ops/phase-2.1f/build-read-model-canonical-persistence.py \
            ops/phase-2.1a/philaios-mission-control-read-model.py \
            /tmp/philaios-mission-control-read-model-2.1f.py
          python3 -m py_compile /tmp/philaios-mission-control-read-model-2.1f.py
          grep -q 'SCHEMA_VERSION = "2.1f.v1"' /tmp/philaios-mission-control-read-model-2.1f.py
          grep -q 'canonical_task_persistence.*persistence' /tmp/philaios-mission-control-read-model-2.1f.py
          echo local_read_model_build=green
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage generated read model
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q /tmp/philaios-mission-control-read-model-2.1f.py "$VPS_USER@$VPS_HOST:/tmp/philaios-mission-control-read-model-2.1f.py"
      - name: Validate against live state read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.1-phase21f'
          BEFORE="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0], c.execute('select count(*) from execution_audit').fetchone()[0])")"
          python3 /tmp/philaios-mission-control-read-model-2.1f.py > /tmp/philaios-read-model-validation.json
          python3 - /tmp/philaios-read-model-validation.json <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m['schema_version']=='2.1f.v1'
          assert m['overall_state']=='healthy'
          s=m['durable_correlation_summary']
          assert s['canonical_task_persistence']=='present'
          assert s['canonical_task_schema']=='approval_and_execution_audit'
          assert s['task_id_mismatch_count']==0
          assert s['historical_null_task_ids_allowed'] is True
          assert m['governance']['execution_allowed_task_classes']==['general']
          assert m['governance']['direct_provider_bypass_allowed'] is False
          assert m['governance']['authority_expansion_state']=='blocked'
          print('read_model_schema=2.1f.v1')
          print('canonical_task_persistence=present')
          print('task_id_mismatch_count=0')
          print('historical_null_task_ids_allowed=true')
          PY
          AFTER="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0], c.execute('select count(*) from execution_audit').fetchone()[0])")"
          test "$BEFORE" = "$AFTER"
          rm -f /tmp/philaios-mission-control-read-model-2.1f.py /tmp/philaios-read-model-validation.json
          echo approval_execution_counts_unchanged=true
          echo production_allowlist=general_only
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_2_1F_READ_MODEL_CANONICAL_PERSISTENCE_VALIDATION_OK
          REMOTE
