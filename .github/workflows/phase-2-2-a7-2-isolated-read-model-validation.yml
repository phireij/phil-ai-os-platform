name: Phase 2.2 A7.2 Isolated Read Model Validation

on:
  push:
    paths:
      - '.github/workflows/phase-2-2-a7-2-isolated-read-model-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate A7.2 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/phase2_2_a7_2_multi_agent_read_model_validator.py | tee phase-2-2-a7-2-validation.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-2-a7-2-isolated-read-model-validation
          path: phase-2-2-a7-2-validation.txt
          if-no-files-found: warn
          retention-days: 30
