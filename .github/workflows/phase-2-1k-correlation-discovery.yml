name: Phase 2.1K Read-Only Approval-to-Execution Correlation Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1k-correlation-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"

          echo 'ssh_diag=begin'
          if ! getent ahosts "$VPS_HOST" >/dev/null 2>&1; then
            echo 'ssh_diag=dns_resolution_failed'
            exit 11
          fi
          echo 'ssh_diag=dns_resolution_ok'

          if ! timeout 20 bash -c "</dev/tcp/$VPS_HOST/$PORT" 2>/dev/null; then
            echo 'ssh_diag=tcp_connect_failed'
            exit 12
          fi
          echo 'ssh_diag=tcp_connect_ok'

          TMP="$(mktemp)"
          trap 'rm -f "$TMP"' EXIT
          if ! ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null || ! test -s "$TMP"; then
            echo 'ssh_diag=host_key_scan_failed'
            exit 13
          fi
          install -m 600 /dev/null ~/.ssh/known_hosts
          cat "$TMP" > ~/.ssh/known_hosts
          echo 'ssh_diag=host_key_scan_ok'

          if ! ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" true; then
            echo 'ssh_diag=authentication_or_session_failed'
            exit 14
          fi
          echo 'ssh_diag=authentication_ok'
          echo 'ssh_diag=ready'

      - name: Discover durable correlation shape without mutation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          DB=/app/state/control-plane.db
          BASE=http://127.0.0.1:4870

          echo '=== PHASE 2.1K K1 READ-ONLY CORRELATION DISCOVERY ==='

          curl -fsS "$BASE/healthz" >/dev/null
          curl -fsS "$BASE/readyz" >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          echo control_api_health=ok
          echo control_api_readiness=ok
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active

          docker inspect "$CONTROL" --format 'control_api_image={{.Config.Image}}'

          docker exec -i "$CONTROL" python - <<'PY'
          import sqlite3
          db='/app/state/control-plane.db'
          c=sqlite3.connect(f'file:{db}?mode=ro', uri=True)
          c.row_factory=sqlite3.Row
          print('sqlite_quick_check=' + c.execute('pragma quick_check').fetchone()[0])
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
          print('tables=' + ','.join(tables))
          focus=['approval_requests','execution_audit','tasks','task_lifecycle_events','task_assignments','task_plans','agent_registry']
          for table in focus:
              if table not in tables:
                  print(f'{table}.present=false')
                  continue
              cols=[r[1] for r in c.execute(f'pragma table_info({table})')]
              print(f'{table}.present=true')
              print(f'{table}.columns=' + ','.join(cols))
              print(f'{table}.has_task_id=' + str('task_id' in cols).lower())
              print(f'{table}.has_approval_id=' + str('approval_id' in cols).lower())
              print(f'{table}.has_agent_id=' + str('agent_id' in cols).lower())
              print(f'{table}.row_count=' + str(c.execute(f'select count(*) from {table}').fetchone()[0]))

          if 'approval_requests' in tables:
              cols=[r[1] for r in c.execute('pragma table_info(approval_requests)')]
              order_col='created_at' if 'created_at' in cols else ('updated_at' if 'updated_at' in cols else None)
              q='select * from approval_requests where task_id is not null' + (f' order by {order_col} desc' if order_col else '') + ' limit 1'
              r=c.execute(q).fetchone()
              if r:
                  task_id=r['task_id']
                  approval_id=r['approval_id'] if 'approval_id' in r.keys() else None
                  print('latest_task_present=true')
                  print('latest_task_id=' + str(task_id or ''))
                  print('latest_task_approval_id=' + str(approval_id or ''))
                  print('latest_task_approval_state=' + str(r['state'] if 'state' in r.keys() else ''))
                  print('latest_task_consumed_at=' + str(r['consumed_at'] if 'consumed_at' in r.keys() and r['consumed_at'] else ''))
                  for table in ['execution_audit','task_lifecycle_events','task_assignments','task_plans']:
                      if table not in tables or not task_id:
                          continue
                      tcols=[x[1] for x in c.execute(f'pragma table_info({table})')]
                      if 'task_id' in tcols:
                          n=c.execute(f'select count(*) from {table} where task_id=?',(task_id,)).fetchone()[0]
                          print(f'latest_task_{table}_links={n}')
                  if 'execution_audit' in tables and approval_id:
                      ecols=[x[1] for x in c.execute('pragma table_info(execution_audit)')]
                      if 'approval_id' in ecols:
                          n=c.execute('select count(*) from execution_audit where approval_id=?',(approval_id,)).fetchone()[0]
                          print('latest_approval_execution_audit_links=' + str(n))
              else:
                  print('latest_task_present=false')
          PY

          echo '=== CONTROL API SOURCE CORRELATION REFERENCES ==='
          docker exec "$CONTROL" sh -lc '
            set -eu
            for root in /app /opt/app /srv/app; do
              [ -d "$root" ] || continue
              grep -R -n -E "task_id|approval_id|consumed_at|execution_audit" "$root" 2>/dev/null | head -n 160 || true
            done
          '

          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_2_1K_K1_CORRELATION_DISCOVERY_OK
          REMOTE
