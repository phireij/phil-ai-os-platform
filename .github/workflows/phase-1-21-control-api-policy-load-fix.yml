name: Phase 1.21 Control API Policy Load Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-control-api-policy-load-fix.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Patch confirmed multiline policy definition and validate
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          SOURCE=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/services/core/control-api/app.py
          echo '=== PHASE 1.21 CONTROL API POLICY LOAD FIX V3 ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          test -f "$SOURCE"

          WORKDIR="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          CONFIG_FILES="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
          SERVICE="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
          test -n "$CONFIG_FILES" -a -n "$SERVICE"
          COMPOSE_FILE="${CONFIG_FILES%%,*}"
          if [[ "$COMPOSE_FILE" != /* ]]; then COMPOSE_FILE="$WORKDIR/$COMPOSE_FILE"; fi
          test -f "$COMPOSE_FILE"
          echo "control_api_source=$SOURCE"
          echo "compose_file=$COMPOSE_FILE"
          echo "compose_service=$SERVICE"

          echo '--- CONFIRMED PRE-PATCH DEFINITION ---'
          nl -ba "$SOURCE" | sed -n '40,55p'
          BACKUP="${SOURCE}.phase-1-21-policy-load-v3.bak"
          test -e "$BACKUP" || cp -a "$SOURCE" "$BACKUP"

          python3 - "$SOURCE" <<'PY'
          import sys,ast
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(); lines=s.splitlines(True)
          replacement='EXECUTION_ALLOWED_TASK_CLASSES = {x.strip() for x in os.getenv("PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES", "general").split(",") if x.strip()}\n'
          if replacement.strip() in s:
              print('policy_parser_already_fixed=yes'); raise SystemExit(0)
          tree=ast.parse(s)
          target=None
          for node in tree.body:
              if isinstance(node,(ast.Assign,ast.AnnAssign)):
                  targets=node.targets if isinstance(node,ast.Assign) else [node.target]
                  if any(isinstance(t,ast.Name) and t.id=='EXECUTION_ALLOWED_TASK_CLASSES' for t in targets):
                      target=node; break
          if target is None:
              raise SystemExit('EXECUTION_ALLOWED_TASK_CLASSES assignment not found')
          old=''.join(lines[target.lineno-1:target.end_lineno])
          if 'PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES' not in old:
              print('confirmed_assignment='+repr(old))
              raise SystemExit('confirmed assignment does not reference expected env key')
          print('patching_lines=%d-%d'%(target.lineno,target.end_lineno))
          lines[target.lineno-1:target.end_lineno]=[replacement]
          ns=''.join(lines)
          ast.parse(ns)
          p.write_text(ns)
          print('policy_parser_patch=ast_targeted_comma_split_env')
          PY

          python3 -m py_compile "$SOURCE"
          echo '--- POST-PATCH DEFINITION ---'
          nl -ba "$SOURCE" | sed -n '40,52p'

          docker compose -f "$COMPOSE_FILE" build "$SERVICE"
          docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate "$SERVICE"
          for i in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:4870/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general,routine$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"

          docker exec "$CONTROL" python - <<'PY'
          import ast,os
          p='/app/app.py'
          s=open(p).read(); tree=ast.parse(s)
          assignment=None
          for node in tree.body:
              if isinstance(node,(ast.Assign,ast.AnnAssign)):
                  targets=node.targets if isinstance(node,ast.Assign) else [node.target]
                  if any(isinstance(t,ast.Name) and t.id=='EXECUTION_ALLOWED_TASK_CLASSES' for t in targets): assignment=node; break
          assert assignment is not None
          loaded={x.strip() for x in os.environ['PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES'].split(',') if x.strip()}
          print('loaded_allowed_task_classes='+','.join(sorted(loaded)))
          assert {'general','routine'} <= loaded
          print('routine_loaded=pass')
          PY

          echo provider_call=none
          echo approval_consumption=none
          echo rollback_backup="$BACKUP"
          echo next_action=PHASE_1_21_SINGLE_ROUTINE_CANARY_RETRY
          echo PHIL_AI_OS_PHASE_1_21_CONTROL_API_POLICY_LOAD_FIX_OK
          REMOTE
