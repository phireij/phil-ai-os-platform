name: Phase 1.21 Control API Policy Load Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-control-api-policy-load-fix.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Repair policy load and validate without provider execution
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.21 CONTROL API POLICY LOAD FIX V2 ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          # Discover the real compose configuration from container labels. Do not
          # assume the project working_dir itself contains the application source.
          WORKDIR="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          CONFIG_FILES="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
          SERVICE="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
          echo "compose_workdir=${WORKDIR:-missing}"
          echo "compose_config_files=${CONFIG_FILES:-missing}"
          echo "compose_service=${SERVICE:-missing}"
          test -n "$CONFIG_FILES"
          COMPOSE_FILE="${CONFIG_FILES%%,*}"
          if [[ "$COMPOSE_FILE" != /* ]]; then
            test -n "$WORKDIR"
            COMPOSE_FILE="$WORKDIR/$COMPOSE_FILE"
          fi
          test -f "$COMPOSE_FILE"
          COMPOSE_DIR="$(dirname "$COMPOSE_FILE")"
          echo "compose_file=$COMPOSE_FILE"

          # Ask Compose for the resolved build context/dockerfile. This is the
          # authoritative host build source used for this service.
          RESOLVED="$(docker compose -f "$COMPOSE_FILE" config --format json)"
          printf '%s' "$RESOLVED" >/tmp/phase121-compose.json
          readarray -t BUILD_INFO < <(python3 - "$SERVICE" /tmp/phase121-compose.json <<'PY'
          import json,sys,os
          svc=sys.argv[1]
          d=json.load(open(sys.argv[2]))
          s=d.get('services',{}).get(svc,{})
          b=s.get('build')
          if isinstance(b,str):
              print(b); print('Dockerfile')
          elif isinstance(b,dict):
              print(b.get('context','')); print(b.get('dockerfile','Dockerfile'))
          else:
              print(''); print('')
          PY
          )
          BUILD_CONTEXT="${BUILD_INFO[0]:-}"
          DOCKERFILE="${BUILD_INFO[1]:-Dockerfile}"
          test -n "$BUILD_CONTEXT"
          if [[ "$BUILD_CONTEXT" != /* ]]; then BUILD_CONTEXT="$COMPOSE_DIR/$BUILD_CONTEXT"; fi
          BUILD_CONTEXT="$(realpath "$BUILD_CONTEXT")"
          echo "build_context=$BUILD_CONTEXT"
          echo "dockerfile=$DOCKERFILE"
          test -d "$BUILD_CONTEXT"

          # Locate only source files in the actual build context containing the
          # confirmed policy symbol/env key.
          SOURCE="$(grep -RIl --exclude-dir=.git --exclude='*.bak*' --include='*.py' 'PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES\|EXECUTION_ALLOWED_TASK_CLASSES' "$BUILD_CONTEXT" 2>/dev/null | head -n1 || true)"
          if [ -z "$SOURCE" ]; then
            echo 'policy_source_not_found_in_build_context'
            find "$BUILD_CONTEXT" -maxdepth 3 -type f -name '*.py' -print | head -n 80
            exit 1
          fi
          echo "control_api_source=$SOURCE"
          BACKUP="${SOURCE}.phase-1-21-policy-load.bak"
          test -e "$BACKUP" || cp -a "$SOURCE" "$BACKUP"

          python3 - "$SOURCE" <<'PY'
          import sys,re
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          replacement='EXECUTION_ALLOWED_TASK_CLASSES = {x.strip() for x in os.get("PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES", "general").split(",") if x.strip()}'
          if replacement in s:
              print('policy_parser_already_fixed=yes')
              raise SystemExit(0)
          patterns=[
            r'EXECUTION_ALLOWED_TASK_CLASSES\s*=\s*\{\s*os\.get\(\s*["\']PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES["\']\s*,\s*["\']general["\']\s*\)\s*\}',
            r'EXECUTION_ALLOWED_TASK_CLASSES\s*=\s*set\(\s*os\.get\(\s*["\']PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES["\']\s*,\s*["\']general["\']\s*\)\.split\([^)]*\)\s*\)',
          ]
          for pat in patterns:
              ns,n=re.subn(pat,replacement,s,count=1,flags=re.S)
              if n:
                  p.write_text(ns)
                  print('policy_parser_patch=comma_split_env')
                  break
          else:
              hits=[(i,l) for i,l in enumerate(s.splitlines(),1) if 'EXECUTION_ALLOWED_TASK_CLASSES' in l or 'PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES' in l]
              print('definition_hits='+repr(hits[:12]))
              raise SystemExit('confirmed definition shape not matched; no source mutation written')
          PY
          python3 -m py_compile "$SOURCE"

          # Build and recreate only the resolved compose service.
          docker compose -f "$COMPOSE_FILE" build "$SERVICE"
          docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate "$SERVICE"
          for i in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:4870/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general,routine$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"

          # Locate the loaded module file and validate the runtime constant without
          # invoking /v1/execute or consuming the approval.
          docker exec "$CONTROL" python - <<'PY'
          import os,glob,re
          candidates=[]
          for root in ('/app','/opt','/srv'):
              if os.path.isdir(root):
                  for p in glob.glob(root+'/**/*.py',recursive=True):
                      try:
                          if 'EXECUTION_ALLOWED_TASK_CLASSES' in open(p,errors='ignore').read(): candidates.append(p)
                      except OSError: pass
          assert candidates, 'runtime policy module not found'
          print('runtime_policy_source='+candidates[0])
          text=open(candidates[0]).read()
          assert '.split(",")' in text or ".split(',')" in text
          allowed={x.strip() for x in os.environ['PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES'].split(',') if x.strip()}
          print('loaded_allowed_task_classes='+','.join(sorted(allowed)))
          assert {'general','routine'} <= allowed
          print('routine_loaded=pass')
          PY

          echo provider_call=none
          echo approval_consumption=none
          echo rollback_backup="$BACKUP"
          echo next_action=PHASE_1_21_SINGLE_ROUTINE_CANARY_RETRY
          echo PHIL_AI_OS_PHASE_1_21_CONTROL_API_POLICY_LOAD_FIX_OK
          REMOTE
