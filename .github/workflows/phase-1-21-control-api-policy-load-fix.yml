name: Phase 1.21 Control API Policy Load Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-control-api-policy-load-fix.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Repair policy load and validate without provider execution
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.21 CONTROL API POLICY LOAD FIX ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          # Diagnostic proved the live env is general,routine but the module-level
          # allowlist remained stale. Locate the host source used to build control-api.
          WORKDIR="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          test -n "$WORKDIR"
          SOURCE="$(grep -RIl --exclude-dir=.git --exclude='*.bak*' 'PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES' "$WORKDIR" 2>/dev/null | grep '/app.py$' | head -n1 || true)"
          if [ -z "$SOURCE" ]; then
            SOURCE="$(find "$WORKDIR" -type f -name app.py -print | head -n1)"
          fi
          test -n "$SOURCE" -a -f "$SOURCE"
          echo "control_api_source=$SOURCE"
          BACKUP="${SOURCE}.phase-1-21-policy-load.bak"
          test -e "$BACKUP" || cp -a "$SOURCE" "$BACKUP"

          python3 - "$SOURCE" <<'PY'
          import sys,re
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          # Normalize only the execution allowlist definition to comma-split the env.
          # Accept either an older singleton/default expression or an already split form.
          pat=r'EXECUTION_ALLOWED_TASK_CLASSES\s*=\s*\{\s*os\.get\(\s*["\']PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES["\']\s*,\s*["\']general["\']\s*\)\s*\}'
          repl='EXECUTION_ALLOWED_TASK_CLASSES = {x.strip() for x in os.get("PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES", "general").split(",") if x.strip()}'
          ns,n=re.subn(pat,repl,s,count=1)
          if n==0:
              # If source uses a different multiline shape, inspect the nearby definition
              # and fail closed rather than making a speculative edit.
              lines=s.splitlines()
              hits=[(i,l) for i,l in enumerate(lines,1) if 'EXECUTION_ALLOWED_TASK_CLASSES' in l]
              print('definition_hits='+repr(hits[:8]))
              if repl in s:
                  print('policy_parser_already_fixed=yes')
                  raise SystemExit(0)
              raise SystemExit('confirmed definition shape not matched; no mutation written')
          p.write_text(ns)
          print('policy_parser_patch=comma_split_env')
          PY

          python3 -m py_compile "$SOURCE"
          grep -q 'EXECUTION_ALLOWED_TASK_CLASSES' "$SOURCE"

          cd "$WORKDIR"
          # Rebuild/recreate only control-api from its local source.
          docker compose build control-api
          docker compose up -d --no-deps --force-recreate control-api
          for i in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:4870/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general,routine$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"

          # Validate the module's loaded constant directly, without calling /v1/execute.
          docker exec "$CONTROL" python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location('control_app_check','/app/app.py')
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          allowed=set(m.EXECUTION_ALLOWED_TASK_CLASSES)
          print('loaded_allowed_task_classes='+','.join(sorted(allowed)))
          assert 'general' in allowed
          assert 'routine' in allowed
          print('routine_loaded=pass')
          PY

          echo provider_call=none
          echo approval_consumption=none
          echo rollback_backup="$BACKUP"
          echo next_action=PHASE_1_21_SINGLE_ROUTINE_CANARY_RETRY
          echo PHIL_AI_OS_PHASE_1_21_CONTROL_API_POLICY_LOAD_FIX_OK
          REMOTE
