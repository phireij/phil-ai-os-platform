name: MC-021 Gate C Systemd Credential Preflight

on:
  workflow_dispatch:
  push:
    branches: [codex/mission-control-cto-next-gate]
    paths:
      - .github/workflows/mission-control-cto-mcp-fixture-gate-c-preflight.yml
      - ops/mission-control-identity/systemd/phil-ai-os-mission-control-cto-mcp-fixture.service.template

permissions:
  contents: read

jobs:
  verify-host-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CONTAINER: phil-ai-os-mission-control-cto-mcp-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Render the non-secret systemd unit for syntax verification
        shell: bash
        run: |
          set -euo pipefail
          sed 's|@IMAGE_REF@|example.invalid/fixture@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa|g' \
            ops/mission-control-identity/systemd/phil-ai-os-mission-control-cto-mcp-fixture.service.template \
            > /tmp/phil-ai-os-mission-control-cto-mcp-fixture.service
      - name: Verify credential support and the unchanged hardened fixture
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh_opts=(-4 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          remote="$VPS_USER@$VPS_HOST"
          scp "${ssh_opts[@]}" /tmp/phil-ai-os-mission-control-cto-mcp-fixture.service "$remote:/tmp/phil-ai-os-mission-control-cto-mcp-fixture.service"
          ssh "${ssh_opts[@]}" "$remote" 'bash -s' -- "$CONTAINER" <<'REMOTE'
          set -euo pipefail
          container="$1"
          version="$(systemd-creds --version | awk 'NR == 1 { print $2 }')"
          [[ "$version" =~ ^[0-9]+$ ]] && (( version >= 250 ))
          systemd-analyze verify /tmp/phil-ai-os-mission-control-cto-mcp-fixture.service
          test "$(findmnt -n -o FSTYPE /run)" = tmpfs
          test "$(docker info --format '{{.Swarm.LocalNodeState}}')" = inactive
          docker inspect "$container" >/dev/null
          test "$(docker inspect "$container" --format '{{.HostConfig.NetworkMode}}|{{.HostConfig.ReadonlyRootfs}}|{{index .Config.Labels "traefik.enable"}}|{{json .HostConfig.SecurityOpt}}|{{json .HostConfig.CapDrop}}|{{.HostConfig.PidsLimit}}')" = 'host|true|false|["no-new-privileges:true"]|["ALL"]|128'
          ss -ltnH '( sport = :8787 )' | grep -Eq '^LISTEN.*127\.0\.0\.1:8787'
          echo "gate_c_preflight=green runtime_unchanged=true systemd_credentials=true swarm=false"
          REMOTE
