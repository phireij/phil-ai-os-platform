name: Twilio Account State Read-Only Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RUBY_TWILIO_ACCOUNT_SID: ${{ secrets.RUBY_TWILIO_ACCOUNT_SID }}
      RUBY_TWILIO_AUTH_TOKEN: ${{ secrets.RUBY_TWILIO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate account-state diagnostic contract
        run: python -m unittest commerce/woocommerce/tests/test_twilio_account_state_readonly_diagnostic.py -v

      - name: Read Twilio account state only
        run: python commerce/woocommerce/tools_twilio_account_state_readonly_diagnostic.py

      - name: Assert no Messaging or write authority exists
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'Messages.json' commerce/woocommerce/tools_twilio_account_state_readonly_diagnostic.py
          ! grep -q 'method="POST"' commerce/woocommerce/tools_twilio_account_state_readonly_diagnostic.py
          ! grep -q '"To"' commerce/woocommerce/tools_twilio_account_state_readonly_diagnostic.py
          ! grep -q '"Body"' commerce/woocommerce/tools_twilio_account_state_readonly_diagnostic.py
          echo PHIL_AI_OS_TWILIO_ACCOUNT_STATE_READONLY_BOUNDARY_GREEN
