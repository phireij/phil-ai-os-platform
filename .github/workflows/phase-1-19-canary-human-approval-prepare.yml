name: Phase 1.19 Canary Human Approval Prepare

on:
  push:
    branches:
      - ops/phase-1.19
    paths:
      - .github/workflows/phase-1-19-canary-human-approval-prepare.yml
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true

      - name: Create fresh canary approval and deliver to Telegram
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES="hermes-agent-whow-hermes-agent-1"
          TASK="PHIL_AI_OS_ROUTED_EXECUTION_OK"

          echo '=== PHASE 1.19 CANARY HUMAN APPROVAL PREPARE ==='
          docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control
          docker exec "$HERMES" test -x /usr/local/bin/philaios-telegram-approval-notifier
          echo mission_control_client=ready
          echo notifier=ready

          OUT="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control request "$TASK")"
          printf '%s\n' "$OUT"
          APPROVAL_ID="$(printf '%s\n' "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["approval"]["approval_id"])')"
          echo "approval_id=$APPROVAL_ID"

          NOTIFY="$(docker exec "$HERMES" /usr/local/bin/philaios-telegram-approval-notifier "$APPROVAL_ID")"
          printf '%s\n' "$NOTIFY"
          printf '%s\n' "$NOTIFY" | grep -F '"telegram_ok": true' >/dev/null
          echo telegram_delivery=ok

          APPROVALS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals)"
          printf '%s\n' "$APPROVALS" | grep -F "$APPROVAL_ID" >/dev/null
          printf '%s\n' "$APPROVALS" | grep -F '"state": "pending"' >/dev/null
          echo approval_state=pending_verified

          echo execution_invoked=none
          echo provider_call=none
          echo PHIL_AI_OS_PHASE_1_19_CANARY_HUMAN_APPROVAL_PREPARE_OK
          REMOTE
