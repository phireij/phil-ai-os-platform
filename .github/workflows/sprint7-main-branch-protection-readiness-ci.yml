name: Sprint 7 Main Branch Protection Readiness CI

on:
  pull_request:
    paths:
      - 'governance/github/**'
      - 'scripts/validate_main_branch_ruleset.py'
      - '.github/workflows/sprint7-main-branch-protection-readiness-ci.yml'
      - 'docs/SPRINT_7_MAIN_BRANCH_PROTECTION_READINESS_2026-09-12.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-protection-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile validator
        run: python -m py_compile scripts/validate_main_branch_ruleset.py
      - name: Self-test fail-closed ruleset policy
        run: python scripts/validate_main_branch_ruleset.py --self-test
      - name: Inspect live repository rulesets read-only
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=( -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' )

          curl --fail --silent --show-error "${auth[@]}" "${api}/rulesets?includes_parents=false" > /tmp/rulesets-summary.json
          jq 'map({id,name,target,enforcement})' /tmp/rulesets-summary.json > /tmp/rulesets-summary-sanitized.json

          : > /tmp/rulesets-details.ndjson
          while IFS= read -r ruleset_id; do
            [ -n "${ruleset_id}" ] || continue
            curl --fail --silent --show-error "${auth[@]}" "${api}/rulesets/${ruleset_id}" >> /tmp/rulesets-details.ndjson
            printf '\n' >> /tmp/rulesets-details.ndjson
          done < <(jq -r '.[].id // empty' /tmp/rulesets-summary.json)

          if [ -s /tmp/rulesets-details.ndjson ]; then
            jq -s '.' /tmp/rulesets-details.ndjson > /tmp/rulesets-live.json
          else
            printf '[]\n' > /tmp/rulesets-live.json
          fi

          set +e
          validation_output=$(python scripts/validate_main_branch_ruleset.py --rulesets /tmp/rulesets-live.json 2>&1)
          validation_status=$?
          set -e

          {
            echo '## Main branch protection live diagnostic'
            echo
            echo '- inspection: read-only GitHub repository rulesets API'
            echo '- authority effect: none'
            echo "- rulesets observed: $(jq 'length' /tmp/rulesets-summary.json)"
            if [ "${validation_status}" -eq 0 ]; then
              echo '- launch gate: GREEN'
              echo '- validator: PHIL_AI_OS_MAIN_BRANCH_RULESET_GREEN'
            else
              echo '- launch gate: NO-GO'
              echo '- validator: PHIL_AI_OS_MAIN_BRANCH_RULESET_NOT_READY'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          cat /tmp/rulesets-summary-sanitized.json
          if [ "${validation_status}" -eq 0 ]; then
            printf '%s\n' "${validation_output}"
          else
            printf 'PHIL_AI_OS_MAIN_BRANCH_RULESET_LIVE_DIAGNOSTIC_COMPLETE launch_gate=no-go authority_effect=none\n'
          fi
      - name: Assert workflow is non-authorizing
        run: |
          test "${{ github.event_name }}" = "pull_request" -o "${{ github.event_name }}" = "workflow_dispatch"
          echo "PHIL_AI_OS_MAIN_BRANCH_PROTECTION_READINESS_CI_GREEN authority_effect=none"
