name: Phase 2.1E UI Polish Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1e-ui-polish-canary.yml'
      - '.github/phase-2-1e-ui-polish-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage UI-only candidate
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q ops/phase-2.1b/mission-control-readonly-server.py "$VPS_USER@$VPS_HOST:/tmp/phase-2-1e-server.py"
      - name: Atomic UI-only canary deployment
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SERVICE='phil-ai-os-mission-control-operator.service'
          INSTALL_DIR='/opt/phil-ai-os/mission-control'
          BACKUP="$(mktemp /tmp/philaios-phase-2-1e-ui-rollback.XXXXXX)"
          success=0
          cleanup(){ rc=$?; rm -f /tmp/phase-2-1e-server.py; if [ "$rc" -ne 0 ] && [ "$success" -ne 1 ]; then install -m 755 "$BACKUP" "$INSTALL_DIR/server.py"; systemctl restart "$SERVICE" >/dev/null 2>&1 || true; echo rollback=completed; fi; rm -f "$BACKUP"; }
          trap cleanup EXIT

          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          HERMES="$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')"
          test -n "$CONTROL"; test -n "$HERMES"
          cp "$INSTALL_DIR/server.py" "$BACKUP"
          BEFORE_A="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0])")"
          BEFORE_E="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from execution_audit').fetchone()[0])")"
          install -m 755 /tmp/phase-2-1e-server.py "$INSTALL_DIR/server.py"
          systemctl restart "$SERVICE"

          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 http://127.0.0.1:4881/ >/tmp/operator.html 2>/dev/null; then break; fi
            sleep 2
          done
          grep -q 'READ ONLY · Phase 2.1E' /tmp/operator.html
          grep -q 'const kvp=' /tmp/operator.html
          grep -q 'approval-id' /tmp/operator.html
          ! grep -q 'const src=' /tmp/operator.html
          MODEL="$(curl -fsS --max-time 15 http://127.0.0.1:4881/api/read-model)"
          printf '%s' "$MODEL" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]=="2.1e.v1"; assert d["overall_state"]=="healthy"; assert d["governance"]["execution_allowed_task_classes"]==["general"]; assert d["durable_correlation_summary"]["correlation_key_type"]=="approval_id"'
          for method in POST PUT PATCH DELETE; do test "$(curl -s -o /dev/null -w '%{http_code}' -X "$method" http://127.0.0.1:4881/)" = 405; done
          test "$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://hermes-agent-whow.srv1833510.hstgr.cloud/phil-ai-os/operator/ || true)" = 401
          AFTER_A="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0])")"
          AFTER_E="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from execution_audit').fetchone()[0])")"
          test "$BEFORE_A" = "$AFTER_A"; test "$BEFORE_E" = "$AFTER_E"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          rm -f /tmp/operator.html
          success=1
          echo provenance_rendering=structured_safe_html
          echo approval_id_overflow=wrapped
          echo schema_version=2.1e.v1
          echo browser_mutation_methods=405
          echo operator_auth_boundary=preserved_401_unauthenticated
          echo database_counts_unchanged=true
          echo production_allowlist=general_only
          echo database_schema_change=none
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1E_UI_POLISH_CANARY_OK
          REMOTE
