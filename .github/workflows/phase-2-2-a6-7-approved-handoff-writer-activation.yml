          test "$PATCHED_SHA" != "$EXPECTED_LIVE_SHA"
          echo candidate_app_sha256="$PATCHED_SHA"

          # Isolated candidate runtime against copied production DB and dummy auth.
          PHIL_AI_OS_STATE_DIR="$WORK/state" PHIL_AI_OS_SECRETS_DIR="$WORK/secrets" PHIL_AI_OS_PORT=4871 \
          PHIL_AI_OS_ROUTED_EXECUTION_ENABLED=false PHIL_AI_OS_LIVE_TEST_ENABLED=false PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general \
          python3 "$WORK/app.py" >"$WORK/candidate.log" 2>&1 &
          CAND_PID=$!
