name: Phase 2.2 A6.7 Approved Inert Handoff Writer Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-2-a6-7-approved-handoff-writer-activation.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify recorded A6.7 authorization
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT=docs/PHASE_2_2_A6_7_CEO_APPROVAL_2026-08-28.md
          grep -Fx 'Approved by: CEO' "$RECEIPT"
          grep -Fx 'Authorization: APPROVE_PHASE_2_2_A6_7' "$RECEIPT"
          grep -F 'Scope: inert handoff persistence/writer activation only' "$RECEIPT"
      - name: Configure IPv4 SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1
      - name: Activate inert handoff writer with isolated validation and rollback containment
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee phase22-a6-7-evidence.txt
          set -euo pipefail

          COMPOSE_DIR=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core
          COMPOSE="$COMPOSE_DIR/compose.yml"
          BUILD_CTX=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/services/core/control-api
          APP_SRC="$BUILD_CTX/app.py"
          OLD_IMAGE='phil-ai-os/control-api:0.20.3-phase21i'
          NEW_IMAGE='phil-ai-os/control-api:0.21.0-phase22a67'
          EXPECTED_LIVE_SHA='ff72f77fdd2114e3d9f469aaac8ae8b548ba14a4e71d79498a51c499fd21fe04'
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -n "$CONTROL"

          # Production gate preflight.
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          systemctl is-active --quiet phil-ai-os-specialist-worker-01-presence.timer
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = "$OLD_IMAGE"
          test "$(docker exec "$CONTROL" sha256sum /app/app.py | awk '{print $1}')" = "$EXPECTED_LIVE_SHA"
          test "$(sha256sum "$APP_SRC" | awk '{print $1}')" = "$EXPECTED_LIVE_SHA"
          docker image inspect "$OLD_IMAGE" >/dev/null
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done

          # A6.4 presence must remain valid before A6.7 starts.
          python3 - <<'PY'
          import json,datetime,pathlib
          p=pathlib.Path('/var/lib/phil-ai-os/agent-presence/specialist-worker-01.json')
          e=json.loads(p.read_text()); pl=e['payload']
          assert pl['agent_id']=='specialist-worker-01'
          assert pl['authority_ceiling']=='L1' and pl['enabled'] is False and pl['assignable'] is False
          ts=datetime.datetime.fromisoformat(pl['observed_at'])
          assert (datetime.datetime.now(datetime.timezone.utc)-ts).total_seconds() <= 120
          PY

          BASELINE="$(docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          assert c.execute("select count(*) from sqlite_master where type='table' and name='task_handoffs'").fetchone()[0]==0
          reg=[dict(r) for r in c.execute('select * from agent_registry order by agent_id')]
          assert len(reg)==2
          h=next(r for r in reg if r['agent_id']=='hermes')
          s=next(r for r in reg if r['agent_id']=='specialist-worker-01')
          assert h['authority_ceiling']=='L3' and int(h['enabled'])==1 and int(h['assignable'])==1
          assert s['authority_ceiling']=='L1' and int(s['enabled'])==0 and int(s['assignable'])==0
          assert c.execute("select count(*) from task_lifecycle_events where assigned_agent_id='specialist-worker-01'").fetchone()[0]==0
          tracked=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit','usage_ledger']
          print(json.dumps({'registry':reg,'counts':{t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}},sort_keys=True,separators=(',',':'),default=str))
          PY
          )"
          echo baseline_captured=true

          HERMES_SCRIPT_HASH="$(sha256sum /usr/local/sbin/philaios-agent-heartbeat | awk '{print $1}')"
          HERMES_SERVICE_HASH="$(systemctl cat phil-ai-os-agent-heartbeat.service | sha256sum | awk '{print $1}')"
          HERMES_TIMER_HASH="$(systemctl cat phil-ai-os-agent-heartbeat.timer | sha256sum | awk '{print $1}')"

          # Fresh standard backup plus exact rollback snapshot.
          systemctl start phil-ai-os-backup.service
          echo prechange_backup_service=completed
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          ROLLBACK_DIR="/var/lib/phil-ai-os/rollback/phase22-a67-$STAMP"
          install -d -m 700 "$ROLLBACK_DIR"
          cp -a "$APP_SRC" "$ROLLBACK_DIR/app.py.before"
          cp -a "$COMPOSE" "$ROLLBACK_DIR/compose.yml.before"
          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3
          src=sqlite3.connect('/app/state/control-plane.db')
          dst=sqlite3.connect('/tmp/phase22-a67-prechange.db')
          src.backup(dst); dst.close(); src.close()
          PY
          docker cp "$CONTROL":/tmp/phase22-a67-prechange.db "$ROLLBACK_DIR/control-plane.db.before"
          docker exec "$CONTROL" rm -f /tmp/phase22-a67-prechange.db
          chmod 600 "$ROLLBACK_DIR/control-plane.db.before"
          STATE_SOURCE="$(docker inspect "$CONTROL" --format '{{range .Mounts}}{{if eq .Destination "/app/state"}}{{.Source}}{{end}}{{end}}')"
          test -n "$STATE_SOURCE"
          DB_HOST_PATH="$STATE_SOURCE/control-plane.db"
          DB_UID="$(stat -c %u "$DB_HOST_PATH")"; DB_GID="$(stat -c %g "$DB_HOST_PATH")"; DB_MODE="$(stat -c %a "$DB_HOST_PATH")"
          echo rollback_snapshot="$ROLLBACK_DIR"

          # Build patched source in /tmp first. No production mutation yet.
          WORK="$(mktemp -d /tmp/phase22-a67.XXXXXX)"
          trap 'rm -rf "$WORK"' EXIT
          cp "$APP_SRC" "$WORK/app.py"
          mkdir -p "$WORK/state" "$WORK/secrets"
          cp "$ROLLBACK_DIR/control-plane.db.before" "$WORK/state/control-plane.db"
          printf '%s\n' 'phase22-a67-isolated-token' > "$WORK/secrets/hermes_control_api_token"
          chmod 600 "$WORK/secrets/hermes_control_api_token"

          python3 - "$WORK/app.py" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); t=p.read_text()
          migration_anchor='        # v0.19 approval-to-execution audit trace.\n'
          assert t.count(migration_anchor)==1
          migration='''        # Phase 2.2 A6.7 additive inert handoff persistence.\n        conn.executescript("""\n        CREATE TABLE IF NOT EXISTS task_handoffs(\n            handoff_id TEXT PRIMARY KEY,\n            handoff_version TEXT NOT NULL,\n            task_id TEXT NOT NULL,\n            source_agent_id TEXT NOT NULL,\n            target_agent_id TEXT NOT NULL,\n            task_class TEXT NOT NULL,\n            required_authority TEXT NOT NULL,\n            source_authority_ceiling TEXT NOT NULL,\n            target_authority_ceiling TEXT NOT NULL,\n            reason_code TEXT NOT NULL,\n            correlation_id TEXT NOT NULL UNIQUE,\n            requested_by TEXT NOT NULL,\n            requested_at TEXT NOT NULL,\n            expires_at TEXT NOT NULL,\n            handoff_approval_required INTEGER NOT NULL,\n            handoff_approval_state TEXT NOT NULL,\n            execution_approval_state TEXT,\n            source_readiness TEXT,\n            target_readiness TEXT,\n            state TEXT NOT NULL,\n            decided_by TEXT,\n            decided_at TEXT,\n            containment_reason TEXT,\n            lifecycle_event_id TEXT UNIQUE\n        );\n        CREATE INDEX IF NOT EXISTS idx_task_handoffs_task_requested\n          ON task_handoffs(task_id,requested_at,handoff_id);\n        CREATE INDEX IF NOT EXISTS idx_task_handoffs_state_expires\n          ON task_handoffs(state,expires_at);\n        """)\n\n'''
          t=t.replace(migration_anchor,migration+migration_anchor,1)

          func_anchor='def coordinator_assign(task_id, agent_id, requested_by="control-api", reason_code=None):\n'
          assert t.count(func_anchor)==1
          funcs=r'''HANDOFF_TTL_SECONDS = 900


def _authority_rank(value):
    return {"L0":0,"L1":1,"L2":2,"L3":3}.get(str(value),-1)


def coordinator_current_owner(conn, task_id):
    row=conn.execute("select assigned_agent_id from task_lifecycle_events where task_id=? and stage='ASSIGNED' and assigned_agent_id is not null order by occurred_at desc,event_id desc limit 1",(task_id,)).fetchone()
    return row[0] if row else None


def coordinator_agent_readiness(conn, agent_id):
    row=conn.execute("select enabled,assignable from agent_registry where agent_id=?",(agent_id,)).fetchone()
    if not row:
        return "unknown"
    if not bool(row[0]) or not bool(row[1]):
        return "unassignable"
    # A6.7 deliberately does not infer readiness from registry alone.
    # Authenticated multi-agent presence/workload integration is a later gate.
    return "indeterminate"


def coordinator_handoff_request(task_id, target_agent_id, reason_code, requested_by="control-api"):
    task_id=(task_id or "").strip(); target_agent_id=(target_agent_id or "").strip()
    reason_code=(reason_code or "handoff_requested").strip()[:128]
    requested_by=(requested_by or "control-api").strip()[:128]
    if not task_id or not target_agent_id:
        return 400,{"status":"invalid_request","detail":"task_id and target_agent_id are required","timestamp":now_iso()}
    conn=db()
    try:
        if not coordinator_task_exists(conn,task_id):
            return 404,{"status":"task_not_found","task_id":task_id,"timestamp":now_iso()}
        if coordinator_task_terminal(conn,task_id):
            return 409,{"status":"task_terminal","task_id":task_id,"timestamp":now_iso()}
        source_agent_id=coordinator_current_owner(conn,task_id)
        if not source_agent_id:
            return 409,{"status":"source_owner_unknown","task_id":task_id,"timestamp":now_iso()}
        if source_agent_id==target_agent_id:
            return 409,{"status":"same_agent_handoff_forbidden","task_id":task_id,"timestamp":now_iso()}
        source=conn.execute("select authority_ceiling from agent_registry where agent_id=?",(source_agent_id,)).fetchone()
        target=conn.execute("select authority_ceiling from agent_registry where agent_id=?",(target_agent_id,)).fetchone()
        if not source:
            return 409,{"status":"source_agent_not_registered","agent_id":source_agent_id,"timestamp":now_iso()}
        if not target:
            return 404,{"status":"target_agent_not_found","agent_id":target_agent_id,"timestamp":now_iso()}
        task=conn.execute("select task_class,state,consumed_at from approval_requests where task_id=? order by created_at desc limit 1",(task_id,)).fetchone()
        if not task:
            return 409,{"status":"task_policy_evidence_missing","task_id":task_id,"timestamp":now_iso()}
        task_class=task[0]
        if task_class!='general' or EXECUTION_ALLOWED_TASK_CLASSES!={"general"}:
            return 409,{"status":"handoff_scope_not_allowed","task_class":task_class,"timestamp":now_iso()}
        required_authority='L1'
        if _authority_rank(source[0]) < _authority_rank(required_authority) or _authority_rank(target[0]) < _authority_rank(required_authority):
            return 409,{"status":"authority_ceiling_insufficient","required_authority":required_authority,"timestamp":now_iso()}
        handoff_id='hof_'+uuid.uuid4().hex
        correlation_id='hofcorr_'+uuid.uuid4().hex
        requested_at=now_iso()
        expires_at=(datetime.now(timezone.utc)+timedelta(seconds=HANDOFF_TTL_SECONDS)).isoformat()
        execution_state='consumed' if task[2] else str(task[1] or 'unknown')
        source_readiness=coordinator_agent_readiness(conn,source_agent_id)
        target_readiness=coordinator_agent_readiness(conn,target_agent_id)
        conn.execute("""insert into task_handoffs(
            handoff_id,handoff_version,task_id,source_agent_id,target_agent_id,task_class,required_authority,
            source_authority_ceiling,target_authority_ceiling,reason_code,correlation_id,requested_by,requested_at,expires_at,
            handoff_approval_required,handoff_approval_state,execution_approval_state,source_readiness,target_readiness,state)
            values(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
            (handoff_id,'2.2-a6.7.v1',task_id,source_agent_id,target_agent_id,task_class,required_authority,
             source[0],target[0],reason_code,correlation_id,requested_by,requested_at,expires_at,
             1,'pending',execution_state,source_readiness,target_readiness,'requested'))
        conn.commit()
        return 201,{"status":"ok","handoff":{"handoff_id":handoff_id,"task_id":task_id,"source_agent_id":source_agent_id,
            "target_agent_id":target_agent_id,"state":"requested","handoff_approval_required":True,
            "handoff_approval_state":"pending","source_readiness":source_readiness,"target_readiness":target_readiness,
            "correlation_id":correlation_id,"expires_at":expires_at},"timestamp":now_iso()}
    finally:
        conn.close()


def coordinator_handoff_accept(handoff_id):
    handoff_id=(handoff_id or "").strip()
    if not handoff_id:
        return 400,{"status":"invalid_request","detail":"handoff_id is required","timestamp":now_iso()}
    conn=db()
    try:
        conn.execute('BEGIN IMMEDIATE')
        row=conn.execute("select * from task_handoffs where handoff_id=?",(handoff_id,)).fetchone()
        if not row:
            conn.rollback(); return 404,{"status":"handoff_not_found","handoff_id":handoff_id,"timestamp":now_iso()}
        d=dict(row)
        if d['state']=='accepted':
            conn.rollback(); return 200,{"status":"ok","handoff":d,"idempotent_replay":True,"timestamp":now_iso()}
        if d['state']!='requested':
            conn.rollback(); return 409,{"status":"handoff_not_requestable","state":d['state'],"timestamp":now_iso()}
        if datetime.now(timezone.utc) >= _iso_to_dt(d['expires_at']):
            now=now_iso(); conn.execute("update task_handoffs set state='expired',decided_by='control-api-authenticated',decided_at=?,containment_reason='expired' where handoff_id=? and state='requested'",(now,handoff_id)); conn.commit()
            return 409,{"status":"handoff_expired","handoff_id":handoff_id,"timestamp":now_iso()}
        current_owner=coordinator_current_owner(conn,d['task_id'])
        if current_owner!=d['source_agent_id']:
            conn.execute("update task_handoffs set state='contained',decided_by='control-api-authenticated',decided_at=?,containment_reason='source_owner_changed' where handoff_id=? and state='requested'",(now_iso(),handoff_id)); conn.commit()
            return 409,{"status":"handoff_contained","reason":"source_owner_changed","timestamp":now_iso()}
        target=conn.execute("select authority_ceiling,enabled,assignable from agent_registry where agent_id=?",(d['target_agent_id'],)).fetchone()
        source=conn.execute("select authority_ceiling,enabled,assignable from agent_registry where agent_id=?",(d['source_agent_id'],)).fetchone()
        if not target or not bool(target[1]) or not bool(target[2]):
            conn.rollback(); return 409,{"status":"target_not_assignable","target_agent_id":d['target_agent_id'],"timestamp":now_iso()}
        if not source:
            conn.rollback(); return 409,{"status":"source_agent_not_registered","timestamp":now_iso()}
        source_readiness=coordinator_agent_readiness(conn,d['source_agent_id'])
        target_readiness=coordinator_agent_readiness(conn,d['target_agent_id'])
        if source_readiness!='ready' or target_readiness!='ready':
            conn.rollback(); return 409,{"status":"handoff_readiness_not_ready","source_readiness":source_readiness,"target_readiness":target_readiness,"timestamp":now_iso()}
        task=conn.execute("select task_class,state,consumed_at from approval_requests where task_id=? order by created_at desc limit 1",(d['task_id'],)).fetchone()
        if not task or task[0]!=d['task_class'] or task[0]!='general' or EXECUTION_ALLOWED_TASK_CLASSES!={"general"}:
            conn.rollback(); return 409,{"status":"handoff_task_class_conflict","timestamp":now_iso()}
        if source[0]!=d['source_authority_ceiling'] or target[0]!=d['target_authority_ceiling']:
            conn.rollback(); return 409,{"status":"handoff_authority_evidence_changed","timestamp":now_iso()}
        if _authority_rank(source[0]) < _authority_rank(d['required_authority']) or _authority_rank(target[0]) < _authority_rank(d['required_authority']):
            conn.rollback(); return 409,{"status":"handoff_authority_insufficient","timestamp":now_iso()}
        if bool(d['handoff_approval_required']) and d['handoff_approval_state']!='approved':
            conn.rollback(); return 409,{"status":"handoff_approval_required","handoff_approval_state":d['handoff_approval_state'],"timestamp":now_iso()}
        latest=conn.execute("select stage from task_lifecycle_events where task_id=? order by occurred_at desc,event_id desc limit 1",(d['task_id'],)).fetchone()
        prior_stage=latest[0] if latest else None
        event_id=lifecycle_event_insert(conn,d['task_id'],'ASSIGNED',source_component='control-api-handoff',actor_id='control-api-authenticated',assigned_agent_id=d['target_agent_id'],previous_stage=prior_stage,reason_code='handoff_accepted',correlation_id=d['correlation_id'])
        updated=conn.execute("update task_handoffs set state='accepted',decided_by='control-api-authenticated',decided_at=?,lifecycle_event_id=?,source_readiness=?,target_readiness=? where handoff_id=? and state='requested'",(now_iso(),event_id,source_readiness,target_readiness,handoff_id))
        if updated.rowcount!=1:
            raise RuntimeError('handoff_accept_transition_conflict')
        conn.commit()
        out=dict(conn.execute("select * from task_handoffs where handoff_id=?",(handoff_id,)).fetchone())
        return 200,{"status":"ok","handoff":out,"timestamp":now_iso()}
    except Exception:
        conn.rollback(); raise
    finally:
        conn.close()


def coordinator_handoff_reject(handoff_id):
    handoff_id=(handoff_id or "").strip()
    if not handoff_id:
        return 400,{"status":"invalid_request","detail":"handoff_id is required","timestamp":now_iso()}
    conn=db()
    try:
        conn.execute('BEGIN IMMEDIATE')
        row=conn.execute("select * from task_handoffs where handoff_id=?",(handoff_id,)).fetchone()
        if not row:
            conn.rollback(); return 404,{"status":"handoff_not_found","handoff_id":handoff_id,"timestamp":now_iso()}
        d=dict(row)
        if d['state']=='rejected':
            conn.rollback(); return 200,{"status":"ok","handoff":d,"idempotent_replay":True,"timestamp":now_iso()}
        if d['state']!='requested':
            conn.rollback(); return 409,{"status":"handoff_terminal","state":d['state'],"timestamp":now_iso()}
        now=now_iso(); conn.execute("update task_handoffs set state='rejected',decided_by='control-api-authenticated',decided_at=?,containment_reason='explicit_rejection' where handoff_id=? and state='requested'",(now,handoff_id)); conn.commit()
        out=dict(conn.execute("select * from task_handoffs where handoff_id=?",(handoff_id,)).fetchone())
        return 200,{"status":"ok","handoff":out,"timestamp":now_iso()}
    except Exception:
        conn.rollback(); raise
    finally:
        conn.close()


'''
          t=t.replace(func_anchor,funcs+func_anchor,1)

          route_anchor='        if path=="/v1/tasks/assign":\n'
          assert t.count(route_anchor)==1
          routes=r'''        if path=="/v1/tasks/handoff/request":
            try:
                length=int(self.headers.get("Content-Length","0") or "0")
                raw=self.rfile.read(min(length,4096)) if length else b"{}"
