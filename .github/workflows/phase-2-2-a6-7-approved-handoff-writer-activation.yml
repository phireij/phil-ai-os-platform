name: Phase 2.2 A6.7 Approved Inert Handoff Writer Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-2-a6-7-approved-handoff-writer-activation.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify recorded A6.7 authorization
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT=docs/PHASE_2_2_A6_7_CEO_APPROVAL_2026-08-28.md
          grep -Fx 'Approved by: CEO' "$RECEIPT"
          grep -Fx 'Authorization: APPROVE_PHASE_2_2_A6_7' "$RECEIPT"
          grep -F 'Scope: inert handoff persistence/writer activation only' "$RECEIPT"

      - name: Configure IPv4 SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then
              exit 0
            fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Stage audited activation scripts
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -4 -P "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            scripts/phase2_2_a6_7_patch_control_api.py \
            scripts/phase2_2_a6_7_approved_activation.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Activate inert writer with isolated validation and rollback containment
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'chmod 700 /tmp/phase2_2_a6_7_approved_activation.sh /tmp/phase2_2_a6_7_patch_control_api.py && bash /tmp/phase2_2_a6_7_approved_activation.sh /tmp/phase2_2_a6_7_patch_control_api.py' \
            | tee phase22-a6-7-evidence.txt

      - name: Upload A6.7 activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-2-a6-7-inert-handoff-writer-activation-evidence
          path: phase22-a6-7-evidence.txt
          if-no-files-found: error
          retention-days: 30
