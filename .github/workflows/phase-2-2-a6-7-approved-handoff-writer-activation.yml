          e=json.loads(pathlib.Path('/var/lib/phil-ai-os/agent-presence/specialist-worker-01.json').read_text()); pl=e['payload']
          assert pl['agent_id']=='specialist-worker-01' and pl['enabled'] is False and pl['assignable'] is False and pl['authority_ceiling']=='L1'
          ts=datetime.datetime.fromisoformat(pl['observed_at']); assert (datetime.datetime.now(datetime.timezone.utc)-ts).total_seconds()<=120
          PY
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
