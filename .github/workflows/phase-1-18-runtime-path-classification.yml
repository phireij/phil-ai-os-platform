name: Phase 1.18 Runtime Path Classification
on:
  workflow_dispatch:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-runtime-classification-trigger'
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Classify active runtime path
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          test -n "$HERMES"

          EXEC_PATH=/usr/local/bin/philaios-execute
          if docker exec "$HERMES" test -x "$EXEC_PATH"; then
            EXEC_MOUNT=present
          else
            EXEC_MOUNT=missing
          fi

          if docker exec "$HERMES" sh -lc "grep -q '/v1/execute' '$EXEC_PATH' 2>/dev/null"; then
            EXEC_ROUTE=control_api
          else
            EXEC_ROUTE=unknown
          fi

          if docker exec "$HERMES" sh -lc "grep -Rqs 'philaios-execute\|/usr/local/bin/philaios-execute' /opt/data /opt/hermes 2>/dev/null"; then
            ACTIVE_CONFIG_REF=found
          else
            ACTIVE_CONFIG_REF=not_found
          fi

          PROVIDER_STYLE_KEYS=$(docker inspect "$HERMES" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | grep -Eic 'OPENAI|OPENROUTER|GEMINI|ANTHROPIC' || true)
          CONTROL_KEYS=$(docker inspect "$HERMES" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | grep -Eic 'PHIL_AI_OS_CONTROL_API' || true)

          echo '=== PHASE 1.18 RUNTIME CLASSIFICATION ==='
          echo "philaios_execute_mount=$EXEC_MOUNT"
          echo "philaios_execute_route=$EXEC_ROUTE"
          echo "active_config_philaios_ref=$ACTIVE_CONFIG_REF"
          echo "provider_style_env_key_count=$PROVIDER_STYLE_KEYS"
          echo "control_api_env_key_count=$CONTROL_KEYS"
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo PHIL_AI_OS_PHASE_1_18_RUNTIME_CLASSIFICATION_OK
          REMOTE
