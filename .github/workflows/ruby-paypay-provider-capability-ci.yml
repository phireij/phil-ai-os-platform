name: Ruby PayPay Provider Capability CI

on:
  pull_request:
    paths:
      - "ops/readiness/ruby-komoju-paypay-provider-capability-2026-09-04.json"
      - "ops/readiness/ruby-checkout-legal-payment-shipping-sync-2026-09-04.json"
      - "scripts/validate_sprint7_paypay_provider_capability.py"
      - ".github/workflows/ruby-paypay-provider-capability-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ops/readiness/ruby-komoju-paypay-provider-capability-2026-09-04.json"
      - "ops/readiness/ruby-checkout-legal-payment-shipping-sync-2026-09-04.json"
      - "scripts/validate_sprint7_paypay_provider_capability.py"
      - ".github/workflows/ruby-paypay-provider-capability-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate provider capability remains separate from merchant activation
        run: python scripts/validate_sprint7_paypay_provider_capability.py
