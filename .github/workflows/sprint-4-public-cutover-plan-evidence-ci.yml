name: Sprint 4 Public Cutover Plan Evidence CI

on:
  pull_request:
    paths:
      - "contracts/operations/ruby-public-cutover-plan-evidence.schema.json"
      - "ops/readiness/ruby-public-cutover-plan-evidence.template.json"
      - "ops/readiness/ruby-final-go-no-go-gate-2026-09-02.json"
      - "ops/readiness/sprint7-production-deployment-readiness.json"
      - "docs/SPRINT_7_WOOCOMMERCE_STAGING_CUTOVER_RUNBOOK_2026-08-28.md"
      - "scripts/validate_sprint7_public_cutover_plan_evidence.py"
      - ".github/workflows/sprint-4-public-cutover-plan-evidence-ci.yml"
  push:
    branches:
      - "main"
      - "sprint4/**"
    paths:
      - "contracts/operations/ruby-public-cutover-plan-evidence.schema.json"
      - "ops/readiness/ruby-public-cutover-plan-evidence.template.json"
      - "ops/readiness/ruby-final-go-no-go-gate-2026-09-02.json"
      - "ops/readiness/sprint7-production-deployment-readiness.json"
      - "docs/SPRINT_7_WOOCOMMERCE_STAGING_CUTOVER_RUNBOOK_2026-08-28.md"
      - "scripts/validate_sprint7_public_cutover_plan_evidence.py"
      - ".github/workflows/sprint-4-public-cutover-plan-evidence-ci.yml"

permissions:
  contents: read

jobs:
  public-cutover-plan-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate public cutover plan evidence contract
        run: python scripts/validate_sprint7_public_cutover_plan_evidence.py --self-test

      - name: Verify pending cutover template remains non-authorizing
        run: |
          python -m json.tool ops/readiness/ruby-public-cutover-plan-evidence.template.json >/dev/null
          ! grep -E '"(dns_cutover_authorized|site_cutover_authorized|production_publish_authorized|payment_execution_authorized|order_creation_authorized|automatic_production_execution_authorized|automatic_rollback_authorized)"[[:space:]]*:[[:space:]]*true' ops/readiness/ruby-public-cutover-plan-evidence.template.json
          echo PHIL_AI_OS_PUBLIC_CUTOVER_PLAN_TEMPLATE_FAIL_CLOSED_GREEN
