name: Phase 2.1H Controlled Production Canary

on:
  push:
    branches: [main]
    paths:
      - '.github/phase-2-1h-production-canary-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate activation tools
        run: |
          set -euo pipefail
          bash -n ops/phase-2.1h/activate-lifecycle-production-canary.sh
          python3 -m py_compile ops/phase-2.1h/build-lifecycle-writer-candidate.py ops/phase-2.1h/apply-lifecycle-ledger-migration.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage canary tools
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q \
            ops/phase-2.1h/activate-lifecycle-production-canary.sh \
            ops/phase-2.1h/build-lifecycle-writer-candidate.py \
            ops/phase-2.1h/apply-lifecycle-ledger-migration.py \
            "$VPS_USER@$VPS_HOST:/tmp/"
      - name: Run atomic rollback-protected canary
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" \
            'chmod 700 /tmp/activate-lifecycle-production-canary.sh && /tmp/activate-lifecycle-production-canary.sh'
