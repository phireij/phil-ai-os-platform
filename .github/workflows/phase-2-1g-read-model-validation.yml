name: Phase 2.1G Read Model Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/phase-2-1g-read-model-validation-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Phase 2.1G candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/phase-2.1f/build-read-model-v21f.py ops/phase-2.1g/build-read-model-v21g.py
          python3 ops/phase-2.1f/build-read-model-v21f.py ops/phase-2.1a/philaios-mission-control-read-model.py /tmp/read-model-2.1f.py
          python3 ops/phase-2.1g/build-read-model-v21g.py /tmp/read-model-2.1f.py /tmp/read-model-2.1g.py
          python3 -m py_compile /tmp/read-model-2.1g.py
          grep -q 'SCHEMA_VERSION = "2.1g.v1"' /tmp/read-model-2.1g.py
          grep -q 'lifecycle_provenance' /tmp/read-model-2.1g.py
          grep -q 'authoritative_source_unavailable' /tmp/read-model-2.1g.py
          echo candidate_build=ok

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1

      - name: Stage candidate only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q /tmp/read-model-2.1g.py "$VPS_USER@$VPS_HOST:/tmp/philaios-read-model-2.1g.py"

      - name: Validate live read-only candidate
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CAND=/tmp/philaios-read-model-2.1g.py
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -f "$CAND"
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.1-phase21f'
          BEFORE="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0],c.execute('select count(*) from execution_audit').fetchone()[0])")"
          python3 "$CAND" > /tmp/philaios-read-model-2.1g.json
          python3 -c "import json; m=json.load(open('/tmp/philaios-read-model-2.1g.json')); assert m['schema_version']=='2.1g.v1'; assert m['overall_state']=='healthy'; assert m['governance']['execution_allowed_task_classes']==['general']; assert m['governance']['direct_provider_bypass_allowed'] is False; assert m['governance']['authority_expansion_state']=='blocked'; q=m['data_quality']; assert q['lifecycle_provenance']=='durable_subset_only'; assert q['agent_assignment_provenance']=='authoritative_source_unavailable'; assert q['unsupported_lifecycle_stages']==['ASSIGNED','PLANNED','POLICY_CHECK','EXECUTING','CLOSED']; s=m['durable_correlation_summary']; assert s['canonical_task_persistence']=='present'; assert s['canonical_task_id_mismatch_count']==0; [(_ for _ in ()).throw(AssertionError('assigned_agent_id must remain unset')) if t.get('assigned_agent_id') is not None else None for t in m['tasks']]; [(_ for _ in ()).throw(AssertionError('missing lifecycle evidence')) if 'lifecycle_evidence' not in t else None for t in m['tasks']]"
          AFTER="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0],c.execute('select count(*) from execution_audit').fetchone()[0])")"
          test "$BEFORE" = "$AFTER"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --max-time 5 http://127.0.0.1:4881/)" = 405
          rm -f "$CAND" /tmp/philaios-read-model-2.1g.json
          echo read_model_schema=2.1g.v1
          echo lifecycle_provenance=durable_subset_only
          echo agent_assignment=authoritative_source_unavailable
          echo unsupported_stages=ASSIGNED,PLANNED,POLICY_CHECK,EXECUTING,CLOSED
          echo approval_execution_counts_unchanged=true
          echo production_change=none
          echo database_write=none
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1G_READ_MODEL_VALIDATION_OK
          REMOTE
