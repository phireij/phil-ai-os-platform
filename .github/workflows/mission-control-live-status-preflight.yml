name: Mission Control Live Status Connector Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-control-live-status-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Verify root-managed inputs and Compose contract without starting workloads
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          port="${VPS_PORT:-22}"
          remote="$VPS_USER@$VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          opts=(-4 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -uo pipefail
          root=/opt/phil-ai-os-platform/mc021-main-runtime
          tunnel_env=/etc/phil-ai-os/secrets/mc021-live-status-tunnel.env
          owner_subject=/etc/phil-ai-os/secrets/mc021-owner-subject
          root_exists=false; [[ -d "$root" ]] && root_exists=true
          tunnel_custody=false; [[ -f "$tunnel_env" && "$(stat -c '%u:%a' "$tunnel_env" 2>/dev/null)" = 0:600 ]] && tunnel_custody=true
          owner_custody=false; [[ -f "$owner_subject" && "$(stat -c '%u:%a' "$owner_subject" 2>/dev/null)" = 0:400 ]] && owner_custody=true
          inputs_present=false
          compose_contract=false
          if [[ "$root_exists" = true && "$tunnel_custody" = true && "$owner_custody" = true ]]; then
            set -a; . "$tunnel_env"; set +a
            [[ -n "${CONTROL_PLANE_API_KEY:-}" && -n "${CONTROL_PLANE_TUNNEL_ID:-}" ]] && inputs_present=true
            if [[ "$inputs_present" = true ]]; then
              cd "$root"
              docker compose -f ops/mission-control-identity/compose.mcp-live-status.nonprod.yml -f ops/mission-control-identity/compose.mcp-live-status.tunnel.nonprod.yml config --quiet && compose_contract=true
            fi
            unset CONTROL_PLANE_API_KEY CONTROL_PLANE_TUNNEL_ID
          fi
          existing=false
          running=false
          read_only=false
          unprivileged=false
          capabilities_dropped=false
          bridge_network=false
          host_port_absent=false
          owner_subject_mount_read_only=false
          workload=phil-ai-os-mc021-live-status-nonprod-mcp-live-status-1
          if docker inspect "$workload" >/dev/null 2>&1; then
            existing=true
            [[ "$(docker inspect "$workload" --format '{{.State.Running}}')" == true ]] && running=true
            [[ "$(docker inspect "$workload" --format '{{.HostConfig.ReadonlyRootfs}}')" == true ]] && read_only=true
            [[ "$(docker inspect "$workload" --format '{{.HostConfig.Privileged}}')" == false ]] && unprivileged=true
            [[ "$(docker inspect "$workload" --format '{{json .HostConfig.CapDrop}}')" == '["ALL"]' ]] && capabilities_dropped=true
            [[ "$(docker inspect "$workload" --format '{{.HostConfig.NetworkMode}}')" == bridge ]] && bridge_network=true
            [[ "$(docker inspect "$workload" --format '{{json .HostConfig.PortBindings}}')" == null ]] && host_port_absent=true
            [[ "$(docker inspect "$workload" --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/mc021_owner_subject"}}{{.Type}} {{.RW}}{{end}}{{end}}')" == 'bind false' ]] && owner_subject_mount_read_only=true
          fi
          echo "mc021_live_status_preflight root_exists=$root_exists tunnel_custody=$tunnel_custody owner_custody=$owner_custody inputs_present=$inputs_present compose_contract=$compose_contract workload_present=$existing workload_running=$running workload_read_only=$read_only workload_unprivileged=$unprivileged workload_capabilities_dropped=$capabilities_dropped workload_bridge_network=$bridge_network workload_host_port_absent=$host_port_absent owner_subject_mount_read_only=$owner_subject_mount_read_only content_accessed=false authority_effect=none"
          test "$root_exists" = true && test "$tunnel_custody" = true && test "$owner_custody" = true && test "$inputs_present" = true && test "$compose_contract" = true && test "$existing" = true && test "$running" = true && test "$read_only" = true && test "$unprivileged" = true && test "$capabilities_dropped" = true && test "$bridge_network" = true && test "$host_port_absent" = true && test "$owner_subject_mount_read_only" = true
          REMOTE
