name: Phase 1.21 Checkpoint Closure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-checkpoint-closure.yml'

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3; do
            echo "ssh_preflight_attempt=$attempt"
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && \
               ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then
              echo ssh_preflight=ok
              exit 0
            fi
            sleep $((attempt*5))
          done
          echo ssh_preflight=failed
          exit 1
      - name: Validate Phase 1.21 closed state
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          MARKER=/etc/phil-ai-os/phase-1-21-routine-canary.env
          APPROVAL_ID='apr_8e246f5927254dfbb4234b21ef10602c'
          echo '=== PHASE 1.21 CHECKPOINT CLOSURE ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          test -s "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVE=false$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_ALLOWLIST_ACTIVE=false$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_CONSUMED=true$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ALLOWLIST_RESTORED=true$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_DIRECT_PROVIDER_BYPASS=false$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_AUTONOMOUS_EXPANSION=false$' "$MARKER"

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          ! grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=.*routine' <<<"$ENV"

          docker exec -e APPROVAL_ID="$APPROVAL_ID" "$CONTROL" python - <<'PY'
          import os,sqlite3
          con=sqlite3.connect('/app/state/control-plane.db'); con.row_factory=sqlite3.Row
          r=con.execute('select state,task_class,consumed_at from approval_requests where approval_id=?',(os.environ['APPROVAL_ID'],)).fetchone()
          assert r is not None
          assert r['state']=='approved'
          assert r['task_class']=='routine'
          assert r['consumed_at'] is not None
          print('approval_consumption=verified')
          PY

          echo phase_1_21_status=COMPLETE
          echo routine_canary=PASS
          echo temporary_routine_allowlist=RESTORED_OFF
          echo execution_allowlist=general_only
          echo control_api_health=ok
          echo direct_provider_bypass=false
          echo autonomous_expansion=false
          echo provider_call=none
          echo next_action=PHASE_1_22
          echo PHIL_AI_OS_PHASE_1_21_CHECKPOINT_CLOSED
          REMOTE
