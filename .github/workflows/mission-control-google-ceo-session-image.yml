name: Mission Control Google CEO Session Immutable Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.mission-control-google-ceo-session'
      - 'ops/mission-control-identity/**'
      - '.github/workflows/mission-control-google-ceo-session-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify offline OAuth and CEO session boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/mission-control-google-ceo-session-venv
          source /tmp/mission-control-google-ceo-session-venv/bin/activate
          python3 -m pip install --disable-pip-version-check google-auth==2.62.0 requests==2.34.2
          python3 ops/mission-control-identity/test_google_identity_probe.py
          python3 ops/mission-control-identity/test_google_ceo_session.py
          python3 ops/mission-control-identity/test_conversation_store.py
          python3 ops/mission-control-identity/test_provider_runtime.py
          python3 ops/mission-control-identity/test_notification_delivery.py
      - name: Publish pinned image and report digest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}/mission-control-google-ceo-session
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/mission-control-google-ceo-session-image.json"
          docker buildx build --file Dockerfile.mission-control-google-ceo-session --tag "$IMAGE:${GITHUB_SHA}" --metadata-file "$metadata" --push .
          digest="$(jq -r '."containerimage.digest"' "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "published_image=$IMAGE@$digest source_revision=$GITHUB_SHA authority_effect=none"
