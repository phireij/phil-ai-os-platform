name: Phase 2.1F Isolation Runtime Dependency Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1f-isolation-runtime-dependency-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Discover isolated runtime dependencies read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          TEST=philaios-phase21f-runtime-dependency-test
          cleanup(){ docker rm -f "$TEST" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.0'
          echo '--- live mount destinations (values not emitted) ---'
          docker inspect "$CONTROL" --format '{{range .Mounts}}{{println .Type "|" .Destination "|rw=" .RW}}{{end}}'
          echo '--- live env key names only ---'
          docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/=.*$//p' | sort -u
          ENV_ARGS=()
          while IFS= read -r e; do [ -n "$e" ] || continue; ENV_ARGS+=(--env "$e"); done < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          docker create --name "$TEST" "${ENV_ARGS[@]}" --entrypoint python3 phil-ai-os/control-api:0.20.0 /app/app.py >/dev/null
          docker start "$TEST" >/dev/null || true
          sleep 2
          STATE="$(docker inspect "$TEST" --format '{{.State.Status}}')"
          EXIT="$(docker inspect "$TEST" --format '{{.State.ExitCode}}')"
          echo isolated_baseline_state="$STATE"
          echo isolated_baseline_exit_code="$EXIT"
          if [ "$STATE" != running ]; then
            echo isolated_baseline_requires_runtime_mounts_or_dependencies=true
          else
            echo isolated_baseline_requires_runtime_mounts_or_dependencies=false
          fi
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.0'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert 'task_id' not in [r[1] for r in c.execute('pragma table_info(approval_requests)')]; assert c.execute('pragma quick_check').fetchone()[0]=='ok'"
          echo production_change=none
          echo live_database_write=none
          echo secret_values_emitted=false
          echo PHIL_AI_OS_PHASE_2_1F_ISOLATION_RUNTIME_DEPENDENCY_DISCOVERY_OK
          REMOTE
