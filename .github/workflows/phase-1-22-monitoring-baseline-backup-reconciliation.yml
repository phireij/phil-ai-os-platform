name: Phase 1.22 Monitoring Baseline and Backup Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-22-monitoring-baseline-backup-reconciliation.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with resilient retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            echo "ssh_preflight_attempt=$attempt"
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Discover exact monitor baseline and backup freshness chain
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.22 MONITORING BASELINE AND BACKUP RECONCILIATION ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          echo production_allowlist=general_only

          echo '--- monitor unit and environment ---'
          systemctl is-active phil-ai-os-monitor.service
          systemctl cat phil-ai-os-monitor.service
          systemctl show phil-ai-os-monitor.service -p Environment -p EnvironmentFiles -p ExecStart -p ActiveState -p SubState --no-pager
          for f in /etc/phil-ai-os/*monitor* /etc/default/phil-ai-os* /etc/sysconfig/phil-ai-os*; do
            [ -f "$f" ] || continue
            echo FILE="$f"
            sed -E 's/(TOKEN|KEY|SECRET|PASSWORD)=.*/\1=REDACTED/I' "$f"
          done

          echo '--- monitor expectation source ---'
          grep -nE 'KILL_SWITCH|ROUTED|BACKUP|EXPECTED|MAX_AGE|LIVE_TEST|ALLOWED_TASK|execution_kill_switch|routed_execution_enabled|backup_status' /opt/phil-ai-os/phase-1.16/monitor.py || true

          echo '--- backup units ---'
          systemctl is-active phil-ai-os-backup.timer
          systemctl is-active phil-ai-os-backup-self-heal.timer
          systemctl cat phil-ai-os-backup.service phil-ai-os-backup.timer phil-ai-os-backup-self-heal.service phil-ai-os-backup-self-heal.timer || true
          systemctl list-timers --all --no-pager | grep -E 'phil-ai-os-backup' || true

          echo '--- backup scripts/status paths ---'
          find /etc/phil-ai-os /opt/phil-ai-os /usr/local/bin -maxdepth 5 -type f 2>/dev/null | grep -Ei 'backup|monitor|status' | sort | head -n 400
          grep -RniE 'backup.*status|status.*backup|max.*age|fresh|timestamp|latest' /opt/phil-ai-os /etc/phil-ai-os /usr/local/bin 2>/dev/null | head -n 500 || true

          echo '--- backup freshness evidence ---'
          find /var/backups /opt/phil-ai-os /etc/phil-ai-os -type f 2>/dev/null | grep -Ei 'backup|control-plane.*db|status' | while read -r f; do stat -c 'mtime=%Y size=%s file=%n' "$f" 2>/dev/null || true; done | sort -nr | head -n 120
          date -u +now_epoch=%s
          journalctl -u phil-ai-os-backup.service --since '72 hours ago' --no-pager -n 200 || true
          journalctl -u phil-ai-os-backup-self-heal.service --since '72 hours ago' --no-pager -n 200 || true

          echo '--- current monitor failures ---'
          journalctl -u phil-ai-os-monitor.service --since '2 hours ago' --no-pager -n 120 | grep -E 'execution_kill_switch|routed_execution_enabled|backup_status|overall|FAIL|OK' || true

          echo provider_call=none
          echo production_change=none
          echo routine_activation=false
          echo reconciliation_mode=read_only
          echo next_action=PHASE_1_22_MONITOR_BASELINE_MINIMAL_REMEDIATION
          echo PHIL_AI_OS_PHASE_1_22_MONITORING_BASELINE_BACKUP_RECONCILIATION_OK
          REMOTE