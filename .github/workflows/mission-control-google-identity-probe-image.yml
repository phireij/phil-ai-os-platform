name: Mission Control Google Identity Probe Immutable Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.mission-control-google-identity-probe'
      - 'ops/mission-control-identity/**'
      - '.github/workflows/mission-control-google-identity-probe-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check inactive activation and secret-staging script syntax
        shell: bash
        run: |
          bash -n ops/mission-control-identity/activate-google-identity-probe.sh
          bash -n ops/mission-control-identity/stage-google-identity-probe-secret.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify offline probe boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/mission-control-google-probe-venv
          source /tmp/mission-control-google-probe-venv/bin/activate
          python3 -m pip install --disable-pip-version-check cryptography==47.0.0 google-auth==2.50.0 requests==2.32.4
          python3 ops/mission-control-identity/test_google_identity_probe.py
          python3 ops/mission-control-identity/test_google_identity_probe_activation_script.py
          python3 ops/mission-control-identity/test_google_identity_probe_build_manifest.py
          python3 ops/mission-control-identity/test_google_identity_probe_runtime_workflow.py
      - name: Publish pinned image and report digest
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}/mission-control-google-identity-probe
        run: |
          set -euo pipefail
          docker buildx build --file Dockerfile.mission-control-google-identity-probe --tag "$IMAGE:${GITHUB_SHA}" --push .
          digest="$(docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "published_image=$IMAGE@$digest source_revision=$GITHUB_SHA authority_effect=none"
