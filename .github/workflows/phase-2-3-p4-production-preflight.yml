name: Phase 2.3 P4 Production Preflight

on:
  push:
    paths:
      - 'scripts/phase2_3_p4_production_preflight.sh'
      - '.github/workflows/phase-2-3-p4-production-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate preflight script
        run: bash -n scripts/phase2_3_p4_production_preflight.sh
      - name: Configure IPv4 SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4 5 6; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Stage audited preflight script
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -4 -P "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes scripts/phase2_3_p4_production_preflight.sh "$VPS_USER@$VPS_HOST:/tmp/phase2_3_p4_production_preflight.sh"
      - name: Run read-only/preparatory production preflight
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'chmod 700 /tmp/phase2_3_p4_production_preflight.sh && /tmp/phase2_3_p4_production_preflight.sh' | tee phase-2-3-p4-preflight.txt
      - name: Cleanup staged script
        if: always()
        shell: bash
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'rm -f /tmp/phase2_3_p4_production_preflight.sh' || true
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-3-p4-production-preflight-evidence
          path: phase-2-3-p4-preflight.txt
          if-no-files-found: warn
          retention-days: 30
