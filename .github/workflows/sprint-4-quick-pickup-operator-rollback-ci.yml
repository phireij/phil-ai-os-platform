name: Sprint 4 Quick Pickup Operator Rollback CI

on:
  pull_request:
    paths:
      - "ops/readiness/ruby-first-party-quick-pickup-readiness.json"
      - "ops/readiness/ruby-first-party-quick-pickup-operator-rollback-evidence.template.json"
      - "scripts/validate_sprint7_first_party_quick_pickup_readiness.py"
      - "scripts/validate_sprint7_first_party_quick_pickup_operator_rollback.py"
      - ".github/workflows/sprint-4-quick-pickup-operator-rollback-ci.yml"
  push:
    branches:
      - main
    paths:
      - "ops/readiness/ruby-first-party-quick-pickup-readiness.json"
      - "ops/readiness/ruby-first-party-quick-pickup-operator-rollback-evidence.template.json"
      - "scripts/validate_sprint7_first_party_quick_pickup_readiness.py"
      - "scripts/validate_sprint7_first_party_quick_pickup_operator_rollback.py"
      - ".github/workflows/sprint-4-quick-pickup-operator-rollback-ci.yml"

permissions:
  contents: read

jobs:
  operator-rollback-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Quick Pickup readiness remains fail-closed
        run: python scripts/validate_sprint7_first_party_quick_pickup_readiness.py
      - name: Validate operator and rollback evidence harness
        run: python scripts/validate_sprint7_first_party_quick_pickup_operator_rollback.py
