name: Mission Control Conversation Storage Monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-control-conversation-backup
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      HOSTNAME: miscon.phireij.cloud
      SESSION: phil-ai-os-mission-control-google-ceo-session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Check active encrypted conversation boundary without content access
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          port="${VPS_PORT:-22}"
          remote="$VPS_USER@$VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh_opts=(-4 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote_command="set -euo pipefail
          test \"\$(docker inspect '$SESSION' --format '{{.State.Running}}')\" = true
          test \"\$(docker inspect '$SESSION' --format '{{.HostConfig.ReadonlyRootfs}}')\" = true
          test \"\$(docker inspect '$SESSION' --format '{{.HostConfig.Privileged}}')\" = false
          test \"\$(docker inspect '$SESSION' --format '{{json .HostConfig.CapDrop}}')\" = '[\"ALL\"]'
          SESSION_IMAGE=\$(docker inspect '$SESSION' --format '{{.Config.Image}}')
          SECRET_VOLUME=\$(docker inspect '$SESSION' --format '{{range .Mounts}}{{if eq .Destination \"/run/secrets\"}}{{.Name}}{{end}}{{end}}')
          STATE_VOLUME=\$(docker inspect '$SESSION' --format '{{range .Mounts}}{{if eq .Destination \"/var/lib/mission-control\"}}{{.Name}}{{end}}{{end}}')
          SESSION_IMAGE=\"\$SESSION_IMAGE\" SECRET_VOLUME=\"\$SECRET_VOLUME\" STATE_VOLUME=\"\$STATE_VOLUME\" BACKUP_VOLUME='phil-ai-os-mission-control-conversation-backup-v1' bash -s"
          ssh "${ssh_opts[@]}" "$remote" "$remote_command" < ops/mission-control-identity/monitor-conversation-storage.sh
          health="$(curl --fail-with-body --silent --show-error --max-time 15 "https://$HOSTNAME/auth/google/healthz")"
          test "$health" = 'session_ready;conversation_authority=enabled'
          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "https://$HOSTNAME/auth/google/session")"
          test "$unauth_status" = 401
          echo 'conversation_storage_monitor_completed=true public_health=green unauthenticated_session=401 existing_workloads_unchanged=true authority_effect=none'
