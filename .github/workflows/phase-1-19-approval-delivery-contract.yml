name: Phase 1.19 Approval Delivery Contract

on:
  workflow_dispatch:
  push:
    branches: [ops/phase-1.19]
    paths:
      - .github/workflows/phase-1-19-approval-delivery-contract.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Inspect notifier contract
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=hermes-agent-whow-hermes-agent-1
          echo '=== PHASE 1.19 APPROVAL DELIVERY CONTRACT ==='
          echo "notifier=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-telegram-approval-notifier && echo ready || echo missing)"
          echo '--- notifier usage / argv contract ---'
          docker exec "$HERMES" sh -lc "grep -nE 'sys\.argv|usage:|approval_id|def main|telegram|sendMessage' /usr/local/bin/philaios-telegram-approval-notifier | head -80" || true
          echo '--- notifier control-api routes ---'
          docker exec "$HERMES" sh -lc "grep -nE '/v1/approvals/(get|link|recent)' /usr/local/bin/philaios-telegram-approval-notifier | head -40" || true
          echo '--- notifier source mount ---'
          docker inspect "$HERMES" --format '{{range .Mounts}}{{if eq .Destination "/usr/local/bin/philaios-telegram-approval-notifier"}}{{.Source}} -> {{.Destination}}{{println}}{{end}}{{end}}'
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo execution_invoked=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_19_APPROVAL_DELIVERY_CONTRACT_OK
          REMOTE
