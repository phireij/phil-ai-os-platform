name: Phase 2.1L L7 Final Closure Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1l-l7-final-closure-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1

      - name: Verify Phase 2.1L final production state read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=http://127.0.0.1:4870
          CONTROL=phil-ai-os-core-control-api-1
          HERMES="$(docker ps --format '{{.Names}}' | grep '^hermes-agent-whow' | head -n1)"
          L5_APPROVAL=apr_c6a4ed5510bb474699f3ab68c8fd18ef
          L5_TASK=tsk_9fb9021a89e24dba94c11ed3361f6e4e
          L6_APPROVAL=apr_958a420bf7c342cdaf29669eb13e74ac
          L6_TASK=tsk_3eae6a789d0d439f81cf15ad356521db

          curl -fsS "$BASE/healthz" >/dev/null
          curl -fsS "$BASE/readyz" >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          systemctl is-enabled --quiet phil-ai-os-approval-notification-dispatcher.timer
          systemctl is-active --quiet phil-ai-os-approval-notification-dispatcher.timer
          test -x /usr/local/sbin/philaios-approval-notification-dispatcher
          test -n "$HERMES"
          docker exec "$HERMES" grep -q 'PHIL_AI_OS_AUTO_NOTIFY_APPROVALS", "0"' /usr/local/bin/philaios-mission-control
          docker exec "$HERMES" grep -q '"mode": "server_outbox"' /usr/local/bin/philaios-mission-control
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general

          docker exec -i "$CONTROL" python - "$L5_APPROVAL" "$L5_TASK" "$L6_APPROVAL" "$L6_TASK" <<'PY'
          import sqlite3,sys
          a5,t5,a6,t6=sys.argv[1:]
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          assert c.execute("select count(*) from sqlite_master where type='table' and name='approval_notification_outbox'").fetchone()[0]==1
          assert c.execute("select count(*) from sqlite_master where type='trigger' and name='trg_approval_notification_outbox_enqueue'").fetchone()[0]==1
          cols={r[1] for r in c.execute('pragma table_info(approval_notification_outbox)').fetchall()}
          forbidden={'token','raw_token','link_token','telegram_token','bearer_token','credential','payload','command','provider','model'}
          assert not (cols & forbidden)
          eligible=c.execute("select count(*) from approval_notification_outbox where state in ('pending','leased','retry_wait')").fetchone()[0]
          assert eligible==0, eligible
          l5=c.execute('select state,attempt_count,delivered_at,approval_id,task_id from approval_notification_outbox where approval_id=? and task_id=?',(a5,t5)).fetchone()
          assert l5 and l5['state']=='delivered' and l5['attempt_count']==1 and l5['delivered_at']
          l6=c.execute('select state,attempt_count,delivered_at,approval_id,task_id from approval_notification_outbox where approval_id=? and task_id=?',(a6,t6)).fetchone()
          assert l6 and l6['state']=='dead_letter' and l6['attempt_count']==2 and l6['delivered_at'] is None
          for a,t in ((a5,t5),(a6,t6)):
              ar=c.execute('select task_class,consumed_at,task_id from approval_requests where approval_id=?',(a,)).fetchone()
              assert ar and ar['task_class']=='general' and ar['consumed_at'] is None and ar['task_id']==t
              assert c.execute('select count(*) from execution_audit where approval_id=? or task_id=?',(a,t)).fetchone()[0]==0
          agents=[dict(r) for r in c.execute('select agent_id,role,authority_ceiling,enabled,assignable from agent_registry').fetchall()]
          assert len(agents)==1 and agents[0]['agent_id']=='hermes' and agents[0]['authority_ceiling']=='L3' and agents[0]['assignable']==1
          print('sqlite_quick_check=ok')
          print('outbox_table=present')
          print('enqueue_trigger=present')
          print('outbox_secret_fields=absent')
          print('eligible_outbox_rows=0')
          print('l5_delivery_state=delivered')
          print('l5_delivery_attempts=1')
          print('l6_failure_state=dead_letter')
          print('l6_failure_attempts=2')
          print('canary_execution_audits=0')
          print('hermes_only_assignable_worker=true')
          print('hermes_authority_ceiling=L3')
          c.close()
          PY

          docker exec "$CONTROL" sh -lc "grep -q 'Read-only Mission Control' /app/app.py"
          docker exec "$CONTROL" sh -lc "grep -q 'approval_id is required' /app/app.py"
          echo health=ok
          echo readiness=ok
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active
          echo notification_dispatcher_timer=active
          echo legacy_direct_notify_default=false
          echo server_outbox_mode=active
          echo execution_allowlist=general
          echo mission_control=read_only
          echo approval_mutation=none
          echo notification_send=none
          echo execution_call=none
          echo provider_call=none
          echo PHIL_AI_OS_PHASE_2_1L_L7_FINAL_VERIFICATION_OK
          REMOTE
