name: Phase 1.18 Controlled Enforcement Activation

on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/workflows/phase-1-18-controlled-enforcement-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Activate constrained execution boundary with rollback guard
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow' || true)
          test -n "$HERMES"
          echo '=== PHASE 1.18 CONTROLLED ENFORCEMENT ACTIVATION ==='
          docker exec "$HERMES" test -x /usr/local/bin/philaios-execute
          docker exec "$HERMES" test -s /run/philaios/hermes_control_api_token
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          # Persistent, reversible activation marker. This does not alter provider
          # credentials or Hermes model/provider configuration.
          STATE_DIR=/etc/phil-ai-os
          STATE_FILE="$STATE_DIR/phase-1.18-enforcement.env"
          ROLLBACK_FILE="$STATE_DIR/phase-1.18-enforcement.rollback.env"
          install -d -m 700 "$STATE_DIR"
          if [ -f "$STATE_FILE" ]; then
            cp -a "$STATE_FILE" "$ROLLBACK_FILE"
            echo 'rollback_state=previous_state_saved'
          else
            rm -f "$ROLLBACK_FILE"
            echo 'rollback_state=clean_disable_available'
          fi

          rollback() {
            rc=$?
            if [ -f "$ROLLBACK_FILE" ]; then
              cp -a "$ROLLBACK_FILE" "$STATE_FILE"
            else
              rm -f "$STATE_FILE"
            fi
            echo 'automatic_rollback=performed'
            exit "$rc"
          }
          trap rollback ERR

          cat > "$STATE_FILE" <<'EOF'
          PHIL_AI_OS_CONTROLLED_ENFORCEMENT=true
          PHIL_AI_OS_ENFORCEMENT_SCOPE=philaios_execute_only
          PHIL_AI_OS_DIRECT_PROVIDER_MIGRATION=false
          PHIL_AI_OS_AUTOMATIC_ROLLBACK=true
          EOF
          chmod 600 "$STATE_FILE"

          grep -qx 'PHIL_AI_OS_CONTROLLED_ENFORCEMENT=true' "$STATE_FILE"
          grep -qx 'PHIL_AI_OS_ENFORCEMENT_SCOPE=philaios_execute_only' "$STATE_FILE"
          grep -qx 'PHIL_AI_OS_DIRECT_PROVIDER_MIGRATION=false' "$STATE_FILE"
          grep -qx 'PHIL_AI_OS_AUTOMATIC_ROLLBACK=true' "$STATE_FILE"
          docker exec "$HERMES" test -x /usr/local/bin/philaios-execute
          docker exec "$HERMES" test -s /run/philaios/hermes_control_api_token
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer

          trap - ERR
          echo 'controlled_enforcement=enabled'
          echo 'enforcement_scope=philaios_execute_only'
          echo 'direct_provider_migration=false'
          echo 'automatic_rollback=armed'
          echo 'provider_call=none'
          echo 'hermes_restart=none'
          echo 'control_api_health=ok'
          echo 'monitor=active'
          echo 'backup_timer=active'
          echo PHIL_AI_OS_PHASE_1_18_CONTROLLED_ENFORCEMENT_ACTIVATION_OK
          REMOTE
