name: Phase 1.19 Hermes Mission Control Client Preflight

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-agent-client-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 3; done
          test -s ~/.ssh/known_hosts
      - name: Preflight agent client install surface
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          echo '=== PHASE 1.19 AGENT CLIENT PREFLIGHT ==='
          echo "bin_writable=$(docker exec "$HERMES" sh -lc 'test -w /usr/local/bin && echo yes || echo no')"
          echo "python=$(docker exec "$HERMES" sh -lc 'command -v python3 >/dev/null && echo ready || echo missing')"
          echo "token_mount=$(docker exec "$HERMES" sh -lc 'test -s /run/philaios/hermes_control_api_token && echo ready || echo missing')"
          echo "control_dns_http=$(docker exec "$HERMES" sh -lc 'T=$(cat /run/philaios/hermes_control_api_token); curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" http://phil-ai-os-core-control-api-1:4870/v1/mission-control/snapshot')"
          echo "existing_agent_client=$(docker exec "$HERMES" sh -lc 'test -e /usr/local/bin/philaios-mission-control && echo present || echo absent')"
          echo "execute_client=$(docker exec "$HERMES" sh -lc 'test -x /usr/local/bin/philaios-execute && echo ready || echo missing')"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_19_AGENT_CLIENT_PREFLIGHT_OK
          REMOTE
