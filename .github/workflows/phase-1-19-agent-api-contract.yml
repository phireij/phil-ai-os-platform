name: Phase 1.19 Agent API Contract

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-agent-api-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Discover agent-facing API contract
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api' || true)
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow' || true)
          test -n "$CONTROL"
          test -n "$HERMES"
          echo '=== PHASE 1.19 AGENT API CONTRACT ==='
          echo '--- auth signals ---'
          docker exec "$CONTROL" sh -lc "grep -nE 'Authorization|Bearer|token|CONTROL_API|MISSION_CONTROL|require_auth|auth' /app/app.py | head -40" || true
          echo '--- endpoint handlers ---'
          docker exec "$CONTROL" sh -lc "grep -nE 'v1/mission-control/snapshot|v1/approvals/(request|recent|get|consume)|v1/execution/recent' /app/app.py | head -40" || true
          echo '--- hermes integration signals ---'
          docker exec "$HERMES" sh -lc "grep -R -nE 'mission-control|approvals/request|execution/recent|philaios-execute|control_api' /usr/local/bin /opt/hermes /opt/data 2>/dev/null | head -40" || true
          echo "snapshot_unauth_http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4870/v1/mission-control/snapshot || true)"
          echo "approvals_recent_unauth_http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4870/v1/approvals/recent || true)"
          echo "execution_recent_unauth_http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4870/v1/execution/recent || true)"
          echo "control_token_mount=$(docker exec "$HERMES" test -s /run/philaios/hermes_control_api_token && echo ready || echo missing)"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo 'backup_self_heal_timer=active'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo 'provider_call=none'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_19_AGENT_API_CONTRACT_OK
          REMOTE
