name: Phase 1.21 Routine Approved-State Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-routine-approved-state-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Verify approved routine canary authorization
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          APPROVAL_ID=apr_af943f687d8944c38f5c0316c5f02034
          echo '=== PHASE 1.21 ROUTINE APPROVED-STATE VERIFICATION ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          docker exec -e APPROVAL_ID="$APPROVAL_ID" "$CONTROL" python - <<'PY'
          import os,sqlite3
          con=sqlite3.connect('/app/state/control-plane.db'); con.row_factory=sqlite3.Row
          r=con.execute('select state,task_text,task_class,expires_at,consumed_at,consumed_by from approval_requests where approval_id=?',(os.environ['APPROVAL_ID'],)).fetchone()
          assert r is not None, 'approval missing'
          assert r['state']=='approved', dict(r)
          assert r['task_class']=='routine', dict(r)
          assert r['task_text'].startswith('PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVATION'), dict(r)
          assert r['consumed_at'] is None and r['consumed_by'] is None, dict(r)
          print('approval_state=approved')
          print('approval_task_class=routine')
          print('approval_consumed=no')
          PY
          echo production_scope=general_only_unchanged
          echo routine_activation=not_performed
          echo provider_call=none
          echo execution_invoked=none
          echo production_policy_change=none
          echo verification_decision=PASS
          echo next_action=PHASE_1_21_ROUTINE_CANARY_ACTIVATION_CONSUMPTION
          echo PHIL_AI_OS_PHASE_1_21_ROUTINE_APPROVED_STATE_VERIFICATION_OK
          REMOTE
