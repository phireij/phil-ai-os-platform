name: Active Workflow Supply-Chain CI

on:
  pull_request:
    paths:
      - ".github/workflows/commerce-woocommerce-production-readonly-preflight.yml"
      - ".github/workflows/commerce-woocommerce-production-readonly-catalog-snapshot.yml"
      - ".github/workflows/commerce-twilio-production-readonly-preflight.yml"
      - ".github/workflows/commerce-woocommerce-tests.yml"
      - ".github/workflows/sprint-3-woocommerce-foundation-ci.yml"
      - ".github/workflows/sprint-4-customer-experience-ci.yml"
      - ".github/workflows/sprint-7-integrated-readiness-ci.yml"
      - ".github/workflows/production-workflow-supply-chain-ci.yml"
      - "scripts/validate_production_workflow_action_pins.py"

permissions:
  contents: read

jobs:
  validate-active-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate immutable action pins and read-only permissions
        run: python scripts/validate_production_workflow_action_pins.py
