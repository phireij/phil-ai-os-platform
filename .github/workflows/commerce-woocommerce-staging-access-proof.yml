name: Ruby Staging Catalog Access Proof

on:
  workflow_dispatch:
    inputs:
      approve_one_catalog_get:
        description: Approve one products GET to the pinned staging origin; no writes or catalog output
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  access-proof:
    if: ${{ inputs.approve_one_catalog_get == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify synthetic offline boundary without credentials
        run: python commerce/woocommerce/test_staging_access_proof.py
      - name: Perform one approved status-only catalog read
        env:
          RUBY_STAGING_ACCESS_PROOF_APPROVED: 'true'
          RUBY_WOO_PRODUCTION_BASE_URL: ${{ secrets.RUBY_WOO_PRODUCTION_BASE_URL }}
          RUBY_WOO_PRODUCTION_CONSUMER_KEY: ${{ secrets.RUBY_WOO_PRODUCTION_CONSUMER_KEY }}
          RUBY_WOO_PRODUCTION_CONSUMER_SECRET: ${{ secrets.RUBY_WOO_PRODUCTION_CONSUMER_SECRET }}
        run: python commerce/woocommerce/tools_staging_access_proof.py
