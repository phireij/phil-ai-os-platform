name: Phase 1.18 Routed Execution Positional Contract

on:
  push:
    branches: [ops/phase-1.18-policy-boundary]
    paths: ['.github/workflows/phase-1-18-routed-execution-positional-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Identify positional CLI contract without execution
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow' || true)
          test -n "$HERMES"
          CLIENT=/usr/local/bin/philaios-execute
          echo '=== PHASE 1.18 ROUTED EXECUTION POSITIONAL CONTRACT ==='
          docker exec "$HERMES" test -x "$CLIENT"
          USAGE=$(docker exec "$HERMES" sh -lc "$CLIENT 2>&1 || true" | grep -i -m1 'usage:' || true)
          if [ -n "$USAGE" ]; then
            SAFE_USAGE=$(printf '%s\n' "$USAGE" | sed -E 's#(/[^ ]+)+/philaios-execute#philaios-execute#g' | tr -s ' ')
            echo "usage=$SAFE_USAGE"
          else
            echo 'usage=unavailable'
          fi
          ARGC=$(docker exec "$HERMES" sh -lc "grep -Eo 'len\(sys\.argv\) *[!=<>]+ *[0-9]+' $CLIENT | head -1" || true)
          echo "argv_guard=${ARGC:-not_found}"
          IDX=$(docker exec "$HERMES" sh -lc "grep -Eo 'sys\.argv\[[0-9]+\]' $CLIENT | sort -u | tr '\n' ','" || true)
          echo "argv_indexes=${IDX:-not_found}"
          ROUTE=$(docker exec "$HERMES" sh -lc "grep -Eo '/v1/execute' $CLIENT | head -1" || true)
          echo "route=${ROUTE:-not_found}"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo 'backup_self_heal_timer=active'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo 'provider_call=none'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_18_ROUTED_EXECUTION_POSITIONAL_CONTRACT_OK
          REMOTE
