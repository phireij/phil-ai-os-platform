name: Phase 1.19 Hermes Approval Request Validation

on:
  workflow_dispatch:
  push:
    branches:
      - ops/phase-1.19
    paths:
      - .github/workflows/phase-1-19-agent-approval-request-validation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Validate installed Mission Control client contract
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES="hermes-agent-whow-hermes-agent-1"
          echo "=== PHASE 1.19 MISSION CONTROL CLIENT CONTRACT VALIDATION ==="

          docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control
          echo "mission_control_client=ready"

          SNAP="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control snapshot 2>&1)"
          APPROVALS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals 2>&1)"
          EXECUTIONS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control executions 2>&1)"

          printf '%s\n' "$SNAP"
          printf '%s\n' "$APPROVALS"
          printf '%s\n' "$EXECUTIONS"

          echo "command=snapshot result=ok"
          echo "command=approvals result=ok"
          echo "command=executions result=ok"
          echo "request_command=not_yet_installed"
          echo "provider_call=none"
          echo "execution_invoked=none"
          echo "production_change=none"
          echo "PHIL_AI_OS_PHASE_1_19_MISSION_CONTROL_CLIENT_CONTRACT_OK"
          REMOTE
