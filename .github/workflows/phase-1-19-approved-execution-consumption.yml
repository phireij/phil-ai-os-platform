name: Phase 1.19 Approved Execution Consumption

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true

      - name: Consume approved authorization through controlled execution
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES="hermes-agent-whow-hermes-agent-1"
          APPROVAL_ID="apr_ccfab3bc84c846d7b20a6d9c6b4e76d7"
          TASK="PHIL_AI_OS_PHASE_1_19_HUMAN_APPROVAL_VALIDATION"

          echo '=== PHASE 1.19 APPROVED EXECUTION CONSUMPTION ==='
          docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control
          docker exec "$HERMES" test -x /usr/local/bin/philaios-execute
          echo mission_control_client=ready
          echo execute_client=ready

          APPROVALS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals)"
          printf '%s\n' "$APPROVALS" | grep -F "$APPROVAL_ID" >/dev/null
          if ! printf '%s\n' "$APPROVALS" | grep -F '"state": "approved"' >/dev/null; then
            echo approval_state_before=not_approved
            echo execution_invoked=none
            echo provider_call=none
            exit 1
          fi
          echo approval_state_before=approved_verified

          set +e
          OUT="$(docker exec "$HERMES" /usr/local/bin/philaios-execute "$APPROVAL_ID" "$TASK" 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUT"
          echo "execution_exit_code=$RC"
          if [ "$RC" -ne 0 ]; then
            echo execution_result=failed
            exit 1
          fi
          echo execution_result=success

          AFTER="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals)"
          printf '%s\n' "$AFTER" | grep -F "$APPROVAL_ID" >/dev/null
          printf '%s\n' "$AFTER" | grep -F '"state": "consumed"' >/dev/null
          echo approval_state_after=consumed_verified

          EXECUTIONS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control executions)"
          printf '%s\n' "$EXECUTIONS" | grep -F "$APPROVAL_ID" >/dev/null
          printf '%s\n' "$EXECUTIONS" | grep -F '"outcome": "success"' >/dev/null
          echo execution_audit=success_verified

          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo backup_self_heal_timer=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo automatic_retry=none
          echo PHIL_AI_OS_PHASE_1_19_APPROVED_EXECUTION_CONSUMPTION_OK
          REMOTE
