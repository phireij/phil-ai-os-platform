name: Phase 2.1F Production Source Readiness Discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1f-production-source-readiness-discovery.yml'
      - '.github/phase-2-1f-production-source-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Discover durable production source and rollback surfaces read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -n "$CONTROL"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null

          echo '=== PHASE 2.1F PRODUCTION SOURCE READINESS DISCOVERY ==='
          echo discovery_mode=read_only
          echo control_container="$CONTROL"
          docker inspect "$CONTROL" --format 'image={{.Config.Image}}'
          docker inspect "$CONTROL" --format 'image_id={{.Image}}'
          docker inspect "$CONTROL" --format 'working_dir={{.Config.WorkingDir}}'
          docker inspect "$CONTROL" --format 'entrypoint={{json .Config.Entrypoint}}'
          docker inspect "$CONTROL" --format 'cmd={{json .Config.Cmd}}'
          docker inspect "$CONTROL" --format 'restart_policy={{.HostConfig.RestartPolicy.Name}}'
          docker inspect "$CONTROL" --format 'network_mode={{.HostConfig.NetworkMode}}'

          echo '--- mounts ---'
          docker inspect "$CONTROL" --format '{{range .Mounts}}mount_type={{.Type}} source={{.Source}} destination={{.Destination}} rw={{.RW}}{{println}}{{end}}'

          echo '--- compose labels ---'
          docker inspect "$CONTROL" --format '{{range $k,$v := .Config.Labels}}{{if (or (eq $k "com.docker.compose.project") (eq $k "com.docker.compose.project.working_dir") (eq $k "com.docker.compose.project.config_files") (eq $k "com.docker.compose.service"))}}{{printf "%s=%s\n" $k $v}}{{end}}{{end}}'

          echo '--- candidate host source paths ---'
          for f in /docker/phil-ai-os-core/app.py /docker/phil-ai-os-core/control-api/app.py /opt/phil-ai-os/app.py /opt/phil-ai-os/control-api/app.py /opt/phil-ai-os-platform/phil-ai-os-platform-phase1/control-api/app.py /opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/control-api/app.py; do
            if [ -f "$f" ]; then echo host_app_candidate="$f"; sha256sum "$f" | awk '{print "host_app_sha256="$1}'; fi
          done
          docker exec "$CONTROL" sha256sum /app/app.py | awk '{print "container_app_sha256="$1}'

          echo '--- compose candidates ---'
          for f in /docker/phil-ai-os-core/docker-compose.yml /docker/phil-ai-os-core/compose.yml /opt/phil-ai-os/docker-compose.yml /opt/phil-ai-os/compose.yml /opt/phil-ai-os-platform/phil-ai-os-platform-phase1/docker-compose.yml; do
            [ -f "$f" ] && echo compose_candidate="$f"
          done

          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          echo production_allowlist=general_only
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active
          echo database_write=none
          echo database_schema_change=none
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1F_PRODUCTION_SOURCE_READINESS_DISCOVERY_OK
          REMOTE
