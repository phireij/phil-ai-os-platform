name: Phase 2.1F V2 Start Condition Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1f-v2-start-condition-diagnostic.yml'
      - '.github/phase-2-1f-v2-start-diagnostic-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Diagnose V2 start conditions read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          WD=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core
          COMPOSE="$WD/compose.yml"
          OLD_IMAGE=phil-ai-os/control-api:0.20.0
          OLD_APP_HASH=c950ff968d54d083ae36c318fc97d279be78dd1543913c28d1e3d2b57fd29046
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api' || true)"
          HERMES="$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow' || true)"
          echo control_container_present=$([ -n "$CONTROL" ] && echo true || echo false)
          echo hermes_container_present=$([ -n "$HERMES" ] && echo true || echo false)
          echo compose_present=$([ -f "$COMPOSE" ] && echo true || echo false)
          [ -n "$CONTROL" ] || exit 21
          [ -n "$HERMES" ] || exit 22
          [ -f "$COMPOSE" ] || exit 23

          H="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4870/healthz || true)"
          R="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:4870/readyz || true)"
          echo health_status="$H"
          echo readiness_status="$R"
          [ "$H" = 200 ] || exit 24
          [ "$R" = 200 ] || exit 25

          RI="$(docker inspect "$CONTROL" --format '{{.Config.Image}}')"
          AH="$(docker exec "$CONTROL" sha256sum /app/app.py | awk '{print $1}')"
          CI="$(docker compose -f "$COMPOSE" config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["services"]["control-api"]["image"])')"
          echo runtime_image="$RI"
          echo app_hash="$AH"
          echo compose_image="$CI"
          [ "$RI" = "$OLD_IMAGE" ] || exit 26
          [ "$AH" = "$OLD_APP_HASH" ] || exit 27
          [ "$CI" = "$OLD_IMAGE" ] || exit 28

          AL="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=' || true)"
          echo allowlist_env="$AL"
          [ "$AL" = 'PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general' ] || exit 29

          for unit in phil-ai-os-monitor.service phil-ai-os-backup.timer phil-ai-os-backup-self-heal.timer phil-ai-os-mission-control-operator.service; do
            state="$(systemctl is-active "$unit" 2>/dev/null || true)"
            echo "unit_${unit//[^A-Za-z0-9]/_}=$state"
            [ "$state" = active ] || exit 30
          done
          echo database_write=none
          echo database_schema_change=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_2_1F_V2_START_CONDITIONS_OK
          REMOTE
