name: Phase 1.20 Narrow Expansion Checkpoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-20-narrow-expansion-checkpoint.yml'

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Verify Phase 1.20 narrow expansion checkpoint
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          MARKER=/etc/phil-ai-os/phase-1-20-narrow-expansion.env
          APPROVAL_ID=apr_8e28ac1a72dd4b3fa02b7da053f664e4
          echo '=== PHASE 1.20 NARROW EXPANSION CHECKPOINT ==='

          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo operational_health=ok

          test -s "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_20_NARROW_EXPANSION_ACTIVE=true$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_20_POLICY=human-approved-general-control-api-only$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_20_DIRECT_PROVIDER_BYPASS=false$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_20_AUTONOMOUS_EXECUTION=false$' "$MARKER"

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_ROUTED_EXECUTION_ENABLED=true$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_LIVE_TEST_ENABLED=false$' <<<"$ENV"

          docker exec -e APPROVAL_ID="$APPROVAL_ID" "$CONTROL" python - <<'PY'
          import os,sqlite3
          a=os.environ['APPROVAL_ID']
          con=sqlite3.connect('/app/state/control-plane.db'); con.row_factory=sqlite3.Row
          r=con.execute('select state,task_text,consumed_at,consumed_by from approval_requests where approval_id=?',(a,)).fetchone()
          assert r is not None
          assert r['state']=='approved'
          assert r['consumed_at'] is not None
          assert r['consumed_by']=='phase1-20-narrow-activation'
          assert r['task_text'].startswith('PHIL_AI_OS_PHASE_1_20_NARROW_ACTIVATION')
          print('human_authorization=durably_verified')
          print('approval_replayable=no')
          PY

          echo narrow_expansion=active_verified
          echo allowed_task_class=general
          echo human_approval_required=yes
          echo route_boundary=control_api_only
          echo direct_provider_bypass=false
          echo autonomous_execution=false
          echo kill_switch_available=yes
          echo provider_call=none
          echo execution_invoked=none
          echo production_policy_change=none
          echo checkpoint_decision=PASS
          echo next_action=PHASE_1_20_COMPLETION_GATE
          echo PHIL_AI_OS_PHASE_1_20_NARROW_EXPANSION_CHECKPOINT_OK
          REMOTE
