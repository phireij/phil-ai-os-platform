name: Hostinger WordPress Operator Bootstrap

on:
  push:
    branches:
      - ops/hostinger-wordpress-operator-bootstrap
    paths:
      - '.github/workflows/hostinger-wordpress-operator-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap-key:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Create dedicated Hostinger pre-production operator key on Phil AI OS VPS
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          KEY_DIR=/root/.ssh/philaios-hostinger-wordpress
          KEY="$KEY_DIR/preprod_operator_ed25519"
          install -d -m 700 "$KEY_DIR"
          if [ ! -f "$KEY" ]; then
            ssh-keygen -q -t ed25519 -N '' -C 'philaios-hostinger-wordpress-preprod' -f "$KEY"
          fi
          chmod 600 "$KEY"
          chmod 644 "$KEY.pub"
          echo '=== HOSTINGER WORDPRESS PREPROD PUBLIC KEY ==='
          cat "$KEY.pub"
          echo '=== FINGERPRINT ==='
          ssh-keygen -lf "$KEY.pub"
          echo 'PHIL_AI_OS_HOSTINGER_WORDPRESS_OPERATOR_KEY_READY'
          REMOTE
