name: Phase 2.1D Read Model Validation

on:
  push:
    branches: [main]
    paths:
      - 'ops/phase-2.1a/philaios-mission-control-read-model.py'
      - '.github/workflows/phase-2-1d-read-model-validation.yml'
      - '.github/phase-2-1d-read-model-validation-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"
            sleep $((attempt*10))
          done
          exit 1
      - name: Stage candidate read model
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q ops/phase-2.1a/philaios-mission-control-read-model.py "$VPS_USER@$VPS_HOST:/tmp/philaios-phase-2-1d-read-model.py"
      - name: Validate candidate against live read sources
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          HERMES="$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')"
          test -n "$CONTROL"; test -n "$HERMES"
          BEFORE_A="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d if isinstance(d,list) else d.get("approvals",[]); print(len(r))')"
          BEFORE_E="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control executions | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d if isinstance(d,list) else d.get("executions",[]); print(len(r))')"
          OUT="$(python3 /tmp/philaios-phase-2-1d-read-model.py)"
          printf '%s' "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]=="2.1d.v1"; assert d["overall_state"]=="healthy"; g=d["governance"]; assert g["execution_allowed_task_classes"]==["general"]; assert g["kill_switch_state"]=="disabled"; assert g["execution_enforcement_mode"]=="unavailable"; assert g["execution_enforcement_scope"]=="unavailable"; assert g["provenance"]["kill_switch_state"]=="control_api_container_env"; q=d["data_quality"]; assert "execution_enforcement_mode" in q["proven_unavailable"]; assert "execution_enforcement_scope" in q["proven_unavailable"]; assert q["correlation_quality"] in ("none","legacy","partial","canonical"); assert all("task_id" in t for t in d["tasks"]); h=[a for a in d["agents"] if a["agent_id"]=="hermes"][0]; assert "lifecycle_state" in h and "current_task_id" in h'
          AFTER_A="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d if isinstance(d,list) else d.get("approvals",[]); print(len(r))')"
          AFTER_E="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control executions | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d if isinstance(d,list) else d.get("executions",[]); print(len(r))')"
          test "$BEFORE_A" = "$AFTER_A"
          test "$BEFORE_E" = "$AFTER_E"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          rm -f /tmp/philaios-phase-2-1d-read-model.py
          echo schema_version=2.1d.v1
          echo production_allowlist=general_only
          echo approval_count_unchanged=true
          echo execution_count_unchanged=true
          echo browser_mutation_change=none
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1D_READ_MODEL_VALIDATION_OK
          REMOTE
