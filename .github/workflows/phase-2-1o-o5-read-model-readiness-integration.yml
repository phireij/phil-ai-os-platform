name: Phase 2.1O O5 Read Model Readiness Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1o-o5-read-model-readiness-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate wrapper
        run: python3 -m py_compile ops/phase-2.1o/philaios-read-model-wrapper-v21o.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"; : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts; sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage wrapper
        shell: bash
        run: |
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q ops/phase-2.1o/philaios-read-model-wrapper-v21o.py "$VPS_USER@$VPS_HOST:/tmp/philaios-read-model-wrapper-v21o.py"
      - name: Activate authoritative workload projection
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/opt/phil-ai-os/mission-control/read-model.py
          BACKUP=/opt/phil-ai-os/mission-control/read-model.py.pre-phase21o
          WRAP=/tmp/philaios-read-model-wrapper-v21o.py
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          success=0
          rollback(){
            set +e
            echo rollback=started
            if [ -f "$BACKUP" ]; then
              cp "$BACKUP" "$BASE"; chmod 0644 "$BASE"
              systemctl restart phil-ai-os-mission-control-operator.service >/dev/null 2>&1 || true
            fi
            echo rollback=completed
          }
          cleanup(){ rc=$?; rm -f "$WRAP" /tmp/o5-model.json; if [ "$rc" -ne 0 ] && [ "$success" -ne 1 ]; then rollback; fi; }
          trap cleanup EXIT

          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('/app/state/control-plane.db')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          assert c.execute('select agent_id,authority_ceiling,enabled,assignable from agent_registry order by agent_id').fetchall()==[('hermes','L3',1,1)]
          PY

          if [ -e "$BACKUP" ]; then rm -f "$BACKUP"; fi
          cp "$BASE" "$BACKUP"; chmod 0600 "$BACKUP"
          install -m 0644 "$WRAP" "$BASE"
          python3 "$BASE" > /tmp/o5-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o5-model.json'))
          assert d['schema_version']=='2.1o.v1'
          w=d['agent_runtime']['workload']
          assert w['source']=='durable_lifecycle_plus_execution_audit_correlation'
          assert w['evidence_complete'] is True
          assert isinstance(w['active_task_count'],int) and w['active_task_count'] >= 1
          assert 'PLANNED' in w['active_states']
          assert any(x.get('task_id')=='tsk_9cf154fca7fb4a74a4632b6af069fa89' for x in w['active_tasks'])
          # Worker workload is scoped only to tasks durably assigned to Hermes.
          # The Phase 2.1K governed canary proved global closure but carried no
          # Hermes assignment lifecycle row, so it must not be required here.
          r=d['worker_readiness']
          assert r['readiness'] in {'busy','stale','indeterminate'}
          assert r['readiness'] != 'ready'
          assert r['authority_effect']=='none'
          assert r['automatic_assignment'] is False
          assert r['automatic_retry'] is False
          assert r['automatic_reroute'] is False
          assert r['automatic_execution'] is False
          PY

          systemctl restart phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4881/api/read-model > /tmp/o5-model.json 2>/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4881/api/read-model > /tmp/o5-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/o5-model.json'))
          assert d['schema_version']=='2.1o.v1'
          w=d['agent_runtime']['workload']
          assert w['evidence_complete'] is True and w['active_task_count'] >= 1
          assert any(x.get('task_id')=='tsk_9cf154fca7fb4a74a4632b6af069fa89' for x in w['active_tasks'])
          r=d['worker_readiness']
          assert r['readiness'] != 'ready'
          assert r['authority_effect']=='none' and r['automatic_assignment'] is False and r['automatic_execution'] is False
          print('worker_readiness='+r['readiness'])
          print('readiness_reason='+r['reason_code'])
          print('active_task_count='+str(w['active_task_count']))
          print('active_states='+json.dumps(w['active_states']))
          print('closed_task_count='+str(len(w['closed_tasks'])))
          PY
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://hermes-agent-whow.srv1833510.hstgr.cloud/phil-ai-os/operator/)" = 401
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general

          success=1
          echo mission_control_schema=2.1o.v1
          echo workload_evidence_complete=true
          echo readiness_authority_effect=none
          echo automatic_assignment=false
          echo automatic_retry=false
          echo automatic_reroute=false
          echo automatic_execution=false
          echo dashboard_mutations=405
          echo operator_auth=401
          echo execution_allowlist=general
          echo agent_registry=hermes_L3_only
          echo lifecycle_mutation=none
          echo assignment_mutation=none
          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1O_O5_READ_MODEL_READINESS_INTEGRATION_OK
          REMOTE
