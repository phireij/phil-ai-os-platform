name: Phase 2.1I Closure Verification
on:
  push:
    branches: [main]
    paths: ['.github/phase-2-1i-closure-verification-trigger']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"; : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do TMP="$(mktemp)"; if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then cat "$TMP" >> ~/.ssh/known_hosts; sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts; if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi; fi; rm -f "$TMP"; sleep $((attempt*10)); done; exit 1
      - name: Verify live Phase 2.1I closure state read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 control-api)"
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.3-phase21i'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          docker exec "$CONTROL" python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('/app/state/control-plane.db')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
          assert {'task_lifecycle_events','agent_registry','task_plans'} <= tables
          assert c.execute('select count(*) from agent_registry').fetchone()[0]==1
          row=c.execute('select agent_id,authority_ceiling,enabled,assignable from agent_registry').fetchone()
          assert row==('hermes','L3',1,1)
          assert c.execute('select count(*) from task_plans').fetchone()[0]==0
          assert c.execute('select count(*) from task_lifecycle_events').fetchone()[0]==0
          c.close()
          PY
          grep -q 'SCHEMA_VERSION = "2.1i.v1"' /opt/phil-ai-os/mission-control/read-model.py
          grep -q 'READ ONLY · Phase 2.1I' /opt/phil-ai-os/mission-control/server.py
          grep -q '<h2>Coordinator</h2>' /opt/phil-ai-os/mission-control/server.py
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          for _ in $(seq 1 10); do if curl -fsS --max-time 3 http://127.0.0.1:4881/api/read-model >/tmp/phase21i-closure.json 2>/dev/null; then break; fi; sleep 2; done
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/phase21i-closure.json'))
          assert d['schema_version']=='2.1i.v1' and d['overall_state']=='healthy'
          c=d['coordinator']; s=c['summary']
          assert s['coordinator_owner']=='control-api'
          assert s['registry_state']=='active' and s['plan_store_state']=='active'
          assert s['registered_agent_count']==1 and s['plan_count_observed']==0
          assert s['mission_control_mutation']=='none'
          assert len(c['agent_registry'])==1 and c['agent_registry'][0]['agent_id']=='hermes'
          assert c['plans']==[]
          PY
          rm -f /tmp/phase21i-closure.json
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://hermes-agent-whow.srv1833510.hstgr.cloud/phil-ai-os/operator/)" = 401
          for m in POST PUT PATCH DELETE; do test "$(curl -ksS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done
          test "$(curl -ksS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4870/v1/tasks/assign)" = 401
          test "$(curl -ksS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4870/v1/tasks/plan)" = 401
          echo control_api_image=0.20.3-phase21i
          echo coordinator_registry=hermes_only
          echo coordinator_plans=0
          echo lifecycle_rows=0
          echo read_model_schema=2.1i.v1
          echo dashboard_badge=Phase_2.1I
          echo operator_auth=401
          echo dashboard_mutations=405
          echo coordinator_unauth=401
          echo production_allowlist=general_only
          echo recovery_services=active
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1I_CLOSURE_VERIFICATION_OK
          REMOTE
