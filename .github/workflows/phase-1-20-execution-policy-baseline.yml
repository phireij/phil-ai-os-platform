name: Phase 1.20 Execution Policy Baseline

on:
  push:
    branches: [ops/phase-1.20]
    paths:
      - '.github/workflows/phase-1-20-execution-policy-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Capture concise Phase 1.20 policy baseline
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          HERMES=hermes-agent-whow-hermes-agent-1
          echo '=== PHASE 1.20 EXECUTION POLICY BASELINE ==='
          docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^PHIL_AI_OS_(ROUTED_EXECUTION_ENABLED|EXECUTION_KILL_SWITCH|EXECUTION_ALLOWED_TASK_CLASSES|EXECUTION_MAX_REQUEST_CHARS|EXECUTION_MAX_OUTPUT_TOKENS|LIVE_TEST_ENABLED)=' | sort
          docker exec "$HERMES" test -x /usr/local/bin/philaios-execute && echo execute_client=ready
          docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control && echo mission_control_client=ready
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo backup_self_heal_timer=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo execution_invoked=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_20_EXECUTION_POLICY_BASELINE_OK
          REMOTE
