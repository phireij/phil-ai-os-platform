name: Phase 1.21 Execution Policy Path Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-execution-policy-path-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Trace client to Control API policy path without executing provider
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=hermes-agent-whow-hermes-agent-1
          CONTROL=phil-ai-os-core-control-api-1
          CLIENT=/usr/local/bin/philaios-execute
          SOURCE=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/hermes/philaios-execute-client.py
          echo '=== PHASE 1.21 EXECUTION POLICY PATH DIAGNOSTIC ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          test -f "$SOURCE"

          echo '--- EXECUTION CLIENT RELEVANT SOURCE ---'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/hermes/philaios-execute-client.py')
          lines=p.read_text().splitlines()
          keys=('urlopen','Request(','/v1/','execute','task_class','approval','json.dumps','payload','status')
          selected=set()
          for i,line in enumerate(lines,1):
              if any(k.lower() in line.lower() for k in keys):
                  selected.update(range(max(1,i-3),min(len(lines),i+3)+1))
          for i in sorted(selected): print(f'{i}: {lines[i-1]}')
          PY

          echo '--- CONTROL API ROUTE/POLICY SOURCE LOCATIONS ---'
          WORKDIR="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          echo "control_workdir=$WORKDIR"
          grep -RInE --exclude-dir='.git' --exclude='*.bak*' 'execution_not_allowlisted|EXECUTION_ALLOWED_TASK_CLASSES|allowed_task_classes|/v1/execute|def .*execute|task_class' "$WORKDIR" 2>/dev/null | head -n 220 || true

          echo '--- LIVE CONTROL API ENV ---'
          docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^PHIL_AI_OS_EXECUTION_(ALLOWED_TASK_CLASSES|KILL_SWITCH)=' || true

          echo '--- NON-PROVIDER ROUTE PROBE ---'
          # Only discover API schema/routes. Never POST to /v1/execute in this diagnostic.
          for path in /openapi.json /docs /healthz /readyz; do
            code="$(curl -sS -o /tmp/probe -w '%{http_code}' --max-time 5 "http://127.0.0.1:4870$path" || true)"
            echo "probe_${path//\//_}=$code"
            if [ "$path" = '/openapi.json' ] && [ "$code" = '200' ]; then
              python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/probe'))
              for p,methods in d.get('paths',{}).items():
                  if 'execut' in p.lower() or 'approv' in p.lower():
                      print('openapi_path='+p+' methods='+','.join(sorted(methods)))
          except Exception as e: print('openapi_parse_error='+type(e).__name__)
          PY
            fi
          done

          echo mutation=none
          echo provider_call=none
          echo approval_consumption=none
          echo next_action=CORRECT_CONFIRMED_CLIENT_CONTROL_POLICY_MISMATCH
          echo PHIL_AI_OS_PHASE_1_21_EXECUTION_POLICY_PATH_DIAGNOSTIC_COMPLETE
          REMOTE
