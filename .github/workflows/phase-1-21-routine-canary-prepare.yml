name: Phase 1.21 Routine Canary Prepare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-routine-canary-prepare.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Prepare one-request routine canary authorization
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=hermes-agent-whow-hermes-agent-1
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.21 ROUTINE CANARY PREPARE ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control
          docker exec "$HERMES" test -x /usr/local/bin/philaios-telegram-approval-notifier

          TASK='PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVATION'
          OUT="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control request "$TASK" --source hermes --requester phase1-21-routine-canary --requested-by hermes)"
          printf '%s\n' "$OUT"
          APPROVAL_ID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["approval"]["approval_id"])' <<<"$OUT")"
          test -n "$APPROVAL_ID"
          docker exec "$HERMES" /usr/local/bin/philaios-telegram-approval-notifier "$APPROVAL_ID"
          echo approval_id="$APPROVAL_ID"
          echo routine_canary_activation=not_performed
          echo provider_call=none
          echo execution_invoked=none
          echo production_policy_change=none
          echo human_decision_required=yes
          echo next_action=APPROVE_OR_DENY_VIA_TELEGRAM
          echo PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_PREPARE_OK
          REMOTE
