name: Phase 1.26 Controlled Approved Request Consumption Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-1-26-controlled-approved-request-consumption-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"
            sleep $((attempt*10))
          done
          exit 1

      - name: Discover exact execute request contract without consuming approval
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          BASE=http://127.0.0.1:4870
          DB=/app/state/control-plane.db
          APPROVAL_ID=apr_6ee5a19331794c159e4d99070d63d08e
          echo '=== PHASE 1.26 EXECUTE REQUEST CONTRACT DISCOVERY ==='
          echo discovery_mode=read_only

          curl -fsS "$BASE/healthz" >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"
          echo production_allowlist=general_only

          FIXTURE="$(docker exec "$CONTROL" python -c "import sqlite3,json; c=sqlite3.connect('$DB'); c.row_factory=sqlite3.Row; r=c.execute('select approval_id,state,task_text,task_class,consumed_at,consumed_by from approval_requests where approval_id=?',('$APPROVAL_ID',)).fetchone(); print(json.dumps(dict(r)) if r else '')")"
          [ -n "$FIXTURE" ]
          STATE="$(printf '%s' "$FIXTURE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("state", ""))')"
          CONSUMED="$(printf '%s' "$FIXTURE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("consumed_at") or "")')"
          [ "$STATE" = approved ]
          [ -z "$CONSUMED" ]
          echo approved_unconsumed_fixture_verified=true

          echo '--- exact /v1/execute HTTP handler context ---'
          docker exec "$CONTROL" sh -lc "grep -n -B 50 -A 140 -E 'path == .*/v1/execute|/v1/execute|routed_execute\(' /app/app.py | head -n 700" || true

          echo '--- invalid_request branches near execute path ---'
          docker exec "$CONTROL" sh -lc "grep -n -B 20 -A 45 -E 'invalid_request|approval_(required|invalid|consumed)|already_consumed|consumed_at|routed_execute\(' /app/app.py | head -n 900" || true

          echo '--- routed_execute signature and initial gates ---'
          docker exec "$CONTROL" sh -lc "grep -n -A 220 '^def routed_execute' /app/app.py | head -n 240" || true

          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo production_change=none
          echo next_action=PATCH_PHASE_1_26_VALIDATION_TO_EXACT_EXECUTE_CONTRACT
          echo PHIL_AI_OS_PHASE_1_26_EXECUTE_REQUEST_CONTRACT_DISCOVERY_OK
          REMOTE
