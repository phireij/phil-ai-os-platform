name: Phase 1.26 Controlled Approved Request Consumption Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-1-26-controlled-approved-request-consumption-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"
            sleep $((attempt*10))
          done
          exit 1

      - name: Consume approved request exactly once through governed execute route
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          HERMES=hermes-agent-whow-hermes-agent-1
          BASE=http://127.0.0.1:4870
          DB=/app/state/control-plane.db
          APPROVAL_ID=apr_6ee5a19331794c159e4d99070d63d08e

          echo '=== PHASE 1.26 CONTROLLED APPROVED REQUEST CONSUMPTION VALIDATION ==='
          curl -fsS "$BASE/healthz" >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service

          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$CENV"
          echo production_allowlist=general_only

          FIXTURE="$(docker exec "$CONTROL" python -c "import sqlite3,json; c=sqlite3.connect('$DB'); c.row_factory=sqlite3.Row; r=c.execute('select approval_id,state,task_text,task_class,consumed_at from approval_requests where approval_id=?',('$APPROVAL_ID',)).fetchone(); print(json.dumps(dict(r)) if r else '')")"
          [ -n "$FIXTURE" ]
          STATE="$(printf '%s' "$FIXTURE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("state", ""))')"
          TASK_TEXT="$(printf '%s' "$FIXTURE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("task_text", ""))')"
          TASK_CLASS="$(printf '%s' "$FIXTURE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("task_class", ""))')"
          CONSUMED="$(printf '%s' "$FIXTURE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("consumed_at") or "")')"
          [ "$STATE" = approved ]
          [ "$TASK_CLASS" = general ]
          [ -n "$TASK_TEXT" ]
          [ -z "$CONSUMED" ]
          echo approval_state_before=approved_unconsumed_verified

          TOKEN="$(docker exec "$HERMES" cat /run/philaios/hermes_control_api_token)"
          [ -n "$TOKEN" ]
          PAYLOAD="$(APPROVAL_ID="$APPROVAL_ID" TASK_TEXT="$TASK_TEXT" python3 - <<'PY'
          import json,os
          print(json.dumps({"approval_id": os.environ["APPROVAL_ID"], "text": os.environ["TASK_TEXT"]}))
          PY
          )"

          FIRST_BODY="$(mktemp)"
          FIRST_CODE="$(curl -sS -o "$FIRST_BODY" -w '%{http_code}' -X POST "$BASE/v1/execute" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$PAYLOAD")"
          cat "$FIRST_BODY"
          echo
          [ "$FIRST_CODE" -ge 200 ] && [ "$FIRST_CODE" -lt 300 ]
          echo first_execution_http=$FIRST_CODE
          echo exact_execute_field=text

          AFTER="$(docker exec "$CONTROL" python -c "import sqlite3,json; c=sqlite3.connect('$DB'); c.row_factory=sqlite3.Row; r=c.execute('select approval_id,state,consumed_at,consumed_by from approval_requests where approval_id=?',('$APPROVAL_ID',)).fetchone(); print(json.dumps(dict(r)) if r else '')")"
          AFTER_STATE="$(printf '%s' "$AFTER" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("state", ""))')"
          AFTER_CONSUMED="$(printf '%s' "$AFTER" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("consumed_at") or "")')"
          [ "$AFTER_STATE" = consumed ]
          [ -n "$AFTER_CONSUMED" ]
          echo approval_state_after=consumed_verified

          SECOND_BODY="$(mktemp)"
          SECOND_CODE="$(curl -sS -o "$SECOND_BODY" -w '%{http_code}' -X POST "$BASE/v1/execute" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$PAYLOAD")"
          cat "$SECOND_BODY"
          echo
          [ "$SECOND_CODE" -ge 400 ]
          grep -q 'approval_already_consumed' "$SECOND_BODY"
          echo replay_http=$SECOND_CODE
          echo replay_blocked=approval_already_consumed_verified

          EXECUTIONS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control executions)"
          printf '%s\n' "$EXECUTIONS" | grep -F "$APPROVAL_ID" >/dev/null
          echo linked_execution_audit=verified

          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          rm -f "$FIRST_BODY" "$SECOND_BODY"
          echo exactly_once_consumption=verified
          echo production_change=approval_consumed_by_authorized_validation_only
          echo next_action=PHASE_1_26_POST_CONSUMPTION_CLOSURE
          echo PHIL_AI_OS_PHASE_1_26_CONTROLLED_APPROVED_REQUEST_CONSUMPTION_VALIDATION_OK
          REMOTE
