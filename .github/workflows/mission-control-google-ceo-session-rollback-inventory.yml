name: Mission Control CEO Session Rollback Topology Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-control-google-identity-deploy
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      SESSION: phil-ai-os-mission-control-google-ceo-session
      ROLLBACK: phil-ai-os-mission-control-google-ceo-session-rollback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Inventory rollback topology without content or authority access
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          port="${VPS_PORT:-22}"
          remote="$VPS_USER@$VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          opts=(-4 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          remote_command="set -euo pipefail
          test \"\$(docker inspect '$SESSION' --format '{{.State.Running}}')\" = true
          if ! docker inspect '$ROLLBACK' >/dev/null 2>&1; then
            echo 'rollback_topology_inventory_completed=true rollback_present=false content_accessed=false authority_effect=none'
            exit 0
          fi
          current_secret=\$(docker inspect '$SESSION' --format '{{range .Mounts}}{{if eq .Destination \"/run/secrets\"}}{{.Name}}{{end}}{{end}}')
          rollback_secret=\$(docker inspect '$ROLLBACK' --format '{{range .Mounts}}{{if eq .Destination \"/run/secrets\"}}{{.Name}}{{end}}{{end}}')
          current_state=\$(docker inspect '$SESSION' --format '{{range .Mounts}}{{if eq .Destination \"/var/lib/mission-control\"}}{{.Name}}{{end}}{{end}}')
          rollback_state=\$(docker inspect '$ROLLBACK' --format '{{range .Mounts}}{{if eq .Destination \"/var/lib/mission-control\"}}{{.Name}}{{end}}{{end}}')
          running=\$(docker inspect '$ROLLBACK' --format '{{.State.Running}}')
          network=\$(docker inspect '$ROLLBACK' --format '{{.HostConfig.NetworkMode}}')
          readonly=\$(docker inspect '$ROLLBACK' --format '{{.HostConfig.ReadonlyRootfs}}')
          restart=\$(docker inspect '$ROLLBACK' --format '{{.HostConfig.RestartPolicy.Name}}')
          traefik=\$(docker inspect '$ROLLBACK' --format '{{index .Config.Labels \\\"traefik.enable\\\"}}')
          service=\$(docker inspect '$ROLLBACK' --format '{{index .Config.Labels \\\"traefik.http.routers.mission-control-google-ceo-session.service\\\"}}')
          image=\$(docker inspect '$ROLLBACK' --format '{{.Config.Image}}')
          image_matches=false; [[ \"\$image\" =~ ^ghcr.io/phireij/phil-ai-os-platform/mission-control-google-ceo-session@sha256:[0-9a-f]{64}$ ]] && image_matches=true
          state_expected=false; [[ \"\$current_state\" = phil-ai-os-mission-control-conversation-state-v1 && \"\$rollback_state\" = phil-ai-os-mission-control-conversation-state-v1 ]] && state_expected=true
          legacy_name_available=true; docker inspect '$ROLLBACK-legacy' >/dev/null 2>&1 && legacy_name_available=false
          archive_candidate=false; [[ \"\$running\" = false && \"\$network\" = bridge && \"\$readonly\" = true && \"\$restart\" = no && -z \"\$traefik\" && -z \"\$service\" && \"\$rollback_secret\" = \"\$current_secret\" && \"\$state_expected\" = true && \"\$image_matches\" = true && \"\$legacy_name_available\" = true ]] && archive_candidate=true
          echo \"rollback_present=true legacy_archive_candidate=\$archive_candidate image_matches=\$image_matches state_expected=\$state_expected legacy_name_available=\$legacy_name_available secret_volume_matches_current=\$([[ \"\$rollback_secret\" = \"\$current_secret\" ]] && echo true || echo false) state_volume_matches_current=\$([[ \"\$rollback_state\" = \"\$current_state\" ]] && echo true || echo false) content_accessed=false authority_effect=none\""
          ssh "${opts[@]}" "$remote" "$remote_command"
