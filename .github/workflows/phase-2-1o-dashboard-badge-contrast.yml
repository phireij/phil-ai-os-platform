name: Phase 2.1O Mission Control Badge Contrast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1o-dashboard-badge-contrast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  improve-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"; : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts; sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Improve phase badge readability
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/opt/phil-ai-os/mission-control/server.py
          BACKUP=/opt/phil-ai-os/mission-control/server.py.pre-badge-contrast
          CAND=/tmp/server-badge-contrast.py
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          success=0
          rollback(){
            set +e
            echo rollback=started
            if [ -f "$BACKUP" ]; then
              cp "$BACKUP" "$BASE"; chmod 0644 "$BASE"
              systemctl restart phil-ai-os-mission-control-operator.service >/dev/null 2>&1 || true
            fi
            echo rollback=completed
          }
          cleanup(){ rc=$?; rm -f "$CAND" /tmp/badge-model.json; if [ "$rc" -ne 0 ] && [ "$success" -ne 1 ]; then rollback; fi; }
          trap cleanup EXIT

          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          curl -fsS http://127.0.0.1:4881/api/read-model >/tmp/badge-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/badge-model.json'))
          assert d['schema_version']=='2.1o.v1'
          assert d['worker_readiness']['authority_effect']=='none'
          PY

          cp "$BASE" "$BACKUP"; chmod 0600 "$BACKUP"
          python3 - "$BASE" "$CAND" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text()
          dark='<span style="color:#111827;font-weight:700">READ ONLY · Phase 2.1O</span>'
          if dark in src:
              out=src
          elif 'READ ONLY · Phase 2.1N' in src:
              out=src.replace('READ ONLY · Phase 2.1N', dark, 1)
          elif 'READ ONLY · Phase 2.1O' in src:
              out=src.replace('READ ONLY · Phase 2.1O', dark, 1)
          else:
              raise SystemExit('phase badge literal not found; refusing broad UI mutation')
          pathlib.Path(sys.argv[2]).write_text(out)
          PY
          python3 -m py_compile "$CAND"
          grep -q 'color:#111827;font-weight:700' "$CAND"
          grep -q 'READ ONLY · Phase 2.1O' "$CAND"
          grep -q 'def do_POST' "$CAND"; grep -q '405' "$CAND"

          install -m 0644 "$CAND" "$BASE"
          systemctl restart phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4881/api/read-model >/tmp/badge-model.json 2>/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4881/api/read-model >/tmp/badge-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/badge-model.json'))
          assert d['schema_version']=='2.1o.v1'
          r=d['worker_readiness']
          assert r['authority_effect']=='none'
          assert r['automatic_assignment'] is False
          assert r['automatic_execution'] is False
          PY
          grep -q 'color:#111827;font-weight:700' "$BASE"
          grep -q 'READ ONLY · Phase 2.1O' "$BASE"
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://hermes-agent-whow.srv1833510.hstgr.cloud/phil-ai-os/operator/)" = 401
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general

          success=1
          echo dashboard_badge_text_color=dark_111827
          echo dashboard_badge_phase=Phase_2.1O
          echo dashboard_mutations=405
          echo operator_auth=401
          echo execution_allowlist=general
          echo production_change=ui_only
          echo lifecycle_mutation=none
          echo assignment_mutation=none
          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1O_DASHBOARD_BADGE_CONTRAST_OK
          REMOTE
