name: Phase 2.2 A8 Closure Verification

on:
  push:
    paths:
      - '.github/workflows/phase-2-2-a8-closure-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure IPv4 SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4 5 6; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1

      - name: Verify Phase 2.2 closure
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee phase-2-2-a8-closure.txt
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -n "$CONTROL"

          echo '=== core health and fixed execution scope ==='
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null && echo control_health=ok
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null && echo control_ready=ok
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.21.1-phase22a68'
          echo control_api_image=0.21.1-phase22a68
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          echo execution_allowlist=general

          echo '=== Mission Control observer boundary ==='
          test "$(curl -sS -o /tmp/a8-read.json -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 200
          for m in POST PUT PATCH DELETE; do
            test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405
          done
          echo mission_control_get=200
          echo mission_control_mutations=405

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/a8-read.json'))
          assert d['schema_version']=='2.2-a7.v1'
          ma=d['multi_agent']; assert ma['registered_agent_count']==2
          a={x['agent_id']:x for x in ma['agents']}
          h=a['hermes']; s=a['specialist-worker-01']
          assert h['authority_ceiling']=='L3' and h['registry']['enabled'] and h['registry']['assignable']
          assert s['authority_ceiling']=='L1' and not s['registry']['enabled'] and not s['registry']['assignable']
          assert s['readiness']['state']=='unassignable' and s['readiness']['grants_authority'] is False
          assert s['presence']['identity_verified'] is True
          assert s['workload']['active_task_count']==0
          assert s['runtime']['execution_runtime']=='none'
          assert ma['handoff_count']==1
          ho=ma['handoffs'][0]
          assert ho['state']=='accepted'
          assert ho['source_agent_id']=='hermes' and ho['target_agent_id']=='specialist-worker-01'
          assert ho['source_authority_ceiling']=='L3' and ho['target_authority_ceiling']=='L1'
          assert ho['task_class']=='general' and ho['required_authority']=='L1'
          assert ho['reason_code']=='phase_2_2_a6_8_controlled_canary'
          assert ho['correlation_id']=='hofcorr_7dba30f92f2c46188c435aaea55bde67'
          assert ho['handoff_approval_required'] is True and ho['handoff_approval_state']=='approved'
          assert ho['task_latest_stage']=='COMPLETED' and ho['active_ownership'] is False
          assert ho['execution_approval_consumed'] is False
          assert ho['evidence_complete'] is True
          g=d['governance']; assert g['mission_control_authority']=='read_only_observer'
          for k in ('automatic_assignment','automatic_retry','automatic_reroute','automatic_delegation','automatic_execution'):
              assert g[k] is False
          print('read_model_schema=2.2-a7.v1')
          print('handoff_attribution=complete')
          print('authority_containment=verified')
          print('specialist_readiness=unassignable')
          print('specialist_active_workload=0')
          print('handoff_active_ownership=false')
          print('execution_approval_consumed=false')
          print('automatic_actions=false')
          PY

          echo '=== durable handoff / lifecycle / approval evidence ==='
          BEFORE="$(docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          reg=[dict(r) for r in c.execute('select agent_id,role,authority_ceiling,enabled,assignable from agent_registry order by agent_id')]
          assert len(reg)==2
          assert reg[0]['agent_id']=='hermes' and reg[0]['authority_ceiling']=='L3' and int(reg[0]['enabled'])==1 and int(reg[0]['assignable'])==1
          assert reg[1]['agent_id']=='specialist-worker-01' and reg[1]['authority_ceiling']=='L1' and int(reg[1]['enabled'])==0 and int(reg[1]['assignable'])==0
          hs=[dict(r) for r in c.execute("select * from task_handoffs where handoff_id='hof_ba25bd0fdfea401c9894d6520099b4cf'")]
          assert len(hs)==1
          h=hs[0]
          assert h['task_id']=='tsk_a68_082b86212fc944b0a45f6c43395cb6f1'
          assert h['source_agent_id']=='hermes' and h['target_agent_id']=='specialist-worker-01'
          assert h['source_authority_ceiling']=='L3' and h['target_authority_ceiling']=='L1'
          assert h['task_class']=='general' and h['required_authority']=='L1'
          assert h['reason_code']=='phase_2_2_a6_8_controlled_canary'
          assert h['correlation_id']=='hofcorr_7dba30f92f2c46188c435aaea55bde67'
          assert h['state']=='accepted' and h['handoff_approval_state']=='approved'
          assert h['lifecycle_event_id']
          ev=[dict(r) for r in c.execute('select * from task_lifecycle_events where event_id=?',(h['lifecycle_event_id'],))]
          assert len(ev)==1 and ev[0]['task_id']==h['task_id'] and ev[0]['stage']=='ASSIGNED' and ev[0]['assigned_agent_id']=='specialist-worker-01' and ev[0]['correlation_id']==h['correlation_id']
          assert c.execute("select count(*) from task_lifecycle_events where task_id=? and stage='ASSIGNED' and assigned_agent_id='specialist-worker-01'",(h['task_id'],)).fetchone()[0]==1
          latest=c.execute('select stage from task_lifecycle_events where task_id=? order by occurred_at desc,event_id desc limit 1',(h['task_id'],)).fetchone()
          assert latest and latest[0]=='COMPLETED'
          aps=[dict(r) for r in c.execute("select state,consumed_at,consumed_by from approval_requests where task_id=?",(h['task_id'],))]
          assert len(aps)==1 and aps[0]['state']=='expired' and aps[0]['consumed_at'] is None and aps[0]['consumed_by'] is None
          tables=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit','usage_ledger','task_handoffs']
          counts={t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tables}
          print(json.dumps({'counts':counts,'registry':reg,'handoff_count':len(hs)},sort_keys=True,separators=(',',':')))
          PY
          )"
          printf '%s\n' "$BEFORE" >/tmp/a8-before.json
          echo database_quick_check=ok
          echo accepted_handoff_rows=1
          echo specialist_assignment_events_for_canary=1
          echo canary_latest_stage=COMPLETED
          echo canary_execution_approval=expired_unconsumed

          echo '=== negative authentication/fail-closed boundary probes ==='
          for path in /v1/tasks/handoff/request /v1/tasks/handoff/accept /v1/tasks/handoff/reject /v1/tasks/assign /v1/tasks/plan /v1/execute; do
            code="$(curl -sS -X POST -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "http://127.0.0.1:4870$path")"
            test "$code" = 401
            echo "unauth_${path}=401"
          done
          AFTER="$(docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          reg=[dict(r) for r in c.execute('select agent_id,role,authority_ceiling,enabled,assignable from agent_registry order by agent_id')]
          tables=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit','usage_ledger','task_handoffs']
          counts={t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tables}
          hs=c.execute("select count(*) from task_handoffs where handoff_id='hof_ba25bd0fdfea401c9894d6520099b4cf'").fetchone()[0]
          print(json.dumps({'counts':counts,'registry':reg,'handoff_count':hs},sort_keys=True,separators=(',',':')))
          PY
          )"
          printf '%s\n' "$AFTER" >/tmp/a8-after.json
          cmp -s /tmp/a8-before.json /tmp/a8-after.json
          echo negative_probes_state_delta=0

          echo '=== monitoring and recovery invariants ==='
          for unit in phil-ai-os-agent-heartbeat.timer phil-ai-os-specialist-worker-01-presence.timer phil-ai-os-monitor.service phil-ai-os-backup.timer phil-ai-os-backup-self-heal.timer; do
            systemctl is-active --quiet "$unit"
            echo "$unit=active"
          done
          test "$(systemctl show -p Result --value phil-ai-os-backup.service)" = success
          test "$(systemctl show -p Result --value phil-ai-os-backup-self-heal.service)" = success
          echo backup_last_result=success
          echo backup_self_heal_last_result=success

          test ! -e /opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core/runtime/state/phase2_2_a6_8_canary_policy.json
          test ! -e /opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core/runtime/state/phase2_2_a6_8_canary_readiness.json
          echo temporary_canary_evidence_absent=true

          echo provider_call=none
          echo execution_call=none
          echo authority_expansion=none
          echo mission_control_authority=read_only_observer
          echo phase_2_2_handoff=durable_attributable_auditable_bounded_safe
          echo production_change=none
          echo PHIL_AI_OS_PHASE_2_2_A8_CLOSURE_VERIFICATION_OK
          rm -f /tmp/a8-read.json /tmp/a8-before.json /tmp/a8-after.json
          REMOTE

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-2-a8-closure-verification-evidence
          path: phase-2-2-a8-closure.txt
          if-no-files-found: warn
          retention-days: 30
