name: Phase 1.20 Post-Canary Rollout Decision Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-gate:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Evaluate post-canary rollout decision gate
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          APPROVAL_TASK='PHIL_AI_OS_ROUTED_EXECUTION_OK'
          echo '=== PHASE 1.20 POST-CANARY ROLLOUT DECISION GATE ==='

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_ROUTED_EXECUTION_ENABLED=true$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_LIVE_TEST_ENABLED=false$' <<<"$ENV"
          echo production_policy=restricted_verified

          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo operational_health=ok

          docker exec "$CONTROL" python - <<'PY'
          import sqlite3, sys
          db='/app/state/control-plane.db'
          con=sqlite3.connect(db)
          con.row_factory=sqlite3.Row
          rows=con.execute("select id,outcome,approval_id,provider_id,route_path,compatibility_pass from execution_audit order by id desc limit 50").fetchall()
          successes=[r for r in rows if r['outcome']=='success' and r['approval_id']]
          if not successes:
              raise SystemExit('no approved successful execution evidence')
          latest=successes[0]
          a=con.execute("select approval_id,state,task_text,consumed_at,consumed_by from approval_requests where approval_id=?",(latest['approval_id'],)).fetchone()
          if not a: raise SystemExit('approval evidence missing')
          assert a['state']=='approved'
          assert a['task_text']=='PHIL_AI_OS_ROUTED_EXECUTION_OK'
          assert a['consumed_at'] is not None
          assert a['consumed_by'] is not None
          assert latest['compatibility_pass']==1
          print('latest_approved_execution_id='+str(latest['id']))
          print('latest_approval_id='+latest['approval_id'])
          print('approval_consumption=verified')
          print('execution_audit=verified')
          PY

          # This gate is deliberately read-only: no policy expansion is performed here.
          echo rollout_decision=HOLD_RESTRICTED_SCOPE
          echo rationale=single_request_canary_validated_but_broader_agent_scope_requires_separate_policy_hardening
          echo human_approval_required_for_sensitive_execution=yes
          echo replay_protection_required=yes
          echo durable_audit_required=yes
          echo kill_switch_required=yes
          echo provider_call=none
          echo execution_invoked=none
          echo production_policy_change=none
          echo next_action=PHASE_1_20_POLICY_HARDENING_BEFORE_NARROW_EXPANSION
          echo PHIL_AI_OS_PHASE_1_20_POST_CANARY_ROLLOUT_DECISION_GATE_OK
          REMOTE
