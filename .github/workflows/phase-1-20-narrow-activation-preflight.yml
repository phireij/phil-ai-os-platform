name: Phase 1.20 Narrow Activation Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-20-narrow-activation-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preflight contract
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/PHASE_1_20_NARROW_EXPANSION_POLICY_CONTRACT.md
          echo activation=not_performed
          echo production_policy_change=none
          echo human_approval_required=yes
          echo prerequisite_negative_path_rollback=validated
          echo next_action=PHASE_1_20_NARROW_ACTIVATION_CANARY_PREPARE
          echo PHIL_AI_OS_PHASE_1_20_NARROW_ACTIVATION_PREFLIGHT_OK
