name: Phase 1.16 Activate Monitor

on:
  push:
    branches:
      - docs/phase-1.16-progress-update
    paths:
      - '.github/phase-1-16-activate-trigger'

permissions:
  contents: read

concurrency:
  group: phil-ai-os-phase-1-16-activate
  cancel-in-progress: false

jobs:
  activate-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}

    steps:
      - uses: actions/checkout@v4
      - name: Validate activation trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < .github/phase-1-16-activate-trigger)" = "ACTIVATE-PHASE-1.16-MONITOR"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Activate continuous monitor
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            test -f /opt/phil-ai-os/phase-1.16/monitor.py
            curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
            curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null
            cat > /etc/phil-ai-os-monitor.env <<"EOF"
PHIL_AI_OS_CONTROL_API_BASE_URL=http://127.0.0.1:4870
PHIL_AI_OS_HEALTH_PATH=/healthz
PHIL_AI_OS_READY_PATH=/readyz
PHIL_AI_OS_MONITOR_INTERVAL_SECONDS=60
PHIL_AI_OS_MONITOR_TIMEOUT_SECONDS=5
PHIL_AI_OS_ALERT_COOLDOWN_SECONDS=1800
PHIL_AI_OS_MONITOR_STATE_PATH=/var/lib/phil-ai-os-monitor/state.json
PHIL_AI_OS_STRICT_SAFETY_SNAPSHOT=false
EOF
            chmod 600 /etc/phil-ai-os-monitor.env
            cat > /etc/systemd/system/phil-ai-os-monitor.service <<"EOF"
[Unit]
Description=Phil AI OS Phase 1.16 Operational Safety Monitor
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
EnvironmentFile=/etc/phil-ai-os-monitor.env
ExecStart=/usr/bin/python3 /opt/phil-ai-os/phase-1.16/monitor.py
Restart=on-failure
RestartSec=10
User=root
NoNewPrivileges=true
ProtectHome=true
PrivateTmp=true

[Install]
WantedBy=multi-user.target
EOF
            systemctl daemon-reload
            systemctl enable --now phil-ai-os-monitor.service
            sleep 3
            systemctl is-enabled phil-ai-os-monitor.service
            systemctl is-active phil-ai-os-monitor.service
            systemctl --no-pager --full status phil-ai-os-monitor.service | head -n 25
            curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
            curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null
            echo PHIL_AI_OS_PHASE_1_16_MONITOR_ACTIVE
          '
