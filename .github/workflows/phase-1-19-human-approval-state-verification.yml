name: Phase 1.19 Human Approval State Verification

on:
  workflow_dispatch:
  push:
    branches:
      - ops/phase-1.19
    paths:
      - .github/workflows/phase-1-19-human-approval-state-verification.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for i in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true

      - name: Verify approved state and no-execution boundary
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES="hermes-agent-whow-hermes-agent-1"
          APPROVAL_ID="apr_ccfab3bc84c846d7b20a6d9c6b4e76d7"
          TASK="PHIL_AI_OS_PHASE_1_19_HUMAN_APPROVAL_VALIDATION"

          echo "=== PHASE 1.19 HUMAN APPROVAL STATE VERIFICATION ==="
          docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control
          echo "mission_control_client=ready"

          APPROVALS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals)"
          printf '%s\n' "$APPROVALS" | grep -F "$APPROVAL_ID" >/dev/null
          printf '%s\n' "$APPROVALS" | grep -F "$TASK" >/dev/null
          printf '%s\n' "$APPROVALS" | grep -Ei 'approved' >/dev/null
          echo "approval_state=approved_verified"

          EXECUTIONS="$(docker exec "$HERMES" /usr/local/bin/philaios-mission-control executions)"
          if printf '%s\n' "$EXECUTIONS" | grep -F "$APPROVAL_ID" >/dev/null; then
            echo "execution_for_approval=unexpected"
            exit 1
          fi
          echo "execution_for_approval=none"

          systemctl is-active --quiet phil-ai-os-monitor.service && echo "monitor=active"
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo "backup_self_heal_timer=active"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo "control_api_health=ok"
          echo "provider_call=none"
          echo "execution_invoked=none"
          echo "production_change=none"
          echo "PHIL_AI_OS_PHASE_1_19_HUMAN_APPROVAL_STATE_VERIFICATION_OK"
          REMOTE
