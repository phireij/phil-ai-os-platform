name: Phase 2.3 P5 Approved Activation

on:
  push:
    paths:
      - 'ops/authorizations/phase-2-3-p5.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact CEO authorization marker
        shell: bash
        run: |
          set -euo pipefail
          test -f ops/authorizations/phase-2-3-p5.txt
          test "$(tr -d '\r\n' < ops/authorizations/phase-2-3-p5.txt)" = 'APPROVE_PHASE_2_3_P5'
      - name: Validate audited activation assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/phase2_3_p5_approved_activation.sh
          bash -n scripts/phase2_3_p5_post_activation_verify.sh
          python3 -m py_compile scripts/phase2_3_p5_patch_control_api.py scripts/phase2_3_p5_patch_read_model.py
      - name: Configure IPv4 SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4 5 6; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Stage audited P5 assets
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -4 -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/phase2_3_p5_patch_control_api.py \
            scripts/phase2_3_p5_patch_read_model.py \
            scripts/phase2_3_p5_approved_activation.sh \
            "$VPS_USER@$VPS_HOST:/tmp/"
      - name: Execute authorized P5 production activation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'chmod 700 /tmp/phase2_3_p5_approved_activation.sh /tmp/phase2_3_p5_patch_control_api.py /tmp/phase2_3_p5_patch_read_model.py && PHIL_AI_OS_P5_AUTHORIZATION=APPROVE_PHASE_2_3_P5 /tmp/phase2_3_p5_approved_activation.sh /tmp/phase2_3_p5_patch_control_api.py /tmp/phase2_3_p5_patch_read_model.py' \
            | tee phase-2-3-p5-activation.txt
      - name: Cleanup staged activation assets
        if: always()
        shell: bash
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'rm -f /tmp/phase2_3_p5_approved_activation.sh /tmp/phase2_3_p5_patch_control_api.py /tmp/phase2_3_p5_patch_read_model.py' || true
      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-3-p5-activation-evidence
          path: phase-2-3-p5-activation.txt
          if-no-files-found: warn
          retention-days: 90

  independent-verify:
    needs: activate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure fresh IPv4 SSH session
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4 5 6; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Stage independent verifier
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -4 -P "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/phase2_3_p5_post_activation_verify.sh "$VPS_USER@$VPS_HOST:/tmp/phase2_3_p5_post_activation_verify.sh"
      - name: Run independent post-activation verification
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'chmod 700 /tmp/phase2_3_p5_post_activation_verify.sh && /tmp/phase2_3_p5_post_activation_verify.sh' \
            | tee phase-2-3-p5-independent-verify.txt
      - name: Cleanup verifier
        if: always()
        shell: bash
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'rm -f /tmp/phase2_3_p5_post_activation_verify.sh' || true
      - name: Upload independent verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-3-p5-independent-verification-evidence
          path: phase-2-3-p5-independent-verify.txt
          if-no-files-found: warn
          retention-days: 90
