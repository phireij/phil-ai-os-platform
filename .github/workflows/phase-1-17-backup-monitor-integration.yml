name: Phase 1.17 Backup Monitor Integration
on:
  push:
    branches:
      - ops/phase-1.17-backup-discovery
    paths:
      - '.github/phase-1-17-backup-monitor-trigger'
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload monitor
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" ops/phase_1_16/monitor.py "$VPS_USER@$VPS_HOST:/tmp/phase-1-17-monitor.py"
      - name: Integrate backup health into monitor
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          STATUS=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/backups/status/latest.json
          test -s "$STATUS"
          install -m 755 /tmp/phase-1-17-monitor.py /opt/phil-ai-os/phase-1.16/monitor.py
          rm -f /tmp/phase-1-17-monitor.py
          grep -q '^PHIL_AI_OS_BACKUP_STATUS_FILE=' /etc/phil-ai-os-monitor.env || printf '%s\n' 'PHIL_AI_OS_BACKUP_STATUS_FILE=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/backups/status/latest.json' >> /etc/phil-ai-os-monitor.env
          grep -q '^PHIL_AI_OS_BACKUP_MAX_AGE_SECONDS=' /etc/phil-ai-os-monitor.env || printf '%s\n' 'PHIL_AI_OS_BACKUP_MAX_AGE_SECONDS=18000' >> /etc/phil-ai-os-monitor.env
          systemctl restart phil-ai-os-monitor.service
          sleep 3
          systemctl is-active --quiet phil-ai-os-monitor.service
          set -a
          . /etc/phil-ai-os-monitor.env
          set +a
          /usr/bin/python3 /opt/phil-ai-os/phase-1.16/monitor.py --once
          python3 -c 'import json;d=json.load(open("/var/lib/phil-ai-os-monitor/state.json"));b=d.get("checks",{}).get("backup_status",{});assert b.get("ok") is True;print("backup_monitor_ok=true");print("backup_monitor_detail="+str(b.get("detail","")))'
          systemctl is-active --quiet phil-ai-os-backup.timer
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo PHIL_AI_OS_PHASE_1_17_BACKUP_MONITOR_OK
          REMOTE
