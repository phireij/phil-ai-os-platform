name: Phase 2.2 A4 Production Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-2-a4-production-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"; : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts; sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Run governed read-only production preflight and isolated-copy migration proof
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee phase22-a4-evidence.txt
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"

          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general

          curl -fsS http://127.0.0.1:4881/api/read-model >/tmp/phase22-a4-read-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/phase22-a4-read-model.json'))
          r=d.get('worker_readiness') or {}
          assert d.get('schema_version')=='2.1o.v1'
          assert r.get('authority_effect')=='none'
          assert r.get('automatic_assignment') is False
          assert r.get('automatic_retry') is False
          assert r.get('automatic_reroute') is False
          assert r.get('automatic_execution') is False
          keys=' '.join(d.keys()).lower()
          print('mission_control_schema='+d.get('schema_version'))
          print('mission_control_handoff_surface='+('present' if 'handoff' in keys else 'absent'))
          print('mission_control_mutation_authority=none')
          PY

          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://hermes-agent-whow.srv1833510.hstgr.cloud/phil-ai-os/operator/)" = 401

          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3, json, os, tempfile, datetime
          prod='file:/app/state/control-plane.db?mode=ro'
          src=sqlite3.connect(prod, uri=True)
          src.row_factory=sqlite3.Row
          assert src.execute('pragma quick_check').fetchone()[0]=='ok'
          tables=[r[0] for r in src.execute("select name from sqlite_master where type='table' order by name")]
          assert 'agent_registry' in tables and 'task_lifecycle_events' in tables
          assert 'task_handoffs' not in tables
          registry=[dict(r) for r in src.execute('select * from agent_registry order by agent_id')]
          assert len(registry)==1 and registry[0]['agent_id']=='hermes' and registry[0]['authority_ceiling']=='L3'
          assert int(registry[0]['enabled'])==1 and int(registry[0]['assignable'])==1
          baseline={t:src.execute(f'select count(*) from {t}').fetchone()[0] for t in ['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit']}
          print('production_tables='+json.dumps(tables,separators=(',',':')))
          print('production_baseline_counts='+json.dumps(baseline,separators=(',',':')))
          print('production_agent_registry='+json.dumps(registry,separators=(',',':'),default=str))

          copy='/tmp/phase22-a4-preflight-copy.db'
          try:
              os.remove(copy)
          except FileNotFoundError:
              pass
          dst=sqlite3.connect(copy)
          src.backup(dst)
          dst.row_factory=sqlite3.Row
          assert dst.execute('pragma quick_check').fetchone()[0]=='ok'
          copied={t:dst.execute(f'select count(*) from {t}').fetchone()[0] for t in baseline}
          assert copied==baseline

          # A5 proof: existing registry schema can hold a disabled, non-assignable L1 second identity with no schema migration.
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          dst.execute("insert into agent_registry(agent_id,display_name,role,authority_ceiling,enabled,assignable,created_at,source_component) values(?,?,?,?,?,?,?,?)",
                      ('specialist-worker-01','Specialist Worker 01','specialist_worker','L1',0,0,now,'phase-2.2-a4-isolated-preflight'))
          assert dst.execute('select count(*) from agent_registry').fetchone()[0]==baseline['agent_registry']+1
          candidate=dict(dst.execute("select * from agent_registry where agent_id='specialist-worker-01'").fetchone())
          assert candidate['authority_ceiling']=='L1' and int(candidate['enabled'])==0 and int(candidate['assignable'])==0
          print('a5_candidate_registry_row='+json.dumps(candidate,separators=(',',':'),default=str))
          print('a5_schema_change_required=false')
          print('a5_candidate_enabled=false')
          print('a5_candidate_assignable=false')
          print('a5_candidate_provider_execution=none')

          # A6 future proof only: additive handoff persistence can be created on the isolated copy without rewriting existing tables.
          dst.executescript('''
          create table task_handoffs(
            handoff_id text primary key,
            handoff_version text not null,
            task_id text not null,
            source_agent_id text not null,
            target_agent_id text not null,
            task_class text not null,
            required_authority text not null,
            source_authority_ceiling text not null,
            target_authority_ceiling text not null,
            reason_code text not null,
            correlation_id text not null unique,
            requested_by text not null,
            requested_at text not null,
            expires_at text not null,
            handoff_approval_required integer not null,
            handoff_approval_state text not null,
            execution_approval_state text,
            source_readiness text,
            target_readiness text,
            state text not null,
            decided_by text,
            decided_at text,
            containment_reason text,
            lifecycle_event_id text unique
          );
          create index idx_task_handoffs_task_time on task_handoffs(task_id,requested_at,handoff_id);
          create index idx_task_handoffs_state_expiry on task_handoffs(state,expires_at);
          ''')
          assert dst.execute('pragma quick_check').fetchone()[0]=='ok'
          after={t:dst.execute(f'select count(*) from {t}').fetchone()[0] for t in baseline if t!='agent_registry'}
          assert all(after[t]==baseline[t] for t in after)
          cols=[dict(r) for r in dst.execute('pragma table_info(task_handoffs)')]
          print('a6_candidate_handoff_columns='+json.dumps(cols,separators=(',',':')))
          print('a6_candidate_schema_change=additive_task_handoffs_only')
          print('existing_rows_rewritten=false')
          dst.close(); src.close(); os.remove(copy)

          # Re-open production read-only to prove baseline remained unchanged after isolated-copy work.
          verify=sqlite3.connect(prod, uri=True)
          assert verify.execute('pragma quick_check').fetchone()[0]=='ok'
          final={t:verify.execute(f'select count(*) from {t}').fetchone()[0] for t in baseline}
          assert final==baseline
          assert verify.execute("select count(*) from sqlite_master where type='table' and name='task_handoffs'").fetchone()[0]==0
          verify.close()
          print('production_counts_unchanged=true')
          print('production_handoff_table_created=false')
          PY

          # Discover current runtime coordinator/registry implementation surface without exposing secrets.
          docker exec "$CONTROL" sh -lc '
            set -eu
            PYFILES="$(find /app -maxdepth 3 -type f -name "*.py" 2>/dev/null | tr "\n" " ")"
            printf "runtime_python_file_count=%s\n" "$(find /app -maxdepth 3 -type f -name "*.py" 2>/dev/null | wc -l | tr -d " ")"
            printf "agent_registry_code_refs=%s\n" "$(grep -R -l "agent_registry" /app --include="*.py" 2>/dev/null | wc -l | tr -d " ")"
            printf "coordinator_assign_route_refs=%s\n" "$(grep -R -E -l "coordinator.*assign|/v1/.+assign" /app --include="*.py" 2>/dev/null | wc -l | tr -d " ")"
            printf "coordinator_plan_route_refs=%s\n" "$(grep -R -E -l "coordinator.*plan|/v1/.+plan" /app --include="*.py" 2>/dev/null | wc -l | tr -d " ")"
            printf "handoff_code_refs=%s\n" "$(grep -R -i -l "handoff" /app --include="*.py" 2>/dev/null | wc -l | tr -d " ")"
          '

          rm -f /tmp/phase22-a4-read-model.json
          echo control_api_health=green
          echo control_api_readiness=green
          echo mission_control_operator=active
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active
          echo execution_allowlist=general
          echo dashboard_mutations=405
          echo operator_auth=401
          echo a5_minimum_change=one_disabled_nonassignable_L1_registry_row
          echo a5_rollback_boundary=registry_row_plus_prechange_database_backup
          echo a6_future_persistence=additive_handoff_table_candidate_only
          echo mission_control_a7_read_model_update_required=true
          echo production_change=none
          echo service_restart=none
          echo schema_mutation_production=none
          echo registry_mutation_production=none
          echo assignment_mutation=none
          echo lifecycle_mutation=none
          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_2_A4_PRODUCTION_PREFLIGHT_OK
          REMOTE
      - name: Upload A4 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-2-a4-production-preflight-evidence
          path: phase22-a4-evidence.txt
          if-no-files-found: error
          retention-days: 14
