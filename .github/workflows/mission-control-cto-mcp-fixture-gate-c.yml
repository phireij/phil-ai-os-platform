name: MC-021 Gate C Systemd Encrypted Credential Migration

on:
  workflow_dispatch:

concurrency:
  group: mission-control-cto-mcp-fixture-gate-c
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-hardened-loopback-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: phil-ai-os-mission-control-cto-mcp-fixture
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CONTAINER: phil-ai-os-mission-control-cto-mcp-fixture
      BACKUP_CONTAINER: phil-ai-os-mission-control-cto-mcp-fixture-gate-c-backup
      UNIT: phil-ai-os-mission-control-cto-mcp-fixture.service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare the checksum-verified fixture build source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar "$GITHUB_SHA" \
            Dockerfile.mission-control-cto-mcp-fixture \
            apps/operations-hub/src/operations_hub \
            apps/operations-hub/mission-control/project-readiness.json \
            | gzip -1 > /tmp/mission-control-cto-mcp-fixture-source.tar.gz
          test -s /tmp/mission-control-cto-mcp-fixture-source.tar.gz
      - name: Render unit without credential material
        shell: bash
        run: |
          set -euo pipefail
          sed "s|@IMAGE_REF@|$IMAGE:gate-c-$GITHUB_SHA|g" \
            ops/mission-control-identity/systemd/phil-ai-os-mission-control-cto-mcp-fixture.service.template \
            > /tmp/phil-ai-os-mission-control-cto-mcp-fixture.service
      - name: Transfer image and migrate only after encrypted-credential checks pass
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Keep authenticated transport alive while Hostinger processes the source build;
          # this changes no host policy.
          ssh_opts=(-4 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o TCPKeepAlive=yes -o StrictHostKeyChecking=accept-new)
          remote="$VPS_USER@$VPS_HOST"
          source_archive=/tmp/mission-control-cto-mcp-fixture-source.tar.gz
          source_sha256="$(sha256sum "$source_archive" | awk '{print $1}')"
          unit_b64="$(base64 -w0 /tmp/phil-ai-os-mission-control-cto-mcp-fixture.service)"
          [[ "$source_sha256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$unit_b64"
          ssh "${ssh_opts[@]}" "$remote" 'mkdir -p -m 700 .cache/phil-ai-os-gate-c'
          remote_build_script="$(base64 -w0 <<'REMOTE_BUILD'
          set -euo pipefail
          expected_sha256="$1"; image_ref="$2"
          stage_root="$PWD/.cache/phil-ai-os-gate-c"
          source_archive="$(mktemp "$stage_root/source.XXXXXX.tar.gz")"
          build_context="$(mktemp -d "$stage_root/build.XXXXXX")"
          case "$source_archive" in "$stage_root"/source.*.tar.gz) ;; *) exit 1 ;; esac
          case "$build_context" in "$stage_root"/build.*) ;; *) exit 1 ;; esac
          cleanup_build_source() {
            rm -f -- "$source_archive"
            rm -rf -- "$build_context"
          }
          trap cleanup_build_source EXIT
          echo 'remote_build_phase=receive'
          cat <&3 > "$source_archive"
          echo 'remote_build_phase=verify'
          test "$(sha256sum "$source_archive" | awk '{print $1}')" = "$expected_sha256"
          echo 'remote_build_phase=extract'
          tar -xzf "$source_archive" -C "$build_context"
          echo 'remote_build_phase=build'
          docker build --pull --file "$build_context/Dockerfile.mission-control-cto-mcp-fixture" --tag "$image_ref" "$build_context"
          docker image inspect "$image_ref" >/dev/null
          echo 'remote_build_phase=complete'
          REMOTE_BUILD
          )"
          echo 'transfer_phase=source_stream_and_build'
          cat "$source_archive" | ssh "${ssh_opts[@]}" "$remote" "exec 3<&0; printf %s '$remote_build_script' | base64 -d | /bin/bash -s -- '$source_sha256' '$IMAGE:gate-c-$GITHUB_SHA'"
          ssh "${ssh_opts[@]}" "$remote" 'bash -s' -- "$IMAGE" "$GITHUB_SHA" "$CONTAINER" "$BACKUP_CONTAINER" "$UNIT" "$unit_b64" <<'REMOTE'
          set -euo pipefail
          image="$1"; revision="$2"; container="$3"; backup="$4"; unit="$5"; unit_b64="$6"; port=8787
          image_ref="$image:gate-c-$revision"
          credential=/etc/credstore.encrypted/mcp_owner_subject
          unit_path="/etc/systemd/system/$unit"
          phase=preflight
          original_stopped=false
          legacy_renamed=false
          rollback() {
            systemctl disable --now "$unit" >/dev/null 2>&1 || true
            rm -f "$unit_path"
            systemctl daemon-reload >/dev/null 2>&1 || true
            if [ "$legacy_renamed" = true ] && docker inspect "$backup" >/dev/null 2>&1; then
              docker rm -f "$container" >/dev/null 2>&1 || true
              docker rename "$backup" "$container" >/dev/null 2>&1 || true
              docker start "$container" >/dev/null 2>&1 || true
            elif [ "$original_stopped" = true ]; then
              docker start "$container" >/dev/null 2>&1 || true
            fi
          }
          report_failure() {
            local rc="$1"
            # Emit only lifecycle fields, never credential contents, environment values,
            # request data, or container configuration.
            printf 'gate_c_failure rc=%s phase=%s\n' "$rc" "$phase"
            systemctl show "$unit" --no-pager \
              --property=LoadState \
              --property=ActiveState \
              --property=SubState \
              --property=Result \
              --property=ExecMainCode \
              --property=ExecMainStatus || true
            journal_signal=other_startup_failure
            if journalctl -u "$unit" --since '-2 minutes' --no-pager -o cat | grep -Fq 'owner_subject_credential_unreadable'; then
              journal_signal=credential_unreadable
            elif journalctl -u "$unit" --since '-2 minutes' --no-pager -o cat | grep -Fq 'owner_subject_credential_invalid'; then
              journal_signal=credential_invalid
            elif journalctl -u "$unit" --since '-2 minutes' --no-pager -o cat | grep -Fq 'Permission denied'; then
              journal_signal=permission_denied
            elif journalctl -u "$unit" --since '-2 minutes' --no-pager -o cat | grep -Fq 'Address already in use'; then
              journal_signal=address_in_use
            elif journalctl -u "$unit" --since '-2 minutes' --no-pager -o cat | grep -Fq 'Error response from daemon'; then
              journal_signal=docker_runtime_error
            elif journalctl -u "$unit" --since '-2 minutes' --no-pager -o cat | grep -Fq 'Traceback'; then
              journal_signal=application_startup_error
            fi
            printf 'journal_signal=%s\n' "$journal_signal"
            rollback
            exit "$rc"
          }
          trap 'report_failure "$?"' ERR
          phase=recover_legacy_backup
          if ! docker inspect "$container" >/dev/null 2>&1 && docker inspect "$backup" >/dev/null 2>&1; then
            docker rename "$backup" "$container"
            if [ "$(docker inspect "$container" --format '{{.State.Running}}')" = false ]; then
              docker start "$container" >/dev/null
            fi
          fi
          phase=preflight_systemd_creds
          version="$(systemd-creds --version | awk 'NR == 1 { print $2 }')"
          [[ "$version" =~ ^[0-9]+$ ]] && (( version >= 250 ))
          phase=preflight_run_tmpfs
          test "$(findmnt -n -o FSTYPE /run)" = tmpfs
          phase=preflight_swarm
          test "$(docker info --format '{{.Swarm.LocalNodeState}}')" = inactive
          phase=preflight_credential_exists
          test -f "$credential"
          phase=preflight_credential_decrypt
          systemd-creds decrypt --name=mcp_owner_subject "$credential" - >/dev/null
          phase=preflight_image
          docker image inspect "$image_ref" >/dev/null
          phase=preflight_legacy_container
          docker inspect "$container" >/dev/null
          phase=preflight_backup_absent
          ! docker inspect "$backup" >/dev/null 2>&1
          phase=preflight_legacy_hardening
          test "$(docker inspect "$container" --format '{{.HostConfig.NetworkMode}}|{{.HostConfig.ReadonlyRootfs}}|{{index .Config.Labels "traefik.enable"}}|{{json .HostConfig.SecurityOpt}}|{{json .HostConfig.CapDrop}}|{{.HostConfig.PidsLimit}}')" = 'host|true|false|["no-new-privileges:true"]|["ALL"]|128'
          phase=preflight_legacy_loopback
          ss -ltnH "( sport = :$port )" | grep -Eq '^LISTEN.*127\.0\.0\.1:8787'
          phase=install_unit
          printf %s "$unit_b64" | base64 -d > "$unit_path"
          chown root:root "$unit_path"
          chmod 0644 "$unit_path"
          systemctl daemon-reload
          test "$(systemctl show "$unit" --property=LoadState --value)" = loaded
          systemctl cat "$unit" >/dev/null
          phase=park_legacy
          docker stop "$container" >/dev/null
          original_stopped=true
          docker rename "$container" "$backup"
          legacy_renamed=true
          phase=start_unit
          systemctl enable --now "$unit"
          phase=health
          rm -f /tmp/mcp-health.json
          for i in $(seq 1 20); do curl -fsS --max-time 2 http://127.0.0.1:8787/healthz >/tmp/mcp-health.json && break; sleep 1; done
          test "$(cat /tmp/mcp-health.json)" = '{"authority_effect":"none","live_data":false,"mode":"offline_fixture","status":"ok"}'
          phase=metadata
          test "$(curl -fsS --max-time 2 http://127.0.0.1:8787/.well-known/oauth-protected-resource/mcp | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["resource"]=="https://miscon.phireij.cloud/mcp"; assert d["authorization_servers"]==["https://dev-81f0leykwbfdtibz.jp.auth0.com/"]; print("metadata=ok")')" = metadata=ok
          phase=challenge
          test "$(curl -fsS --max-time 2 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_phil_ai_os_status","arguments":{}}}' http://127.0.0.1:8787/mcp | python3 -c 'import json,sys; d=json.load(sys.stdin)["result"]; assert d["isError"] is True and d["content"][0]["text"]=="authentication_required"; assert "mcp/www_authenticate" in d["_meta"]; print("challenge=ok")')" = challenge=ok
          phase=container_hardening
          test "$(docker inspect "$container" --format '{{.Config.User}}|{{.HostConfig.NetworkMode}}|{{.HostConfig.ReadonlyRootfs}}|{{index .Config.Labels "traefik.enable"}}|{{json .HostConfig.SecurityOpt}}|{{json .HostConfig.CapDrop}}|{{.HostConfig.PidsLimit}}|{{json .HostConfig.PortBindings}}')" = 'app|host|true|false|["no-new-privileges:true"]|["ALL"]|128|{}'
          phase=credential_mount
          credential_mount="$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/mcp_owner_subject"}}{{.Source}}|{{.RW}}{{end}}{{end}}')"
          credential_mount_shape=unexpected
          case "$credential_mount" in */mcp_owner_subject\|false) credential_mount_shape=readonly_named ;; esac
          printf 'credential_mount_shape=%s\n' "$credential_mount_shape"
          test "$credential_mount_shape" = readonly_named
          credential_source="${credential_mount%|false}"
          credential_source_class=unexpected
          case "$credential_source" in /run/phil-ai-os-mission-control-cto-mcp-fixture/mcp_owner_subject) credential_source_class=runtime_tmpfs ;; esac
          printf 'credential_source_class=%s\n' "$credential_source_class"
          test "$credential_source_class" = runtime_tmpfs
          phase=credential_mode
          test "$(stat -c '%u:%g:%a' "$credential_source")" = '10001:10001:400'
          phase=credential_read
          docker exec --user 10001:10001 "$container" test -r /run/secrets/mcp_owner_subject
          phase=loopback
          ss -ltnH "( sport = :$port )" | grep -Eq '^LISTEN.*127\.0\.0\.1:8787'
          phase=finalize
          docker rm "$backup" >/dev/null
          echo "gate_c=green listener=127.0.0.1:8787 public_route=false tunnel_client=false auth0_changed=false tokens_issued=false live_data=false owner_credential=encrypted_systemd_file"
          REMOTE
