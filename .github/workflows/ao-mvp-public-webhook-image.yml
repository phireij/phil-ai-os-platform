name: AO-MVP Public Webhook Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.ao-mvp-public-webhook
      - scripts/ao_mvp_public_webhook_server.py
      - .github/workflows/ao-mvp-public-webhook-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ao-mvp-public-webhook
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phil-ai-os-public-webhook:sha-${{ github.sha }}
      - name: Verify AMD64 pull
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/phil-ai-os-public-webhook:sha-${{ github.sha }}"
          docker pull --platform linux/amd64 "$IMAGE"
          test "$(docker image inspect --format '{{.Architecture}}/{{.Os}}' "$IMAGE")" = "amd64/linux"
