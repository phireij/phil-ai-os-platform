name: Twilio Ingress Read-Only Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commerce-twilio-ingress-readonly-discovery.yml'
      - '.github/commerce-twilio-ingress-readonly-discovery-trigger'

permissions:
  contents: read

concurrency:
  group: commerce-twilio-ingress-readonly-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then
                rm -f "$TMP"
                exit 0
              fi
            fi
            rm -f "$TMP"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Discover Control API ingress facts without mutation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo '--- bounded ingress discovery ---'
          TRAEFIK_IDS="$(docker ps --filter name=traefik --format '{{.ID}}')"
          TRAEFIK_COUNT="$(printf '%s\n' "$TRAEFIK_IDS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo traefik_candidate_count="$TRAEFIK_COUNT"
          if test "$TRAEFIK_COUNT" -ne 1; then
            echo ingress_discovery_state=unresolved_traefik_cardinality
            echo read_only=true
            echo mutation=false
            echo dns=false
            echo proxy_restart=false
            echo callback_deploy=false
            exit 1
          fi
          TRAEFIK_CID="$(printf '%s\n' "$TRAEFIK_IDS" | sed '/^$/d')"
          echo traefik_container="$(docker inspect "$TRAEFIK_CID" --format '{{.Name}}' | sed 's#^/##')"
          echo traefik_networks="$(docker inspect "$TRAEFIK_CID" --format '{{range $name,$cfg := .NetworkSettings.Networks}}{{printf "%s " $name}}{{end}}')"
          echo traefik_ports="$(docker inspect "$TRAEFIK_CID" --format '{{json .NetworkSettings.Ports}}')"

          echo '--- control api candidates ---'
          CONTROL_ROWS="$(docker ps --format '{{.ID}}|{{.Names}}|{{.Image}}' | awk 'BEGIN{IGNORECASE=1} /control[-_]?api|control.*api|phil.*control/')"
          CONTROL_COUNT="$(printf '%s\n' "$CONTROL_ROWS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo control_api_candidate_count="$CONTROL_COUNT"
          if test "$CONTROL_COUNT" -eq 0; then
            echo control_api_container=not_found_by_bounded_name_image_match
          else
            printf '%s\n' "$CONTROL_ROWS" | while IFS='|' read -r CID CNAME CIMAGE; do
              test -n "$CID" || continue
              echo control_api_container="$CNAME"
              echo control_api_image="$CIMAGE"
              echo control_api_networks="$(docker inspect "$CID" --format '{{range $name,$cfg := .NetworkSettings.Networks}}{{printf "%s " $name}}{{end}}')"
              echo control_api_ports="$(docker inspect "$CID" --format '{{json .NetworkSettings.Ports}}')"
              echo 'control_api_traefik_labels_begin'
              docker inspect "$CID" --format '{{range $k,$v := .Config.Labels}}{{printf "%s=%s\n" $k $v}}{{end}}' \
                | grep -E '^traefik\.(enable|http\.routers\..*\.(rule|entrypoints|service|tls|tls\.certresolver)|http\.services\..*\.loadbalancer\.server\.port)=' \
                || true
              echo 'control_api_traefik_labels_end'
            done
          fi

          echo '--- approved traefik file-provider hints ---'
          for f in \
            /docker/traefik-fhxl/docker-compose.yml \
            /docker/traefik-fhxl/traefik.yml \
            /docker/traefik-fhxl/traefik.yaml \
            /docker/traefik-fhxl/dynamic.yml \
            /docker/traefik-fhxl/dynamic.yaml; do
            if test -f "$f"; then
              MATCHES="$(grep -Eni -C 4 'control[-_]?api|127\.0\.0\.1:4870|:4870' "$f" || true)"
              if test -n "$MATCHES"; then
                echo file="$f"
                printf '%s\n' "$MATCHES"
              fi
            fi
          done

          echo '--- local control api health probe ---'
          if command -v curl >/dev/null 2>&1; then
            HEALTH_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:4870/healthz || true)"
            echo control_api_local_health_http_code="${HEALTH_CODE:-unreachable}"
          else
            echo control_api_local_health_http_code=curl_unavailable
          fi

          echo read_only=true
          echo mutation=false
          echo dns=false
          echo proxy_restart=false
          echo callback_deploy=false
          echo external_twilio_call=false
          echo PHIL_AI_OS_TWILIO_INGRESS_READONLY_DISCOVERY_OK
          REMOTE

      - name: Assert workflow contains no mutation commands
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/commerce-twilio-ingress-readonly-discovery.yml
          ! grep -E 'docker (restart|rm|stop|kill)|docker compose (up|down|restart)|systemctl (restart|reload|stop)|iptables|ufw |certbot|curl .*-[Xx] *(POST|PUT|PATCH|DELETE)' "$FILE"
          echo PHIL_AI_OS_TWILIO_INGRESS_DISCOVERY_STATIC_NO_MUTATION_GREEN
