name: Phase 1.25 Approval API Contract Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase-1-25-approval-api-contract-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" true; then
                rm -f "$TMP"
                exit 0
              fi
            fi
            rm -f "$TMP"
            sleep $((attempt*10))
          done
          exit 1
      - name: Discover exact approval request API contract
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          BASE=http://127.0.0.1:4870
          echo '=== PHASE 1.25 APPROVAL API CONTRACT DISCOVERY ==='
          curl -fsS "$BASE/healthz" >/dev/null
          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"
          echo production_allowlist=general_only

          echo '--- approval request function source ---'
          docker exec "$CONTROL" python - <<'PY'
          import app, inspect
          for name in ('approval_request','approval_create','approval_link_issue'):
              fn=getattr(app,name,None)
              if fn:
                  print('FUNCTION='+name)
                  print(inspect.getsource(fn))
          PY

          echo '--- HTTP handler context for approval routes ---'
          docker exec "$CONTROL" python - <<'PY'
          from pathlib import Path
          p=Path('/app/app.py')
          lines=p.read_text(errors='replace').splitlines()
          needles=('/v1/approvals/request','/v1/approvals/approve','/v1/approvals/deny','/v1/approvals/link')
          hits=[]
          for i,l in enumerate(lines):
              if any(n in l for n in needles): hits.append(i)
          for i in hits:
              print(f'LINE={i+1}')
              for j in range(max(0,i-35),min(len(lines),i+90)):
                  print(f'{j+1:05d}: {lines[j]}')
          PY

          echo '--- approval table schema ---'
          docker exec "$CONTROL" python - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/state/control-plane.db')
          con.row_factory=sqlite3.Row
          for row in con.execute('pragma table_info(approval_requests)'):
              print(dict(row))
          PY

          echo '--- non-mutating request validation probes ---'
          # Intentionally malformed requests only; all must fail before creating approval state.
          for body in '{}' '{"task_text":""}' '{"task_text":"PHASE_1_25_SCHEMA_PROBE"}' '{"task_class":"general"}'; do
            code="$(curl -sS -o /tmp/phase125-probe.json -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "$BASE/v1/approvals/request" || true)"
            echo "probe_body=$body http_status=$code"
            cat /tmp/phase125-probe.json 2>/dev/null || true
            echo
          done

          echo provider_call=none
          echo approval_decision=none
          echo production_change=none
          echo routine_activation=false
          echo discovery_mode=read_only_plus_invalid_probes
          echo next_action=PHASE_1_25_CONTROLLED_E2E_CONTRACT_CORRECTION
          echo PHIL_AI_OS_PHASE_1_25_APPROVAL_API_CONTRACT_DISCOVERY_OK
          REMOTE
