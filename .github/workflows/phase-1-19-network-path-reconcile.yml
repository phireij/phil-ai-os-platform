name: Phase 1.19 Hermes Control API Network Reconciliation

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-network-path-reconcile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 3; done
          test -s ~/.ssh/known_hosts
      - name: Reconcile Hermes to Control API network path
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api')
          echo '=== PHASE 1.19 HERMES CONTROL API NETWORK RECONCILIATION ==='
          HNETS=$(docker inspect "$HERMES" --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | sort -u)
          CNETS=$(docker inspect "$CONTROL" --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | sort -u)
          SHARED=$(comm -12 <(printf '%s\n' "$HNETS") <(printf '%s\n' "$CNETS") | head -1 || true)
          echo "hermes_networks=$(printf '%s' "$HNETS" | paste -sd, -)"
          echo "control_networks=$(printf '%s' "$CNETS" | paste -sd, -)"
          echo "shared_network=${SHARED:-none}"
          if [ -n "$SHARED" ]; then
            HIP=$(docker inspect "$HERMES" --format '{{with index .NetworkSettings.Networks "'"$SHARED"'"}}{{.IPAddress}}{{end}}')
            CIP=$(docker inspect "$CONTROL" --format '{{with index .NetworkSettings.Networks "'"$SHARED"'"}}{{.IPAddress}}{{end}}')
            echo "hermes_ip=$HIP"
            echo "control_ip=$CIP"
            CODE=$(docker exec "$HERMES" sh -lc "curl -sS -o /tmp/p119-net.out -w '%{http_code}' --max-time 5 http://$CIP:4870/healthz" 2>/dev/null || true)
            echo "direct_control_ip_http=${CODE:-000}"
          else
            echo 'direct_control_ip_http=000'
          fi
          DNS_CODE=$(docker exec "$HERMES" sh -lc "curl -sS -o /tmp/p119-dns.out -w '%{http_code}' --max-time 5 http://$CONTROL:4870/healthz" 2>/dev/null || true)
          echo "container_dns_http=${DNS_CODE:-000}"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_19_HERMES_CONTROL_API_NETWORK_RECONCILIATION_OK
          REMOTE
