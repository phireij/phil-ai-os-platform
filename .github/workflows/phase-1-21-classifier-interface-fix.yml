name: Phase 1.21 Classifier Interface Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-classifier-interface-fix.yml'

permissions:
  contents: read

jobs:
  fix-and-validate:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Patch host source of Hermes execution bind mount
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=hermes-agent-whow-hermes-agent-1
          DEST=/usr/local/bin/philaios-execute
          BACKUP=/etc/phil-ai-os/phase-1-21-philaios-execute.host-source.pre-classifier-fix
          echo '=== PHASE 1.21 CLASSIFIER INTERFACE FIX V3 ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          docker exec "$HERMES" test -x "$DEST"
          install -d -m 0755 /etc/phil-ai-os

          SOURCE="$(docker inspect "$HERMES" --format '{{range .Mounts}}{{if eq .Destination "/usr/local/bin/philaios-execute"}}{{println .Source}}{{end}}{{end}}')"
          test -n "$SOURCE"
          test -f "$SOURCE"
          echo "bind_mount_source=$SOURCE"
          test -s "$BACKUP" || cp -a "$SOURCE" "$BACKUP"
          chmod 0755 "$BACKUP"

          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          target='text = " ".join(sys.argv[2:]).strip()'
          replacement='text = sys.argv[2].strip()'
          if target in s:
              p.write_text(s.replace(target,replacement,1))
              print('classifier_input_patch=host_source_task_text_only')
          elif replacement in s:
              print('classifier_input_patch=already_applied')
          else:
              raise SystemExit('unexpected host source interface; refusing guessed patch')
          PY
          chmod 0755 "$SOURCE"

          # Bind mount reflects an in-place host edit without replacing the mounted inode.
          docker exec "$HERMES" python - <<'PY'
          from pathlib import Path
          s=Path('/usr/local/bin/philaios-execute').read_text()
          assert 'text = sys.argv[2].strip()' in s
          assert 'text = " ".join(sys.argv[2:]).strip()' not in s
          print('container_mount_reflects_fix=yes')
          print('metadata_leak_static_regression=pass')
          PY

          ENV="$(docker inspect phil-ai-os-core-control-api-1 --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          echo persistent_production_scope=general_only
          echo provider_call=none
          echo canary_consumed=none
          echo rollback_artifact="$BACKUP"
          echo next_action=PHASE_1_21_CLASSIFIER_REGRESSION_VALIDATION
          echo PHIL_AI_OS_PHASE_1_21_CLASSIFIER_INTERFACE_FIX_OK
          REMOTE
