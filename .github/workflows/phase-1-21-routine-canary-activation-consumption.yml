name: Phase 1.21 Routine Canary Activation Consumption

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-routine-canary-activation-consumption.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Atomically consume approval and activate one-request routine canary marker
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          APPROVAL_ID=apr_af943f687d8944c38f5c0316c5f02034
          MARKER=/etc/phil-ai-os/phase-1-21-routine-canary.env
          echo '=== PHASE 1.21 ROUTINE CANARY ACTIVATION CONSUMPTION ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"

          docker exec -e APPROVAL_ID="$APPROVAL_ID" "$CONTROL" python - <<'PY'
          import os,sqlite3,datetime
          aid=os.environ['APPROVAL_ID']
          con=sqlite3.connect('/app/state/control-plane.db', isolation_level=None); con.row_factory=sqlite3.Row
          con.execute('BEGIN IMMEDIATE')
          r=con.execute('select state,task_text,task_class,consumed_at,consumed_by from approval_requests where approval_id=?',(aid,)).fetchone()
          assert r is not None, 'approval missing'
          assert r['state']=='approved', dict(r)
          assert r['task_class']=='routine', dict(r)
          assert r['task_text'].startswith('PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVATION'), dict(r)
          assert r['consumed_at'] is None and r['consumed_by'] is None, 'approval already consumed'
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          cur=con.execute('update approval_requests set consumed_at=?, consumed_by=?, updated_at=? where approval_id=? and state=? and consumed_at is null',(now,'phase1-21-routine-canary-activation',now,aid,'approved'))
          assert cur.rowcount==1, 'atomic consume failed'
          con.execute('COMMIT')
          print('approval_consumption=atomic_success')
          PY

          install -d -m 0755 /etc/phil-ai-os
          cat > "$MARKER" <<EOF
          PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVE=true
          PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_SCOPE=one-request-only
          PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_APPROVAL_ID=$APPROVAL_ID
          PHIL_AI_OS_PHASE_1_21_DIRECT_PROVIDER_BYPASS=false
          PHIL_AI_OS_PHASE_1_21_AUTONOMOUS_EXPANSION=false
          EOF
          chmod 0644 "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVE=true$' "$MARKER"
          echo routine_canary_marker=active
          echo production_allowed_task_classes=general_unchanged
          echo routine_execution_consumed=none
          echo provider_call=none
          echo execution_invoked=none
          echo direct_provider_bypass=false
          echo autonomous_expansion=false
          echo next_action=PHASE_1_21_ROUTINE_CANARY_POST_ACTIVATION_VERIFICATION
          echo PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVATION_CONSUMPTION_OK
          REMOTE
