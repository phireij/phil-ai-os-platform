name: MC-021 Gate A Loopback MCP Fixture Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy-loopback-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/${{ github.repository }}/mission-control-cto-mcp-fixture
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTAINER: phil-ai-os-mission-control-cto-mcp-fixture
      REMOTE_DOCKER_CONFIG: /tmp/phil-ai-os-mcp-fixture-ghcr-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish isolated fixture image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --file Dockerfile.mission-control-cto-mcp-fixture --tag "$IMAGE:sha-$GITHUB_SHA" \
            --push --metadata-file /tmp/image.json .
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/image.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy only after loopback-port inventory
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          remote="$VPS_USER@$VPS_HOST"
          ssh_opts=(-4 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_opts[@]}" "$remote" true
          printf '%s' "$GH_TOKEN" | ssh "${ssh_opts[@]}" "$remote" \
            "mkdir -m 700 -p '$REMOTE_DOCKER_CONFIG' && DOCKER_CONFIG='$REMOTE_DOCKER_CONFIG' docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh "${ssh_opts[@]}" "$remote" 'bash -s' -- "$IMAGE" "$DIGEST" "$CONTAINER" "$REMOTE_DOCKER_CONFIG" <<'REMOTE'
          set -euo pipefail
          image="$1"; digest="$2"; container="$3"; config="$4"; port=8787
          cleanup() { DOCKER_CONFIG="$config" docker logout ghcr.io >/dev/null 2>&1 || true; rm -f "$config/config.json"; rmdir "$config" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ! docker inspect "$container" >/dev/null 2>&1
          ! ss -ltnH "( sport = :$port )" | grep -q .
          before="$(docker ps --format '{{.Names}}|{{.Image}}' | sort)"
          DOCKER_CONFIG="$config" docker pull --platform linux/amd64 "$image@$digest" >/dev/null
          docker run -d --name "$container" --restart unless-stopped --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --label traefik.enable=false "$image@$digest" >/dev/null
          rollback() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap 'rollback; cleanup' ERR
          for i in 1 2 3 4 5; do curl -fsS --max-time 2 http://127.0.0.1:8787/healthz >/tmp/mcp-health.json && break; sleep 1; done
          test "$(cat /tmp/mcp-health.json)" = '{"authority_effect":"none","live_data":false,"mode":"offline_fixture","status":"ok"}'
          test "$(curl -fsS --max-time 2 http://127.0.0.1:8787/.well-known/oauth-protected-resource/mcp | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["resource"]=="https://miscon.phireij.cloud/mcp"; assert d["authorization_servers"]==["https://identity.example.test/"]; print("metadata=ok")')" = metadata=ok
          test "$(curl -fsS --max-time 2 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:8787/mcp | python3 -c 'import json,sys; d=json.load(sys.stdin); assert [x["name"] for x in d["result"]["tools"]]==["get_phil_ai_os_status"]; print("tools=ok")')" = tools=ok
          test "$(docker inspect "$container" --format '{{.HostConfig.NetworkMode}}|{{.HostConfig.ReadonlyRootfs}}|{{index .Config.Labels "traefik.enable"}}')" = 'host|true|false'
          ss -ltnH "( sport = :$port )" | grep -Eq '^LISTEN.*127\.0\.0\.1:8787'
          after="$(docker ps --format '{{.Names}}|{{.Image}}' | awk -F'|' -v c="$container" '$1 != c' | sort)"
          test "$before" = "$after"
          echo "gate_a=green listener=127.0.0.1:8787 public_route=false tunnel_client=false auth0=false live_data=false"
          REMOTE
