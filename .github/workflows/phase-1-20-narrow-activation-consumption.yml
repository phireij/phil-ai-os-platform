name: Phase 1.20 Narrow Activation Consumption

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-20-narrow-activation-consumption.yml'

permissions:
  contents: read

jobs:
  consume-and-activate:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Consume approval and activate narrow policy marker
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          APPROVAL_ID=apr_8e28ac1a72dd4b3fa02b7da053f664e4
          echo '=== PHASE 1.20 NARROW ACTIVATION CONSUMPTION ==='
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          # Atomically consume the exact human-approved activation authorization.
          docker exec -e APPROVAL_ID="$APPROVAL_ID" "$CONTROL" python - <<'PY'
          import os,sqlite3,datetime
          a=os.environ['APPROVAL_ID']
          con=sqlite3.connect('/app/state/control-plane.db', timeout=10)
          con.row_factory=sqlite3.Row
          con.execute('BEGIN IMMEDIATE')
          r=con.execute('select approval_id,state,task_text,expires_at,consumed_at,consumed_by from approval_requests where approval_id=?',(a,)).fetchone()
          assert r is not None, 'approval missing'
          assert r['state']=='approved', dict(r)
          assert r['consumed_at'] is None and r['consumed_by'] is None, dict(r)
          assert r['task_text'].startswith('PHIL_AI_OS_PHASE_1_20_NARROW_ACTIVATION'), dict(r)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          cur=con.execute("update approval_requests set consumed_at=?, consumed_by=?, updated_at=? where approval_id=? and state='approved' and consumed_at is null",(now,'phase1-20-narrow-activation',now,a))
          assert cur.rowcount==1, 'approval consumption race/replay detected'
          con.commit()
          print('approval_state=approved_verified')
          print('approval_consumption=success')
          print('replay_protection=armed')
          PY

          # Persist the narrow activation state as a host-side control marker.
          # Existing execution allowlist and kill switch remain unchanged.
          install -d -m 0755 /etc/phil-ai-os
          TMP="$(mktemp)"
          cat > "$TMP" <<'EOF'
          PHIL_AI_OS_PHASE_1_20_NARROW_EXPANSION_ACTIVE=true
          PHIL_AI_OS_PHASE_1_20_POLICY=human-approved-general-control-api-only
          PHIL_AI_OS_PHASE_1_20_DIRECT_PROVIDER_BYPASS=false
          PHIL_AI_OS_PHASE_1_20_AUTONOMOUS_EXECUTION=false
          EOF
          install -m 0644 "$TMP" /etc/phil-ai-os/phase-1-20-narrow-expansion.env
          rm -f "$TMP"

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_ROUTED_EXECUTION_ENABLED=true$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_LIVE_TEST_ENABLED=false$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_PHASE_1_20_NARROW_EXPANSION_ACTIVE=true$' /etc/phil-ai-os/phase-1-20-narrow-expansion.env
          grep -q '^PHIL_AI_OS_PHASE_1_20_DIRECT_PROVIDER_BYPASS=false$' /etc/phil-ai-os/phase-1-20-narrow-expansion.env
          grep -q '^PHIL_AI_OS_PHASE_1_20_AUTONOMOUS_EXECUTION=false$' /etc/phil-ai-os/phase-1-20-narrow-expansion.env

          echo narrow_activation=active
          echo allowed_task_class=general
          echo human_approval_required=yes
          echo route_boundary=control_api_only
          echo direct_provider_bypass=false
          echo autonomous_execution=false
          echo existing_kill_switch_preserved=yes
          echo provider_call=none
          echo execution_invoked=none
          echo next_action=PHASE_1_20_POST_ACTIVATION_VERIFICATION
          echo PHIL_AI_OS_PHASE_1_20_NARROW_ACTIVATION_CONSUMPTION_OK
          REMOTE
