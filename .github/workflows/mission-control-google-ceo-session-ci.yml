name: Mission Control Google CEO Session CI

on:
  pull_request:
    paths:
      - 'Dockerfile.mission-control-google-ceo-session'
      - 'Dockerfile.ruby-staging-review'
      - 'Dockerfile.ruby-staging-review.dockerignore'
      - 'ops/mission-control-identity/**'
      - '.github/workflows/mission-control-google-ceo-session-ci.yml'
      - '.github/workflows/mission-control-google-ceo-session-image.yml'
      - '.github/workflows/mission-control-provider-custody-preflight.yml'
      - '.github/workflows/mission-control-google-ceo-session-deploy.yml'
      - '.github/workflows/mission-control-google-ceo-session-upgrade.yml'
      - '.github/workflows/mission-control-google-ceo-session-recovery.yml'
      - '.github/workflows/mission-control-google-ceo-session-route-cutover.yml'
      - '.github/workflows/mission-control-telegram-delivery-activate.yml'
      - '.github/workflows/mission-control-google-ceo-session-rollback-inventory.yml'
      - '.github/workflows/mission-control-conversation-storage-preflight.yml'
      - '.github/workflows/mission-control-conversation-key-bootstrap.yml'
      - '.github/workflows/mission-control-conversation-storage-activate.yml'
      - '.github/workflows/mission-control-conversation-recovery-preflight.yml'
      - '.github/workflows/mission-control-conversation-quarantined-restore.yml'
      - '.github/workflows/mission-control-conversation-recovery-package-removal.yml'
      - '.github/workflows/mission-control-conversation-storage-monitor.yml'
      - '.github/workflows/mission-control-conversation-backup.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile.mission-control-google-ceo-session'
      - 'Dockerfile.ruby-staging-review'
      - 'Dockerfile.ruby-staging-review.dockerignore'
      - 'ops/mission-control-identity/**'
      - '.github/workflows/mission-control-google-ceo-session-ci.yml'
      - '.github/workflows/mission-control-google-ceo-session-image.yml'
      - '.github/workflows/mission-control-provider-custody-preflight.yml'
      - '.github/workflows/mission-control-google-ceo-session-deploy.yml'
      - '.github/workflows/mission-control-google-ceo-session-upgrade.yml'
      - '.github/workflows/mission-control-google-ceo-session-recovery.yml'
      - '.github/workflows/mission-control-google-ceo-session-route-cutover.yml'
      - '.github/workflows/mission-control-telegram-delivery-activate.yml'
      - '.github/workflows/mission-control-google-ceo-session-rollback-inventory.yml'
      - '.github/workflows/mission-control-conversation-storage-preflight.yml'
      - '.github/workflows/mission-control-conversation-key-bootstrap.yml'
      - '.github/workflows/mission-control-conversation-storage-activate.yml'
      - '.github/workflows/mission-control-conversation-recovery-preflight.yml'
      - '.github/workflows/mission-control-conversation-quarantined-restore.yml'
      - '.github/workflows/mission-control-conversation-recovery-package-removal.yml'
      - '.github/workflows/mission-control-conversation-storage-monitor.yml'
      - '.github/workflows/mission-control-conversation-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify offline OAuth and CEO session boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/mission-control-google-ceo-session-venv
          source /tmp/mission-control-google-ceo-session-venv/bin/activate
          python3 -m pip install --disable-pip-version-check -r ops/mission-control-identity/requirements.txt
          python3 ops/mission-control-identity/test_google_identity_probe.py
          python3 ops/mission-control-identity/test_google_ceo_session.py
          python3 ops/mission-control-identity/test_conversation_store.py
          python3 ops/mission-control-identity/test_cto_deletion_recovery.py
          python3 ops/mission-control-identity/test_ruby_review_records.py
          python3 ops/mission-control-identity/test_ruby_inquiry.py
          python3 ops/mission-control-identity/test_ruby_inquiry_source.py
          python3 ops/mission-control-identity/test_ruby_finalized_quote.py
          python3 ops/mission-control-identity/test_ruby_quote_custody.py
          python3 ops/mission-control-identity/test_ruby_quote_consent.py
          python3 ops/mission-control-identity/test_ruby_review_synthetic_harness.py
          python3 ops/mission-control-identity/test_ruby_review_synthetic_topology.py
          python3 ops/mission-control-identity/test_ruby_staging_rehearsal.py
          python3 ops/mission-control-identity/test_ruby_staging_lifecycle.py
          python3 ops/mission-control-identity/test_ruby_staging_review_harness.py
          python3 ops/mission-control-identity/test_ruby_staging_id_token.py
          python3 ops/mission-control-identity/test_ruby_staging_signed_review.py
          python3 ops/mission-control-identity/test_ruby_staging_google_exchange.py
          python3 ops/mission-control-identity/test_ruby_staging_google_auth.py
          python3 ops/mission-control-identity/test_ruby_staging_http_app.py
          python3 ops/mission-control-identity/test_ruby_staging_owner_quote.py
          python3 ops/mission-control-identity/test_ruby_staging_app_factory.py
          python3 ops/mission-control-identity/test_ruby_staging_protected_files.py
          python3 ops/mission-control-identity/test_ruby_staging_runtime_limits.py
          python3 ops/mission-control-identity/test_provider_runtime.py
          python3 ops/mission-control-identity/test_notification_delivery.py
          python3 ops/mission-control-identity/test_diagnose_telegram_delivery.py
          python3 ops/mission-control-identity/test_preflight_conversation_storage.py
          python3 ops/mission-control-identity/test_hostinger_conversation_storage_preflight_workflow.py
          python3 ops/mission-control-identity/test_conversation_key_bootstrap.py
          python3 ops/mission-control-identity/test_activate_conversation_storage.py
          python3 ops/mission-control-identity/test_preflight_conversation_recovery.py
          python3 ops/mission-control-identity/test_exercise_conversation_quarantined_restore.py
          python3 ops/mission-control-identity/test_remove_conversation_recovery_package.py
          python3 ops/mission-control-identity/test_monitor_conversation_storage.py
          python3 ops/mission-control-identity/test_create_conversation_backup.py
          python3 ops/mission-control-identity/test_upgrade_google_ceo_session.py
          bash -n ops/mission-control-identity/activate-google-ceo-session.sh
          bash -n ops/mission-control-identity/preflight-conversation-storage.sh
          bash -n ops/mission-control-identity/upgrade-google-ceo-session.sh
          bash -n ops/mission-control-identity/bootstrap-conversation-key.sh
          bash -n ops/mission-control-identity/activate-conversation-storage.sh
          bash -n ops/mission-control-identity/preflight-conversation-recovery.sh
          bash -n ops/mission-control-identity/exercise-conversation-quarantined-restore.sh
          bash -n ops/mission-control-identity/remove-conversation-recovery-package.sh
          bash -n ops/mission-control-identity/monitor-conversation-storage.sh
          bash -n ops/mission-control-identity/create-conversation-backup.sh
      - name: Build inactive CEO session image
        shell: bash
        run: |
          set -euo pipefail
          docker build --file Dockerfile.mission-control-google-ceo-session --tag mission-control-google-ceo-session:review .
      - name: Smoke-test packaged CEO session entrypoint imports
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint python3 mission-control-google-ceo-session:review \
            -c 'import runpy; runpy.run_path("/srv/google_ceo_session.py", run_name="__packaging_smoke__")'

  verify-staging-server-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out reviewed official Gunicorn test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: benoitc/gunicorn
          ref: 8d98faa9a13d3399a7bea81b5169e5cd72225395
          path: .ruby-staging-gunicorn-source
          persist-credentials: false
      - name: Verify opt-in staging handler with inert transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ruby-staging-server-test-venv
          source /tmp/ruby-staging-server-test-venv/bin/activate
          python3 -m pip install --disable-pip-version-check -r ops/mission-control-identity/requirements.txt
          export RUBY_STAGING_TEST_GUNICORN_SOURCE="$GITHUB_WORKSPACE/.ruby-staging-gunicorn-source"
          python3 -I -B ops/mission-control-identity/test_ruby_staging_gunicorn_logging.py
          python3 -I -B ops/mission-control-identity/test_ruby_staging_gunicorn_errors.py
          python3 -I -B ops/mission-control-identity/test_ruby_staging_gunicorn_boundary.py
          python3 -I -B ops/mission-control-identity/test_ruby_staging_gunicorn_integrated.py
          python3 -I -B ops/mission-control-identity/test_ruby_staging_gunicorn_arbiter.py
          python3 -I -B ops/mission-control-identity/test_ruby_staging_gunicorn_application.py

  verify-staging-review-image:
    # Packaging only: no application execution, registry push or deployment.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BUILD_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and inspect inactive Ruby review image without publishing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BUILD_SOURCE_SHA" ]]
          echo "source_revision=$BUILD_SOURCE_SHA"
          context="$(mktemp -d "$RUNNER_TEMP/ruby-staging-build.XXXXXX")"
          python3 -I -B - "$context" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          root, context = Path.cwd(), Path(sys.argv[1])
          sources = (
              "Dockerfile.ruby-staging-review",
              "Dockerfile.ruby-staging-review.dockerignore",
              "ops/mission-control-identity/requirements.txt",
              "ops/mission-control-identity/ruby_staging_lifecycle.py",
              "ops/mission-control-identity/ruby_staging_id_token.py",
              "ops/mission-control-identity/ruby_staging_google_auth.py",
              "ops/mission-control-identity/ruby_staging_app_factory.py",
              "ops/mission-control-identity/ruby_staging_protected_files.py",
              "ops/mission-control-identity/ruby_staging_http_app.py",
              "ops/mission-control-identity/ruby_review_synthetic.py",
          )
          for name in sources:
              source = root
              for part in Path(name).parts:
                  source = source / part
                  if source.is_symlink():
                      raise SystemExit("staging_build_context_symlink_rejected")
              if not source.is_file():
                  raise SystemExit("staging_build_context_file_required")
              data = source.read_bytes()
              target = context / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"source_sha256={hashlib.sha256(data).hexdigest()} path={name}")
          PY
          # Fail rather than selecting any remote or user-managed Docker host.
          [[ "$(docker context inspect default --format '{{.Endpoints.docker.Host}}')" == 'unix:///var/run/docker.sock' ]]
          docker --context default version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          image_id_file="$RUNNER_TEMP/ruby-staging-review-image-id"
          docker --context default build --builder default --platform linux/amd64 \
            --file "$context/Dockerfile.ruby-staging-review" \
            --tag "ruby-staging-review:ci-$BUILD_SOURCE_SHA" \
            --iidfile "$image_id_file" "$context"
          image_id="$(cat "$image_id_file")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          inspect_file="$RUNNER_TEMP/ruby-staging-review-image-inspect.json"
          docker --context default image inspect "$image_id" > "$inspect_file"
          python3 -I -B - "$inspect_file" "$image_id" <<'PY'
          import json
          from pathlib import Path
          import sys

          images = json.loads(Path(sys.argv[1]).read_text())
          if not isinstance(images, list) or len(images) != 1:
              raise SystemExit("staging_image_inspection_invalid")
          image = images[0]
          config = image.get("Config", {})
          if not (image.get("Id") == sys.argv[2]
                  and image.get("Os") == "linux"
                  and image.get("Architecture") == "amd64"
                  and config.get("User") == "app"
                  and config.get("WorkingDir") == "/srv"
                  and config.get("Entrypoint") == ["python3", "/srv/ruby_staging_http_app.py"]
                  and not config.get("Cmd")
                  and not config.get("ExposedPorts")
                  and not config.get("Volumes")
                  and not config.get("Healthcheck")):
              raise SystemExit("staging_image_configuration_invalid")
          print(f"runner_local_image_id={sys.argv[2]} application_executed=false image_pushed=false")
          PY
