name: Phase 1.20 Controlled Rollout Readiness

on:
  push:
    branches: [ops/phase-1.20]
    paths:
      - '.github/workflows/phase-1-20-controlled-rollout-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true
      - name: Verify controlled rollout readiness
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          HERMES=hermes-agent-whow-hermes-agent-1
          echo '=== PHASE 1.20 CONTROLLED ROLLOUT READINESS ==='

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_ROUTED_EXECUTION_ENABLED=true$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_LIVE_TEST_ENABLED=false$' <<<"$ENV"
          echo execution_policy=verified

          docker exec "$HERMES" test -x /usr/local/bin/philaios-execute
          docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control
          echo hermes_clients=ready

          docker exec "$CONTROL" python -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute(\"select count(*) from execution_audit where outcome='success' and approval_id is not null\").fetchone()[0] >= 1; assert c.execute(\"select count(*) from approval_requests where consumed_at is not null\").fetchone()[0] >= 1"
          echo durable_approval_and_audit=verified

          # Verify enforcement from durable runtime behavior rather than brittle
          # implementation symbol names. No execution/provider call is made here.
          docker exec "$CONTROL" python -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute(\"select count(*) from execution_audit where outcome='canary_not_allowlisted'\").fetchone()[0] >= 1; assert c.execute(\"select count(*) from execution_audit where outcome='success' and approval_id is not null\").fetchone()[0] >= 1; assert c.execute(\"select count(*) from approval_requests where state='approved' and consumed_at is not null and consumed_by is not null\").fetchone()[0] >= 1"
          echo canary_boundary_evidence=verified
          echo approval_consumption_evidence=verified
          echo execution_audit_evidence=verified
          echo enforcement_contract=verified

          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          echo operational_safety=ready

          test -f /docker/hermes-agent-whow/docker-compose.phil-ai-os.yml.phase119.rollback
          echo rollback_reference=ready

          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo control_api_health=ok
          echo provider_call=none
          echo execution_invoked=none
          echo production_change=none
          echo rollout_decision=READY_FOR_GATED_EXPANSION_NOT_ACTIVATED
          echo PHIL_AI_OS_PHASE_1_20_CONTROLLED_ROLLOUT_READINESS_OK
          REMOTE
