name: Phase 1.18 Hook Surface Discovery
on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-hook-surface-trigger'
      - '.github/workflows/phase-1-18-hook-surface.yml'
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only Hermes hook surface classification
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          test -n "$HERMES"
          WRAPPER=/opt/hermes/docker/main-wrapper.sh
          CONFIG=/opt/data/config.yaml
          WRAPPER_PRESENT=$(docker exec "$HERMES" test -r "$WRAPPER" && echo yes || echo no)
          CONFIG_PRESENT=$(docker exec "$HERMES" test -r "$CONFIG" && echo yes || echo no)
          GATEWAY_REFS=$(docker exec "$HERMES" sh -lc "grep -Eic 'gateway|main' '$WRAPPER' 2>/dev/null || true" | tr -d ' ')
          ENV_REFS=$(docker exec "$HERMES" sh -lc "grep -Eic 'env|export|source|\. ' '$WRAPPER' 2>/dev/null || true" | tr -d ' ')
          EXEC_REFS=$(docker exec "$HERMES" sh -lc "grep -Eic 'exec ' '$WRAPPER' 2>/dev/null || true" | tr -d ' ')
          TOOL_KEYS=$(docker exec "$HERMES" sh -lc "grep -E '^[[:space:]]*[A-Za-z0-9_.-]+:' '$CONFIG' 2>/dev/null | sed -E 's/^[[:space:]]*([^:]+):.*/\1/' | grep -Ei 'tool|command|plugin|hook|skill|gateway|provider|model' | sort -u | paste -sd, -" || true)
          echo '=== PHASE 1.18 HOOK SURFACE ==='
          echo "main_wrapper_present=$WRAPPER_PRESENT"
          echo "config_yaml_present=$CONFIG_PRESENT"
          echo "wrapper_gateway_refs=$GATEWAY_REFS"
          echo "wrapper_env_hook_refs=$ENV_REFS"
          echo "wrapper_exec_refs=$EXEC_REFS"
          echo "config_hook_keys=${TOOL_KEYS:-none}"
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo PHIL_AI_OS_PHASE_1_18_HOOK_SURFACE_OK
          REMOTE
