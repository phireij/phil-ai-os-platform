name: Mission Control Conversation Quarantined Restore Exercise

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable digest of the already-running CEO session image
        required: true
        type: string
      approved_exercise:
        description: Type exactly APPROVE_QUARANTINED_RESTORE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mission-control-conversation-quarantined-restore
  cancel-in-progress: false

jobs:
  exercise:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      HOSTNAME: miscon.phireij.cloud
      SESSION: phil-ai-os-mission-control-google-ceo-session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Perform explicitly approved quarantined restore exercise
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APPROVED_EXERCISE: ${{ inputs.approved_exercise }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$APPROVED_EXERCISE" = 'APPROVE_QUARANTINED_RESTORE'
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          port="${VPS_PORT:-22}"
          remote="$VPS_USER@$VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh_opts=(-4 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          cleanup() {
            ssh "${ssh_opts[@]}" "$remote" 'rm -f /tmp/exercise-conversation-quarantined-restore.sh' || true
          }
          trap cleanup EXIT
          scp -4 -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new ops/mission-control-identity/exercise-conversation-quarantined-restore.sh "$remote:/tmp/exercise-conversation-quarantined-restore.sh"
          ssh "${ssh_opts[@]}" "$remote" "chmod 700 /tmp/exercise-conversation-quarantined-restore.sh && IMAGE_DIGEST='$IMAGE_DIGEST' SECRET_VOLUME=\$(docker inspect '$SESSION' --format '{{range .Mounts}}{{if eq .Destination \"/run/secrets\"}}{{.Name}}{{end}}{{end}}') STATE_VOLUME=\$(docker inspect '$SESSION' --format '{{range .Mounts}}{{if eq .Destination \"/var/lib/mission-control\"}}{{.Name}}{{end}}{{end}}') BACKUP_VOLUME='phil-ai-os-mission-control-conversation-backup-v1' bash /tmp/exercise-conversation-quarantined-restore.sh"
          health="$(curl --fail-with-body --silent --show-error --max-time 15 "https://$HOSTNAME/auth/google/healthz")"
          test "$health" = 'session_ready;conversation_authority=enabled'
          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "https://$HOSTNAME/auth/google/session")"
          test "$unauth_status" = 401
          echo 'conversation_quarantined_restore_workflow_completed=true public_health=green unauthenticated_session=401 live_state_replaced=false offline_recovery_package_exercised=false'
