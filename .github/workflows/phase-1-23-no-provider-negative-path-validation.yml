name: Phase 1.23 No-Provider Negative-Path Validation

on:
  push:
    paths:
      - '.github/workflows/phase-1-23-no-provider-negative-path-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with resilient retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"
            sleep $((attempt*10))
          done
          exit 1
      - name: Validate no-provider negative paths without provider calls
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.23 NO-PROVIDER NEGATIVE-PATH VALIDATION ==='
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$CENV"
          echo production_allowlist=general_only

          # Invalid/unsupported task classes must fail before any provider dispatch.
          for cls in coding browser admin unknown; do
            code="$(curl -sS -o "/tmp/phase123-${cls}.json" -w '%{http_code}' -X POST http://127.0.0.1:4870/v1/execute -H 'Content-Type: application/json' --data "{\"task_class\":\"${cls}\",\"prompt\":\"PHASE_1_23_NEGATIVE_PATH_ONLY\"}" || true)"
            echo "task_class=${cls} http_status=${code}"
            test "$code" != 200
          done

          # Malformed payload must also fail closed.
          code="$(curl -sS -o /tmp/phase123-malformed.json -w '%{http_code}' -X POST http://127.0.0.1:4870/v1/execute -H 'Content-Type: application/json' --data '{}' || true)"
          echo "malformed_payload_http_status=${code}"
          test "$code" != 200

          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          RECENT="$(journalctl -u phil-ai-os-monitor.service --since '3 minutes ago' --no-pager -n 20)"
          ! grep -q '"ok": false' <<<"$RECENT"
          echo monitor_healthy=true
          echo provider_call=none
          echo production_change=none
          echo negative_paths_fail_closed=true
          echo next_action=PHASE_1_24_GENERAL_EXECUTION_GOVERNANCE_VALIDATION
          echo PHIL_AI_OS_PHASE_1_23_NO_PROVIDER_NEGATIVE_PATH_VALIDATION_OK
          REMOTE
