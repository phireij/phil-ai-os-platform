name: Phase 1.27 Final Foundation Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-27-final-foundation-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Validate Phase 1 final foundation readiness read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          DB=/app/state/control-plane.db
          APPROVAL_ID=apr_6ee5a19331794c159e4d99070d63d08e
          BASE=http://127.0.0.1:4870

          echo '=== PHASE 1.27 FINAL FOUNDATION READINESS ==='
          curl -fsS "$BASE/healthz" >/dev/null
          curl -fsS "$BASE/readyz" >/dev/null
          echo control_api_health=ok
          echo control_api_readiness=ok

          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          echo monitoring=active
          echo backup_timer=active
          echo backup_self_heal=active

          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"
          echo production_allowlist=general_only

          ENFORCEMENT="$(printf '%s\n' "$CENV" | sed -n 's/^PHIL_AI_OS_EXECUTION_ENFORCEMENT_MODE=//p' | tail -n1)"
          SCOPE="$(printf '%s\n' "$CENV" | sed -n 's/^PHIL_AI_OS_EXECUTION_ENFORCEMENT_SCOPE=//p' | tail -n1)"
          if [ -n "$ENFORCEMENT" ]; then echo enforcement_mode="$ENFORCEMENT"; fi
          if [ -n "$SCOPE" ]; then echo enforcement_scope="$SCOPE"; fi

          CHECK="$(docker exec "$CONTROL" python -c "import sqlite3; c=sqlite3.connect('$DB'); c.row_factory=sqlite3.Row; r=c.execute('select state,consumed_at,consumed_by from approval_requests where approval_id=?',('$APPROVAL_ID',)).fetchone(); assert r is not None; assert r['state']=='approved'; assert r['consumed_at']; assert r['consumed_by']=='hermes'; n=c.execute(\"select count(*) from execution_audit where approval_id=? and outcome='success'\",('$APPROVAL_ID',)).fetchone()[0]; assert n>=1; print('approval_consumption=durable'); print('successful_audit_link=present')")"
          printf '%s\n' "$CHECK"

          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo production_change=none
          echo phase_2_entry_recommendation=prepare_formal_phase_1_closure
          echo PHIL_AI_OS_PHASE_1_27_FINAL_FOUNDATION_READINESS_OK
          REMOTE
