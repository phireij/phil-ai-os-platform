name: Phase 2.1A Mission Control Read-Model Prototype Validation

on:
  push:
    branches: [main]
    paths:
      - 'ops/phase-2.1a/philaios-mission-control-read-model.py'
      - '.github/workflows/phase-2-1a-read-model-prototype-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"
            sleep $((attempt*10))
          done
          exit 1

      - name: Validate prototype without production mutation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          LOCAL_SCRIPT='ops/phase-2.1a/philaios-mission-control-read-model.py'
          REMOTE_SCRIPT='/tmp/philaios-mission-control-read-model-phase21a.py'
          REMOTE_JSON='/tmp/philaios-mission-control-read-model-phase21a.json'

          python3 -m py_compile "$LOCAL_SCRIPT"
          scp -P "$PORT" -q "$LOCAL_SCRIPT" "$VPS_USER@$VPS_HOST:$REMOTE_SCRIPT"

          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" "REMOTE_SCRIPT='$REMOTE_SCRIPT' REMOTE_JSON='$REMOTE_JSON' bash -s" <<'REMOTE'
          set -euo pipefail
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api')
          DB=/app/state/control-plane.db

          BEFORE="$(docker exec "$CONTROL" python -c "import sqlite3,json; c=sqlite3.connect('$DB'); print(json.dumps({'approvals':c.execute('select count(*) from approval_requests').fetchone()[0],'audits':c.execute('select count(*) from execution_audit').fetchone()[0]},sort_keys=True))")"

          python3 "$REMOTE_SCRIPT" > "$REMOTE_JSON"

          python3 - "$REMOTE_JSON" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p))
          assert d['schema_version']=='2.1a.v1', d
          assert d['overall_state'] in {'healthy','degraded','contained','unknown'}, d
          assert d['governance']['execution_allowed_task_classes']==['general'], d['governance']
          assert d['governance']['direct_provider_bypass_allowed'] is False, d['governance']
          assert d['governance']['authority_expansion_state']=='blocked', d['governance']
          assert d['recovery']['monitoring_independent_of_ui'] is True, d['recovery']
          agents={a['agent_id']:a for a in d['agents']}
          assert {'human-ceo','cto-office','hermes'} <= set(agents), agents
          assert agents['hermes']['can_self_approve'] is False, agents['hermes']
          text=json.dumps(d).lower()
          for forbidden in ['authorization: bearer','telegram_bot_token','openai_api_key','private_key']:
              assert forbidden not in text, forbidden
          print('aggregate_schema=valid')
          print('general_only=preserved')
          print('declared_agents=present')
          print('secret_redaction_contract=passed')
          PY

          AFTER="$(docker exec "$CONTROL" python -c "import sqlite3,json; c=sqlite3.connect('$DB'); print(json.dumps({'approvals':c.execute('select count(*) from approval_requests').fetchone()[0],'audits':c.execute('select count(*) from execution_audit').fetchone()[0]},sort_keys=True))")"
          test "$BEFORE" = "$AFTER"

          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer

          rm -f "$REMOTE_SCRIPT" "$REMOTE_JSON"

          echo approval_and_audit_counts_unchanged=true
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_2_1A_READ_MODEL_PROTOTYPE_OK
          REMOTE
