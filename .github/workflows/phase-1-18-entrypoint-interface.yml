name: Phase 1.18 Entrypoint Interface
on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-entrypoint-interface-trigger'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only entrypoint interface discovery
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          test -n "$HERMES"
          ENTRY_EXISTS=$(docker exec "$HERMES" sh -lc 'test -f /entrypoint.sh && echo yes || echo no')
          ENTRY_EXEC=$(docker exec "$HERMES" sh -lc "grep -E '^[[:space:]]*(exec|python|python3|uv|hermes|node|bash|sh)[[:space:]]' /entrypoint.sh 2>/dev/null | tail -n 1 | sed -E 's/[[:space:]]+/ /g' | cut -c1-140" || true)
          DATA_CONFIGS=$(docker exec "$HERMES" sh -lc "find /opt/data -maxdepth 2 -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' -o -name '*.toml' -o -name '*.ini' -o -name '*.conf' \) -printf '%f\n' 2>/dev/null | sort -u | head -n 12 | paste -sd, -" || true)
          PHIL_REFS=$(docker exec "$HERMES" sh -lc "grep -RIl 'PHIL_AI_OS_CONTROL_API\|philaios-execute' /opt/data 2>/dev/null | wc -l" | tr -d ' ')
          echo '=== PHASE 1.18 ENTRYPOINT INTERFACE ==='
          echo "entrypoint_present=$ENTRY_EXISTS"
          echo "entrypoint_launch=${ENTRY_EXEC:-not_detected}"
          echo "data_config_names=${DATA_CONFIGS:-none}"
          echo "opt_data_control_refs=$PHIL_REFS"
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo PHIL_AI_OS_PHASE_1_18_ENTRYPOINT_INTERFACE_OK
          REMOTE
