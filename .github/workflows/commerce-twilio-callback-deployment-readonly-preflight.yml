name: Twilio Callback Deployment Read-Only Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commerce-twilio-callback-deployment-readonly-preflight.yml'
      - '.github/commerce-twilio-callback-deployment-readonly-preflight-trigger'

permissions:
  contents: read

concurrency:
  group: commerce-twilio-callback-deployment-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      RUBY_TWILIO_AUTH_TOKEN: ${{ secrets.RUBY_TWILIO_AUTH_TOKEN }}
      RUBY_TWILIO_STATUS_CALLBACK_URL: ${{ secrets.RUBY_TWILIO_STATUS_CALLBACK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify local deployment inputs without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          if test -n "$RUBY_TWILIO_AUTH_TOKEN"; then
            echo twilio_auth_token_secret_present=true
          else
            echo twilio_auth_token_secret_present=false
          fi
          if test -n "$RUBY_TWILIO_STATUS_CALLBACK_URL"; then
            python - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ['RUBY_TWILIO_STATUS_CALLBACK_URL']
          parsed = urlsplit(value)
          valid = (
              parsed.scheme == 'https'
              and bool(parsed.netloc)
              and parsed.path == '/v1/webhooks/twilio/sms-status'
              and not parsed.fragment
          )
          print('twilio_status_callback_url_secret_present=true')
          print(f'twilio_status_callback_url_shape_valid={str(valid).lower()}')
          if not valid:
              raise SystemExit('configured callback URL does not match the canonical HTTPS contract')
          PY
          else
            echo twilio_status_callback_url_secret_present=false
            echo twilio_status_callback_url_shape_valid=false
          fi
          echo secret_values_printed=false
          echo mutation=false
          echo sms_send=false

      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then
                rm -f "$TMP"
                exit 0
              fi
            fi
            rm -f "$TMP"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Inspect exact callback deployment target without mutation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo '--- callback deployment target ---'
          TRAEFIK_IDS="$(docker ps --filter name=traefik --format '{{.ID}}')"
          TRAEFIK_COUNT="$(printf '%s\n' "$TRAEFIK_IDS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo traefik_candidate_count="$TRAEFIK_COUNT"
          test "$TRAEFIK_COUNT" -eq 1
          TRAEFIK_CID="$(printf '%s\n' "$TRAEFIK_IDS" | sed '/^$/d')"
          echo traefik_container="$(docker inspect "$TRAEFIK_CID" --format '{{.Name}}' | sed 's#^/##')"
          echo traefik_network_mode="$(docker inspect "$TRAEFIK_CID" --format '{{.HostConfig.NetworkMode}}')"

          CONTROL_ROWS="$(docker ps --format '{{.ID}}|{{.Names}}|{{.Image}}' | awk 'BEGIN{IGNORECASE=1} /control[-_]?api|control.*api|phil.*control/')"
          CONTROL_COUNT="$(printf '%s\n' "$CONTROL_ROWS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo control_api_name_match_count="$CONTROL_COUNT"
          test "$CONTROL_COUNT" -ge 1

          PRIMARY_ROWS="$(printf '%s\n' "$CONTROL_ROWS" | awk -F'|' '$3 ~ /^phil-ai-os\/control-api:/')"
          PRIMARY_COUNT="$(printf '%s\n' "$PRIMARY_ROWS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo primary_control_api_image_match_count="$PRIMARY_COUNT"
          test "$PRIMARY_COUNT" -eq 1
          IFS='|' read -r CONTROL_CID CONTROL_NAME CONTROL_IMAGE <<EOF
          $(printf '%s\n' "$PRIMARY_ROWS" | sed '/^$/d')
          EOF
          echo control_api_selection=exact_phil_ai_os_control_api_image
          echo control_api_container="$CONTROL_NAME"
          echo control_api_image="$CONTROL_IMAGE"
          echo control_api_compose_service="$(docker inspect "$CONTROL_CID" --format '{{index .Config.Labels "com.docker.compose.service"}}')"
          echo control_api_compose_working_dir="$(docker inspect "$CONTROL_CID" --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')"
          echo control_api_compose_config_files="$(docker inspect "$CONTROL_CID" --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}')"
          echo control_api_entrypoint="$(docker inspect "$CONTROL_CID" --format '{{json .Config.Entrypoint}}')"
          echo control_api_cmd="$(docker inspect "$CONTROL_CID" --format '{{json .Config.Cmd}}')"
          echo control_api_restart_policy="$(docker inspect "$CONTROL_CID" --format '{{.HostConfig.RestartPolicy.Name}}')"
          echo control_api_mounts_begin
          docker inspect "$CONTROL_CID" --format '{{range .Mounts}}{{printf "%s|%s|%s|%t\n" .Type .Source .Destination .RW}}{{end}}'
          echo control_api_mounts_end

          echo control_api_env_keys_begin
          docker inspect "$CONTROL_CID" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed 's/=.*$//' | sort -u
          echo control_api_env_keys_end

          HEALTH_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 5 http://127.0.0.1:4870/healthz || true)"
          echo control_api_local_health_http_code="${HEALTH_CODE:-unreachable}"
          test "$HEALTH_CODE" = 200

          echo '--- current ingress shape ---'
          LABELS="$(docker inspect "$CONTROL_CID" --format '{{range $k,$v := .Config.Labels}}{{printf "%s=%s\n" $k $v}}{{end}}')"
          printf '%s\n' "$LABELS" | grep -E '^traefik\.(enable|http\.routers\..*\.(entrypoints|service|tls|tls\.certresolver)|http\.services\..*\.loadbalancer\.server\.port)=' || true
          RULES="$(printf '%s\n' "$LABELS" | grep -E '^traefik\.http\.routers\..*\.rule=' || true)"
          HOSTS="$(printf '%s\n' "$RULES" | grep -oE 'Host\(`[^`]+`\)' | sed -E 's/^Host\(`//; s/`\)$//' | sort -u)"
          HOST_COUNT="$(printf '%s\n' "$HOSTS" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo public_host_candidate_count="$HOST_COUNT"
          if test "$HOST_COUNT" -eq 1; then
            HOST_VALUE="$(printf '%s\n' "$HOSTS" | sed '/^$/d')"
            printf '%s' "$HOST_VALUE" | sha256sum | awk '{print "public_host_sha256=" $1}'
          fi
          echo public_hostname_printed=false
          CALLBACK_RULE_COUNT="$(printf '%s\n' "$RULES" | grep -F '/v1/webhooks/twilio/sms-status' | wc -l | tr -d ' ')"
          echo existing_twilio_callback_router_count="$CALLBACK_RULE_COUNT"

          echo '--- application source/config discovery ---'
          echo callback_contract_occurrences_in_container="$(docker exec "$CONTROL_CID" sh -lc "grep -Rsl -- '/v1/webhooks/twilio/sms-status' /app /opt 2>/dev/null | wc -l | tr -d ' '" || true)"
          echo approval_route_source_candidates_begin
          docker exec "$CONTROL_CID" sh -lc "grep -Rsl -- '/v1/approvals/request' /app /opt 2>/dev/null | head -n 10" || true
          echo approval_route_source_candidates_end

          echo '--- recovery controls ---'
          for unit in phil-ai-os-backup.timer phil-ai-os-backup-self-heal.timer; do
            if systemctl is-active --quiet "$unit"; then
              echo "$unit=active"
            else
              echo "$unit=inactive"
            fi
          done

          echo read_only=true
          echo mutation=false
          echo proxy_restart=false
          echo dns=false
          echo twilio_configuration_mutation=false
          echo sms_send=false
          echo payment_execution=false
          echo woocommerce_mutation=false
          echo PHIL_AI_OS_TWILIO_CALLBACK_DEPLOYMENT_READONLY_PREFLIGHT_OK
          REMOTE

      - name: Assert remote preflight block contains no mutation commands
        shell: bash
        run: |
          set -euo pipefail
          FILE=.github/workflows/commerce-twilio-callback-deployment-readonly-preflight.yml
          sed -n "/<<'REMOTE'/,/^          REMOTE$/p" "$FILE" > /tmp/twilio-callback-preflight-remote.sh
          test -s /tmp/twilio-callback-preflight-remote.sh
          ! grep -E 'docker (restart|rm|stop|kill|cp)|docker compose (up|down|restart)|systemctl (restart|reload|stop|enable|disable)|iptables|ufw |certbot|curl .*-[Xx] *(POST|PUT|PATCH|DELETE)|sed +-i|tee +/|cat +> */|cp +.* /|mv +.* /|rm +-f' /tmp/twilio-callback-preflight-remote.sh
          echo PHIL_AI_OS_TWILIO_CALLBACK_PREFLIGHT_STATIC_NO_MUTATION_GREEN
