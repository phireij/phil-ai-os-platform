name: Phase 2.1I Isolated Planning Validation
on:
  push:
    branches: [main]
    paths: ['.github/phase-2-1i-planning-validation-trigger']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate validator syntax
        run: python3 -m py_compile ops/phase-2.1i/validate-planning-contract.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage validator
        shell: bash
        run: |
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q ops/phase-2.1i/validate-planning-contract.py "$VPS_USER@$VPS_HOST:/tmp/phase21i-planning-validator.py"
      - name: Validate isolated copy only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          COPY=/tmp/phase21i-planning.db
          rm -f "$COPY"
          read A0 E0 L0 < <(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute('pragma quick_check').fetchone()[0]=='ok'; print(c.execute('select count(*) from approval_requests').fetchone()[0],c.execute('select count(*) from execution_audit').fetchone()[0],c.execute('select count(*) from task_lifecycle_events').fetchone()[0])")
          docker exec "$CONTROL" python3 -c "import sqlite3; s=sqlite3.connect('/app/state/control-plane.db'); d=sqlite3.connect('/tmp/phase21i-planning-copy.db'); s.backup(d); d.close(); s.close()"
          docker cp "$CONTROL:/tmp/phase21i-planning-copy.db" "$COPY"
          python3 /tmp/phase21i-planning-validator.py "$COPY" | tee /tmp/phase21i-planning.log
          grep -q 'PHIL_AI_OS_PHASE_2_1I_ISOLATED_PLANNING_CONTRACT_OK' /tmp/phase21i-planning.log
          docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute('pragma quick_check').fetchone()[0]=='ok'; assert c.execute('select count(*) from approval_requests').fetchone()[0]==$A0; assert c.execute('select count(*) from execution_audit').fetchone()[0]==$E0; assert c.execute('select count(*) from task_lifecycle_events').fetchone()[0]==$L0; assert c.execute(\"select count(*) from sqlite_master where type='table' and name='task_plans'\").fetchone()[0]==0"
          rm -f "$COPY" /tmp/phase21i-planning-validator.py /tmp/phase21i-planning.log
          echo live_task_plans=absent
          echo live_counts_unchanged=true
          echo production_change=none
          echo execution_call=none
          echo provider_call=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1I_ISOLATED_PLANNING_LIVE_BOUNDARY_OK
          REMOTE
