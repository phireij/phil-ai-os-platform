name: Phase 2.3 P1 Approval Policy Discovery

on:
  push:
    paths:
      - '.github/workflows/phase-2-3-p1-approval-policy-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure IPv4 SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4 5 6; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1

      - name: Read-only approval and policy discovery
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee phase-2-3-p1-discovery.txt
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -n "$CONTROL"

          echo '=== baseline ==='
          echo control_api_image="$(docker inspect "$CONTROL" --format '{{.Config.Image}}')"
          echo control_api_app_sha256="$(docker exec "$CONTROL" sha256sum /app/app.py | awk '{print $1}')"
          echo execution_allowlist="$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')"
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null && echo control_health=ok
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null && echo control_ready=ok
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 200 && echo mission_control_read_model=200
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done
          echo mission_control_mutations=405

          echo '=== durable schema inventory ==='
          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          tables=[r[0] for r in c.execute("select name from sqlite_master where type='table' order by name")]
          print('tables='+json.dumps(tables,separators=(',',':')))
          for t in tables:
              low=t.lower()
              if any(k in low for k in ('approval','policy','audit','execution','usage','route','task','agent','notification','outbox')):
                  cols=[dict(r) for r in c.execute(f'pragma table_info({t})')]
                  safe=[{'name':r['name'],'type':r['type'],'notnull':r['notnull'],'pk':r['pk']} for r in cols]
                  print('columns.'+t+'='+json.dumps(safe,sort_keys=True,separators=(',',':')))
                  print('count.'+t+'='+str(c.execute(f'select count(*) from {t}').fetchone()[0]))
          for t in ('approval_requests','execution_audit','task_lifecycle_events','task_plans','agent_registry','task_handoffs'):
              if t in tables:
                  idx=[dict(r) for r in c.execute(f'pragma index_list({t})')]
                  print('indexes.'+t+'='+json.dumps(idx,sort_keys=True,separators=(',',':')))
          if 'approval_requests' in tables:
              print('approval_states='+json.dumps([list(r) for r in c.execute('select state,count(*) from approval_requests group by state order by state')],separators=(',',':')))
              print('approval_task_classes='+json.dumps([list(r) for r in c.execute('select task_class,count(*) from approval_requests group by task_class order by task_class')],separators=(',',':')))
              print('approval_consumption_summary='+json.dumps({
                  'consumed':c.execute('select count(*) from approval_requests where consumed_at is not null or consumed_by is not null').fetchone()[0],
                  'unconsumed':c.execute('select count(*) from approval_requests where consumed_at is null and consumed_by is null').fetchone()[0],
              },sort_keys=True,separators=(',',':')))
          if 'execution_audit' in tables:
              print('execution_outcomes='+json.dumps([list(r) for r in c.execute('select outcome,count(*) from execution_audit group by outcome order by outcome')],separators=(',',':')))
          print('registry='+json.dumps([dict(r) for r in c.execute('select agent_id,role,authority_ceiling,enabled,assignable,source_component from agent_registry order by agent_id')],sort_keys=True,separators=(',',':')))
          print('quick_check=ok')
          PY

          echo '=== source approval / policy / execution anchors ==='
          docker exec "$CONTROL" sh -lc "grep -nE 'def (approval|execute|classify|route|coordinator)|/v1/approvals|/v1/execute|consumed_at|consumed_by|kill|KILL|ALLOWED_TASK_CLASSES|task_class|approval_state|approval_id|execution_audit|usage_ledger|policy' /app/app.py | head -n 260" || true

          echo '=== source function inventory ==='
          docker exec -i "$CONTROL" python3 - <<'PY'
          import ast,json
          src=open('/app/app.py','r',encoding='utf-8').read(); tree=ast.parse(src)
          names=[]
          for n in ast.walk(tree):
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                  low=n.name.lower()
                  if any(k in low for k in ('approval','execute','route','classif','policy','audit','usage','coordinator')):
                      names.append({'name':n.name,'line':n.lineno})
          print(json.dumps(sorted(names,key=lambda x:x['line']),separators=(',',':')))
          PY

          echo '=== relevant environment controls: names only except approved public-safe scope ==='
          docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '
            /PHIL_AI_OS_/ {
              key=$1;
              if (key=="PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES") print key"="substr($0,index($0,"=")+1);
              else if (key ~ /(LIVE|EXECUTION|ROUTED|KILL|APPROVAL|POLICY|LIMIT|MAX|PROVIDER|MODEL)/) print key"=<present>";
            }' | sort -u

          echo '=== config/policy files: metadata only ==='
          for dir in /app/config /opt/phil-ai-os-platform/phil-ai-os-platform-phase1/services/core/control-api/config /opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core/runtime/state; do
            echo dir="$dir"
            if [ -d "$dir" ]; then
              find "$dir" -maxdepth 2 -type f -printf '%m %u:%g %s %p\n' 2>/dev/null | sort | sed -n '1,160p'
            fi
          done

          echo '=== notification / approval delivery surfaces ==='
          systemctl list-unit-files --type=service --type=timer --no-legend | grep -Ei 'approval|telegram|notification|outbox|dispatcher' | head -n 120 || true
          ps -ef | grep -Ei '[a]pproval|[t]elegram|[n]otification|[o]utbox|[d]ispatcher' | head -n 120 || true

          echo '=== mission control approval/policy projection anchors ==='
          grep -nEi 'approval|policy|risk|authority|execution|handoff|readiness' /opt/phil-ai-os/mission-control/read-model.py | head -n 180 || true

          echo '=== authentication boundary probes: no body/state ==='
          for path in /v1/approvals/request /v1/approvals/approve /v1/approvals/deny /v1/execute; do
            code="$(curl -sS -X POST -H 'Content-Type: application/json' -d '{}' -o /dev/null -w '%{http_code}' "http://127.0.0.1:4870$path")"
            echo "unauth_${path}=$code"
          done

          echo '=== operational safety ==='
          for unit in phil-ai-os-monitor.service phil-ai-os-backup.timer phil-ai-os-backup-self-heal.timer phil-ai-os-agent-heartbeat.timer phil-ai-os-specialist-worker-01-presence.timer; do
            systemctl is-active --quiet "$unit"
            echo "$unit=active"
          done
          echo backup_last_result="$(systemctl show -p Result --value phil-ai-os-backup.service)"
          echo backup_self_heal_last_result="$(systemctl show -p Result --value phil-ai-os-backup-self-heal.service)"
          echo production_change=none
          echo PHIL_AI_OS_PHASE_2_3_P1_APPROVAL_POLICY_DISCOVERY_OK
          REMOTE

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-3-p1-approval-policy-discovery-evidence
          path: phase-2-3-p1-discovery.txt
          if-no-files-found: warn
          retention-days: 30
