name: Phase 1.18 Gateway Readiness
on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-gateway-readiness-trigger'
      - '.github/workflows/phase-1-18-gateway-readiness.yml'
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only gateway readiness classification
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          test -n "$HERMES"
          docker exec -i "$HERMES" python3 - <<'PY'
          import pathlib
          p=pathlib.Path('/opt/data/config.yaml')
          text=p.read_text(errors='replace') if p.exists() else ''
          def scalar(name):
              for raw in text.splitlines():
                  s=raw.strip()
                  if s.startswith(name+':'):
                      return s.split(':',1)[1].strip() or 'empty'
              return 'not_set'
          print('=== PHASE 1.18 GATEWAY READINESS ===')
          print('use_gateway='+scalar('use_gateway'))
          print('provider='+scalar('provider'))
          print('cloud_provider='+scalar('cloud_provider'))
          print('model_configured='+('yes' if scalar('model') not in ('not_set','empty') else 'no'))
          print('gateway_state_file='+('present' if pathlib.Path('/opt/data/gateway_state.json').exists() else 'missing'))
          print('gateway_lifecycle_file='+('present' if pathlib.Path('/opt/data/gateway.lifecycle.json').exists() else 'missing'))
          PY
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo PHIL_AI_OS_PHASE_1_18_GATEWAY_READINESS_OK
          REMOTE
