name: Phase 1.18 Routed Execution Audit Verification

on:
  push:
    branches: [ops/phase-1.18-policy-boundary]
    paths: ['.github/workflows/phase-1-18-execution-audit-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Verify execution audit trail
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api' || true)
          test -n "$CONTROL"
          echo '=== PHASE 1.18 ROUTED EXECUTION AUDIT VERIFICATION ==='
          docker exec "$CONTROL" test -s /app/state/control-plane.db
          docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print('tables='+','.join(r[0] for r in c.execute(\"select name from sqlite_master where type='table' order by name\")))"
          FOUND=0
          for T in execution_audit execution_audit_log execution_events audit_log; do
            if docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); cols=[r[1] for r in c.execute('pragma table_info($T)')]; assert cols; print('audit_table=$T'); print('audit_columns='+','.join(cols)); rows=c.execute('select * from $T order by rowid desc limit 3').fetchall(); print('audit_recent_count='+str(len(rows))); print('audit_latest='+repr(rows[0])[:700] if rows else 'audit_latest=none')" 2>/dev/null; then
              FOUND=1
              break
            fi
          done
          echo "audit_table_found=$FOUND"
          echo "runtime_routed=$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^PHIL_AI_OS_ROUTED_EXECUTION_ENABLED=' | head -1)"
          echo "runtime_kill_switch=$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=' | head -1)"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo 'backup_self_heal_timer=active'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo 'provider_call=none'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_18_ROUTED_EXECUTION_AUDIT_VERIFICATION_OK
          REMOTE
