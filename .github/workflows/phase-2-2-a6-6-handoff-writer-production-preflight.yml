name: Phase 2.2 A6.6 Handoff Writer Production Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-2-a6-6-handoff-writer-production-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure direct SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4; do
            if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Run read-only A6.6 production preflight
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee phase22-a6-6-evidence.txt
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -n "$CONTROL"

          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done

          echo control_api_container="$CONTROL"
          echo control_api_image="$(docker inspect -f '{{.Config.Image}}' "$CONTROL")"
          echo control_api_image_id="$(docker inspect -f '{{.Image}}' "$CONTROL")"
          echo compose_project="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$CONTROL")"
          echo compose_service="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$CONTROL")"
          echo compose_config_files="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "$CONTROL")"
          echo compose_working_dir="$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$CONTROL")"

          # Probe likely historical coordinator paths without credentials. Security invariant: none may succeed.
          for path in /internal/coordinator/assign /v1/coordinator/assign /internal/coordinator/plan /v1/coordinator/plan; do
            code="$(curl -sS -o /tmp/a66-probe.out -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "http://127.0.0.1:4870${path}")"
            echo "unauth_probe_${path//\//_}=${code}"
            case "$code" in 2*|3*) echo "unauthenticated coordinator probe unexpectedly succeeded" >&2; exit 1;; esac
          done
          rm -f /tmp/a66-probe.out
          echo coordinator_unauthenticated_success=false

          # Discover the actual authoritative coordinator source/route shape rather than assuming a stale path spelling.
          docker exec -i "$CONTROL" python3 - <<'PY'
          import pathlib,hashlib,json,re
          files=[]; handoff=[]
          route_literal=re.compile(r'''["'](/[^"']*coordinator[^"']*)["']''',re.I)
          for p in pathlib.Path('/app').rglob('*.py'):
              try: b=p.read_bytes(); t=b.decode('utf-8','ignore')
              except Exception: continue
              lo=t.lower()
              routes=sorted(set(route_literal.findall(t)))
              coord_signal=('coordinator' in lo and ('assign' in lo or 'plan' in lo) and ('agent_registry' in lo or 'task_lifecycle_events' in lo or 'lifecycle_event_insert' in lo))
              if coord_signal:
                  files.append({
                    'path':str(p),
                    'sha256':hashlib.sha256(b).hexdigest(),
                    'routes':routes,
                    'assign_signal':'assign' in lo,
                    'plan_signal':'plan' in lo,
                    'auth_signal':bool(re.search(r'Authorization|Bearer|token|auth',t,re.I)),
                    'registry_signal':'agent_registry' in lo,
                    'lifecycle_signal':'task_lifecycle_events' in lo or 'lifecycle_event_insert' in lo,
                  })
              if 'handoff' in lo: handoff.append(str(p))
          assert files, 'coordinator source not found'
          assert any(x['assign_signal'] for x in files)
          assert any(x['plan_signal'] for x in files)
          assert any(x['auth_signal'] for x in files)
          assert any(x['registry_signal'] for x in files)
          assert any(x['lifecycle_signal'] for x in files)
          print('coordinator_source='+json.dumps(files,separators=(',',':')))
          print('existing_handoff_code_files='+json.dumps(handoff,separators=(',',':')))
          print('existing_handoff_code_file_count='+str(len(handoff)))
          PY

          # Production DB remains read-only; candidate schema is proven only on an ephemeral copied DB.
          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,os,json
          uri='file:/app/state/control-plane.db?mode=ro'
          src=sqlite3.connect(uri,uri=True); src.row_factory=sqlite3.Row
          assert src.execute('pragma quick_check').fetchone()[0]=='ok'
          tables=[r[0] for r in src.execute("select name from sqlite_master where type='table' order by name")]
          assert 'task_handoffs' not in tables
          reg=[dict(r) for r in src.execute('select * from agent_registry order by agent_id')]
          assert len(reg)==2
          h=next(r for r in reg if r['agent_id']=='hermes')
          s=next(r for r in reg if r['agent_id']=='specialist-worker-01')
          assert h['authority_ceiling']=='L3' and int(h['enabled'])==1 and int(h['assignable'])==1
          assert s['authority_ceiling']=='L1' and int(s['enabled'])==0 and int(s['assignable'])==0
          tracked=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit']
          base={t:src.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}
          assert src.execute("select count(*) from task_lifecycle_events where assigned_agent_id='specialist-worker-01'").fetchone()[0]==0
          print('production_registry='+json.dumps(reg,separators=(',',':'),default=str))
          print('production_baseline_counts='+json.dumps(base,separators=(',',':')))
          print('specialist_assignment_refs=0')

          cp='/tmp/phase22-a6-6-copy.db'
          try: os.remove(cp)
          except FileNotFoundError: pass
          dst=sqlite3.connect(cp); src.backup(dst); dst.row_factory=sqlite3.Row
          assert dst.execute('pragma quick_check').fetchone()[0]=='ok'
          assert {t:dst.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}==base
          dst.executescript('''
          create table task_handoffs(
            handoff_id text primary key,
            handoff_version text not null,
            task_id text not null,
            source_agent_id text not null,
            target_agent_id text not null,
            task_class text not null,
            required_authority text not null,
            source_authority_ceiling text not null,
            target_authority_ceiling text not null,
            reason_code text not null,
            correlation_id text not null unique,
            requested_by text not null,
            requested_at text not null,
            expires_at text not null,
            handoff_approval_required integer not null,
            handoff_approval_state text not null,
            execution_approval_state text,
            source_readiness text,
            target_readiness text,
            state text not null,
            decided_by text,
            decided_at text,
            containment_reason text,
            lifecycle_event_id text unique
          );
          create index idx_task_handoffs_task_time on task_handoffs(task_id,requested_at,handoff_id);
          create index idx_task_handoffs_state_expiry on task_handoffs(state,expires_at);
          ''')
          assert dst.execute('pragma quick_check').fetchone()[0]=='ok'
          assert {t:dst.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}==base
          assert dst.execute('select count(*) from task_handoffs').fetchone()[0]==0
          ss=dst.execute("select enabled,assignable,authority_ceiling from agent_registry where agent_id='specialist-worker-01'").fetchone()
          assert int(ss['enabled'])==0 and int(ss['assignable'])==0 and ss['authority_ceiling']=='L1'
          print('candidate_schema_additive=true')
          print('candidate_handoff_rows=0')
          print('candidate_specialist_remains_disabled=true')
          print('candidate_specialist_remains_nonassignable=true')
          dst.close(); src.close(); os.remove(cp)

          v=sqlite3.connect(uri,uri=True)
          assert v.execute('pragma quick_check').fetchone()[0]=='ok'
          assert {t:v.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}==base
          assert v.execute("select count(*) from sqlite_master where type='table' and name='task_handoffs'").fetchone()[0]==0
          v.close()
          print('production_counts_unchanged=true')
          print('production_handoff_table_created=false')
          PY

          echo a6_7_minimum_db_delta=additive_task_handoffs_table_and_indexes
          echo a6_7_minimum_app_delta=control_api_coordinator_handoff_routes_only
          echo a6_7_new_service_required=false
          echo a6_7_mission_control_change_required=false
          echo a6_7_registry_change_required=false
          echo a6_7_lifecycle_activation_write_required=false
          echo a6_7_handoff_row_activation_write_required=false
          echo a6_7_specialist_must_remain_disabled=true
          echo a6_7_specialist_must_remain_nonassignable=true
          echo a6_7_accept_to_specialist_must_fail_closed=true
          echo a6_7_rollback_requires_prechange_db_backup=true
          echo a6_7_rollback_requires_previous_control_api_image=true
          echo control_api_health=green
          echo control_api_readiness=green
          echo execution_allowlist=general
          echo mission_control_mutations=405
          echo production_change=none
          echo schema_mutation_production=none
          echo registry_mutation=none
          echo lifecycle_mutation=none
          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_2_A6_6_HANDOFF_WRITER_PREFLIGHT_OK
          REMOTE
      - name: Upload A6.6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-2-a6-6-handoff-writer-production-preflight-evidence
          path: phase22-a6-6-evidence.txt
          if-no-files-found: error
          retention-days: 14
