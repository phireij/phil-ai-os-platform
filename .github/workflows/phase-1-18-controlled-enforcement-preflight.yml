name: Phase 1.18 Controlled Enforcement Preflight
on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-controlled-enforcement-preflight-trigger'
      - '.github/workflows/phase-1-18-controlled-enforcement-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Controlled enforcement preflight
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          test -n "$HERMES"
          EXEC=/usr/local/bin/philaios-execute
          TOKEN=/run/philaios/hermes_control_api_token
          WRAPPER=/opt/hermes/docker/main-wrapper.sh
          CONFIG=/opt/data/config.yaml
          echo '=== PHASE 1.18 CONTROLLED ENFORCEMENT PREFLIGHT ==='
          echo "hermes=found"
          echo "philaios_execute=$([ -x "$EXEC" ] && echo executable || echo missing)"
          echo "control_token_mount=$([ -s "$TOKEN" ] && echo present || echo missing)"
          echo "wrapper_present=$([ -f "$WRAPPER" ] && echo yes || echo no)"
          echo "config_present=$([ -f "$CONFIG" ] && echo yes || echo no)"
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          echo "backup_timer=$(systemctl is-active phil-ai-os-backup.timer || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_18_CONTROLLED_ENFORCEMENT_PREFLIGHT_OK
          REMOTE
