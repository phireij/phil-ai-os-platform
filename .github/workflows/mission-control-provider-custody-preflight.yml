name: Mission Control Provider Custody Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-control-google-identity-deploy
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Verify provider-input custody without provider configuration or dispatch
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          port="${VPS_PORT:-22}"
          remote="$VPS_USER@$VPS_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          opts=(-4 -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=accept-new)
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -uo pipefail
          session=phil-ai-os-mission-control-google-ceo-session
          session_present=false
          session_running=false
          session_image_verified=false
          secret_volume_verified=false
          provider_environment_absent=false
          dispatch_disabled=false
          provider_secret_custody=false
          if docker inspect "$session" >/dev/null 2>&1; then
            session_present=true
            [[ "$(docker inspect "$session" --format '{{.State.Running}}')" == true ]] && session_running=true
            image="$(docker inspect "$session" --format '{{.Config.Image}}')"
            secret_volume="$(docker inspect "$session" --format '{{range .Mounts}}{{if eq .Destination "/run/secrets"}}{{.Name}}{{end}}{{end}}')"
            active_env="$(docker inspect "$session" --format '{{range .Config.Env}}{{println .}}{{end}}')"
            [[ "$image" =~ ^ghcr\.io/phireij/phil-ai-os-platform/mission-control-google-ceo-session@sha256:[0-9a-f]{64}$ ]] && session_image_verified=true
            [[ "$secret_volume" =~ ^phil-ai-os-mc-google-session-secret-[0-9]+-[0-9]+$ ]] && secret_volume_verified=true
            if ! grep -q '^MISSION_CONTROL_OPENAI_' <<<"$active_env"; then provider_environment_absent=true; fi
            if ! grep -Fx 'MISSION_CONTROL_OPENAI_DISPATCH_ENABLED=true' <<<"$active_env" >/dev/null; then dispatch_disabled=true; fi
            if [[ "$session_image_verified" == true && "$secret_volume_verified" == true ]]; then
              if docker run --rm --network none --user 0:0 --read-only --cap-drop ALL --security-opt no-new-privileges:true \
                --mount "type=volume,src=$secret_volume,dst=/run/secrets,readonly" \
                --entrypoint /bin/sh "$image" \
                -c 'test "$(stat -c "%a" /run/secrets/openai)" = "1733" && test "$(stat -c "%u:%a" /run/secrets/openai/api_key)" = "10003:400" && test "$(stat -c "%u:%a" /run/secrets/openai/policy.json)" = "10003:400" && test -s /run/secrets/openai/api_key && test -s /run/secrets/openai/policy.json'; then
                provider_secret_custody=true
              fi
            fi
          fi
          echo "mc010_provider_custody_preflight session_present=$session_present session_running=$session_running session_image_verified=$session_image_verified secret_volume_verified=$secret_volume_verified provider_environment_absent=$provider_environment_absent dispatch_disabled=$dispatch_disabled provider_secret_custody=$provider_secret_custody content_accessed=false provider_worker_started=false provider_request_made=false authority_effect=none"
          test "$session_present" = true && test "$session_running" = true && test "$session_image_verified" = true && test "$secret_volume_verified" = true && test "$provider_environment_absent" = true && test "$dispatch_disabled" = true && test "$provider_secret_custody" = true
          REMOTE
