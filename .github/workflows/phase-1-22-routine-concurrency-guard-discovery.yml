name: Phase 1.22 Routine Concurrency Guard Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-22-routine-concurrency-guard-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3; do
            echo "ssh_preflight_attempt=$attempt"
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then
              echo ssh_preflight=ok
              exit 0
            fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Discover routine concurrency guard surface
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.22 ROUTINE CONCURRENCY GUARD DISCOVERY ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo control_api_health=ok

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          ! grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=.*routine' <<<"$ENV"
          echo production_allowlist=general_only

          echo '--- concurrency-related environment ---'
          printf '%s\n' "$ENV" | grep -Ei 'CONCURRENC|SEMAPHORE|LOCK|SINGLE|EXECUTION_ALLOWED_TASK_CLASSES|ROUTED' | sort || true

          echo '--- execution implementation candidates ---'
          docker exec "$CONTROL" sh -lc 'find /app -maxdepth 4 -type f 2>/dev/null | sort | head -n 400' || true

          echo '--- routed execution and concurrency signals ---'
          docker exec "$CONTROL" sh -lc 'grep -RniE "routed_execute|def .*execute|/v1/execute|concurr|semaphore|asyncio.Lock|threading.Lock|flock|filelock|single.?flight|in.?flight|busy|already.*running|execution.*lock" /app 2>/dev/null | head -n 500' || true

          echo '--- source context around routed_execute ---'
          docker exec "$CONTROL" python - <<'PY'
          import os
          needles=('routed_execute','/v1/execute')
          for root, _, files in os.walk('/app'):
              for fn in files:
                  if not fn.endswith(('.py','.sh','.yml','.yaml','.json','.toml')): continue
                  p=os.path.join(root,fn)
                  try: lines=open(p,encoding='utf-8',errors='replace').read().splitlines()
                  except Exception: continue
                  hits=[i for i,l in enumerate(lines) if any(n in l for n in needles)]
                  for i in hits:
                      print(f'FILE={p} LINE={i+1}')
                      for j in range(max(0,i-20),min(len(lines),i+81)):
                          print(f'{j+1:05d}: {lines[j]}')
          PY

          echo '--- process/server topology ---'
          docker inspect "$CONTROL" --format 'entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}} restart={{.HostConfig.RestartPolicy.Name}}'
          docker exec "$CONTROL" sh -lc 'ps -ef || true'
          docker exec "$CONTROL" sh -lc 'python - <<"PY"
          import os
          for k,v in sorted(os.environ.items()):
              if any(x in k.upper() for x in ("WORKER","WEB_CONCURRENCY","UVICORN","GUNICORN")):
                  print(f"{k}={v}")
          PY' || true

          echo '--- durable execution schema for possible atomic guard ---'
          docker exec "$CONTROL" python - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/state/control-plane.db')
          for name, sql in con.execute("select name, sql from sqlite_master where type='table' order by name"):
              if any(k in name.lower() for k in ('execution','approval','lock','lease','job','task')):
                  print('TABLE='+name)
                  print(sql or '')
                  for row in con.execute(f'pragma index_list("{name}")'):
                      print('INDEX='+str(row))
          PY

          echo provider_call=none
          echo production_change=none
          echo routine_activation=false
          echo discovery_mode=read_only
          echo next_action=PHASE_1_22_CONCURRENCY_GUARD_DESIGN
          echo PHIL_AI_OS_PHASE_1_22_ROUTINE_CONCURRENCY_GUARD_DISCOVERY_OK
          REMOTE