name: Mission Control Gateway Immutable Image

on:
  push:
    branches:
      - main
      - codex/mission-control-readonly-deploy
    paths:
      - Dockerfile.mission-control-gateway
      - apps/operations-hub/src/operations_hub/mission_control_control_plane.py
      - apps/operations-hub/src/operations_hub/__init__.py
      - ops/mission-control-public/control-plane-gateway.py
      - ops/mission-control-public/activate-gateway.sh
      - .github/workflows/mission-control-gateway-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/${{ github.repository }}/mission-control-gateway
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable gateway image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.mission-control-gateway \
            --tag "$IMAGE:${GITHUB_SHA}" \
            --push \
            --provenance=true \
            --sbom=true \
            .
          digest="$(docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        run: |
          echo "Published $IMAGE@${{ steps.image.outputs.digest }}"
          echo "The gateway image is published only; Hostinger deployment remains separately gated by CEO authentication and routing configuration."
