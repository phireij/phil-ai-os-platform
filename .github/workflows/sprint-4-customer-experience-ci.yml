name: Sprint 4 Customer Experience CI

on:
  pull_request:
    paths:
      - "apps/customer-experience/**"
      - "contracts/cx/**"
      - "docs/SPRINT_4_**"
      - ".github/workflows/sprint-4-customer-experience-ci.yml"
  push:
    branches:
      - "sprint4/**"
    paths:
      - "apps/customer-experience/**"
      - "contracts/cx/**"
      - "docs/SPRINT_4_**"
      - ".github/workflows/sprint-4-customer-experience-ci.yml"

permissions:
  contents: read

jobs:
  cx-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        run: |
          node --check apps/customer-experience/src/core.mjs
          node --check apps/customer-experience/src/cart.mjs
          node --check apps/customer-experience/src/cart-preview.mjs
          node --check apps/customer-experience/src/cart-selection-continuity.mjs
          node --check apps/customer-experience/src/cart-mobile-controls.mjs
          node --check apps/customer-experience/src/cart-locale-state.mjs
          node --check apps/customer-experience/src/fulfillment-choice.mjs
          node --check apps/customer-experience/src/cart-form-guard.mjs
          node --check apps/customer-experience/src/checkout-confidence.mjs
          node --check apps/customer-experience/src/confirmation-preview.mjs
          node --check apps/customer-experience/src/flow.mjs
          node --check apps/customer-experience/src/locale-links.mjs
          node --check apps/customer-experience/src/mobile-ux.mjs
          node --check apps/customer-experience/src/product-browse-ux.mjs
          node --check apps/customer-experience/src/payment.mjs
          node --check apps/customer-experience/src/pickup.mjs
          node --check apps/customer-experience/src/quick-pickup-preview.mjs
          node --check apps/customer-experience/src/readiness-feedback.mjs
          node --check apps/customer-experience/src/seo.mjs
          node --check apps/customer-experience/src/ui-state.mjs
          node --check apps/customer-experience/src/app.mjs
          node --check apps/customer-experience/sw.js

      - name: Run isolated CX unit tests
        run: node --test apps/customer-experience/tests/*.test.mjs

      - name: Validate CX fixture, PWA, accessibility and safety boundaries
        run: python apps/customer-experience/tools_validate_cx.py

      - name: Validate cross-contract compatibility
        run: python apps/customer-experience/tools_validate_contract_compatibility.py

      - name: Validate payment handoff contract is inert
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('contracts/cx/payment-handoff-intent.schema.json').read_text())
          assert schema['properties']['provider']['const'] == 'komoju'
          assert schema['properties']['integration_mode']['const'] == 'woocommerce_plugin'
          assert schema['properties']['connection_state']['const'] == 'not_configured'
          assert schema['properties']['order_creation_authorized']['const'] is False
          assert schema['properties']['payment_execution_authorized']['const'] is False
          assert schema['properties']['live_mode_authorized']['const'] is False
          print('PHIL_AI_OS_SPRINT_4_PAYMENT_HANDOFF_CONTRACT_GREEN')
          PY

      - name: Serve isolated customer experience
        run: |
          python -m http.server 8094 --bind 127.0.0.1 --directory apps/customer-experience >/tmp/phil-cx-http.log 2>&1 &
          echo $! >/tmp/phil-cx-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8094/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/phil-cx-http.log
          exit 1

      - name: HTTP smoke app shell, previews and fixtures
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8094/ | grep -F "Customer Experience"
          curl --fail --silent http://127.0.0.1:8094/cart-preview.html | grep -F "KOMOJU not connected"
          curl --fail --silent http://127.0.0.1:8094/cart-preview.html | grep -F "cart-form-guard.mjs"
          curl --fail --silent http://127.0.0.1:8094/src/cart-form-guard.mjs | grep -F "choosePickup"
          curl --fail --silent http://127.0.0.1:8094/src/cart-form-guard.mjs | grep -F "chooseArea"
          curl --fail --silent http://127.0.0.1:8094/src/cart-locale-state.mjs | grep -F "snapshotQuantities"
          curl --fail --silent http://127.0.0.1:8094/src/cart-selection-continuity.mjs | grep -F "explicitSelectionApplied"
          curl --fail --silent http://127.0.0.1:8094/src/fulfillment-choice.mjs | grep -F "Kanto: ¥1,350 flat rate"
          curl --fail --silent http://127.0.0.1:8094/confirmation-preview.html | grep -F "No order submission"
          curl --fail --silent http://127.0.0.1:8094/quick-pickup-preview.html | grep -F "No external activation"
          curl --fail --silent http://127.0.0.1:8094/manifest.webmanifest | grep -F '"display": "standalone"'
          curl --fail --silent http://127.0.0.1:8094/fixtures/catalog.json | grep -F '"fixture_only": true'
          curl --fail --silent http://127.0.0.1:8094/fixtures/payment-provider.json | grep -F '"connection_state": "not_configured"'
          curl --fail --silent http://127.0.0.1:8094/sw.js | grep -F 'phil-ai-os-cx-sprint4-v16'
          curl --fail --silent http://127.0.0.1:8094/sw.js | grep -F './src/cart-form-guard.mjs'

      - name: Stop isolated server
        if: always()
        run: |
          if [ -f /tmp/phil-cx-http.pid ]; then kill "$(cat /tmp/phil-cx-http.pid)" 2>/dev/null || true; fi
