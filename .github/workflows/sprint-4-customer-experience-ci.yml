name: Sprint 4 Customer Experience CI

on:
  pull_request:
    paths:
      - "apps/customer-experience/**"
      - "contracts/cx/**"
      - "docs/SPRINT_4_**"
      - ".github/workflows/sprint-4-customer-experience-ci.yml"
  push:
    branches:
      - "sprint4/**"
    paths:
      - "apps/customer-experience/**"
      - "contracts/cx/**"
      - "docs/SPRINT_4_**"
      - ".github/workflows/sprint-4-customer-experience-ci.yml"

permissions:
  contents: read

jobs:
  cx-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        run: |
          node --check apps/customer-experience/src/core.mjs
          node --check apps/customer-experience/src/cart.mjs
          node --check apps/customer-experience/src/cart-preview.mjs
          node --check apps/customer-experience/src/checkout-confidence.mjs
          node --check apps/customer-experience/src/confirmation-preview.mjs
          node --check apps/customer-experience/src/flow.mjs
          node --check apps/customer-experience/src/locale-links.mjs
          node --check apps/customer-experience/src/mobile-ux.mjs
          node --check apps/customer-experience/src/product-browse-ux.mjs
          node --check apps/customer-experience/src/payment.mjs
          node --check apps/customer-experience/src/pickup.mjs
          node --check apps/customer-experience/src/quick-pickup-preview.mjs
          node --check apps/customer-experience/src/readiness-feedback.mjs
          node --check apps/customer-experience/src/seo.mjs
          node --check apps/customer-experience/src/ui-state.mjs
          node --check apps/customer-experience/src/app.mjs
          node --check apps/customer-experience/sw.js

      - name: Run isolated CX unit tests
        run: node --test apps/customer-experience/tests/*.test.mjs

      - name: Validate CX fixture, PWA, accessibility and safety boundaries
        run: python apps/customer-experience/tools_validate_cx.py

      - name: Validate cross-contract compatibility
        run: python apps/customer-experience/tools_validate_contract_compatibility.py

      - name: Validate payment handoff contract is inert
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('contracts/cx/payment-handoff-intent.schema.json').read_text())
          assert schema['properties']['provider']['const'] == 'komoju'
          assert schema['properties']['integration_mode']['const'] == 'woocommerce_plugin'
          assert schema['properties']['connection_state']['const'] == 'not_configured'
          assert schema['properties']['order_creation_authorized']['const'] is False
          assert schema['properties']['payment_execution_authorized']['const'] is False
          assert schema['properties']['live_mode_authorized']['const'] is False
          print('PHIL_AI_OS_SPRINT_4_PAYMENT_HANDOFF_CONTRACT_GREEN')
          PY

      - name: Serve isolated customer experience
        run: |
          python -m http.server 8094 --bind 127.0.0.1 --directory apps/customer-experience >/tmp/phil-cx-http.log 2>&1 &
          echo $! >/tmp/phil-cx-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8094/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/phil-cx-http.log
          exit 1

      - name: HTTP smoke app shell, previews and fixtures
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:8094/ | grep -F "Customer Experience"
          curl --fail --silent http://127.0.0.1:8094/ | grep -F "cart-preview.html"
          curl --fail --silent http://127.0.0.1:8094/ | grep -F "confirmation-preview.html"
          curl --fail --silent http://127.0.0.1:8094/ | grep -F "quick-pickup-preview.html"
          curl --fail --silent http://127.0.0.1:8094/ | grep -F "product-browse-ux.css"
          curl --fail --silent http://127.0.0.1:8094/ | grep -F "product-browse-ux.mjs"
          curl --fail --silent http://127.0.0.1:8094/cart-preview.html | grep -F "KOMOJU not connected"
          curl --fail --silent http://127.0.0.1:8094/confirmation-preview.html | grep -F "No order submission"
          curl --fail --silent http://127.0.0.1:8094/confirmation-preview.html | grep -F "Place order (preview only — disabled)"
          curl --fail --silent http://127.0.0.1:8094/quick-pickup-preview.html | grep -F "No external activation"
          curl --fail --silent http://127.0.0.1:8094/quick-pickup-preview.html | grep -F "No external link is activated automatically"
          curl --fail --silent http://127.0.0.1:8094/src/cart-preview.mjs | grep -F "buildPaymentHandoffIntent"
          curl --fail --silent http://127.0.0.1:8094/src/confirmation-preview.mjs | grep -F "isolated preview cannot claim actual final-screen acceptance"
          curl --fail --silent http://127.0.0.1:8094/src/confirmation-preview.mjs | grep -F "Konbini confirmation must preserve the verified 3-day Live expiry"
          curl --fail --silent http://127.0.0.1:8094/src/quick-pickup-preview.mjs | grep -F "externalQuickPickupUiState"
          curl --fail --silent http://127.0.0.1:8094/src/quick-pickup-preview.mjs | grep -F "No external link has been activated"
          curl --fail --silent http://127.0.0.1:8094/src/readiness-feedback.mjs | grep -F "readiness feedback must remain non-authorizing"
          curl --fail --silent http://127.0.0.1:8094/src/ui-state.mjs | grep -F "mutation_authorized: false"
          curl --fail --silent http://127.0.0.1:8094/src/locale-links.mjs | grep -F "localizedRelativeHref"
          curl --fail --silent http://127.0.0.1:8094/src/product-browse-ux.mjs | grep -F "Available now"
          curl --fail --silent http://127.0.0.1:8094/product-browse-ux.css | grep -F ".filter-chip"
          curl --fail --silent http://127.0.0.1:8094/manifest.webmanifest | grep -F '"display": "standalone"'
          curl --fail --silent http://127.0.0.1:8094/fixtures/catalog.json | grep -F '"fixture_only": true'
          curl --fail --silent http://127.0.0.1:8094/fixtures/catalog.json | grep -F '"SAMPLE-UBE-001"'
          curl --fail --silent http://127.0.0.1:8094/fixtures/final-confirmation.json | grep -F '"preview_only": true'
          curl --fail --silent http://127.0.0.1:8094/fixtures/final-confirmation.json | grep -F '"actual_final_confirmation_screen_reviewed": false'
          curl --fail --silent http://127.0.0.1:8094/fixtures/final-confirmation.json | grep -F '"expiry_days": 3'
          curl --fail --silent http://127.0.0.1:8094/fixtures/pickup-policy.json | grep -F '"fixture_only": true'
          curl --fail --silent http://127.0.0.1:8094/fixtures/air-mobile-quick-pickup.json | grep -F '"production_url": null'
          curl --fail --silent http://127.0.0.1:8094/fixtures/air-mobile-quick-pickup.json | grep -F '"activation_authorized": false'
          curl --fail --silent http://127.0.0.1:8094/fixtures/air-mobile-quick-pickup.json | grep -F '"automatic_publication_authorized": false'
          curl --fail --silent http://127.0.0.1:8094/fixtures/payment-provider.json | grep -F '"provider": "komoju"'
          curl --fail --silent http://127.0.0.1:8094/fixtures/payment-provider.json | grep -F '"connection_state": "not_configured"'
          curl --fail --silent http://127.0.0.1:8094/sw.js | grep -F 'phil-ai-os-cx-sprint4-v11'

      - name: Stop isolated server
        if: always()
        run: |
          if [ -f /tmp/phil-cx-http.pid ]; then
            kill "$(cat /tmp/phil-cx-http.pid)" 2>/dev/null || true
          fi
