name: Phase 1.18 Routed Execution Enable

on:
  push:
    branches: [ops/phase-1.18-policy-boundary]
    paths: ['.github/workflows/phase-1-18-routed-execution-enable.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Discover routed execution compose binding
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CORE=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core
          COMPOSE="$CORE/compose.yml"
          echo '=== PHASE 1.18 ROUTED EXECUTION BINDING ==='
          test -f "$COMPOSE"
          echo "compose_sha256=$(sha256sum "$COMPOSE" | awk '{print $1}')"
          echo '--- compose refs ---'
          grep -nE 'PHIL_AI_OS_ROUTED_EXECUTION_ENABLED|PHIL_AI_OS_EXECUTION_KILL_SWITCH|PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES' "$COMPOSE" || true
          echo '--- env files ---'
          for f in "$CORE/.env" "$CORE/env" "$CORE/.env.production"; do
            if [ -f "$f" ]; then
              echo "env_file=$f"
              grep -nE 'PHIL_AI_OS_ROUTED_EXECUTION_ENABLED|PHIL_AI_OS_EXECUTION_KILL_SWITCH|PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES' "$f" || true
            fi
          done
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api' || true)
          test -n "$CONTROL"
          echo '--- runtime ---'
          docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^PHIL_AI_OS_(ROUTED_EXECUTION_ENABLED|EXECUTION_KILL_SWITCH|EXECUTION_ALLOWED_TASK_CLASSES)=' || true
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo 'backup_self_heal_timer=active'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo 'provider_call=none'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_18_ROUTED_EXECUTION_BINDING_OK
          REMOTE
