name: Phase 1.18 Backup Self-Heal Contract

on:
  push:
    branches: [ops/phase-1.18-policy-boundary]
    paths: ['.github/workflows/phase-1-18-backup-self-heal-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Compact backup self-heal contract
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          MON=/opt/phil-ai-os/phase-1.16/monitor.py
          ENV=/etc/phil-ai-os-monitor.env
          BACKUP=/opt/phil-ai-os-platform/phase-1.17-run-backup.sh
          echo '=== PHASE 1.18 BACKUP SELF-HEAL CONTRACT ==='
          test -f "$MON" && echo 'monitor_script=present'
          test -f "$ENV" && echo 'monitor_env=present'
          test -x "$BACKUP" && echo 'backup_runner=executable'
          python3 - "$MON" <<'PY'
          import ast, sys
          p=sys.argv[1]
          t=ast.parse(open(p,encoding='utf-8').read())
          names=[n.name for n in t.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
          rel=[n for n in names if any(k in n.lower() for k in ('backup','alert','telegram','recover','check'))]
          print('relevant_functions='+','.join(rel[:12]))
          PY
          echo "env_keys=$(grep -E '^[A-Z0-9_]+=' "$ENV" | cut -d= -f1 | grep -Ei 'BACKUP|ALERT|TELEGRAM|STATE|COOLDOWN|MAX_AGE' | paste -sd, -)"
          echo "backup_status_refs=$(grep -Ec 'backup_status' "$MON" || true)"
          echo "stale_refs=$(grep -Eci 'stale|max_age' "$MON" || true)"
          echo "recovery_refs=$(grep -Eci 'recovery|recover' "$MON" || true)"
          echo "subprocess_refs=$(grep -Eci 'subprocess|systemctl|Popen|run\(' "$MON" || true)"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup.timer && echo 'backup_timer=active'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_18_BACKUP_SELF_HEAL_CONTRACT_OK
          REMOTE
