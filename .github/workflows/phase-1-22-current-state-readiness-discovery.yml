name: Phase 1.22 Current-State Readiness Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-22-current-state-readiness-discovery.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3; do
            echo "ssh_preflight_attempt=$attempt"
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && \
               ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then
              echo ssh_preflight=ok
              exit 0
            fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Discover Phase 1.22 readiness state
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          MARKER=/etc/phil-ai-os/phase-1-21-routine-canary.env
          echo '=== PHASE 1.22 CURRENT-STATE READINESS DISCOVERY ==='

          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo control_api_health=ok

          test -s "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVE=false$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_ALLOWLIST_ACTIVE=false$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_CONSUMED=true$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ALLOWLIST_RESTORED=true$' "$MARKER"
          echo phase_1_21_closed_state=verified

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"
          ! grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=.*routine' <<<"$ENV"
          echo production_allowlist=general_only
          echo routine_persistent_enablement=false
          echo execution_kill_switch=false

          echo '--- operational protections ---'
          systemctl is-active --quiet phil-ai-os-backup.timer && echo backup_timer=active
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo backup_self_heal=active
          if systemctl is-active --quiet phil-ai-os-monitor.timer 2>/dev/null; then echo monitor_timer=active; else echo monitor_timer=not_found_or_inactive; fi

          echo '--- approval/audit schema discovery ---'
          docker exec "$CONTROL" python - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/state/control-plane.db')
          con.row_factory=sqlite3.Row
          tables=[r[0] for r in con.execute("select name from sqlite_master where type='table' order by name")]
          print('table_count='+str(len(tables)))
          for t in tables:
              if any(k in t.lower() for k in ('approval','audit','execution')):
                  cols=[r[1] for r in con.execute(f'pragma table_info("{t}")')]
                  print('schema='+t+':'+','.join(cols))
          rows=con.execute("select task_class,state,consumed_at from approval_requests order by rowid desc limit 10").fetchall()
          print('recent_approval_rows='+str(len(rows)))
          for r in rows: print('approval_sample='+str(dict(r)))
          PY

          echo '--- current execution boundary signals ---'
          docker exec "$CONTROL" sh -lc 'env | grep -E "^(PHIL_AI_OS_EXECUTION_|PHIL_AI_OS_LIVE_|PHIL_AI_OS_ROUT|PHIL_AI_OS_PROVIDER|PHIL_AI_OS_MODEL)" | sort' || true

          echo direct_provider_bypass=false
          echo autonomous_expansion=false
          echo provider_call=none
          echo production_change=none
          echo discovery_mode=read_only
          echo next_action=PHASE_1_22_BOUNDED_ROUTINE_OPERATING_MODEL_CONTRACT
          echo PHIL_AI_OS_PHASE_1_22_CURRENT_STATE_READINESS_DISCOVERY_OK
          REMOTE
