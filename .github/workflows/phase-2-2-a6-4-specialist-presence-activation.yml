name: Phase 2.2 A6.4 Specialist Presence Activation

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type APPROVE_PHASE_2_2_A6_4 after explicit CEO approval'
        required: true
        type: string

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      A6_4_AUTHORIZATION: ${{ inputs.authorization }}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce explicit A6.4 authorization token
        shell: bash
        run: |
          set -euo pipefail
          test "$A6_4_AUTHORIZATION" = 'APPROVE_PHASE_2_2_A6_4'
      - name: Configure direct SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4; do
            if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=12 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Activate signed specialist presence with containment rollback
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee phase22-a6-4-evidence.txt
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          SCRIPT=/usr/local/sbin/philaios-specialist-worker-01-presence
          KEYDIR=/etc/phil-ai-os/specialist-worker-01
          PRIV="$KEYDIR/presence-private.pem"
          PUB="$KEYDIR/presence-public.pem"
          SERVICE=/etc/systemd/system/phil-ai-os-specialist-worker-01-presence.service
          TIMER=/etc/systemd/system/phil-ai-os-specialist-worker-01-presence.timer
          EVIDENCE=/var/lib/phil-ai-os/agent-presence/specialist-worker-01.json
          MUTATED=0

          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          test ! -e "$SCRIPT" && test ! -e "$KEYDIR" && test ! -e "$SERVICE" && test ! -e "$TIMER" && test ! -e "$EVIDENCE"

          # Prove Ed25519 support before any persistent mutation.
          td="$(mktemp -d)"
          openssl genpkey -algorithm ED25519 -out "$td/k.pem" >/dev/null 2>&1
          printf 'phase-2.2-a6.4-ed25519-test' > "$td/payload"
          openssl pkey -in "$td/k.pem" -pubout -out "$td/p.pub" >/dev/null 2>&1
          openssl pkeyutl -sign -inkey "$td/k.pem" -rawin -in "$td/payload" -out "$td/sig" >/dev/null 2>&1
          openssl pkeyutl -verify -pubin -inkey "$td/p.pub" -rawin -in "$td/payload" -sigfile "$td/sig" >/dev/null 2>&1
          rm -rf "$td"
          echo ed25519_support=green

          HERMES_SCRIPT_SHA="$(sha256sum /usr/local/sbin/philaios-agent-heartbeat | awk '{print $1}')"
          HERMES_SERVICE_SHA="$(sha256sum /etc/systemd/system/phil-ai-os-agent-heartbeat.service | awk '{print $1}')"
          HERMES_TIMER_SHA="$(sha256sum /etc/systemd/system/phil-ai-os-agent-heartbeat.timer | awk '{print $1}')"

          docker exec -i "$CONTROL" python3 - <<'PY' >/tmp/a64-baseline.json
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          reg=[dict(r) for r in c.execute('select * from agent_registry order by agent_id')]
          s=next(r for r in reg if r['agent_id']=='specialist-worker-01')
          assert len(reg)==2 and s['authority_ceiling']=='L1' and int(s['enabled'])==0 and int(s['assignable'])==0
          tracked=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit']
          print(json.dumps({'registry':reg,'counts':{t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}},sort_keys=True,separators=(',',':'),default=str))
          PY

          rollback() {
            if [ "$MUTATED" = 1 ]; then
              echo rollback_attempted=true
              systemctl disable --now phil-ai-os-specialist-worker-01-presence.timer >/dev/null 2>&1 || true
              systemctl stop phil-ai-os-specialist-worker-01-presence.service >/dev/null 2>&1 || true
              rm -f "$SERVICE" "$TIMER" "$SCRIPT" "$EVIDENCE"
              rm -rf "$KEYDIR"
              systemctl daemon-reload || true
              echo rollback_completed=true
            fi
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback || true; fi; exit "$rc"' EXIT

          install -d -m 700 "$KEYDIR"
          openssl genpkey -algorithm ED25519 -out "$PRIV" >/dev/null 2>&1
          openssl pkey -in "$PRIV" -pubout -out "$PUB" >/dev/null 2>&1
          chmod 400 "$PRIV"; chmod 444 "$PUB"
          MUTATED=1

          cat > "$SCRIPT" <<'PY'
          #!/usr/bin/env python3
          import base64, datetime, json, os, subprocess, tempfile, urllib.request, uuid
          AGENT='specialist-worker-01'
          KEY='/etc/phil-ai-os/specialist-worker-01/presence-private.pem'
          OUT='/var/lib/phil-ai-os/agent-presence/specialist-worker-01.json'
          def get(path):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4870'+path, timeout=4) as r:
                      return 'green' if 200 <= r.status < 300 else 'error'
              except Exception:
                  return 'error'
          health=get('/healthz'); ready=get('/readyz')
          payload={
              'agent_id':AGENT,
              'control_api_health':health,
              'control_api_readiness':ready,
              'nonce':uuid.uuid4().hex,
              'observation_type':'authenticated_signed_control_api_roundtrip',
              'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'schema_version':'2.2-a6.4.v1',
              'signature_algorithm':'ed25519',
              'status':'ok' if health=='green' and ready=='green' else 'degraded',
          }
          canonical=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()
          with tempfile.TemporaryDirectory() as td:
              pin=os.path.join(td,'payload'); sig=os.path.join(td,'sig')
              open(pin,'wb').write(canonical)
              subprocess.run(['openssl','pkeyutl','-sign','-inkey',KEY,'-rawin','-in',pin,'-out',sig],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              payload['signature_b64']=base64.b64encode(open(sig,'rb').read()).decode()
          directory=os.path.dirname(OUT)
          fd,tmp=tempfile.mkstemp(prefix='.specialist-worker-01.',suffix='.tmp',dir=directory,text=True)
          try:
              with os.fdopen(fd,'w') as f:
                  json.dump(payload,f,sort_keys=True,separators=(',',':')); f.write('\n'); f.flush(); os.fsync(f.fileno())
              os.chmod(tmp,0o600); os.replace(tmp,OUT)
          finally:
              if os.path.exists(tmp): os.unlink(tmp)
          PY
          chmod 755 "$SCRIPT"

          cat > "$SERVICE" <<'UNIT'
          [Unit]
          Description=Phil AI OS specialist-worker-01 signed presence heartbeat
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=root
          Group=root
          ExecStart=/usr/local/sbin/philaios-specialist-worker-01-presence
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          ProtectHostname=true
          ProtectClock=true
          RestrictRealtime=true
          RestrictSUIDSGID=true
          LockPersonality=true
          CapabilityBoundingSet=
          AmbientCapabilities=
          RestrictAddressFamilies=AF_INET AF_INET6
          ReadWritePaths=/var/lib/phil-ai-os/agent-presence
          ReadOnlyPaths=/etc/phil-ai-os/specialist-worker-01 /usr/local/sbin/philaios-specialist-worker-01-presence
          InaccessiblePaths=-/run/philaios -/run/docker.sock -/var/run/docker.sock
          UMask=0077
          UNIT

          cat > "$TIMER" <<'UNIT'
          [Unit]
          Description=Phil AI OS specialist-worker-01 signed presence timer

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          AccuracySec=5s
          Unit=phil-ai-os-specialist-worker-01-presence.service

          [Install]
          WantedBy=timers.target
          UNIT

          systemctl daemon-reload
          systemctl start phil-ai-os-specialist-worker-01-presence.service
          systemctl enable --now phil-ai-os-specialist-worker-01-presence.timer >/dev/null
          systemctl is-active --quiet phil-ai-os-specialist-worker-01-presence.timer
          test -s "$EVIDENCE"

          python3 - <<'PY'
          import base64,datetime,json,subprocess,tempfile,os
          p='/var/lib/phil-ai-os/agent-presence/specialist-worker-01.json'
          pub='/etc/phil-ai-os/specialist-worker-01/presence-public.pem'
          d=json.load(open(p)); sig=base64.b64decode(d.pop('signature_b64'))
          assert d['schema_version']=='2.2-a6.4.v1'
          assert d['agent_id']=='specialist-worker-01'
          assert d['observation_type']=='authenticated_signed_control_api_roundtrip'
          assert d['signature_algorithm']=='ed25519'
          assert d['control_api_health']=='green' and d['control_api_readiness']=='green' and d['status']=='ok'
          canonical=json.dumps(d,sort_keys=True,separators=(',',':')).encode()
          with tempfile.TemporaryDirectory() as td:
              pin=os.path.join(td,'payload'); sp=os.path.join(td,'sig')
              open(pin,'wb').write(canonical); open(sp,'wb').write(sig)
              subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey',pub,'-rawin','-in',pin,'-sigfile',sp],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          observed=datetime.datetime.fromisoformat(d['observed_at'])
          age=(datetime.datetime.now(datetime.timezone.utc)-observed).total_seconds()
          assert 0 <= age <= 120
          print('specialist_presence_signature=valid')
          print('specialist_presence_fresh=true')
          PY

          # Prove no token/provider/execution surface was installed into the presence primitive.
          test "$(grep -Eic 'openai|openrouter|anthropic|gemini|/v1/execute|philaios-execute|control_api_token|bearer|authorization' "$SCRIPT" || true)" = 0
          test "$(systemctl cat phil-ai-os-specialist-worker-01-presence.service | grep -Eic 'token|credential|docker.sock' || true)" -ge 1
          # docker.sock appears only in InaccessiblePaths; no environment credential is configured.
          test -z "$(systemctl show phil-ai-os-specialist-worker-01-presence.service -p Environment --value)"

          docker exec -i "$CONTROL" python3 - <<'PY' >/tmp/a64-final.json
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          reg=[dict(r) for r in c.execute('select * from agent_registry order by agent_id')]
          s=next(r for r in reg if r['agent_id']=='specialist-worker-01')
          assert len(reg)==2 and s['authority_ceiling']=='L1' and int(s['enabled'])==0 and int(s['assignable'])==0
          assert c.execute("select count(*) from task_lifecycle_events where assigned_agent_id='specialist-worker-01'").fetchone()[0]==0
          tracked=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit']
          print(json.dumps({'registry':reg,'counts':{t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}},sort_keys=True,separators=(',',':'),default=str))
          PY
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/a64-baseline.json')); b=json.load(open('/tmp/a64-final.json'))
          assert a==b
          PY

          test "$HERMES_SCRIPT_SHA" = "$(sha256sum /usr/local/sbin/philaios-agent-heartbeat | awk '{print $1}')"
          test "$HERMES_SERVICE_SHA" = "$(sha256sum /etc/systemd/system/phil-ai-os-agent-heartbeat.service | awk '{print $1}')"
          test "$HERMES_TIMER_SHA" = "$(sha256sum /etc/systemd/system/phil-ai-os-agent-heartbeat.timer | awk '{print $1}')"
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done

          trap - EXIT
          rm -f /tmp/a64-baseline.json /tmp/a64-final.json
          echo specialist_agent_id=specialist-worker-01
          echo specialist_authority_ceiling=L1
          echo specialist_enabled=false
          echo specialist_assignable=false
          echo specialist_presence_timer=active
          echo specialist_presence_auth=ed25519_signed
          echo specialist_control_api_bearer_token=none
          echo specialist_provider_credentials=none
          echo specialist_execution_capability=none
          echo specialist_assignment_refs=0
          echo hermes_heartbeat_unchanged=true
          echo execution_allowlist=general
          echo mission_control_mutations=405
          echo provider_call=none
          echo execution_call=none
          echo automatic_assignment=false
          echo automatic_retry=false
          echo automatic_reroute=false
          echo automatic_delegation=false
          echo automatic_execution=false
          echo PHIL_AI_OS_PHASE_2_2_A6_4_SPECIALIST_PRESENCE_ACTIVATION_OK
          REMOTE
      - name: Upload A6.4 activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-2-a6-4-specialist-presence-activation-evidence
          path: phase22-a6-4-evidence.txt
          if-no-files-found: error
          retention-days: 30
