name: MC-021 Gate C Fixture Emergency Restore

on:
  push:
    branches:
      - codex/mission-control-cto-next-gate
    paths:
      - .github/workflows/mission-control-cto-mcp-fixture-gate-c-recovery.yml

permissions:
  contents: read

jobs:
  restore-gate-b-loopback-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      CONTAINER: phil-ai-os-mission-control-cto-mcp-fixture
      IMAGE: ghcr.io/phireij/phil-ai-os-platform/mission-control-cto-mcp-fixture@sha256:faaba9708efd7edee1d35d0f1499d73cfdceb53fac64f86a618803d01fd5ddc3
    steps:
      - name: Restore only the previously approved immutable Gate B fixture image
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh_opts=(-4 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' -- "$CONTAINER" "$IMAGE" <<'REMOTE'
          set -euo pipefail
          container="$1"; image="$2"; port=8787
          issuer='https://dev-81f0leykwbfdtibz.jp.auth0.com/'
          jwks='https://dev-81f0leykwbfdtibz.jp.auth0.com/.well-known/jwks.json'
          ! docker inspect "$container" >/dev/null 2>&1
          ! ss -ltnH "( sport = :$port )" | grep -q .
          docker image inspect "$image" >/dev/null
          rollback() {
            docker inspect "$container" --format 'recovery_container_state={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' 2>/dev/null || true
            docker logs --tail 20 "$container" 2>&1 || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap rollback ERR
          docker run -d --name "$container" --restart unless-stopped --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --label traefik.enable=false \
            -e MCP_AUTHORIZATION_ISSUER="$issuer" -e MCP_AUTHORIZATION_JWKS_URI="$jwks" \
            "$image" >/dev/null
          for i in 1 2 3 4 5; do curl -fsS --max-time 2 http://127.0.0.1:8787/healthz >/tmp/mcp-health.json && break; sleep 1; done
          test "$(cat /tmp/mcp-health.json)" = '{"authority_effect":"none","live_data":false,"mode":"offline_fixture","status":"ok"}'
          test "$(curl -fsS --max-time 2 http://127.0.0.1:8787/.well-known/oauth-protected-resource/mcp | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["resource"]=="https://miscon.phireij.cloud/mcp"; assert d["authorization_servers"]==["https://dev-81f0leykwbfdtibz.jp.auth0.com/"]; print("metadata=ok")')" = metadata=ok
          test "$(curl -fsS --max-time 2 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_phil_ai_os_status","arguments":{}}}' http://127.0.0.1:8787/mcp | python3 -c 'import json,sys; d=json.load(sys.stdin)["result"]; assert d["isError"] is True and d["content"][0]["text"]=="authentication_required"; assert "mcp/www_authenticate" in d["_meta"]; print("challenge=ok")')" = challenge=ok
          test "$(docker inspect "$container" --format '{{.Config.User}}|{{.HostConfig.NetworkMode}}|{{.HostConfig.ReadonlyRootfs}}|{{index .Config.Labels "traefik.enable"}}|{{json .HostConfig.SecurityOpt}}|{{json .HostConfig.CapDrop}}|{{.HostConfig.PidsLimit}}|{{json .HostConfig.PortBindings}}')" = 'app|host|true|false|["no-new-privileges:true"]|["ALL"]|128|null'
          ss -ltnH "( sport = :$port )" | grep -Eq '^LISTEN.*127\.0\.0\.1:8787'
          echo "gate_c_recovery=green listener=127.0.0.1:8787 public_route=false tunnel_client=false auth0_changed=false tokens_issued=false live_data=false"
          REMOTE
