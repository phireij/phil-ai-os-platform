name: Phase 1.25 Approval Telegram E2E Controlled Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase-1-25-approval-telegram-e2e-controlled-validation.yml

permissions:
  contents: read

jobs:
  controlled-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" true; then
                rm -f "$TMP"
                exit 0
              fi
            fi
            rm -f "$TMP"
            sleep $((attempt*10))
          done
          exit 1
      - name: Run controlled approval and Telegram E2E validation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          BASE=http://127.0.0.1:4870
          echo '=== PHASE 1.25 CONTROLLED APPROVAL TELEGRAM E2E VALIDATION V3 ==='
          curl -fsS "$BASE/healthz" >/dev/null
          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"
          echo production_allowlist=general_only

          TOKEN=''
          for f in /run/philaios/control_api_token /run/philaios/hermes_control_api_token /etc/phil-ai-os/control-api-token /opt/phil-ai-os/secrets/control-api-token; do
            if [ -r "$f" ]; then
              TOKEN="$(cat "$f")"
              break
            fi
          done
          if [ -z "$TOKEN" ] && [ -r /etc/phil-ai-os-monitor.env ]; then
            TOKEN_FILE="$(sed -n 's/^PHIL_AI_OS_CONTROL_API_TOKEN_FILE=//p' /etc/phil-ai-os-monitor.env | tail -n1)"
            if [ -n "$TOKEN_FILE" ] && [ -r "$TOKEN_FILE" ]; then TOKEN="$(cat "$TOKEN_FILE")"; fi
            if [ -z "$TOKEN" ]; then TOKEN="$(sed -n 's/^PHIL_AI_OS_CONTROL_API_TOKEN=//p' /etc/phil-ai-os-monitor.env | tail -n1)"; fi
          fi
          [ -n "$TOKEN" ]
          AUTH="Authorization: Bearer $TOKEN"

          TASK="PHIL_AI_OS_PHASE_1_25_CONTROLLED_APPROVAL_E2E_$(date -u +%Y%m%dT%H%M%SZ)"
          REQ="$(printf '%s' "$TASK" | python3 -c 'import json,sys; print(json.dumps(dict(task_text=sys.stdin.read(), task_class="general", source="phase-1.25-controlled-validation")))')"
          RESP="$(curl -fsS -H "$AUTH" -H 'Content-Type: application/json' -d "$REQ" "$BASE/v1/approvals/request")"
          APPROVAL_ID="$(printf '%s' "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("approval_id", ""))')"
          [ -n "$APPROVAL_ID" ]
          echo approval_request_created=true
          echo approval_id="$APPROVAL_ID"

          LINK_RESP="$(curl -fsS -H "$AUTH" "$BASE/v1/approvals/link?approval_id=$APPROVAL_ID")"
          LINK="$(printf '%s' "$LINK_RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("url") or d.get("link") or d.get("approval_url") or "")')"
          [ -n "$LINK" ]
          echo approval_link_issued=true

          set -a
          [ -r /etc/phil-ai-os-monitor.env ] && . /etc/phil-ai-os-monitor.env
          set +a
          HERMES_ENV=/opt/hermes-agent-whow/.env
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] && [ -r "$HERMES_ENV" ]; then TELEGRAM_BOT_TOKEN="$(sed -n 's/^TELEGRAM_BOT_TOKEN=//p' "$HERMES_ENV" | tail -n1)"; fi
          if [ -z "${TELEGRAM_CHAT_ID:-}" ] && [ -r "$HERMES_ENV" ]; then TELEGRAM_CHAT_ID="$(sed -n 's/^TELEGRAM_HOME_CHANNEL=//p' "$HERMES_ENV" | tail -n1)"; fi
          [ -n "${TELEGRAM_BOT_TOKEN:-}" ]
          [ -n "${TELEGRAM_CHAT_ID:-}" ]
          MSG="Phil AI OS Phase 1.25 controlled approval test. Approval ID: $APPROVAL_ID. Open Mission Control: $LINK"
          TG_PAYLOAD="$(printf '%s\n%s' "$TELEGRAM_CHAT_ID" "$MSG" | python3 -c 'import json,sys; lines=sys.stdin.read().split("\n",1); print(json.dumps(dict(chat_id=lines[0], text=lines[1] if len(lines)>1 else "", disable_web_page_preview=True)))')"
          TG_RESP="$(curl -fsS -H 'Content-Type: application/json' -d "$TG_PAYLOAD" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")"
          printf '%s' "$TG_RESP" | python3 -c 'import json,sys; assert json.load(sys.stdin).get("ok") is True'
          echo telegram_message_sent=true

          GET_RESP="$(curl -fsS -H "$AUTH" "$BASE/v1/approvals/get?approval_id=$APPROVAL_ID")"
          STATE="$(printf '%s' "$GET_RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("approval") or d).get("state", ""))')"
          [ "$STATE" = pending ]
          echo approval_state=pending
          echo approval_decision=none
          echo approval_consumed=false
          echo provider_call=none
          echo production_config_change=none
          curl -fsS "$BASE/healthz" >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service
          echo next_action=USER_APPROVE_PHASE_1_25_CONTROLLED_REQUEST_FROM_TELEGRAM_MISSION_CONTROL_LINK
          echo PHIL_AI_OS_PHASE_1_25_CONTROLLED_APPROVAL_TELEGRAM_E2E_OK
          REMOTE
