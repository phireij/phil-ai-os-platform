name: Phase 2.1H Production Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/phase-2-1h-production-preflight-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate tools
        run: |
          set -euo pipefail
          python3 -m py_compile ops/phase-2.1h/build-lifecycle-writer-candidate.py ops/phase-2.1h/apply-lifecycle-ledger-migration.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Verify live production baseline read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HOSTNAME=hermes-agent-whow.srv1833510.hstgr.cloud
          COMPOSE=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core/compose.yml
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -f "$COMPOSE"
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.1-phase21f'
          APP_HASH="$(docker exec "$CONTROL" sha256sum /app/app.py | awk '{print $1}')"
          test -n "$APP_HASH"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null
          docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute('pragma quick_check').fetchone()[0]=='ok'; assert c.execute(\"select count(*) from sqlite_master where type='table' and name='task_lifecycle_events'\").fetchone()[0]==0"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          grep -q 'SCHEMA_VERSION = "2.1g.v1"' /opt/phil-ai-os/mission-control/read-model.py
          grep -q 'READ ONLY · Phase 2.1G' /opt/phil-ai-os/mission-control/server.py
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://$HOSTNAME/phil-ai-os/operator/)" = 401
          for method in POST PUT PATCH DELETE; do test "$(curl -s -o /dev/null -w '%{http_code}' -X "$method" --max-time 5 http://127.0.0.1:4881/)" = 405; done
          IMAGE_EXPR="$(grep -E '^[[:space:]]*image:[[:space:]]*phil-ai-os/control-api:' "$COMPOSE" | head -n1 | sed 's/^[[:space:]]*image:[[:space:]]*//')"
          test -n "$IMAGE_EXPR"
          echo control_api_image=0.20.1-phase21f
          echo control_api_app_hash_present=true
          echo live_lifecycle_table=absent
          echo db_quick_check=ok
          echo mission_control_schema=2.1g.v1
          echo production_allowlist=general_only
          echo operator_auth_boundary=preserved
          echo browser_mutation_methods=405
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active
          echo compose_image_expression_present=true
          echo production_change=none
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1H_PRODUCTION_PREFLIGHT_OK
          REMOTE
