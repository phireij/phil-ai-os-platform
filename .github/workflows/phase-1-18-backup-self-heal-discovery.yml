name: Phase 1.18 Backup Self-Heal Discovery

on:
  push:
    branches: [ops/phase-1.18-policy-boundary]
    paths: ['.github/workflows/phase-1-18-backup-self-heal-discovery.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Compact self-heal discovery
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== PHASE 1.18 BACKUP SELF-HEAL DISCOVERY ==='
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup.timer && echo 'backup_timer=active'
          echo "backup_service=$(systemctl is-enabled phil-ai-os-backup.service 2>/dev/null || true)"
          echo "backup_timer_next=$(systemctl list-timers phil-ai-os-backup.timer --no-legend 2>/dev/null | awk '{print $1" "$2" "$3" "$4}' | head -1)"
          MON_PID=$(systemctl show -p MainPID --value phil-ai-os-monitor.service)
          MON_CMD=$(tr '\0' ' ' < /proc/$MON_PID/cmdline 2>/dev/null || true)
          echo "monitor_cmd=$MON_CMD"
          MON_SCRIPT=$(printf '%s\n' "$MON_CMD" | grep -oE '/[^ ]+\.py' | head -1 || true)
          echo "monitor_script=${MON_SCRIPT:-unknown}"
          if [ -n "$MON_SCRIPT" ] && [ -f "$MON_SCRIPT" ]; then
            echo "backup_refs=$(grep -Ec 'backup_status|stale|backup' "$MON_SCRIPT" || true)"
            echo "telegram_refs=$(grep -Ec 'telegram|alert|recovery' "$MON_SCRIPT" || true)"
          fi
          echo "backup_exec=$(systemctl show -p ExecStart --value phil-ai-os-backup.service | sed 's/;.*//')"
          echo "monitor_state_dir=$(systemctl cat phil-ai-os-monitor.service 2>/dev/null | grep -Eo 'EnvironmentFile=[^ ]+|StateDirectory=[^ ]+' | tr '\n' ',' || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_18_BACKUP_SELF_HEAL_DISCOVERY_OK
          REMOTE
