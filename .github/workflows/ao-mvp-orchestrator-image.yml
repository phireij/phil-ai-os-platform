name: AO-MVP Orchestrator Image

on:
  pull_request:
    paths:
      - 'Dockerfile.ao-mvp'
      - '.dockerignore'
      - '.github/workflows/ao-mvp-orchestrator-image.yml'
      - 'scripts/ao_mvp_*.py'
      - 'ops/authorizations/**'
      - 'ops/autonomous-work-queue/**'
      - 'ops/runtime/**'
      - 'policy/**'
  push:
    branches: [main]
    tags: ['ao-mvp-orchestrator-v*']
    paths:
      - 'Dockerfile.ao-mvp'
      - '.dockerignore'
      - '.github/workflows/ao-mvp-orchestrator-image.yml'
      - 'scripts/ao_mvp_*.py'
      - 'ops/authorizations/**'
      - 'ops/autonomous-work-queue/**'
      - 'ops/runtime/**'
      - 'policy/**'

permissions:
  contents: read

jobs:
  pull-request-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build without publishing
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --file Dockerfile.ao-mvp --tag ao-mvp-orchestrator:pr-check .
          echo 'Pull request build completed without publishing.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and publish image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/ao-mvp-orchestrator
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag_args=(--tag "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
            tag_args+=(--tag "$IMAGE:$release_tag")
          fi
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --file Dockerfile.ao-mvp \
            "${tag_args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --push \
            --metadata-file /tmp/ao-mvp-image-metadata.json \
            .
          digest="$(python -c 'import json; print(json.load(open("/tmp/ao-mvp-image-metadata.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Verify the pushed registry artifact, not only the local build request.
          # This prevents a misleading success when the tag resolves to an image
          # that Docker cannot run on the declared linux/amd64 target.
          docker pull --platform linux/amd64 "$IMAGE@$digest"
          platform="$(docker image inspect "$IMAGE@$digest" --format '{{.Os}}/{{.Architecture}}')"
          [[ "$platform" == "linux/amd64" ]]
          docker image rm "$IMAGE@$digest" >/dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published and verified `$IMAGE@$digest` from commit `$GITHUB_SHA` (linux/amd64; registry pull verified)." >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
