name: Phase 2.1H Isolated Lifecycle Ledger Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/phase-2-1h-isolated-ledger-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate validator syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile ops/phase-2.1h/validate-lifecycle-ledger-migration.py
          echo validator_compile=ok
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage validator
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q ops/phase-2.1h/validate-lifecycle-ledger-migration.py "$VPS_USER@$VPS_HOST:/tmp/validate-lifecycle-ledger-migration.py"
      - name: Validate isolated copy only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          VALIDATOR=/tmp/validate-lifecycle-ledger-migration.py
          COPY=/tmp/control-plane-phase21h-isolated.db
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          cleanup(){ rm -f "$VALIDATOR" "$COPY"; }
          trap cleanup EXIT

          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.1-phase21f'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null
          test -f "$VALIDATOR"

          BEFORE="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute('pragma quick_check').fetchone()[0]=='ok'; print(c.execute('select count(*) from approval_requests').fetchone()[0],c.execute('select count(*) from execution_audit').fetchone()[0],c.execute(\"select count(*) from sqlite_master where type='table' and name='task_lifecycle_events'\").fetchone()[0])")"
          set -- $BEFORE
          test "$3" = 0

          rm -f "$COPY"
          docker cp "$CONTROL:/app/state/control-plane.db" "$COPY"
          test -s "$COPY"
          python3 "$VALIDATOR" "$COPY"

          python3 - "$COPY" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1])
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          assert c.execute("select count(*) from sqlite_master where type='table' and name='task_lifecycle_events'").fetchone()[0]==1
          assert c.execute("select count(*) from sqlite_master where type='trigger' and name='trg_task_lifecycle_events_no_update'").fetchone()[0]==1
          assert c.execute("select count(*) from sqlite_master where type='trigger' and name='trg_task_lifecycle_events_no_delete'").fetchone()[0]==1
          print('isolated_copy_schema=validated')
          PY

          AFTER="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute('pragma quick_check').fetchone()[0]=='ok'; print(c.execute('select count(*) from approval_requests').fetchone()[0],c.execute('select count(*) from execution_audit').fetchone()[0],c.execute(\"select count(*) from sqlite_master where type='table' and name='task_lifecycle_events'\").fetchone()[0])")"
          test "$BEFORE" = "$AFTER"
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer

          echo live_lifecycle_table=absent
          echo live_database_unchanged=true
          echo production_allowlist=general_only
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1H_ISOLATED_LEDGER_VALIDATION_OK
          REMOTE
