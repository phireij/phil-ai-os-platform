name: Phase 1.18 First Controlled Routed Execution

on:
  push:
    branches: [ops/phase-1.18-policy-boundary]
    paths: ['.github/workflows/phase-1-18-controlled-routed-execution.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: First controlled routed execution
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow' || true)
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api' || true)
          test -n "$HERMES"
          test -n "$CONTROL"
          echo '=== PHASE 1.18 FIRST CONTROLLED ROUTED EXECUTION ==='
          grep -qx 'PHIL_AI_OS_CONTROLLED_ENFORCEMENT=true' /etc/phil-ai-os/phase-1.18-enforcement.env
          echo 'controlled_enforcement=enabled'
          docker exec "$HERMES" test -x /usr/local/bin/philaios-execute
          docker exec "$HERMES" test -s /run/philaios/hermes_control_api_token
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          DB=/app/state/control-plane.db
          docker exec "$CONTROL" test -s "$DB"
          PY_B64=''
          APPROVAL_ID=$(docker exec "$CONTROL" python3 -c "import base64,sys; exec(base64.b64decode(sys.argv[1]))" "$PY_B64" "$DB")

          if [ -z "$APPROVAL_ID" ]; then
            echo 'authorization=approved_unconsumed_not_found'
            echo 'provider_call=none'
            echo 'next_action=create_explicit_test_approval'
            echo PHIL_AI_OS_PHASE_1_18_FIRST_CONTROLLED_ROUTED_EXECUTION_AWAITING_APPROVAL
            exit 0
          fi

          echo 'authorization=approved_unconsumed_found'
          set +e
          OUT=$(docker exec "$HERMES" /usr/local/bin/philaios-execute "$APPROVAL_ID" 'Return exactly PHIL_AI_OS_PHASE_1_18_ROUTED_OK' 2>&1)
          RC=$?
          set -e
          echo "execution_exit_code=$RC"
          printf '%s\n' "$OUT" \
            | sed -E 's/(Bearer[[:space:]]+)[^[:space:]"']+/\1<redacted>/Ig; s/((token|api[_-]?key|secret)["'= :]+)[^, }]+/\1<redacted>/Ig' \
            | tail -n 12

          if [ "$RC" -ne 0 ]; then
            echo 'execution_result=rejected_or_failed'
            echo 'automatic_retry=none'
            echo 'approval_change=none'
            echo PHIL_AI_OS_PHASE_1_18_ROUTED_EXECUTION_DIAGNOSTIC_OK
            exit 0
          fi

          echo 'execution_result=success'
          echo 'execution_invoked=philaios_execute'
          echo 'control_api_route=/v1/execute'
          echo 'monitor=active'
          echo 'backup_self_heal_timer=active'
          echo PHIL_AI_OS_PHASE_1_18_FIRST_CONTROLLED_ROUTED_EXECUTION_OK
          REMOTE
