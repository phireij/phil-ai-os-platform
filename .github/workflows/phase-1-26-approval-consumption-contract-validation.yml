name: Phase 1.26 Approval Consumption Contract Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-26-approval-consumption-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Validate durable consumption and replay protection
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          DB=/app/state/control-plane.db
          APPROVAL_ID=apr_6ee5a19331794c159e4d99070d63d08e
          TASK_TEXT=PHIL_AI_OS_PHASE_1_25_CONTROLLED_APPROVAL_E2E_20260826T072555Z
          BASE=http://127.0.0.1:4870

          curl -fsS "$BASE/healthz" >/dev/null
          systemctl is-active --quiet phil-ai-os-monitor.service

          CHECK="$(docker exec "$CONTROL" python -c "import sqlite3; c=sqlite3.connect('$DB'); c.row_factory=sqlite3.Row; r=c.execute('select state,consumed_at,consumed_by from approval_requests where approval_id=?',('$APPROVAL_ID',)).fetchone(); assert r is not None, 'approval missing'; assert r['state']=='approved', dict(r); assert r['consumed_at'], dict(r); assert r['consumed_by']=='hermes', dict(r); a=c.execute(\"select count(*) from execution_audit where approval_id=? and outcome='success'\",('$APPROVAL_ID',)).fetchone()[0]; assert a >= 1, 'successful execution audit missing'; print('durable_consumption=ok'); print('execution_audit_link=ok')")"
          printf '%s\n' "$CHECK"
          grep -q '^durable_consumption=ok$' <<<"$CHECK"
          grep -q '^execution_audit_link=ok$' <<<"$CHECK"

          TOKEN=''
          if [ -r /etc/phil-ai-os-monitor.env ]; then
            set -a; . /etc/phil-ai-os-monitor.env; set +a
            TOKEN="${PHIL_AI_OS_CONTROL_API_TOKEN:-}"
            TOKEN_FILE="${PHIL_AI_OS_CONTROL_API_TOKEN_FILE:-}"
            if [ -z "$TOKEN" ] && [ -n "${TOKEN_FILE:-}" ] && [ -r "$TOKEN_FILE" ]; then TOKEN="$(cat "$TOKEN_FILE")"; fi
          fi
          if [ -z "$TOKEN" ]; then
            MPID="$(systemctl show phil-ai-os-monitor.service -p MainPID --value)"
            if [ -n "$MPID" ] && [ "$MPID" != 0 ] && [ -r "/proc/$MPID/environ" ]; then
              PROC_ENV="$(tr '\0' '\n' < "/proc/$MPID/environ")"
              TOKEN="$(printf '%s\n' "$PROC_ENV" | sed -n 's/^PHIL_AI_OS_CONTROL_API_TOKEN=//p' | tail -n1)"
              TOKEN_FILE="$(printf '%s\n' "$PROC_ENV" | sed -n 's/^PHIL_AI_OS_CONTROL_API_TOKEN_FILE=//p' | tail -n1)"
              if [ -z "$TOKEN" ] && [ -n "$TOKEN_FILE" ] && [ -r "$TOKEN_FILE" ]; then TOKEN="$(cat "$TOKEN_FILE")"; fi
            fi
          fi
          if [ -z "$TOKEN" ]; then
            for f in /run/philaios/control_api_token /run/philaios/hermes_control_api_token /etc/phil-ai-os/control-api-token /opt/phil-ai-os/secrets/control-api-token; do
              if [ -r "$f" ]; then TOKEN="$(cat "$f")"; break; fi
            done
          fi
          [ -n "$TOKEN" ]
          echo control_api_token_resolved=true
          AUTH="Authorization: Bearer $TOKEN"

          SUCCESS_BEFORE="$(docker exec "$CONTROL" python -c "import sqlite3; c=sqlite3.connect('$DB'); print(c.execute(\"select count(*) from execution_audit where approval_id=? and outcome='success'\",('$APPROVAL_ID',)).fetchone()[0])")"
          code="$(curl -sS -o /tmp/replay.json -w '%{http_code}' -X POST -H "$AUTH" -H 'Content-Type: application/json' --data "{\"text\":\"$TASK_TEXT\",\"source\":\"hermes\",\"approval_id\":\"$APPROVAL_ID\"}" "$BASE/v1/execute")"
          echo replay_http_code="$code"
          test "$code" = 409
          python3 -c "import json; d=json.load(open('/tmp/replay.json')); assert d.get('status')=='execution_approval_rejected', d; a=d.get('approval') or {}; assert a.get('status')=='approval_already_consumed', d; print('replay_protection=ok')"
          SUCCESS_AFTER="$(docker exec "$CONTROL" python -c "import sqlite3; c=sqlite3.connect('$DB'); print(c.execute(\"select count(*) from execution_audit where approval_id=? and outcome='success'\",('$APPROVAL_ID',)).fetchone()[0])")"
          test "$SUCCESS_BEFORE" = "$SUCCESS_AFTER"
          echo successful_execution_count_unchanged=true
          echo rejected_replay_may_be_audited=true
          echo provider_replay_call=blocked_before_provider
          echo PHIL_AI_OS_PHASE_1_26_APPROVAL_CONSUMPTION_CONTRACT_VALIDATION_OK
          REMOTE
