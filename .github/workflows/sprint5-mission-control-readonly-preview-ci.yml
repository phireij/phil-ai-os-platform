name: Sprint 5 Mission Control Read-only Preview CI

on:
  pull_request:
    paths:
      - 'apps/operations-hub/mission-control/**'
      - 'apps/operations-hub/tools_generate_mission_control_preview_fixture.py'
      - 'apps/operations-hub/tools_generate_mission_control_channel_readiness.py'
      - 'apps/operations-hub/tools_validate_mission_control_preview.py'
      - 'apps/operations-hub/src/operations_hub/mission_control_projection.py'
      - 'ops/readiness/sprint7-channel-activation-readiness.json'
      - 'contracts/operations/mission-control-lifecycle-projection.schema.json'
      - '.github/workflows/sprint5-mission-control-readonly-preview-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/operations-hub/mission-control/**'
      - 'apps/operations-hub/tools_generate_mission_control_preview_fixture.py'
      - 'apps/operations-hub/tools_generate_mission_control_channel_readiness.py'
      - 'apps/operations-hub/tools_validate_mission_control_preview.py'
      - 'apps/operations-hub/src/operations_hub/mission_control_projection.py'
      - 'ops/readiness/sprint7-channel-activation-readiness.json'
      - 'contracts/operations/mission-control-lifecycle-projection.schema.json'
      - '.github/workflows/sprint5-mission-control-readonly-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readonly-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify fixture is generated from Mission Control projection
        run: python apps/operations-hub/tools_generate_mission_control_preview_fixture.py --check
      - name: Verify channel readiness is generated from canonical readiness state
        run: python apps/operations-hub/tools_generate_mission_control_channel_readiness.py --check
      - name: Validate Mission Control preview boundary and v5 contract alignment
        run: python apps/operations-hub/tools_validate_mission_control_preview.py
      - name: Serve preview locally
        run: |
          python -m http.server 8765 --directory apps/operations-hub/mission-control >/tmp/mission-control-preview.log 2>&1 &
          echo $! >/tmp/mission-control-preview.pid
          sleep 1
      - name: HTTP smoke preview shell and bounded projections
        run: |
          set -euo pipefail
          for asset in index.html mission-control.css mission-control.mjs fixture.json channel-readiness.json conversation.json project-readiness.json notification-read-model.json governed-proposals.json operator-read-model.json; do
            curl --fail --silent --show-error "http://127.0.0.1:8765/$asset" >/dev/null
          done
      - name: Stop local preview
        if: always()
        run: |
          if [ -f /tmp/mission-control-preview.pid ]; then kill "$(cat /tmp/mission-control-preview.pid)" || true; fi
      - name: Package bounded read-only Mission Control preview
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/philaios-mission-control-readonly-preview
          mkdir -p "$out/preview" "$out/contracts"
          cp -a apps/operations-hub/mission-control/. "$out/preview/"
          cp contracts/operations/mission-control-lifecycle-projection.schema.json "$out/contracts/"
          cat > "$out/BOUNDARY.txt" <<'EOF'
          Phil AI OS Mission Control bounded preview artifact
          mode=read_only
          authority_effect=none
          autonomy=A0
          task_class=general
          hermes=idle
          live_execution=false
          mission_control_writes=false
          live_channel_connectivity=false
          inbound_channel_activation=false
          customer_replies=false
          payment_execution=false
          sms_send=false
          woo_commerce_mutation=false
          inventory_mutation=false
          production_publish=false
          retry_authorized=false
          rollback_authorized=false
          This artifact is a static non-production preview package only. It does not grant deployment or production authority.
          EOF
          cat > "$out/PROVENANCE.txt" <<EOF
          Phil AI OS Mission Control bounded preview provenance
          source_commit=${GITHUB_SHA}
          workflow=${GITHUB_WORKFLOW}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          repository=${GITHUB_REPOSITORY}
          authority_effect=none
          EOF
          for asset in index.html mission-control.css mission-control.mjs fixture.json channel-readiness.json conversation.json project-readiness.json notification-read-model.json governed-proposals.json operator-read-model.json; do
            test -s "$out/preview/$asset"
          done
          test -f "$out/contracts/mission-control-lifecycle-projection.schema.json"
          grep -q 'mode=read_only' "$out/BOUNDARY.txt"
          grep -q 'live_channel_connectivity=false' "$out/BOUNDARY.txt"
          grep -q 'authority_effect=none' "$out/BOUNDARY.txt"
          grep -q "source_commit=${GITHUB_SHA}" "$out/PROVENANCE.txt"
          (
            cd "$out"
            find BOUNDARY.txt PROVENANCE.txt preview contracts -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > MANIFEST.sha256
            sha256sum --check MANIFEST.sha256
          )
          test -s "$out/MANIFEST.sha256"
          echo 'PHIL_AI_OS_MISSION_CONTROL_PREVIEW_ARTIFACT_GREEN mode=read_only channels=5 provenance=recorded manifest=sha256 live_connectivity=false authority_effect=none deployment_authority=false'
      - name: Upload bounded Mission Control preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phil-ai-os-mission-control-readonly-preview
          path: /tmp/philaios-mission-control-readonly-preview/
          if-no-files-found: error
          retention-days: 7

  mission-control-pr834-browser-replay:
    # Temporary acceptance job for the repository-owned review branch; never on push or dispatch.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 834 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'review/mc-message-history-v1-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the PR test-merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tested
          persist-credentials: false
      - name: Check out the actual PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: review-head
          persist-credentials: false
      - name: Check out the exact previous-release base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7aa9c3948bf9c920705cff6004ee00d325fba905
          path: legacy
          persist-credentials: false
      - name: Check out frozen reviewed product bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7ecb36e88118400e1bc5e9b054f3caf8af1cceec
          path: frozen
          persist-credentials: false
      - name: Verify tested and PR-head product content
        shell: bash
        run: |
          set -euo pipefail
          for checkout in tested review-head frozen legacy; do
            printf '%s commit=%s tree=%s\n' "$checkout" \
              "$(git -C "$checkout" rev-parse HEAD)" \
              "$(git -C "$checkout" rev-parse 'HEAD^{tree}')"
          done
          for checkout in tested review-head; do
            diff -r frozen/apps/operations-hub/mission-control "$checkout/apps/operations-hub/mission-control"
            for file in conversation_store.py google_ceo_session.py; do
              cmp "frozen/ops/mission-control-identity/$file" "$checkout/ops/mission-control-identity/$file"
            done
          done
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        shell: bash
        working-directory: tested
        run: |
          set -euo pipefail
          python -m pip --isolated install --require-hashes --only-binary=:all: -r apps/operations-hub/tests/mission-control-browser-requirements.txt
          python -m playwright install --with-deps chromium
      - name: Verify synthetic history, focus, scroll and compatibility
        shell: bash
        run: |
          set -euo pipefail
          python -m playwright --version
          python tested/apps/operations-hub/tests/history_replay_reviewed.py \
            tested/apps/operations-hub/mission-control \
            --legacy-frontend legacy/apps/operations-hub/mission-control
      - name: Exercise the exact browser and real backend on loopback only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip --isolated install --only-binary=:all: -r tested/ops/mission-control-identity/requirements.txt
          python -B tested/apps/operations-hub/tests/integrated_message_history.py tested
      - name: Check the same candidate browser tab during exact baseline rollback
        shell: bash
        run: |
          set -euo pipefail
          python -B tested/apps/operations-hub/tests/message_history_rollback_wire.py tested/ops/mission-control-identity legacy/ops/mission-control-identity
          python -B tested/apps/operations-hub/tests/message_history_rollback_browser.py tested legacy/ops/mission-control-identity
