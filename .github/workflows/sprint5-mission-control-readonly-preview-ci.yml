name: Sprint 5 Mission Control Read-only Preview CI

on:
  pull_request:
    paths:
      - 'apps/operations-hub/mission-control/**'
      - 'apps/operations-hub/tools_generate_mission_control_preview_fixture.py'
      - 'apps/operations-hub/tools_generate_mission_control_channel_readiness.py'
      - 'apps/operations-hub/tools_validate_mission_control_preview.py'
      - 'apps/operations-hub/src/operations_hub/mission_control_projection.py'
      - 'ops/readiness/sprint7-channel-activation-readiness.json'
      - 'contracts/operations/mission-control-lifecycle-projection.schema.json'
      - '.github/workflows/sprint5-mission-control-readonly-preview-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/operations-hub/mission-control/**'
      - 'apps/operations-hub/tools_generate_mission_control_preview_fixture.py'
      - 'apps/operations-hub/tools_generate_mission_control_channel_readiness.py'
      - 'apps/operations-hub/tools_validate_mission_control_preview.py'
      - 'apps/operations-hub/src/operations_hub/mission_control_projection.py'
      - 'ops/readiness/sprint7-channel-activation-readiness.json'
      - 'contracts/operations/mission-control-lifecycle-projection.schema.json'
      - '.github/workflows/sprint5-mission-control-readonly-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readonly-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify fixture is generated from Mission Control projection
        run: python apps/operations-hub/tools_generate_mission_control_preview_fixture.py --check
      - name: Verify channel readiness is generated from canonical readiness state
        run: python apps/operations-hub/tools_generate_mission_control_channel_readiness.py --check
      - name: Validate Mission Control preview boundary and v5 contract alignment
        run: python apps/operations-hub/tools_validate_mission_control_preview.py
      - name: Serve preview locally
        run: |
          python -m http.server 8765 --directory apps/operations-hub/mission-control >/tmp/mission-control-preview.log 2>&1 &
          echo $! >/tmp/mission-control-preview.pid
          sleep 1
      - name: HTTP smoke preview shell and bounded projections
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8765/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/fixture.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/channel-readiness.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/mission-control.mjs >/dev/null
      - name: Stop local preview
        if: always()
        run: |
          if [ -f /tmp/mission-control-preview.pid ]; then kill "$(cat /tmp/mission-control-preview.pid)" || true; fi
      - name: Package bounded read-only Mission Control preview
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/philaios-mission-control-readonly-preview
          mkdir -p "$out/preview" "$out/contracts"
          cp -a apps/operations-hub/mission-control/. "$out/preview/"
          cp contracts/operations/mission-control-lifecycle-projection.schema.json "$out/contracts/"
          cat > "$out/BOUNDARY.txt" <<'EOF'
          Phil AI OS Mission Control bounded preview artifact
          mode=read_only
          authority_effect=none
          autonomy=A0
          task_class=general
          hermes=idle
          live_execution=false
          mission_control_writes=false
          live_channel_connectivity=false
          inbound_channel_activation=false
          customer_replies=false
          payment_execution=false
          sms_send=false
          woo_commerce_mutation=false
          inventory_mutation=false
          production_publish=false
          retry_authorized=false
          rollback_authorized=false
          This artifact is a static non-production preview package only. It does not grant deployment or production authority.
          EOF
          cat > "$out/PROVENANCE.txt" <<EOF
          Phil AI OS Mission Control bounded preview provenance
          source_commit=${GITHUB_SHA}
          workflow=${GITHUB_WORKFLOW}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          repository=${GITHUB_REPOSITORY}
          authority_effect=none
          EOF
          test -f "$out/preview/index.html"
          test -f "$out/preview/fixture.json"
          test -f "$out/preview/channel-readiness.json"
          test -f "$out/preview/mission-control.mjs"
          test -f "$out/contracts/mission-control-lifecycle-projection.schema.json"
          grep -q 'mode=read_only' "$out/BOUNDARY.txt"
          grep -q 'live_channel_connectivity=false' "$out/BOUNDARY.txt"
          grep -q 'authority_effect=none' "$out/BOUNDARY.txt"
          grep -q "source_commit=${GITHUB_SHA}" "$out/PROVENANCE.txt"
          (
            cd "$out"
            sha256sum \
              BOUNDARY.txt \
              PROVENANCE.txt \
              preview/index.html \
              preview/fixture.json \
              preview/channel-readiness.json \
              preview/mission-control.mjs \
              contracts/mission-control-lifecycle-projection.schema.json \
              > MANIFEST.sha256
            sha256sum --check MANIFEST.sha256
          )
          test -s "$out/MANIFEST.sha256"
          echo 'PHIL_AI_OS_MISSION_CONTROL_PREVIEW_ARTIFACT_GREEN mode=read_only channels=5 provenance=recorded manifest=sha256 live_connectivity=false authority_effect=none deployment_authority=false'
      - name: Upload bounded Mission Control preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phil-ai-os-mission-control-readonly-preview
          path: /tmp/philaios-mission-control-readonly-preview/
          if-no-files-found: error
          retention-days: 7
