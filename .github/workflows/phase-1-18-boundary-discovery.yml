name: Phase 1.18 Boundary Discovery
on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-boundary-discovery-trigger'
      - '.github/workflows/phase-1-18-boundary-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for i in $(seq 1 12); do
            if ssh-keyscan -T 8 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $i failed; retrying..."
            sleep 5
          done
          test -s ~/.ssh/known_hosts
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          for i in $(seq 1 6); do
            if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" 'true'; then
              echo 'ssh_connectivity=ok'
              exit 0
            fi
            echo "ssh connectivity attempt $i failed; retrying..."
            sleep 5
          done
          echo 'ssh_connectivity=failed'
          exit 1
      - name: Read-only execution boundary discovery
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          TMP=$(mktemp -d /tmp/phil-ai-os-1-18-XXXXXX)
          trap 'rm -rf "$TMP"' EXIT
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 -E 'control[-_]?api|phil.*control' || true)
          : > "$TMP/envkeys"; : > "$TMP/routes"; : > "$TMP/callsites"
          if [ -n "$HERMES" ]; then
            docker inspect "$HERMES" --format '{{range .Config.Env}}{{println .}}{{end}}' | cut -d= -f1 | grep -Ei 'OPENAI|OPENROUTER|GEMINI|ANTHROPIC|PROVIDER|MODEL|PHIL_AI_OS|CONTROL_API|TOKEN|KEY' | sort -u > "$TMP/envkeys" || true
            docker exec "$HERMES" sh -lc "grep -RInE 'api\.openai\.com|openrouter\.ai|generativelanguage\.googleapis\.com|anthropic\.com|control-api:4870|127\.0\.0\.1:4870|PHIL_AI_OS_CONTROL_API' /opt/hermes /usr/local/bin /opt/data 2>/dev/null | head -n 500" > "$TMP/callsites" || true
          fi
          if [ -n "$CONTROL" ]; then
            docker exec "$CONTROL" sh -lc "grep -RhoE '/v1/[A-Za-z0-9_./?-]*(execute|execution)[A-Za-z0-9_./?=-]*' /app 2>/dev/null | sort -u | head -n 100" > "$TMP/routes" || true
          fi
          echo '=== PHASE 1.18 CTO SUMMARY ==='
          echo "hermes=$([ -n "$HERMES" ] && echo found || echo missing)"
          echo "control_api=$([ -n "$CONTROL" ] && echo found || echo missing)"
          echo "provider_env_keys=$(wc -l < "$TMP/envkeys" | tr -d ' ')"
          echo "execution_routes=$(wc -l < "$TMP/routes" | tr -d ' ')"
          echo "control_api_refs=$(grep -Eic 'control-api:4870|127\.0\.0\.1:4870|PHIL_AI_OS_CONTROL_API' "$TMP/callsites" || true)"
          echo "direct_openai_refs=$(grep -Eic 'api\.openai\.com' "$TMP/callsites" || true)"
          echo "direct_openrouter_refs=$(grep -Eic 'openrouter\.ai' "$TMP/callsites" || true)"
          echo "direct_gemini_refs=$(grep -Eic 'generativelanguage\.googleapis\.com' "$TMP/callsites" || true)"
          echo "direct_anthropic_refs=$(grep -Eic 'anthropic\.com' "$TMP/callsites" || true)"
          ROUTES=$(paste -sd, "$TMP/routes" 2>/dev/null || true)
          echo "routes=${ROUTES:-none}"
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          echo "backup_timer=$(systemctl is-active phil-ai-os-backup.timer || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo PHIL_AI_OS_PHASE_1_18_BOUNDARY_DISCOVERY_OK
          REMOTE
