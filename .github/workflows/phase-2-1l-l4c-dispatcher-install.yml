name: Phase 2.1L L4C One-Shot Dispatcher Install

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1l-l4c-dispatcher-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          getent ahosts "$VPS_HOST" >/dev/null
          timeout 20 bash -c "</dev/tcp/$VPS_HOST/$PORT"
          ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" true

      - name: Install dispatcher without scheduling it
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          SCRIPT=/usr/local/sbin/philaios-approval-notification-dispatcher
          TS="$(date -u +%Y%m%dT%H%M%SZ)"

          if [ -e "$SCRIPT" ]; then
            cp -a "$SCRIPT" "$SCRIPT.pre-phase21l-$TS"
            echo dispatcher_previous_backup="$SCRIPT.pre-phase21l-$TS"
          else
            echo dispatcher_previous_backup=none
          fi

          cat > "$SCRIPT" <<'DISPATCHER'
          #!/usr/bin/env bash
          set -euo pipefail
          CONTROL="${PHIL_AI_OS_CONTROL_CONTAINER:-phil-ai-os-core-control-api-1}"
          HERMES="${PHIL_AI_OS_HERMES_CONTAINER:-$(docker ps --format '{{.Names}}' | grep '^hermes-agent-whow' | head -n1)}"
          LEASE_SECONDS="${PHIL_AI_OS_NOTIFICATION_LEASE_SECONDS:-60}"
          RETRY_SECONDS="${PHIL_AI_OS_NOTIFICATION_RETRY_SECONDS:-60}"
          MAX_ATTEMPTS="${PHIL_AI_OS_NOTIFICATION_MAX_ATTEMPTS:-3}"
          test -n "$HERMES"

          CLAIM="$(docker exec -i "$CONTROL" python - "$LEASE_SECONDS" <<'PY'
          import sqlite3,sys
          from datetime import datetime,timezone,timedelta
          lease_seconds=int(sys.argv[1])
          now=datetime.now(timezone.utc)
          now_s=now.isoformat()
          lease_s=(now+timedelta(seconds=lease_seconds)).isoformat()
          c=sqlite3.connect('/app/state/control-plane.db',timeout=10)
          c.row_factory=sqlite3.Row
          c.execute('BEGIN IMMEDIATE')
          r=c.execute('''
            SELECT id,approval_id,task_id,state,attempt_count
            FROM approval_notification_outbox
            WHERE (
              state='pending'
              OR (state='retry_wait' AND (next_attempt_at IS NULL OR next_attempt_at<=?))
              OR (state='leased' AND lease_until IS NOT NULL AND lease_until<=?)
            )
            ORDER BY id
            LIMIT 1
          ''',(now_s,now_s)).fetchone()
          if not r:
            c.commit(); c.close(); print(''); raise SystemExit(0)
          updated=c.execute('''
            UPDATE approval_notification_outbox
            SET state='leased', attempt_count=attempt_count+1,
                lease_until=?, next_attempt_at=NULL, updated_at=?
            WHERE id=?
          ''',(lease_s,now_s,r['id']))
          assert updated.rowcount==1
          c.commit(); c.close()
          print(f"{r['id']}|{r['approval_id']}|{r['task_id']}|{r['attempt_count']+1}")
          PY
          )"

          if [ -z "$CLAIM" ]; then
            echo dispatcher_status=no_work
            exit 0
          fi

          IFS='|' read -r ROW_ID APPROVAL_ID TASK_ID ATTEMPT <<< "$CLAIM"
          echo dispatcher_row_id="$ROW_ID"
          echo dispatcher_approval_id="$APPROVAL_ID"
          echo dispatcher_task_id="$TASK_ID"
          echo dispatcher_attempt="$ATTEMPT"

          OUT="$(mktemp)"
          set +e
          docker exec "$HERMES" /usr/local/bin/philaios-telegram-approval-notifier "$APPROVAL_ID" >"$OUT" 2>&1
          RC=$?
          set -e

          TELEGRAM_OK=false
          if [ "$RC" -eq 0 ]; then
            if cat "$OUT" | docker exec -i "$CONTROL" python -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if (d.get("telegram_ok") is True or d.get("status")=="ok") else 1)' 2>/dev/null; then
              TELEGRAM_OK=true
            fi
          fi

          if [ "$TELEGRAM_OK" = true ]; then
            docker exec -i "$CONTROL" python - "$ROW_ID" <<'PY'
          import sqlite3,sys
          from datetime import datetime,timezone
          row_id=int(sys.argv[1]); now=datetime.now(timezone.utc).isoformat()
          c=sqlite3.connect('/app/state/control-plane.db')
          u=c.execute("UPDATE approval_notification_outbox SET state='delivered',delivered_at=?,lease_until=NULL,next_attempt_at=NULL,last_error_code=NULL,updated_at=? WHERE id=? AND state='leased'",(now,now,row_id))
          assert u.rowcount==1
          c.commit(); c.close()
          PY
            echo dispatcher_status=delivered
            cat "$OUT"
            rm -f "$OUT"
            exit 0
          fi

          docker exec -i "$CONTROL" python - "$ROW_ID" "$ATTEMPT" "$MAX_ATTEMPTS" "$RETRY_SECONDS" "$RC" <<'PY'
          import sqlite3,sys
          from datetime import datetime,timezone,timedelta
          row_id,attempt,max_attempts,retry_seconds,rc=map(int,sys.argv[1:])
          now=datetime.now(timezone.utc)
          state='dead_letter' if attempt>=max_attempts else 'retry_wait'
          next_at=None if state=='dead_letter' else (now+timedelta(seconds=retry_seconds)).isoformat()
          code='notifier_exit_'+str(rc) if rc else 'notifier_unconfirmed'
          c=sqlite3.connect('/app/state/control-plane.db')
          u=c.execute("UPDATE approval_notification_outbox SET state=?,next_attempt_at=?,lease_until=NULL,last_error_code=?,updated_at=? WHERE id=? AND state='leased'",(state,next_at,code,now.isoformat(),row_id))
          assert u.rowcount==1
          c.commit(); c.close()
          print('dispatcher_failure_state='+state)
          print('dispatcher_error_code='+code)
          PY
          echo dispatcher_status=delivery_failed
          rm -f "$OUT"
          exit 1
          DISPATCHER

          chmod 0750 "$SCRIPT"
          bash -n "$SCRIPT"

          docker exec -i "$CONTROL" python - <<'PY'
          import sqlite3
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True)
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          assert c.execute("select count(*) from sqlite_master where type='table' and name='approval_notification_outbox'").fetchone()[0]==1
          assert c.execute("select count(*) from sqlite_master where type='trigger' and name='trg_approval_notification_outbox_enqueue'").fetchone()[0]==1
          print('outbox_rows='+str(c.execute('select count(*) from approval_notification_outbox').fetchone()[0]))
          c.close()
          PY

          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          test ! -e /etc/systemd/system/philaios-approval-notification-dispatcher.timer
          echo dispatcher_installed=true
          echo dispatcher_scheduled=false
          echo notification_send=none
          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo PHIL_AI_OS_PHASE_2_1L_L4C_DISPATCHER_INSTALLED_DISABLED_OK
          REMOTE
