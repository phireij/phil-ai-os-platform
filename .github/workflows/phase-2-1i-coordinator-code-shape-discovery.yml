name: Phase 2.1I Coordinator Code Shape Discovery
on:
  push:
    branches: [main]
    paths: ['.github/phase-2-1i-coordinator-code-shape-trigger']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Discover live app code shape read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.2-phase21h'
          docker exec "$CONTROL" python3 -c "import ast,pathlib; s=pathlib.Path('/app/app.py').read_text(); t=ast.parse(s); funcs=sorted(n.name for n in ast.walk(t) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))); print('function_names='+','.join(funcs)); classes=sorted(n.name for n in ast.walk(t) if isinstance(n,ast.ClassDef)); print('class_names='+','.join(classes))"
          docker exec "$CONTROL" python3 -c "import ast,pathlib; s=pathlib.Path('/app/app.py').read_text(); t=ast.parse(s); routes=[]; [routes.append(n.value) for n in ast.walk(t) if isinstance(n,ast.Constant) and isinstance(n.value,str) and n.value.startswith('/v1/')]; print('v1_route_literals='+','.join(sorted(set(routes))))"
          docker exec "$CONTROL" python3 -c "import ast,pathlib; s=pathlib.Path('/app/app.py').read_text(); t=ast.parse(s); names=sorted({n.id for n in ast.walk(t) if isinstance(n,ast.Name) and any(k in n.id.lower() for k in ('auth','token','bearer'))}); print('auth_symbol_names='+','.join(names))"
          echo production_change=none
          echo PHIL_AI_OS_PHASE_2_1I_COORDINATOR_CODE_SHAPE_DISCOVERY_OK
          REMOTE
