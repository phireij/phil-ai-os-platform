name: Phase 1.19 Hermes Mission Control Readiness

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-agent-readiness.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 3; done
          test -s ~/.ssh/known_hosts
      - name: Probe Hermes authenticated Mission Control reads
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          echo '=== PHASE 1.19 HERMES MISSION CONTROL READINESS ==='
          docker exec "$HERMES" python3 -c 'from pathlib import Path; p=Path("/run/philaios/hermes_control_api_token"); print("token_mount="+("ready" if p.is_file() and p.stat().st_size>0 else "missing"))'
          for ep in /v1/mission-control/snapshot /v1/approvals/recent /v1/execution/recent; do
            code=$(docker exec "$HERMES" sh -lc 'T=$(cat /run/philaios/hermes_control_api_token); curl -sS -o /tmp/p119.out -w "%{http_code}" -H "Authorization: Bearer $T" "http://host.docker.internal:4870'"$ep"'"' 2>/dev/null || true)
            echo "endpoint=$ep http=${code:-000}"
          done
          echo "advisory_client=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-advisory && echo ready || echo missing)"
          echo "execute_client=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-execute && echo ready || echo missing)"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_19_HERMES_MISSION_CONTROL_READINESS_OK
          REMOTE
