name: Sprint 3 Catalog Owner Worksheet Artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "commerce/woocommerce/fixtures/working-catalog-subset-*.json"
      - "commerce/woocommerce/fixtures/working-catalog-owner-draft-assistance-*.json"
      - "commerce/woocommerce/src/phil_ai_os_woocommerce/working_catalog_*.py"
      - "commerce/woocommerce/tools_working_catalog_owner_worksheet.py"
      - "commerce/woocommerce/tools_working_catalog_owner_action_checklist.py"
      - "commerce/woocommerce/tools_working_catalog_owner_draft_assistance.py"
      - "commerce/woocommerce/tools_working_catalog_owner_decision_brief.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_worksheet.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_action_packet.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_action_checklist*.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_draft_assistance.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_decision_brief.py"
      - ".github/workflows/sprint-3-catalog-owner-worksheet-artifact.yml"
  push:
    branches:
      - main
    paths:
      - "commerce/woocommerce/fixtures/working-catalog-subset-*.json"
      - "commerce/woocommerce/fixtures/working-catalog-owner-draft-assistance-*.json"
      - "commerce/woocommerce/src/phil_ai_os_woocommerce/working_catalog_*.py"
      - "commerce/woocommerce/tools_working_catalog_owner_worksheet.py"
      - "commerce/woocommerce/tools_working_catalog_owner_action_checklist.py"
      - "commerce/woocommerce/tools_working_catalog_owner_draft_assistance.py"
      - "commerce/woocommerce/tools_working_catalog_owner_decision_brief.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_worksheet.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_action_packet.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_action_checklist*.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_draft_assistance.py"
      - "commerce/woocommerce/tests/test_working_catalog_owner_decision_brief.py"
      - ".github/workflows/sprint-3-catalog-owner-worksheet-artifact.yml"

permissions:
  contents: read

jobs:
  build-owner-worksheet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run owner handoff regression tests
        env:
          PYTHONPATH: commerce/woocommerce/src
        run: |
          python -m unittest \
            commerce.woocommerce.tests.test_working_catalog_owner_worksheet \
            commerce.woocommerce.tests.test_working_catalog_owner_action_packet \
            commerce.woocommerce.tests.test_working_catalog_owner_action_checklist \
            commerce.woocommerce.tests.test_working_catalog_owner_action_checklist_cli \
            commerce.woocommerce.tests.test_working_catalog_owner_draft_assistance \
            commerce.woocommerce.tests.test_working_catalog_owner_decision_brief \
            -v

      - name: Build source-backed owner handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/philaios-catalog-owner-worksheet
          python commerce/woocommerce/tools_working_catalog_owner_worksheet.py \
            --input commerce/woocommerce/fixtures/working-catalog-subset-2026-09-11.json \
            --output /tmp/philaios-catalog-owner-worksheet/ruby-working-catalog-owner-worksheet.csv \
            --requirements-output /tmp/philaios-catalog-owner-worksheet/ruby-working-catalog-owner-requirements.json
          python commerce/woocommerce/tools_working_catalog_owner_action_checklist.py \
            --input commerce/woocommerce/fixtures/working-catalog-subset-2026-09-11.json \
            --output /tmp/philaios-catalog-owner-worksheet/ruby-working-catalog-owner-checklist.md
          python commerce/woocommerce/tools_working_catalog_owner_draft_assistance.py \
            --input commerce/woocommerce/fixtures/working-catalog-subset-2026-09-11.json \
            --proposals commerce/woocommerce/fixtures/working-catalog-owner-draft-assistance-2026-09-15.json \
            --output /tmp/philaios-catalog-owner-worksheet/ruby-working-catalog-japanese-copy-draft-assistance.md
          python commerce/woocommerce/tools_working_catalog_owner_decision_brief.py \
            --input commerce/woocommerce/fixtures/working-catalog-subset-2026-09-11.json \
            --proposals commerce/woocommerce/fixtures/working-catalog-owner-draft-assistance-2026-09-15.json \
            --output /tmp/philaios-catalog-owner-worksheet/ruby-working-catalog-ceo-decision-brief.md

      - name: Validate artifact boundary and source-backed structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path('/tmp/philaios-catalog-owner-worksheet')
          csv_path = root / 'ruby-working-catalog-owner-worksheet.csv'
          req_path = root / 'ruby-working-catalog-owner-requirements.json'
          checklist_path = root / 'ruby-working-catalog-owner-checklist.md'
          assistance_path = root / 'ruby-working-catalog-japanese-copy-draft-assistance.md'
          decision_path = root / 'ruby-working-catalog-ceo-decision-brief.md'
          assert csv_path.is_file()
          assert req_path.is_file()
          assert checklist_path.is_file()
          assert assistance_path.is_file()
          assert decision_path.is_file()
          raw = csv_path.read_bytes()
          assert raw.startswith(b'\xef\xbb\xbf'), 'worksheet must remain UTF-8 BOM for spreadsheet compatibility'
          with csv_path.open('r', encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 5
          by_sku = {row['sku']: row for row in rows}
          assert by_sku['RCD-MCH-RD']['record_type'] == 'variable_parent'
          assert by_sku['RCD-MCH-RD']['price_jpy'] == ''
          assert by_sku['RCD-MCH-RD-15']['parent_sku'] == 'RCD-MCH-RD'
          assert by_sku['RCD-MCH-RD-15']['price_jpy'] == '3500'
          assert by_sku['RCD-MCH-RD-21']['parent_sku'] == 'RCD-MCH-RD'
          assert by_sku['RCD-MCH-RD-21']['price_jpy'] == '5500'
          assert by_sku['RCD-BAR-FMB']['price_jpy'] == '250'
          assert by_sku['RCD-BRD-ENS-1']['price_jpy'] == '300'
          for sku in ('RCD-MCH-RD', 'RCD-BAR-FMB', 'RCD-BRD-ENS-1'):
              assert by_sku[sku]['japanese_name'] == ''
              assert by_sku[sku]['japanese_description'] == ''
              assert by_sku[sku]['primary_media_ref'] == ''
              assert by_sku[sku]['shipping_class'] == ''
          requirements = json.loads(req_path.read_text(encoding='utf-8'))
          assert requirements['global_requirements']
          assert requirements['network_call_performed'] is False
          assert requirements['mutation_authorized'] is False
          assert requirements['production_publish_authorized'] is False
          checklist = checklist_path.read_text(encoding='utf-8')
          assert '# Working Catalog Owner Checklist' in checklist
          assert 'Owner worksheet row: `variable_parent` / `RCD-MCH-RD`' in checklist
          assert '`RCD-MCH-RD-15`, `RCD-MCH-RD-21`' in checklist
          assert 'Network calls performed: **No**' in checklist
          assert 'WooCommerce mutation authorized: **No**' in checklist
          assert 'Production publication authorized: **No**' in checklist
          assistance = assistance_path.read_text(encoding='utf-8')
          assert '# Working Catalog Japanese Copy — Draft Assistance' in assistance
          assert '**Proposal only.**' in assistance
          assert 'モイストチョコレート・ラウンドケーキ' in assistance
          assert 'ファッジー・ミルキーバー' in assistance
          assert 'チージー・エンサイマダ' in assistance
          assert 'Owner approved: **No**' in assistance
          assert 'Canonical apply authorized: **No**' in assistance
          assert 'Production publication authorized: **No**' in assistance
          decision = decision_path.read_text(encoding='utf-8')
          assert '# Initial Launch Catalog V1 — CEO Decision Brief' in decision
          assert 'Canonical unresolved actions accounted for: **20**' in decision
          assert 'CEO-controlled decisions: **14**' in decision
          assert 'Japanese copy decisions with draft assistance: **6**' in decision
          assert 'Post-decision/system records: **1**' in decision
          assert 'Operational/evidence items: **5**' in decision
          assert 'Deferred authority gates: **0**' in decision
          assert 'Needs classification/review: **0**' in decision
          assert 'WooCommerce mutation authorized: **No**' in decision
          assert 'Production publication authorized: **No**' in decision
          print('PHIL_AI_OS_CATALOG_OWNER_WORKSHEET_ARTIFACT_BOUNDARY_GREEN rows=5 checklist=true draft_assistance=true ceo_decision_brief=true owner_decisions=14 draft_assisted=6 operational_evidence=5 deferred_authority=0 needs_review=0 owner_approved=false network_call=false mutation_authorized=false production_publish_authorized=false')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ruby-working-catalog-owner-worksheet
          path: /tmp/philaios-catalog-owner-worksheet/
          if-no-files-found: error
          retention-days: 7
