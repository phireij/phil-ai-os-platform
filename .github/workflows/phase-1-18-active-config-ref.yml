name: Phase 1.18 Active Config Reference
on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/phase-1-18-active-config-ref-trigger'
      - '.github/workflows/phase-1-18-active-config-ref.yml'
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read-only active config reference discovery
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 hermes || true)
          test -n "$HERMES"
          FILE=$(docker exec "$HERMES" sh -lc "grep -RIl 'philaios-execute' /opt/data /etc 2>/dev/null | head -n 1" || true)
          echo '=== PHASE 1.18 ACTIVE CONFIG REF ==='
          echo "config_ref_present=$([ -n "$FILE" ] && echo yes || echo no)"
          echo "config_ref_file=${FILE:-none}"
          if [ -n "$FILE" ]; then
            BASENAME=$(basename "$FILE")
            echo "config_ref_basename=$BASENAME"
            echo "config_ref_location=$([ "${FILE#/opt/data/}" != "$FILE" ] && echo opt_data || echo etc)"
          else
            echo 'config_ref_basename=none'
            echo 'config_ref_location=none'
          fi
          echo "monitor=$(systemctl is-active phil-ai-os-monitor.service || true)"
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo 'control_api_health=ok'
          echo PHIL_AI_OS_PHASE_1_18_ACTIVE_CONFIG_REF_OK
          REMOTE
