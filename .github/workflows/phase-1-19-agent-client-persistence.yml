name: Phase 1.19 Mission Control Client Persistence Discovery

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-agent-client-persistence.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 3; done
          test -s ~/.ssh/known_hosts
      - name: Discover durable install surface
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          echo '=== PHASE 1.19 AGENT CLIENT PERSISTENCE ==='
          echo "client_present=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control && echo yes || echo no)"
          echo '--- relevant mounts ---'
          docker inspect "$HERMES" --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}' | grep -E '/usr/local/bin|/opt/hermes|/opt/data|/run/philaios' | head -20 || true
          echo '--- compose candidates ---'
          docker inspect "$HERMES" --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}|{{index .Config.Labels "com.docker.compose.project.config_files"}}|{{index .Config.Labels "com.docker.compose.service"}}'
          echo "host_script_candidates=$(find /docker/hermes-agent-whow /opt/phil-ai-os-platform -maxdepth 4 -type f -name 'philaios-*' 2>/dev/null | head -10 | tr '\n' ',' )"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_19_AGENT_CLIENT_PERSISTENCE_OK
          REMOTE
