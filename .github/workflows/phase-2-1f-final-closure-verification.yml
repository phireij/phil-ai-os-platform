name: Phase 2.1F Final Closure Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/phase-2-1f-final-closure-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1

      - name: Verify Phase 2.1F live state read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HOSTNAME=hermes-agent-whow.srv1833510.hstgr.cloud
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          SERVICE=phil-ai-os-mission-control-operator.service
          test -n "$CONTROL"
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.1-phase21f'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null
          systemctl is-active --quiet "$SERVICE"
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer

          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"

          BEFORE="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); assert c.execute('pragma quick_check').fetchone()[0]=='ok'; a=[r[1] for r in c.execute('pragma table_info(approval_requests)')]; e=[r[1] for r in c.execute('pragma table_info(execution_audit)')]; idx=[r[1] for r in c.execute('pragma index_list(approval_requests)')]; assert 'task_id' in a and 'task_id' in e and 'idx_approval_requests_task_id_nonnull' in idx; print(c.execute('select count(*) from approval_requests').fetchone()[0], c.execute('select count(*) from execution_audit').fetchone()[0])")"

          curl -fsS --max-time 8 http://127.0.0.1:4881/ > /tmp/philaios-final-dashboard.html
          grep -q 'READ ONLY · Phase 2.1F' /tmp/philaios-final-dashboard.html
          grep -q 'Canonical task persistence is active' /tmp/philaios-final-dashboard.html
          curl -fsS --max-time 8 http://127.0.0.1:4881/api/read-model > /tmp/philaios-final-read-model.json
          python3 -c "import json; m=json.load(open('/tmp/philaios-final-read-model.json')); assert m['schema_version']=='2.1f.v1'; assert m['overall_state']=='healthy'; assert m['governance']['execution_allowed_task_classes']==['general']; assert m['governance']['direct_provider_bypass_allowed'] is False; assert m['governance']['authority_expansion_state']=='blocked'; s=m['durable_correlation_summary']; assert s['canonical_task_persistence']=='present'; assert s['task_id_mismatch_count']==0; assert s['historical_null_task_ids_allowed'] is True"

          test "$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 https://$HOSTNAME/phil-ai-os/operator/)" = 401
          for method in POST PUT PATCH DELETE; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X "$method" --max-time 5 http://127.0.0.1:4881/)" = 405
          done

          AFTER="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0], c.execute('select count(*) from execution_audit').fetchone()[0])")"
          test "$BEFORE" = "$AFTER"
          rm -f /tmp/philaios-final-dashboard.html /tmp/philaios-final-read-model.json

          echo control_api_image=0.20.1-phase21f
          echo control_api_health=ok
          echo control_api_readiness=ok
          echo canonical_task_schema=present
          echo canonical_task_mismatch_count=0
          echo historical_backfill=none
          echo dashboard_schema=2.1f.v1
          echo dashboard_badge=Phase_2.1F
          echo production_allowlist=general_only
          echo operator_auth_boundary=preserved
          echo browser_mutation_methods=405
          echo approval_execution_counts_unchanged=true
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1F_FINAL_CLOSURE_VERIFICATION_OK
          REMOTE
