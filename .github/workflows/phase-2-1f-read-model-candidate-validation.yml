name: Phase 2.1F Read-Model Candidate Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1f-read-model-candidate-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate on runner
        shell: bash
        run: |
          set -euo pipefail
          python3 ops/phase-2.1f/build-read-model-v21f.py \
            ops/phase-2.1a/philaios-mission-control-read-model.py \
            /tmp/philaios-mission-control-read-model-v21f.py
          python3 -m py_compile /tmp/philaios-mission-control-read-model-v21f.py
          grep -q 'SCHEMA_VERSION = "2.1f.v1"' /tmp/philaios-mission-control-read-model-v21f.py
          echo read_model_candidate_runner_validation=green
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage candidate read model
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q /tmp/philaios-mission-control-read-model-v21f.py "$VPS_USER@$VPS_HOST:/tmp/philaios-mission-control-read-model-v21f.py"
      - name: Validate candidate against live state read-only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test "$(docker inspect "$CONTROL" --format '{{.Config.Image}}')" = 'phil-ai-os/control-api:0.20.1-phase21f'
          BEFORE="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0],c.execute('select count(*) from execution_audit').fetchone()[0])")"
          python3 /tmp/philaios-mission-control-read-model-v21f.py > /tmp/philaios-read-model-v21f.json
          python3 - /tmp/philaios-read-model-v21f.json <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schema_version']=='2.1f.v1'
          assert d['overall_state']=='healthy'
          assert d['durable_correlation_summary']['canonical_task_persistence']=='present'
          assert d['data_quality']['canonical_task_persistence']=='present'
          assert d['data_quality']['durable_link_quality']=='approval_id_plus_canonical_task_id'
          assert d['governance']['execution_allowed_task_classes']==['general']
          assert d['governance']['direct_provider_bypass_allowed'] is False
          assert d['governance']['authority_expansion_state']=='blocked'
          assert all(isinstance(x,dict) for x in d.get('tasks',[]))
          text=open(sys.argv[1]).read().lower()
          for forbidden in ('authorization','private_key','api_key','apikey','password'):
              assert forbidden not in text
          print('schema_version=2.1f.v1')
          print('canonical_task_persistence=present')
          print('canonical_tasks_observed='+str(len(d.get('tasks',[]))))
          print('durable_link_quality=approval_id_plus_canonical_task_id')
          print('secret_values_exposed=false')
          PY
          AFTER="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(c.execute('select count(*) from approval_requests').fetchone()[0],c.execute('select count(*) from execution_audit').fetchone()[0])")"
          test "$BEFORE" = "$AFTER"
          rm -f /tmp/philaios-mission-control-read-model-v21f.py /tmp/philaios-read-model-v21f.json
          echo approval_and_audit_counts_unchanged=true
          echo production_change=none
          echo database_write=none
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo PHIL_AI_OS_PHASE_2_1F_READ_MODEL_CANDIDATE_VALIDATION_OK
          REMOTE
