name: Phase 1.21 Narrow Canary Gate Expansion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-narrow-canary-gate-expansion.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Replace legacy exact-canary gate with narrow approved-class gate
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          SOURCE=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/services/core/control-api/app.py
          MARKER=/etc/phil-ai-os/phase-1-21-routine-canary.env
          echo '=== PHASE 1.21 NARROW CANARY GATE EXPANSION ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          test -f "$SOURCE" -a -s "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_ACTIVE=true$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_ROUTINE_CANARY_SCOPE=one-request-only$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_AUTONOMOUS_EXPANSION=false$' "$MARKER"
          grep -q '^PHIL_AI_OS_PHASE_1_21_DIRECT_PROVIDER_BYPASS=false$' "$MARKER"

          ENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general,routine$' <<<"$ENV"
          grep -q '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=false$' <<<"$ENV"

          WORKDIR="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
          CONFIG_FILES="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
          SERVICE="$(docker inspect "$CONTROL" --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
          COMPOSE_FILE="${CONFIG_FILES%%,*}"
          if [[ "$COMPOSE_FILE" != /* ]]; then COMPOSE_FILE="$WORKDIR/$COMPOSE_FILE"; fi
          test -f "$COMPOSE_FILE"

          BACKUP="${SOURCE}.phase-1-21-pre-canary-gate-expansion.bak"
          test -e "$BACKUP" || cp -a "$SOURCE" "$BACKUP"

          python3 - "$SOURCE" <<'PY'
          import sys,ast
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          old='''    # v0.17 remains canary-only. General task execution is NOT live yet.\n    if requested != ROUTED_EXECUTION_CANARY:\n        classification = classify_task(requested)\n\n        execution_audit_write(\n            source,\n            task_class=classification["task_class"],\n            outcome="canary_not_allowlisted",\n            detail="v0.17 controlled execution remains canary-only"\n        )\n\n        return 403, {\n            "status": "execution_not_allowlisted",\n            "execution_mode": "controlled",\n            "classification": classification,\n            "timestamp": now_iso()\n        }\n\n    classification = classify_task(requested)\n    task_class = classification["task_class"]\n'''
          new='''    # Phase 1.21 narrow expansion: requests remain blocked unless their\n    # classified task class is explicitly present in the execution allowlist.\n    # Approval, budget, routing, and kill-switch gates below remain mandatory.\n    classification = classify_task(requested)\n    task_class = classification["task_class"]\n'''
          if new in s:
              print('legacy_exact_canary_gate_already_removed=yes')
          elif old in s:
              s=s.replace(old,new,1)
              ast.parse(s); p.write_text(s)
              print('legacy_exact_canary_gate_removed=yes')
          else:
              lines=s.splitlines()
              hits=[(i,l) for i,l in enumerate(lines,1) if 'v0.17 remains canary-only' in l or 'requested != ROUTED_EXECUTION_CANARY' in l]
              print('legacy_gate_hits='+repr(hits))
              raise SystemExit('confirmed legacy canary gate shape changed; no mutation written')
          PY
          python3 -m py_compile "$SOURCE"

          # Confirm the restrictive downstream class gate is still present.
          grep -q 'if task_class not in EXECUTION_ALLOWED_TASK_CLASSES:' "$SOURCE"
          grep -q 'approval_consume(' "$SOURCE"
          grep -q 'budget_allows_test(' "$SOURCE"

          docker compose -f "$COMPOSE_FILE" build "$SERVICE"
          docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate "$SERVICE"
          for i in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:4870/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          docker exec "$CONTROL" sh -lc 'cd /app && python - <<"PY"
          import app,inspect
          src=inspect.getsource(app.routed_execute)
          assert "requested != ROUTED_EXECUTION_CANARY" not in src
          assert "task_class not in EXECUTION_ALLOWED_TASK_CLASSES" in src
          assert "approval_consume(" in src
          assert "budget_allows_test(" in src
          assert "routine" in app.EXECUTION_ALLOWED_TASK_CLASSES
          print("legacy_exact_canary_gate=removed")
          print("task_class_allowlist_gate=present")
          print("approval_gate=present")
          print("budget_gate=present")
          print("routine_allowlisted=true")
          PY'

          grep -q '^PHIL_AI_OS_PHASE_1_21_CANARY_GATE_EXPANDED=true$' "$MARKER" || printf '%s\n' 'PHIL_AI_OS_PHASE_1_21_CANARY_GATE_EXPANDED=true' >> "$MARKER"
          echo mutation=legacy_exact_canary_gate_removed
          echo provider_call=none
          echo approval_consumption=none
          echo rollback_backup="$BACKUP"
          echo next_action=PHASE_1_21_SINGLE_ROUTINE_CANARY_RETRY_CURRENT_MAIN
          echo PHIL_AI_OS_PHASE_1_21_NARROW_CANARY_GATE_EXPANSION_OK
          REMOTE
