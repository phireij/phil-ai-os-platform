name: Phase 2.1N N4 Readiness Projection Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1n-n4-readiness-projection-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate wrapper
        run: python3 -m py_compile ops/phase-2.1n/philaios-read-model-wrapper-v21n.py
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"; : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts; sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Stage wrapper
        shell: bash
        run: |
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q ops/phase-2.1n/philaios-read-model-wrapper-v21n.py "$VPS_USER@$VPS_HOST:/tmp/philaios-read-model-wrapper-v21n.py"
      - name: Activate read-only readiness projection
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          BASE=/opt/phil-ai-os/mission-control/read-model.py
          BACKUP=/opt/phil-ai-os/mission-control/read-model.py.pre-phase21n
          WRAP=/tmp/philaios-read-model-wrapper-v21n.py
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          success=0
          rollback(){
            set +e
            echo rollback=started
            if [ -f "$BACKUP" ]; then
              cp "$BACKUP" "$BASE"; chmod 0644 "$BASE"
              systemctl restart phil-ai-os-mission-control-operator.service >/dev/null 2>&1 || true
              rm -f "$BACKUP"
            fi
            echo rollback=completed
          }
          cleanup(){ rc=$?; rm -f "$WRAP" /tmp/n4-model.json; if [ "$rc" -ne 0 ] && [ "$success" -ne 1 ]; then rollback; fi; }
          trap cleanup EXIT

          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          grep -q "2.1m.v1" "$BASE"
          if [ -e "$BACKUP" ]; then cmp -s "$BASE" "$BACKUP"; rm -f "$BACKUP"; fi

          cp "$BASE" "$BACKUP"; chmod 0600 "$BACKUP"
          install -m 0644 "$WRAP" "$BASE"
          python3 "$BASE" > /tmp/n4-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/n4-model.json'))
          assert d['schema_version']=='2.1n.v1'
          r=d['worker_readiness']
          assert r['agent_id']=='hermes'
          assert r['task_class_scope']=='general'
          assert r['readiness']=='indeterminate'
          assert r['reason_code']=='workload_evidence_incomplete'
          assert r['authority_effect']=='none'
          assert r['automatic_assignment'] is False
          assert r['automatic_retry'] is False
          assert r['automatic_reroute'] is False
          assert r['automatic_execution'] is False
          assert d['governance']['worker_readiness_authority_effect']=='none'
          PY

          systemctl restart phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4881/api/read-model > /tmp/n4-model.json 2>/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4881/api/read-model > /tmp/n4-model.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/n4-model.json'))
          assert d['schema_version']=='2.1n.v1'
          r=d['worker_readiness']
          assert r['readiness']=='indeterminate' and r['reason_code']=='workload_evidence_incomplete'
          assert r['authority_effect']=='none' and r['automatic_assignment'] is False and r['automatic_execution'] is False
          PY
          for m in POST PUT PATCH DELETE; do test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405; done
          test "$(curl -ksS -o /dev/null -w '%{http_code}' https://hermes-agent-whow.srv1833510.hstgr.cloud/phil-ai-os/operator/)" = 401
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('/app/state/control-plane.db')
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          r=c.execute('select agent_id,authority_ceiling,enabled,assignable from agent_registry order by agent_id').fetchall()
          assert r==[('hermes','L3',1,1)]
          PY

          success=1
          echo mission_control_schema=2.1n.v1
          echo worker_readiness=indeterminate
          echo readiness_reason=workload_evidence_incomplete
          echo readiness_authority_effect=none
          echo automatic_assignment=false
          echo automatic_execution=false
          echo dashboard_mutations=405
          echo operator_auth=401
          echo execution_allowlist=general
          echo agent_registry=hermes_L3_only
          echo lifecycle_mutation=none
          echo assignment_mutation=none
          echo approval_mutation=none
          echo execution_call=none
          echo provider_call=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1N_N4_READINESS_PROJECTION_ACTIVATION_OK
          REMOTE
