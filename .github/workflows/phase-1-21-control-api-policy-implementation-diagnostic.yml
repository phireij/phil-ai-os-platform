name: Phase 1.21 Control API Policy Implementation Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-21-control-api-policy-implementation-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH with retry
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*5))
          done
          exit 1
      - name: Inspect running Control API implementation without mutation
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.21 CONTROL API POLICY IMPLEMENTATION DIAGNOSTIC ==='
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null

          echo '--- CONTAINER IDENTITY / PROCESS ---'
          docker inspect "$CONTROL" --format 'image={{.Config.Image}} workdir={{.Config.WorkingDir}} entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}}'
          docker exec "$CONTROL" sh -lc 'pwd; ps -ef | head -n 20' || true

          echo '--- LIVE ENV ---'
          docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^PHIL_AI_OS_EXECUTION_(ALLOWED_TASK_CLASSES|KILL_SWITCH)=' || true

          echo '--- APPLICATION FILE DISCOVERY ---'
          docker exec "$CONTROL" sh -lc 'find /app /opt /srv /usr/local -maxdepth 4 -type f \( -name "*.py" -o -name "*.js" -o -name "*.ts" -o -name "*.go" \) 2>/dev/null | head -n 300' || true

          echo '--- EXECUTION POLICY REFERENCES INSIDE CONTAINER ---'
          docker exec "$CONTROL" sh -lc 'grep -RInE --exclude="*.pyc" "execution_not_allowlisted|PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES|allowed_task_classes|/v1/execute|task_class" /app /opt /srv /usr/local 2>/dev/null | head -n 320' || true

          echo '--- PYTHON MODULE OR SCRIPT CONTENT AROUND POLICY ---'
          docker exec "$CONTROL" python - <<'PY'
          from pathlib import Path
          roots=[Path('/app'),Path('/opt'),Path('/srv'),Path('/usr/local')]
          needles=('execution_not_allowlisted','PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES','allowed_task_classes')
          shown=0
          for root in roots:
              if not root.exists(): continue
              for p in root.rglob('*.py'):
                  try: lines=p.read_text(errors='ignore').splitlines()
                  except Exception: continue
                  hits=[i for i,l in enumerate(lines,1) if any(n in l for n in needles)]
                  for i in hits:
                      print(f'FILE={p} CONTEXT={max(1,i-8)}-{min(len(lines),i+12)}')
                      for j in range(max(1,i-8),min(len(lines),i+12)+1):
                          print(f'{j}: {lines[j-1]}')
                      shown+=1
                      if shown>=12: raise SystemExit
          print('policy_context_blocks='+str(shown))
          PY

          echo '--- RUNTIME PARSE CHECK ---'
          docker exec "$CONTROL" python - <<'PY'
          import os
          raw=os.getenv('PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES')
          print('raw_allowed_task_classes='+repr(raw))
          if raw is not None:
              print('comma_split='+repr([x.strip() for x in raw.split(',') if x.strip()]))
              print('routine_in_comma_split='+str('routine' in [x.strip() for x in raw.split(',') if x.strip()]).lower())
          PY

          echo mutation=none
          echo provider_call=none
          echo approval_consumption=none
          echo next_action=PATCH_CONFIRMED_CONTROL_API_POLICY_PARSER_OR_SOURCE
          echo PHIL_AI_OS_PHASE_1_21_CONTROL_API_POLICY_IMPLEMENTATION_DIAGNOSTIC_COMPLETE
          REMOTE
