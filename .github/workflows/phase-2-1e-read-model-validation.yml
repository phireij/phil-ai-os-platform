name: Phase 2.1E Read Model Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1e-read-model-validation.yml'
      - '.github/phase-2-1e-read-model-validation-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1

      - name: Stage Phase 2.1E candidate
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          scp -P "$PORT" -q ops/phase-2.1a/philaios-mission-control-read-model.py "$VPS_USER@$VPS_HOST:/tmp/philaios-phase-2-1e-read-model.py"

      - name: Validate durable read model against live state
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          DB=/app/state/control-plane.db
          test -n "$CONTROL"
          trap 'rm -f /tmp/philaios-phase-2-1e-read-model.py' EXIT

          BEFORE_APPROVALS="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('$DB'); print(c.execute('select count(*) from approval_requests').fetchone()[0])")"
          BEFORE_AUDITS="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('$DB'); print(c.execute('select count(*) from execution_audit').fetchone()[0])")"

          OUT="$(python3 /tmp/philaios-phase-2-1e-read-model.py)"
          printf '%s' "$OUT" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]=="2.1e.v1"; assert d["overall_state"]=="healthy"; assert d["governance"]["execution_allowed_task_classes"]==["general"]; s=d["durable_correlation_summary"]; assert s["correlation_key_type"]=="approval_id"; assert s["canonical_task_persistence"]=="absent"; assert s["approval_row_count_observed"]>=1; assert s["execution_audit_row_count_observed"]>=1; assert d["data_quality"]["durable_link_quality"]=="approval_id_authoritative"; links=d["durable_correlations"]; assert all(x.get("canonical_task_id") is None and x.get("correlation_key_type")=="approval_id" for x in links); ap={"approval_id","created_at","updated_at","expires_at","state","source","requester","task_class","requested_by","decision_by","decision_at","consumed_at","consumed_by"}; au={"id","occurred_at","source","task_class","provider_id","model_id","route_path","compatibility_pass","execution_mode","outcome","approval_id"}; assert all(set(x.get("approval",{})).issubset(ap) for x in links); assert all(set(a).issubset(au) for x in links for a in x.get("execution_audits",[]))'

          AFTER_APPROVALS="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('$DB'); print(c.execute('select count(*) from approval_requests').fetchone()[0])")"
          AFTER_AUDITS="$(docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('$DB'); print(c.execute('select count(*) from execution_audit').fetchone()[0])")"
          test "$BEFORE_APPROVALS" = "$AFTER_APPROVALS"
          test "$BEFORE_AUDITS" = "$AFTER_AUDITS"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer

          echo schema_version=2.1e.v1
          echo durable_correlation_key=approval_id
          echo canonical_task_persistence=absent
          echo approval_row_count_unchanged=true
          echo execution_audit_row_count_unchanged=true
          echo sensitive_durable_fields_exposed=false
          echo production_allowlist=general_only
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo production_change=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1E_READ_MODEL_VALIDATION_OK
          REMOTE
