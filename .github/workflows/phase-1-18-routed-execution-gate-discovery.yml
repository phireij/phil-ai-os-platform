name: Phase 1.18 Routed Execution Gate Discovery

on:
  push:
    branches: [ops/phase-1.18-policy-boundary]
    paths: ['.github/workflows/phase-1-18-routed-execution-gate-discovery.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Discover routed execution gate control
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api' || true)
          test -n "$CONTROL"
          echo '=== PHASE 1.18 ROUTED EXECUTION GATE DISCOVERY ==='
          echo "control_container=$CONTROL"
          docker exec "$CONTROL" sh -lc 'env | cut -d= -f1 | grep -Ei "ROUTED|EXECUTION|KILL_SWITCH|LIVE_TEST" | sort' \
            | sed 's/^/env_key=/' || true
          echo "container_cmd=$(docker inspect -f '{{json .Config.Cmd}}' "$CONTROL")"
          echo "container_entrypoint=$(docker inspect -f '{{json .Config.Entrypoint}}' "$CONTROL")"
          SRC=$(docker exec "$CONTROL" sh -lc 'grep -RIl "routed_execution_enabled\|ROUTED_EXECUTION" /app /opt 2>/dev/null | head -n 5' || true)
          if [ -n "$SRC" ]; then
            printf '%s\n' "$SRC" | while read -r f; do
              [ -n "$f" ] && echo "gate_ref=$f"
            done
          else
            echo 'gate_ref=not_found'
          fi
          HOST_REFS=$(grep -RIl 'routed_execution_enabled\|ROUTED_EXECUTION' /opt/phil-ai-os-platform /etc 2>/dev/null | head -n 8 || true)
          if [ -n "$HOST_REFS" ]; then
            printf '%s\n' "$HOST_REFS" | while read -r f; do echo "host_gate_ref=$f"; done
          else
            echo 'host_gate_ref=not_found'
          fi
          SNAP_CODE=$(curl -sS -o /tmp/p118-gate-snapshot -w '%{http_code}' http://127.0.0.1:4870/v1/mission-control/snapshot || true)
          echo "snapshot_http=$SNAP_CODE"
          rm -f /tmp/p118-gate-snapshot
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo 'control_api_health=ok'
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo 'backup_self_heal_timer=active'
          echo 'provider_call=none'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_18_ROUTED_EXECUTION_GATE_DISCOVERY_OK
          REMOTE
