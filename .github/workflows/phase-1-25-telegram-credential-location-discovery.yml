name: Phase 1.25 Telegram Credential Location Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-1-25-telegram-credential-location-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Discover Telegram credential locations without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== PHASE 1.25 TELEGRAM CREDENTIAL LOCATION DISCOVERY ==='
          echo discovery_mode=read_only

          echo '--- running containers ---'
          docker ps --format 'name={{.Names}} image={{.Image}}' | grep -Ei 'hermes|telegram|notify|bot' || true

          echo '--- likely host files (paths only) ---'
          find /opt /docker /etc /run -maxdepth 5 -type f 2>/dev/null \
            | grep -Ei '(telegram|hermes|notifier|notify|bot|env|secret|credential)' \
            | sort | head -n 500 || true

          echo '--- variable names present in candidate files (values redacted) ---'
          for f in $(find /opt/hermes-agent-whow /docker/hermes-agent-whow /etc/phil-ai-os* /opt/phil-ai-os /run/philaios -maxdepth 4 -type f 2>/dev/null | head -n 500); do
            MATCHES="$(grep -E '^(TELEGRAM_[A-Z0-9_]+|BOT_TOKEN|CHAT_ID|HOME_CHANNEL)=' "$f" 2>/dev/null | sed -E 's/=.*/=REDACTED/' || true)"
            if [ -n "$MATCHES" ]; then
              echo FILE="$f"
              printf '%s\n' "$MATCHES"
            fi
          done

          echo '--- systemd units referencing Telegram/notifier ---'
          grep -RniE 'telegram|notifier|notify|BOT_TOKEN|CHAT_ID|HOME_CHANNEL' /etc/systemd/system /usr/lib/systemd/system 2>/dev/null \
            | sed -E 's/(TOKEN|KEY|SECRET|PASSWORD)=([^ ]+)/\1=REDACTED/g' \
            | head -n 400 || true

          echo '--- Hermes container environment variable NAMES only ---'
          HERMES="$(docker ps --format '{{.Names}}' | grep -E '^hermes-agent-whow|hermes' | head -n1 || true)"
          if [ -n "$HERMES" ]; then
            docker inspect "$HERMES" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | sed -n -E 's/^([A-Za-z0-9_]*(TELEGRAM|BOT|CHAT|CHANNEL)[A-Za-z0-9_]*)=.*/\1=REDACTED/p' || true
            echo '--- Hermes mounts ---'
            docker inspect "$HERMES" --format '{{range .Mounts}}{{println .Source " -> " .Destination}}{{end}}' \
              | grep -Ei 'telegram|secret|credential|config|env|data|hermes' || true
          fi

          echo '--- notifier scripts/config references ---'
          grep -RniE 'api\.telegram\.org|sendMessage|getMe|TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|TELEGRAM_HOME_CHANNEL|BOT_TOKEN' \
            /opt/phil-ai-os /opt/hermes-agent-whow /docker/hermes-agent-whow /usr/local/bin /etc 2>/dev/null \
            | sed -E 's/(bot)[0-9]+:[A-Za-z0-9_-]+/\1REDACTED/g; s/(TOKEN|KEY|SECRET|PASSWORD)=([^ ]+)/\1=REDACTED/g' \
            | head -n 600 || true

          echo provider_call=none
          echo telegram_api_call=none
          echo production_change=none
          echo next_action=PHASE_1_25_V11_USE_PROVEN_TELEGRAM_CREDENTIAL_LOCATION
          echo PHIL_AI_OS_PHASE_1_25_TELEGRAM_CREDENTIAL_LOCATION_DISCOVERY_OK
          REMOTE
