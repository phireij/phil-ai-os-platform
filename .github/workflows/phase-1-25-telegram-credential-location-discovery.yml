name: Phase 1.25 Telegram Credential Location Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-1-25-telegram-credential-location-discovery.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Validate Telegram credential sources without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== PHASE 1.25 TELEGRAM CREDENTIAL SOURCE VALIDATION V2 ==='
          echo discovery_mode=read_only
          TMP="$(mktemp)"; trap 'rm -f "$TMP" /tmp/philaios-tg-getme.json' EXIT

          # Extract token-like values only in memory. Never print values.
          add_file_candidates() {
            f="$1"; [ -r "$f" ] || return 0
            sed -n -E 's/^(TELEGRAM_BOT_TOKEN|TELEGRAM_TOKEN|BOT_TOKEN)=(.*)$/file|'"$f"'|\1|\2/p' "$f" >> "$TMP" || true
          }
          add_file_candidates /opt/hermes-agent-whow/.env
          add_file_candidates /docker/hermes-agent-whow/.env
          add_file_candidates /etc/phil-ai-os-monitor.env
          add_file_candidates /etc/default/hermes-agent-whow
          add_file_candidates /etc/environment

          HERMES="$(docker ps --format '{{.Names}}' | grep -E '^hermes-agent-whow|hermes' | head -n1 || true)"
          if [ -n "$HERMES" ]; then
            docker inspect "$HERMES" --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
              | sed -n -E 's/^(TELEGRAM_BOT_TOKEN|TELEGRAM_TOKEN|BOT_TOKEN)=(.*)$/container|hermes|\1|\2/p' >> "$TMP" || true
          fi

          # Include systemd EnvironmentFile paths, then inspect only Telegram token variable names.
          for ef in $(grep -RhoE 'EnvironmentFile=-?[^ ]+' /etc/systemd/system 2>/dev/null | sed -E 's/EnvironmentFile=-?//' | tr -d '"' | sort -u); do add_file_candidates "$ef"; done

          # Search bounded likely configuration roots for exact token assignments.
          while IFS= read -r f; do add_file_candidates "$f"; done < <(grep -RIlE '^(TELEGRAM_BOT_TOKEN|TELEGRAM_TOKEN|BOT_TOKEN)=' /opt/hermes-agent-whow /docker/hermes-agent-whow /opt/phil-ai-os /etc 2>/dev/null | head -n 200)

          total=0; valid=0
          while IFS='|' read -r source location var raw; do
            [ -n "${raw:-}" ] || continue
            token="$(printf '%s' "$raw" | sed "s/^['\"]//; s/['\"]$//; s/[[:space:]]*$//")"
            [ -n "$token" ] || continue
            total=$((total+1))
            code="$(curl -sS -o /tmp/philaios-tg-getme.json -w '%{http_code}' "https://api.telegram.org/bot${token}/getMe" || true)"
            ok=false
            if [ "$code" = 200 ] && python3 -c 'import json; assert json.load(open("/tmp/philaios-tg-getme.json")).get("ok") is True' 2>/dev/null; then ok=true; valid=$((valid+1)); fi
            echo "candidate_source=$source location=$location variable=$var telegram_getme_valid=$ok"
          done < <(awk -F'|' '!seen[$1 FS $2 FS $3 FS $4]++' "$TMP")

          echo telegram_token_candidates_tested="$total"
          echo telegram_valid_candidates="$valid"
          echo provider_call=none
          echo production_change=none
          if [ "$valid" -gt 0 ]; then
            echo next_action=PATCH_PHASE_1_25_E2E_WITH_VALIDATED_SOURCE
            echo PHIL_AI_OS_PHASE_1_25_TELEGRAM_CREDENTIAL_SOURCE_VALIDATION_OK
          else
            echo next_action=RECONCILE_HERMES_TELEGRAM_CONFIGURATION
            echo PHIL_AI_OS_PHASE_1_25_TELEGRAM_CREDENTIAL_SOURCE_VALIDATION_NO_VALID_TOKEN
          fi
          REMOTE
