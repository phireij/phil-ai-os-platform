name: Phase 1.18 Controlled Enforcement Dry Run

on:
  push:
    branches:
      - ops/phase-1.18-policy-boundary
    paths:
      - '.github/workflows/phase-1-18-controlled-enforcement-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Validate controlled execution boundary without provider call
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow' || true)
          test -n "$HERMES"
          echo '=== PHASE 1.18 CONTROLLED ENFORCEMENT DRY RUN ==='
          docker exec "$HERMES" test -x /usr/local/bin/philaios-execute
          echo 'philaios_execute=ready'
          docker exec "$HERMES" test -s /run/philaios/hermes_control_api_token
          echo 'control_token_mount=ready'
          docker exec "$HERMES" test -f /opt/hermes/docker/main-wrapper.sh
          echo 'wrapper=ready'
          docker exec "$HERMES" test -f /opt/data/config.yaml
          echo 'config=ready'
          EXEC_HELP=$(docker exec "$HERMES" sh -lc '/usr/local/bin/philaios-execute 2>&1 || true')
          if printf '%s\n' "$EXEC_HELP" | grep -Eqi 'usage|task|class|execute|argument|required'; then
            echo 'execution_client_interface=responsive'
          else
            echo 'execution_client_interface=unclassified'
          fi
          systemctl is-active --quiet phil-ai-os-monitor.service
          echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup.timer
          echo 'backup_timer=active'
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          echo 'control_api_health=ok'
          echo 'provider_call=none'
          echo 'production_change=none'
          echo 'enforcement_mode=validation_only'
          echo PHIL_AI_OS_PHASE_1_18_CONTROLLED_ENFORCEMENT_DRY_RUN_OK
          REMOTE
