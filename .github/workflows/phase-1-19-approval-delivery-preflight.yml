name: Phase 1.19 Approval Delivery Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - ops/phase-1.19
    paths:
      - .github/workflows/phase-1-19-approval-delivery-preflight.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"

          ok=0
          for i in 1 2 3 4 5; do
            if ssh -p "$PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=accept-new \
              "$VPS_USER@$VPS_HOST" true; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Discover approval delivery contract
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api')
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          echo '=== PHASE 1.19 APPROVAL DELIVERY PREFLIGHT ==='
          echo "notifier=$(docker exec "$HERMES" sh -lc 'test -x /usr/local/bin/philaios-telegram-approval-notifier && echo ready || echo missing')"
          echo '--- notifier interface ---'
          docker exec "$HERMES" sh -lc '/usr/local/bin/philaios-telegram-approval-notifier --help 2>&1 | head -25' || true
          echo '--- approval link handler ---'
          docker exec "$CONTROL" sh -lc "sed -n '3280,3310p' /app/app.py" | grep -E 'approvals/link|payload|get\(|approval_id|self\._json' | head -20 || true
          echo '--- pending approvals ---'
          docker exec "$HERMES" /usr/local/bin/philaios-mission-control approvals | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d.get("approvals",[]); p=[x for x in a if x.get("operational_status")=="pending" or x.get("state")=="pending"]; print("pending_count="+str(len(p))); print("pending_latest="+(p[0].get("approval_id","none") if p else "none"))'
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo execution_invoked=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_19_APPROVAL_DELIVERY_PREFLIGHT_OK
          REMOTE
