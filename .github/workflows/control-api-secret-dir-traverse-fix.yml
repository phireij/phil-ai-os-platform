name: Control API Secret Directory Traverse Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-api-secret-dir-traverse-fix.yml'
      - '.github/control-api-secret-dir-traverse-fix-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-api-secret-dir-traverse-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true
      - name: Repair only Control API secret-directory group traversal
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1
          SECRET_DIR="$ROOT/infrastructure/core/secrets"
          CID="$(docker ps --filter name=phil-ai-os-core-control-api-1 --format '{{.ID}}')"
          test -n "$CID"
          test -d "$SECRET_DIR"
          echo before_mode="$(stat -c '%a' "$SECRET_DIR")"
          echo before_gid="$(stat -c '%g' "$SECRET_DIR")"
          chgrp 10001 "$SECRET_DIR"
          chmod 0750 "$SECRET_DIR"
          test "$(stat -c '%a' "$SECRET_DIR")" = 750
          test "$(stat -c '%g' "$SECRET_DIR")" = 10001
          docker exec "$CID" test -x /run/philaios-secrets
          if test -f "$SECRET_DIR/hermes_control_api_token"; then
            docker exec "$CID" test -r /run/philaios-secrets/hermes_control_api_token
            docker exec -i "$CID" python - <<'PY'
          import urllib.request
          from pathlib import Path
          token=Path('/run/philaios-secrets/hermes_control_api_token').read_text(encoding='utf-8').strip()
          req=urllib.request.Request('http://127.0.0.1:4870/v1/system',headers={'Authorization':f'Bearer {token}'})
          with urllib.request.urlopen(req,timeout=3) as response:
              assert response.status == 200
          PY
            echo control_api_secret_auth_readability=true
          else
            echo hermes_control_api_token_present=false
          fi
          if test -f "$SECRET_DIR/mission_control_password"; then
            docker exec "$CID" test -r /run/philaios-secrets/mission_control_password
            echo mission_control_password_readability=true
          fi
          curl -fsS --max-time 3 http://127.0.0.1:4870/healthz >/dev/null
          echo after_mode="$(stat -c '%a' "$SECRET_DIR")"
          echo after_gid="$(stat -c '%g' "$SECRET_DIR")"
          echo control_api_health=true
          echo secret_values_logged=false
          echo sms_send=false
          echo woo_mutation=false
          echo payment_mutation=false
          echo dns_mutation=false
          echo mission_control_mutation=false
          echo PHIL_AI_OS_CONTROL_API_SECRET_DIR_TRAVERSE_REPAIR_GREEN
          REMOTE
