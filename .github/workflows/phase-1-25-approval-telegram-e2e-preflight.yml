name: Phase 1.25 Approval and Telegram E2E Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-1-25-approval-telegram-e2e-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts; sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Discover approval and Telegram end-to-end interfaces
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=phil-ai-os-core-control-api-1
          echo '=== PHASE 1.25 APPROVAL AND TELEGRAM E2E PREFLIGHT V2 ==='
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          CENV="$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')"
          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' <<<"$CENV"
          echo production_allowlist=general_only

          echo '--- approval schema and routes ---'
          docker exec "$CONTROL" python - <<'PY'
          import sqlite3
          con=sqlite3.connect('/app/state/control-plane.db')
          for name,sql in con.execute("select name,sql from sqlite_master where type='table' and name like '%approval%' order by name"):
              print('TABLE='+name)
              print(sql or '')
          PY
          docker exec "$CONTROL" sh -lc 'grep -RniE "approval_requests|approval_id|/v1/approval|/v1/approvals|approve|reject|consume" /app 2>/dev/null | head -n 350' || true

          echo '--- notifier and telegram implementation ---'
          # Discovery pipelines are informational. With pipefail, head may close early and make
          # upstream find/grep return SIGPIPE (141); that must not fail the safety preflight.
          find /opt/phil-ai-os /usr/local/bin /etc/systemd/system -maxdepth 5 -type f 2>/dev/null | grep -Ei 'approval|telegram|notifier|notify' | sort | head -n 300 || true
          grep -RniE 'api.telegram.org|sendMessage|TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|TELEGRAM_HOME_CHANNEL|approval.*notify|notify.*approval' /opt/phil-ai-os /usr/local/bin /etc/systemd/system 2>/dev/null | head -n 400 || true

          echo '--- recent successful approval/telegram evidence ---'
          journalctl --since '7 days ago' --no-pager | grep -Ei 'PHIL_AI_OS_PHASE_1_16_TELEGRAM_TEST_OK|PHIL_AI_OS_PHASE_1_16_FINAL_INTEGRATION_OK|approval.*telegram|telegram.*approval' | tail -n 100 || true

          echo '--- monitor/telegram config presence (secrets redacted) ---'
          for f in /etc/phil-ai-os-monitor.env /opt/hermes-agent-whow/.env /opt/hermes-agent-whow/*env*; do
            [ -f "$f" ] || continue
            echo FILE="$f"
            grep -E 'TELEGRAM_(BOT_TOKEN|CHAT_ID|HOME_CHANNEL)' "$f" | sed -E 's/=.*/=REDACTED/' || true
          done

          systemctl is-active --quiet phil-ai-os-monitor.service
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          echo provider_call=none
          echo production_change=none
          echo telegram_message_sent=false
          echo approval_mutation=none
          echo preflight_mode=read_only
          echo next_action=PHASE_1_25_APPROVAL_TELEGRAM_E2E_CONTROLLED_VALIDATION
          echo PHIL_AI_OS_PHASE_1_25_APPROVAL_TELEGRAM_E2E_PREFLIGHT_OK
          REMOTE
