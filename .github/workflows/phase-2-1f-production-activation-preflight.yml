name: Phase 2.1F Production Activation Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-1f-production-activation-preflight.yml'
      - '.github/phase-2-1f-production-preflight-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          : > ~/.ssh/known_hosts
          for attempt in 1 2 3 4 5 6; do
            TMP="$(mktemp)"
            if ssh-keyscan -T 20 -p "$PORT" -H "$VPS_HOST" > "$TMP" 2>/dev/null && test -s "$TMP"; then
              cat "$TMP" >> ~/.ssh/known_hosts
              sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
              if ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$VPS_USER@$VPS_HOST" true; then rm -f "$TMP"; exit 0; fi
            fi
            rm -f "$TMP"; sleep $((attempt*10))
          done
          exit 1
      - name: Phase 2.1F read-only production activation preflight
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes -o ConnectTimeout=25 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          HERMES="$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')"
          DB=/app/state/control-plane.db
          COMPOSE=/opt/phil-ai-os-platform/phil-ai-os-platform-phase1/infrastructure/core/compose.yml
          HOSTNAME=hermes-agent-whow.srv1833510.hstgr.cloud
          test -n "$CONTROL"; test -n "$HERMES"; test -f "$COMPOSE"
          echo checkpoint=runtime_objects_present

          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS --max-time 5 http://127.0.0.1:4870/readyz >/dev/null
          echo checkpoint=control_api_health_ready

          RUNTIME_IMAGE="$(docker inspect "$CONTROL" --format '{{.Config.Image}}')"
          APP_HASH="$(docker exec "$CONTROL" sha256sum /app/app.py | awk '{print $1}')"
          COMPOSE_IMAGE="$(docker compose -f "$COMPOSE" config --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["services"]["control-api"]["image"])')"
          echo runtime_image="$RUNTIME_IMAGE"
          echo compose_resolved_image="$COMPOSE_IMAGE"
          test "$RUNTIME_IMAGE" = 'phil-ai-os/control-api:0.20.0'
          test "$APP_HASH" = 'c950ff968d54d083ae36c318fc97d279be78dd1543913c28d1e3d2b57fd29046'
          test "$COMPOSE_IMAGE" = "$RUNTIME_IMAGE"
          echo checkpoint=image_and_compose_baseline

          docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3
          db='/app/state/control-plane.db'
          c=sqlite3.connect(db)
          try:
              assert c.execute('pragma quick_check').fetchone()[0]=='ok'
              ac=[r[1] for r in c.execute('pragma table_info(approval_requests)')]
              ec=[r[1] for r in c.execute('pragma table_info(execution_audit)')]
              assert 'task_id' not in ac
              assert 'task_id' not in ec
              print('approval_rows='+str(c.execute('select count(*) from approval_requests').fetchone()[0]))
              print('execution_audit_rows='+str(c.execute('select count(*) from execution_audit').fetchone()[0]))
          finally:
              c.close()
          PY
          echo checkpoint=database_baseline

          grep -q '^PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES=general$' < <(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}')
          echo checkpoint=general_only_allowlist

          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          echo checkpoint=recovery_and_operator_services_active

          ss -ltnp | grep -F '127.0.0.1:4881' >/dev/null
          ! ss -ltnp | grep -Eq '(^|[[:space:]])(0\.0\.0\.0|\[::\]):4881'
          echo checkpoint=operator_loopback_only

          OP_CODE="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOSTNAME/phil-ai-os/operator/" || true)"
          echo operator_unauthenticated_status="$OP_CODE"
          test "$OP_CODE" = '401'
          echo checkpoint=operator_basic_auth_fail_closed

          for method in POST PUT PATCH DELETE; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -X "$method" --max-time 5 http://127.0.0.1:4881/)"
            echo "operator_local_${method}_status=$code"
            test "$code" = '405'
          done
          echo checkpoint=operator_mutations_blocked

          APPROVAL_CODE="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOSTNAME/phil-ai-os/approval/" || true)"
          MC_CODE="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "https://$HOSTNAME/phil-ai-os/mission-control" || true)"
          echo approval_route_status="$APPROVAL_CODE"
          echo mission_control_route_status="$MC_CODE"
          test "$APPROVAL_CODE" != '000'
          test "$MC_CODE" != '000'
          echo checkpoint=existing_routes_reachable

          echo control_api_health=ok
          echo control_api_readiness=ok
          echo baseline_image=phil-ai-os/control-api:0.20.0
          echo baseline_app_hash=verified
          echo compose_baseline=verified
          echo live_database_quick_check=ok
          echo canonical_task_columns=absent_baseline
          echo production_allowlist=general_only
          echo monitor=active
          echo backup_timer=active
          echo backup_self_heal=active
          echo operator_auth_boundary=401_unauthenticated
          echo browser_mutation_methods=405
          echo provider_call=none
          echo execution_call=none
          echo approval_mutation=none
          echo database_write=none
          echo database_schema_change=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_1F_PRODUCTION_ACTIVATION_PREFLIGHT_OK
          REMOTE
