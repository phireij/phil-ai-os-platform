name: Phase 1.19 Agent Approval Request Contract

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-agent-request-contract.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break; sleep 3; done
          test -s ~/.ssh/known_hosts
      - name: Discover approval request contract
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api')
          echo '=== PHASE 1.19 AGENT APPROVAL REQUEST CONTRACT ==='
          echo '--- request handler ---'
          docker exec "$CONTROL" sh -lc "sed -n '3388,3425p' /app/app.py | grep -E 'path==|payload|get\(|request|source|task|ttl|approval|return' | head -30" || true
          echo '--- approval schema ---'
          docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(','.join(r[1] for r in c.execute('pragma table_info(approval_requests)')))"
          echo '--- client durability ---'
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow')
          echo "mission_control_client=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-mission-control && echo ready || echo missing)"
          echo "execute_client=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-execute && echo ready || echo missing)"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo monitor=active
          curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo control_api_health=ok
          echo provider_call=none
          echo production_change=none
          echo PHIL_AI_OS_PHASE_1_19_AGENT_APPROVAL_REQUEST_CONTRACT_OK
          REMOTE
