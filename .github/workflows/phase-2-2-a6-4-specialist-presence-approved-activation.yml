name: Phase 2.2 A6.4 Approved Specialist Presence Activation

# CEO approval received in chat on 2026-08-28. Scope is A6.4 only.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase-2-2-a6-4-specialist-presence-approved-activation.yml'

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure IPv4 SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for attempt in 1 2 3 4; do
            if ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ConnectionAttempts=1 -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" true; then exit 0; fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Activate signed presence-only runtime with rollback containment
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -4 -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee phase22-a6-4-evidence.txt
          set -euo pipefail

          CONTROL="$(docker ps --format '{{.Names}}' | grep -m1 'control-api')"
          test -n "$CONTROL"

          AGENT_ID='specialist-worker-01'
          SCRIPT='/usr/local/sbin/philaios-specialist-worker-01-presence-heartbeat'
          SERVICE='/etc/systemd/system/phil-ai-os-specialist-worker-01-presence.service'
          TIMER='/etc/systemd/system/phil-ai-os-specialist-worker-01-presence.timer'
          IDENTITY_PARENT='/var/lib/phil-ai-os/agent-identities'
          IDENTITY_DIR="$IDENTITY_PARENT/$AGENT_ID"
          PRIVATE_KEY="$IDENTITY_DIR/private.pem"
          PUBLIC_KEY="$IDENTITY_DIR/public.pem"
          PRESENCE_DIR='/var/lib/phil-ai-os/agent-presence'
          EVIDENCE="$PRESENCE_DIR/$AGENT_ID.json"

          # Protected production preflight.
          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          for m in POST PUT PATCH DELETE; do
            test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405
          done
          command -v openssl >/dev/null
          command -v python3 >/dev/null
          test -d "$PRESENCE_DIR"

          # Fail closed on any unexpected namespace collision.
          test ! -e "$SCRIPT"
          test ! -e "$SERVICE"
          test ! -e "$TIMER"
          test ! -e "$IDENTITY_DIR"
          test ! -e "$EVIDENCE"
          for unit in phil-ai-os-specialist-worker-01-presence.service phil-ai-os-specialist-worker-01-presence.timer; do
            ! systemctl list-unit-files --no-legend 2>/dev/null | awk '{print $1}' | grep -Fxq "$unit"
          done

          HERMES_SCRIPT_HASH="$(sha256sum /usr/local/sbin/philaios-agent-heartbeat | awk '{print $1}')"
          HERMES_SERVICE_HASH="$(systemctl cat phil-ai-os-agent-heartbeat.service | sha256sum | awk '{print $1}')"
          HERMES_TIMER_HASH="$(systemctl cat phil-ai-os-agent-heartbeat.timer | sha256sum | awk '{print $1}')"

          BASELINE="$(docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          reg=[dict(r) for r in c.execute('select * from agent_registry order by agent_id')]
          assert len(reg)==2
          h=next(r for r in reg if r['agent_id']=='hermes')
          s=next(r for r in reg if r['agent_id']=='specialist-worker-01')
          assert h['authority_ceiling']=='L3' and int(h['enabled'])==1 and int(h['assignable'])==1
          assert s['authority_ceiling']=='L1' and int(s['enabled'])==0 and int(s['assignable'])==0
          assert c.execute("select count(*) from task_lifecycle_events where assigned_agent_id='specialist-worker-01'").fetchone()[0]==0
          assert c.execute("select count(*) from sqlite_master where type='table' and name='task_handoffs'").fetchone()[0]==0
          tracked=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit']
          counts={t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}
          print(json.dumps({'registry':reg,'counts':counts},sort_keys=True,separators=(',',':'),default=str))
          PY
          )"
          echo baseline_captured=true

          PARENT_EXISTED=0
          [ -d "$IDENTITY_PARENT" ] && PARENT_EXISTED=1
          MUTATED=0
          rollback() {
            rc=$?
            if [ "$MUTATED" -eq 1 ]; then
              echo rollback_attempted=true
              systemctl disable --now phil-ai-os-specialist-worker-01-presence.timer >/dev/null 2>&1 || true
              systemctl stop phil-ai-os-specialist-worker-01-presence.service >/dev/null 2>&1 || true
              rm -f "$SERVICE" "$TIMER" "$SCRIPT" "$EVIDENCE"
              rm -rf "$IDENTITY_DIR"
              if [ "$PARENT_EXISTED" -eq 0 ]; then rmdir "$IDENTITY_PARENT" >/dev/null 2>&1 || true; fi
              systemctl daemon-reload || true
              echo rollback_completed=true
            fi
            exit "$rc"
          }
          trap rollback ERR

          # Authorized A6.4 mutation starts here: identity-specific presence-only runtime.
          MUTATED=1
          install -d -m 700 -o root -g root "$IDENTITY_PARENT"
          install -d -m 700 -o root -g root "$IDENTITY_DIR"
          umask 077
          openssl genpkey -algorithm ED25519 -out "$PRIVATE_KEY"
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_KEY"
          chmod 600 "$PRIVATE_KEY"
          chmod 644 "$PUBLIC_KEY"

          cat > "$SCRIPT" <<'PY'
          #!/usr/bin/env python3
          import base64, datetime, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request

          AGENT_ID='specialist-worker-01'
          PRIVATE_KEY=pathlib.Path('/var/lib/phil-ai-os/agent-identities/specialist-worker-01/private.pem')
          PUBLIC_KEY=pathlib.Path('/var/lib/phil-ai-os/agent-identities/specialist-worker-01/public.pem')
          EVIDENCE=pathlib.Path('/var/lib/phil-ai-os/agent-presence/specialist-worker-01.json')

          def probe(path):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4870'+path, timeout=3) as r:
                      return r.status == 200
              except Exception:
                  return False

          health=probe('/healthz')
          ready=probe('/readyz')
          if not health or not ready:
              raise SystemExit('local Control API health/readiness observation failed')

          observed_at=datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload={
              'agent_id':AGENT_ID,
              'assignable':False,
              'authority_ceiling':'L1',
              'control_api_health':'green',
              'control_api_readiness':'green',
              'enabled':False,
              'observation_type':'local_control_api_health_roundtrip',
              'observed_at':observed_at,
              'schema_version':'2.2-a6.4-presence.v1',
              'status':'fresh',
          }
          canonical=json.dumps(payload,sort_keys=True,separators=(',',':')).encode()

          pub_der=subprocess.check_output(['openssl','pkey','-pubin','-in',str(PUBLIC_KEY),'-outform','DER'])
          fingerprint=hashlib.sha256(pub_der).hexdigest()

          with tempfile.TemporaryDirectory(prefix='philaios-a64-') as td:
              msg=pathlib.Path(td)/'payload.json'
              sig=pathlib.Path(td)/'signature.bin'
              msg.write_bytes(canonical)
              subprocess.run(['openssl','pkeyutl','-sign','-inkey',str(PRIVATE_KEY),'-rawin','-in',str(msg),'-out',str(sig)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey',str(PUBLIC_KEY),'-sigfile',str(sig),'-rawin','-in',str(msg)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              signature=base64.b64encode(sig.read_bytes()).decode('ascii')

          envelope={
              'payload':payload,
              'public_key_sha256':fingerprint,
              'signature_algorithm':'ed25519',
              'signature_base64':signature,
          }
          EVIDENCE.parent.mkdir(parents=True,exist_ok=True)
          tmp=EVIDENCE.with_name(EVIDENCE.name+'.tmp')
          tmp.write_text(json.dumps(envelope,sort_keys=True,separators=(',',':'))+'\n')
          os.chmod(tmp,0o644)
          os.replace(tmp,EVIDENCE)
          PY
          chmod 755 "$SCRIPT"
          chown root:root "$SCRIPT"

          cat > "$SERVICE" <<'UNIT'
          [Unit]
          Description=Phil AI OS specialist-worker-01 signed presence heartbeat
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          User=root
          Group=root
          UMask=0077
          ExecStart=/usr/local/sbin/philaios-specialist-worker-01-presence-heartbeat
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=true
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true
          LockPersonality=true
          CapabilityBoundingSet=
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          InaccessiblePaths=-/run/philaios -/var/run/docker.sock
          ReadOnlyPaths=/var/lib/phil-ai-os/agent-identities/specialist-worker-01
          ReadWritePaths=/var/lib/phil-ai-os/agent-presence
          UNIT

          cat > "$TIMER" <<'UNIT'
          [Unit]
          Description=Phil AI OS specialist-worker-01 signed presence heartbeat timer

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=60s
          AccuracySec=10s
          Persistent=true
          Unit=phil-ai-os-specialist-worker-01-presence.service

          [Install]
          WantedBy=timers.target
          UNIT
          chmod 644 "$SERVICE" "$TIMER"
          chown root:root "$SERVICE" "$TIMER"

          # Static capability-denial proof before starting the runtime.
          python3 - <<'PY'
          import pathlib,re
          t=pathlib.Path('/usr/local/sbin/philaios-specialist-worker-01-presence-heartbeat').read_text()
          forbidden=[
              r'/v1/execute', r'/v1/tasks/assign', r'/v1/tasks/plan', r'handoff',
              r'approval', r'Authorization', r'Bearer', r'openai', r'openrouter',
              r'anthropic', r'gemini', r'docker', r'/run/philaios', r'API[_-]?KEY'
          ]
          for p in forbidden:
              assert not re.search(p,t,re.I), p
          PY

          systemctl daemon-reload
          systemctl start phil-ai-os-specialist-worker-01-presence.service
          systemctl enable --now phil-ai-os-specialist-worker-01-presence.timer
          systemctl is-active --quiet phil-ai-os-specialist-worker-01-presence.timer
          test -s "$EVIDENCE"

          # Independently verify signature, freshness, bounded evidence, and identity.
          python3 - <<'PY'
          import base64,datetime,json,pathlib,subprocess,tempfile
          p=pathlib.Path('/var/lib/phil-ai-os/agent-presence/specialist-worker-01.json')
          e=json.loads(p.read_text())
          assert set(e)=={'payload','public_key_sha256','signature_algorithm','signature_base64'}
          assert e['signature_algorithm']=='ed25519'
          pl=e['payload']
          assert pl['agent_id']=='specialist-worker-01'
          assert pl['authority_ceiling']=='L1' and pl['enabled'] is False and pl['assignable'] is False
          assert pl['control_api_health']=='green' and pl['control_api_readiness']=='green'
          assert pl['observation_type']=='local_control_api_health_roundtrip'
          assert pl['status']=='fresh'
          ts=datetime.datetime.fromisoformat(pl['observed_at'])
          age=(datetime.datetime.now(datetime.timezone.utc)-ts).total_seconds()
          assert 0 <= age <= 120, age
          canonical=json.dumps(pl,sort_keys=True,separators=(',',':')).encode()
          with tempfile.TemporaryDirectory(prefix='philaios-a64-verify-') as td:
              msg=pathlib.Path(td)/'payload.json'; sig=pathlib.Path(td)/'signature.bin'
              msg.write_bytes(canonical); sig.write_bytes(base64.b64decode(e['signature_base64'],validate=True))
              subprocess.run(['openssl','pkeyutl','-verify','-pubin','-inkey','/var/lib/phil-ai-os/agent-identities/specialist-worker-01/public.pem','-sigfile',str(sig),'-rawin','-in',str(msg)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          forbidden=('token','credential','authorization','bearer','prompt','task_text','provider_response','api_key')
          low=p.read_text().lower()
          assert not any(x in low for x in forbidden)
          print('specialist_presence_age_seconds='+str(round(age,3)))
          print('specialist_presence_signature_verified=true')
          print('specialist_presence_identity_verified=true')
          print('specialist_presence_status=fresh')
          PY

          test "$(stat -c %a "$PRIVATE_KEY")" = 600
          test "$(stat -c %U:%G "$PRIVATE_KEY")" = root:root
          test "$(stat -c %a "$IDENTITY_DIR")" = 700
          echo specialist_private_key_mode=600
          echo specialist_identity_directory_mode=700
          echo specialist_public_key_sha256="$(openssl pkey -pubin -in "$PUBLIC_KEY" -outform DER | sha256sum | awk '{print $1}')"

          # Production state must remain non-eligible and database-unchanged.
          FINAL="$(docker exec -i "$CONTROL" python3 - <<'PY'
          import sqlite3,json
          c=sqlite3.connect('file:/app/state/control-plane.db?mode=ro',uri=True); c.row_factory=sqlite3.Row
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          reg=[dict(r) for r in c.execute('select * from agent_registry order by agent_id')]
          assert len(reg)==2
          h=next(r for r in reg if r['agent_id']=='hermes')
          s=next(r for r in reg if r['agent_id']=='specialist-worker-01')
          assert h['authority_ceiling']=='L3' and int(h['enabled'])==1 and int(h['assignable'])==1
          assert s['authority_ceiling']=='L1' and int(s['enabled'])==0 and int(s['assignable'])==0
          assert c.execute("select count(*) from task_lifecycle_events where assigned_agent_id='specialist-worker-01'").fetchone()[0]==0
          assert c.execute("select count(*) from sqlite_master where type='table' and name='task_handoffs'").fetchone()[0]==0
          tracked=['agent_registry','task_lifecycle_events','task_plans','approval_requests','execution_audit']
          counts={t:c.execute(f'select count(*) from {t}').fetchone()[0] for t in tracked}
          print(json.dumps({'registry':reg,'counts':counts},sort_keys=True,separators=(',',':'),default=str))
          PY
          )"
          python3 - "$BASELINE" "$FINAL" <<'PY'
          import json,sys
          b=json.loads(sys.argv[1]); f=json.loads(sys.argv[2])
          assert f==b, (b,f)
          PY

          test "$(sha256sum /usr/local/sbin/philaios-agent-heartbeat | awk '{print $1}')" = "$HERMES_SCRIPT_HASH"
          test "$(systemctl cat phil-ai-os-agent-heartbeat.service | sha256sum | awk '{print $1}')" = "$HERMES_SERVICE_HASH"
          test "$(systemctl cat phil-ai-os-agent-heartbeat.timer | sha256sum | awk '{print $1}')" = "$HERMES_TIMER_HASH"
          systemctl is-active --quiet phil-ai-os-agent-heartbeat.timer

          curl -fsS http://127.0.0.1:4870/healthz >/dev/null
          curl -fsS http://127.0.0.1:4870/readyz >/dev/null
          systemctl is-active --quiet phil-ai-os-mission-control-operator.service
          systemctl is-active --quiet phil-ai-os-monitor.service
          systemctl is-active --quiet phil-ai-os-backup.timer
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer
          test "$(docker exec "$CONTROL" sh -lc 'printf %s "$PHIL_AI_OS_EXECUTION_ALLOWED_TASK_CLASSES"')" = general
          for m in POST PUT PATCH DELETE; do
            test "$(curl -sS -X "$m" -o /dev/null -w '%{http_code}' http://127.0.0.1:4881/api/read-model)" = 405
          done

          trap - ERR
          MUTATED=0
          echo specialist_agent_id=specialist-worker-01
          echo specialist_authority_ceiling=L1
          echo specialist_enabled=false
          echo specialist_assignable=false
          echo specialist_presence_runtime=active
          echo specialist_presence_timer=active
          echo specialist_control_api_bearer_token=none
          echo specialist_provider_credentials=none
          echo specialist_execution_capability=none
          echo specialist_assignment_refs=0
          echo task_handoffs_table=absent
          echo hermes_heartbeat_unchanged=true
          echo registry_delta=0
          echo lifecycle_delta=0
          echo plan_delta=0
          echo approval_delta=0
          echo execution_audit_delta=0
          echo execution_allowlist=general
          echo mission_control_mutations=405
          echo automatic_assignment=false
          echo automatic_retry=false
          echo automatic_reroute=false
          echo automatic_delegation=false
          echo automatic_execution=false
          echo provider_call=none
          echo execution_call=none
          echo authority_expansion=none
          echo PHIL_AI_OS_PHASE_2_2_A6_4_SPECIALIST_PRESENCE_ACTIVATION_OK
          REMOTE

      - name: Upload A6.4 activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2-2-a6-4-specialist-presence-activation-evidence
          path: phase22-a6-4-evidence.txt
          if-no-files-found: error
          retention-days: 30
