name: Production Prep Ruby Business Profile CI

on:
  pull_request:
    paths:
      - "contracts/commerce/verified-ruby-business-profile.schema.json"
      - "ops/readiness/verified-ruby-business-profile.template.json"
      - "docs/RUBY_BUSINESS_PROFILE_VERIFICATION_FORM_2026-08-28.md"
      - "scripts/validate_ruby_business_profile_template.py"
      - ".github/workflows/production-prep-ruby-business-profile-ci.yml"
  push:
    branches:
      - "production-prep/**"
    paths:
      - "contracts/commerce/verified-ruby-business-profile.schema.json"
      - "ops/readiness/verified-ruby-business-profile.template.json"
      - "docs/RUBY_BUSINESS_PROFILE_VERIFICATION_FORM_2026-08-28.md"
      - "scripts/validate_ruby_business_profile_template.py"
      - ".github/workflows/production-prep-ruby-business-profile-ci.yml"

permissions:
  contents: read

jobs:
  verify-profile-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          python -m json.tool contracts/commerce/verified-ruby-business-profile.schema.json >/dev/null
          python -m json.tool ops/readiness/verified-ruby-business-profile.template.json >/dev/null

      - name: Validate verification template and migration boundary
        run: python scripts/validate_ruby_business_profile_template.py

      - name: Assert no populated or authorized production profile
        run: |
          set -euo pipefail
          ! grep -R -E '"profile_complete"[[:space:]]*:[[:space:]]*true' ops/readiness/verified-ruby-business-profile.template.json
          ! grep -R -E '"production_publish_authorized"[[:space:]]*:[[:space:]]*true' contracts/commerce/verified-ruby-business-profile.schema.json ops/readiness/verified-ruby-business-profile.template.json
          ! grep -R -E '"verification_status"[[:space:]]*:[[:space:]]*"verified"' ops/readiness/verified-ruby-business-profile.template.json
          echo PHIL_AI_OS_RUBY_BUSINESS_PROFILE_NO_FALSE_VERIFICATION_GREEN

      - name: Assert no WooCommerce credential material
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^A-Za-z])(ck_[A-Za-z0-9]{20,}|cs_[A-Za-z0-9]{20,})' contracts/commerce/verified-ruby-business-profile.schema.json ops/readiness/verified-ruby-business-profile.template.json docs/RUBY_BUSINESS_PROFILE_VERIFICATION_FORM_2026-08-28.md
          echo PHIL_AI_OS_RUBY_BUSINESS_PROFILE_CREDENTIAL_BOUNDARY_GREEN
