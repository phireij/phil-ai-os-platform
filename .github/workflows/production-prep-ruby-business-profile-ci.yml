name: Production Prep Ruby Business Profile CI

on:
  pull_request:
    paths:
      - "contracts/commerce/verified-ruby-business-profile.schema.json"
      - "ops/readiness/verified-ruby-business-profile.template.json"
      - "docs/RUBY_BUSINESS_PROFILE_VERIFICATION_FORM_2026-08-28.md"
      - "docs/RUBY_BUSINESS_PROFILE_CUSTOMER_CONTENT_DRAFTS_2026-08-28.md"
      - "docs/RUBY_PRIVACY_POLICY_TERMS_DRAFTS_2026-08-29.md"
      - "docs/RUBY_PRIVACY_TERMS_APPROVAL_RECORD_2026-08-29.md"
      - "docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md"
      - "docs/RUBY_TOKUSHOHO_LEGACY_SOURCE_CAPTURE_2026-08-29.md"
      - "scripts/validate_ruby_business_profile_template.py"
      - ".github/workflows/production-prep-ruby-business-profile-ci.yml"
  push:
    branches:
      - "production-prep/**"
    paths:
      - "contracts/commerce/verified-ruby-business-profile.schema.json"
      - "ops/readiness/verified-ruby-business-profile.template.json"
      - "docs/RUBY_BUSINESS_PROFILE_VERIFICATION_FORM_2026-08-28.md"
      - "docs/RUBY_BUSINESS_PROFILE_CUSTOMER_CONTENT_DRAFTS_2026-08-28.md"
      - "docs/RUBY_PRIVACY_POLICY_TERMS_DRAFTS_2026-08-29.md"
      - "docs/RUBY_PRIVACY_TERMS_APPROVAL_RECORD_2026-08-29.md"
      - "docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md"
      - "docs/RUBY_TOKUSHOHO_LEGACY_SOURCE_CAPTURE_2026-08-29.md"
      - "scripts/validate_ruby_business_profile_template.py"
      - ".github/workflows/production-prep-ruby-business-profile-ci.yml"

permissions:
  contents: read

jobs:
  verify-profile-template:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON syntax
        run: |
          python -m json.tool contracts/commerce/verified-ruby-business-profile.schema.json >/dev/null
          python -m json.tool ops/readiness/verified-ruby-business-profile.template.json >/dev/null

      - name: Validate completed profile and reconciled Tokushoho source
        run: python scripts/validate_ruby_business_profile_template.py

      - name: Assert profile complete, Tokushoho reconciled, publication still gated
        run: |
          set -euo pipefail
          grep -E '"profile_complete"[[:space:]]*:[[:space:]]*true' ops/readiness/verified-ruby-business-profile.template.json
          ! grep -R -E '"production_publish_authorized"[[:space:]]*:[[:space:]]*true' contracts/commerce/verified-ruby-business-profile.schema.json ops/readiness/verified-ruby-business-profile.template.json
          grep -F 'PHIL_AI_OS_RUBY_TOKUSHOHO_LEGACY_SOURCE_CAPTURED_EMAIL_CORRECTION_APPROVED' docs/RUBY_TOKUSHOHO_LEGACY_SOURCE_CAPTURE_2026-08-29.md
          grep -F 'PHIL_AI_OS_RUBY_TOKUSHOHO_SOURCE_RECONCILED_EMAIL_UPDATED_PUBLICATION_PENDING_APPROVAL' docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md
          grep -F 'info@rubyscakedelights.shop' docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md
          ! grep -F 'rubyscakedelights@gmail.com' docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md
          grep -F 'BOMBEO PHILIP GO' docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md
          grep -F 'ヤマト運輸（クール宅急便）' docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md
          grep -F 'tokushoho_publication_approved: false' docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md
          echo PHIL_AI_OS_RUBY_TOKUSHOHO_RECONCILED_PUBLISH_GATED_GREEN

      - name: Assert no WooCommerce credential material
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^A-Za-z])(ck_[A-Za-z0-9]{20,}|cs_[A-Za-z0-9]{20,})' \
            contracts/commerce/verified-ruby-business-profile.schema.json \
            ops/readiness/verified-ruby-business-profile.template.json \
            docs/RUBY_BUSINESS_PROFILE_VERIFICATION_FORM_2026-08-28.md \
            docs/RUBY_BUSINESS_PROFILE_CUSTOMER_CONTENT_DRAFTS_2026-08-28.md \
            docs/RUBY_PRIVACY_POLICY_TERMS_DRAFTS_2026-08-29.md \
            docs/RUBY_PRIVACY_TERMS_APPROVAL_RECORD_2026-08-29.md \
            docs/RUBY_TOKUSHOHO_EXPANSION_DRAFT_2026-08-29.md \
            docs/RUBY_TOKUSHOHO_LEGACY_SOURCE_CAPTURE_2026-08-29.md
          echo PHIL_AI_OS_RUBY_BUSINESS_PROFILE_CREDENTIAL_BOUNDARY_GREEN
