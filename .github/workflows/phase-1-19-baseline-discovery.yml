name: Phase 1.19 Mission Control Agent Baseline

on:
  push:
    branches: [ops/phase-1.19]
    paths: ['.github/workflows/phase-1-19-baseline-discovery.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 3
          done
          test -s ~/.ssh/known_hosts
      - name: Discover Mission Control agent baseline
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          CONTROL=$(docker ps --format '{{.Names}}' | grep -m1 'control-api' || true)
          HERMES=$(docker ps --format '{{.Names}}' | grep -m1 '^hermes-agent-whow' || true)
          test -n "$CONTROL"
          test -n "$HERMES"
          echo '=== PHASE 1.19 MISSION CONTROL AGENT BASELINE ==='
          echo "control_api=$CONTROL"
          echo "hermes=$HERMES"
          echo "control_api_health=$(curl -fsS --max-time 5 http://127.0.0.1:4870/healthz >/dev/null && echo ok || echo failed)"
          echo "execution_client=$(docker exec "$HERMES" test -x /usr/local/bin/philaios-execute && echo ready || echo missing)"
          echo "routed_execution=$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^PHIL_AI_OS_ROUTED_EXECUTION_ENABLED=' | head -1)"
          echo "kill_switch=$(docker inspect "$CONTROL" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^PHIL_AI_OS_EXECUTION_KILL_SWITCH=' | head -1)"
          echo '--- mission control routes ---'
          docker exec "$CONTROL" sh -lc "grep -nE '/(mission|approval|execution|agent|dashboard|snapshot|health)' /app/app.py | head -40" || true
          echo '--- agent/approval tables ---'
          docker exec "$CONTROL" python3 -c "import sqlite3; c=sqlite3.connect('/app/state/control-plane.db'); print(','.join(r[0] for r in c.execute(\"select name from sqlite_master where type='table' order by name\") if any(x in r[0] for x in ('approval','execution','agent','audit'))))"
          systemctl is-active --quiet phil-ai-os-monitor.service && echo 'monitor=active'
          systemctl is-active --quiet phil-ai-os-backup.timer && echo 'backup_timer=active'
          systemctl is-active --quiet phil-ai-os-backup-self-heal.timer && echo 'backup_self_heal_timer=active'
          echo 'provider_call=none'
          echo 'production_change=none'
          echo PHIL_AI_OS_PHASE_1_19_MISSION_CONTROL_AGENT_BASELINE_OK
          REMOTE
