name: WooCommerce Contract Tests

on:
  pull_request:
    paths:
      - 'commerce/woocommerce/**'
      - '.github/workflows/commerce-woocommerce-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'commerce/woocommerce/**'
      - '.github/workflows/commerce-woocommerce-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run WooCommerce foundation tests
        working-directory: commerce/woocommerce
        run: python -m pytest -q
