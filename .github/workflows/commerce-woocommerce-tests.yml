name: WooCommerce Contract Tests

on:
  pull_request:
    paths:
      - 'commerce/woocommerce/**'
      - 'contracts/commerce/**'
      - '.github/workflows/commerce-woocommerce-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'commerce/woocommerce/**'
      - 'contracts/commerce/**'
      - '.github/workflows/commerce-woocommerce-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WooCommerce foundation tests
        working-directory: commerce/woocommerce
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate catalog and tax intake gate
        working-directory: commerce/woocommerce
        env:
          PYTHONPATH: src
        run: python tools_validate_catalog_readiness.py
