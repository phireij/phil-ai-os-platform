name: WooCommerce Contract Tests

on:
  pull_request:
    paths:
      - 'commerce/woocommerce/**'
      - 'contracts/commerce/**'
      - '.github/workflows/commerce-woocommerce-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'commerce/woocommerce/**'
      - 'contracts/commerce/**'
      - '.github/workflows/commerce-woocommerce-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run WooCommerce foundation tests
        working-directory: commerce/woocommerce
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate catalog and tax intake gate
        working-directory: commerce/woocommerce
        env:
          PYTHONPATH: src
        run: python tools_validate_catalog_readiness.py
