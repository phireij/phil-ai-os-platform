name: WooCommerce Contract Tests

on:
  pull_request:
    paths:
      - 'commerce/woocommerce/**'
      - 'contracts/commerce/**'
      - 'ops/readiness/ruby-japan-consumption-tax-status-2026-09-03.json'
      - 'ops/readiness/ruby-checkout-legal-payment-shipping-sync-2026-09-04.json'
      - '.github/workflows/commerce-woocommerce-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'commerce/woocommerce/**'
      - 'contracts/commerce/**'
      - 'ops/readiness/ruby-japan-consumption-tax-status-2026-09-03.json'
      - 'ops/readiness/ruby-checkout-legal-payment-shipping-sync-2026-09-04.json'
      - '.github/workflows/commerce-woocommerce-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run WooCommerce foundation tests
        working-directory: commerce/woocommerce
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate catalog and tax intake gate
        working-directory: commerce/woocommerce
        env:
          PYTHONPATH: src
        run: python tools_validate_catalog_readiness.py
      - name: Validate final catalog handoff contract
        working-directory: commerce/woocommerce
        run: python tools_validate_catalog_handoff.py
      - name: Exercise owner catalog package CLI against pending template
        working-directory: commerce/woocommerce
        env:
          PYTHONPATH: src
        run: python tools_validate_owner_catalog_package.py fixtures/production-catalog-intake.template.json --expect-pending
