name: phil-ai-os-woocommerce-dev

# LOCAL/ISOLATED DEVELOPMENT ONLY.
# This compose file does not contain WooCommerce production credentials and is
# not referenced by production deployment workflows.
services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-development-only
      MARIADB_ROOT_PASSWORD: local-development-only-root
    volumes:
      - wc_dev_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [wc_dev]

  wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-development-only
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "127.0.0.1:${WC_DEV_PORT:-8088}:80"
    volumes:
      - wc_dev_wp:/var/www/html
    networks: [wc_dev]

  wpcli:
    image: ${WORDPRESS_CLI_IMAGE:-wordpress:cli}
    profiles: ["local-tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-development-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wc_dev_wp:/var/www/html
    networks: [wc_dev]
    entrypoint: ["wp"]

volumes:
  wc_dev_db:
  wc_dev_wp:

networks:
  wc_dev:
    driver: bridge
