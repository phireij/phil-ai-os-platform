# MC-021 live-status connector.  No host port is published and no tunnel or
# runtime key is present here. Traefik is the only approved public HTTPS entry
# point and forwards only the OAuth-protected MCP route and its metadata.
# The process can make only the manifest's two fixed HTTPS GET probes after an
# authenticated tool call.
name: phil-ai-os-mc021-live-status-nonprod

services:
  mcp-live-status:
    build:
      context: ../..
      dockerfile: Dockerfile.mission-control-cto-mcp-live-status
    image: phil-ai-os/mc021-live-status:nonprod
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    restart: unless-stopped
    environment:
      # Bind within Docker's bridge network for Traefik only. No host port is
      # published, and the listener rejects every other bind shape in code.
      MCP_LISTEN_HOST: 0.0.0.0
      MCP_AUTHORIZATION_ISSUER: https://dev-81f0leykwbfdtibz.jp.auth0.com/
      MCP_AUTHORIZATION_JWKS_URI: https://dev-81f0leykwbfdtibz.jp.auth0.com/.well-known/jwks.json
      # Tunnel-client may fetch only the existing Auth0 issuer metadata while
      # resolving the private MCP server's OAuth discovery document.
      MCP_OAUTH_TRUSTED_ORIGINS: https://dev-81f0leykwbfdtibz.jp.auth0.com
      MCP_LIVE_STATUS_MANIFEST_PATH: /srv/mission-control/live-status-manifest.json
      MCP_OWNER_SUBJECT_FILE: /run/secrets/mc021_owner_subject
    volumes:
      - type: bind
        source: /etc/phil-ai-os/secrets/mc021-owner-subject
        target: /run/secrets/mc021_owner_subject
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8788/healthz', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.docker.network: "bridge"
      traefik.http.routers.mcp-live-status.entrypoints: "web,websecure"
      traefik.http.routers.mcp-live-status.rule: "Host(`miscon.phireij.cloud`) && Path(`/mcp/live-status`)"
      traefik.http.routers.mcp-live-status.priority: "200"
      traefik.http.routers.mcp-live-status.tls: "true"
      traefik.http.routers.mcp-live-status.tls.certresolver: "letsencrypt"
      traefik.http.routers.mcp-live-status.middlewares: "mcp-live-status-rewrite"
      traefik.http.routers.mcp-live-status.service: "mcp-live-status"
      traefik.http.middlewares.mcp-live-status-rewrite.replacepathregex.regex: "^/mcp/live-status$"
      traefik.http.middlewares.mcp-live-status-rewrite.replacepathregex.replacement: "/mcp"
      traefik.http.routers.mcp-live-status-metadata.entrypoints: "web,websecure"
      traefik.http.routers.mcp-live-status-metadata.rule: "Host(`miscon.phireij.cloud`) && Path(`/.well-known/oauth-protected-resource/mcp/live-status`)"
      traefik.http.routers.mcp-live-status-metadata.priority: "200"
      traefik.http.routers.mcp-live-status-metadata.tls: "true"
      traefik.http.routers.mcp-live-status-metadata.tls.certresolver: "letsencrypt"
      traefik.http.routers.mcp-live-status-metadata.service: "mcp-live-status"
      traefik.http.services.mcp-live-status.loadbalancer.server.port: "8788"
      com.phil-ai-os.scope: "mc021-live-status-nonprod"
      com.phil-ai-os.authority: "none"
    network_mode: bridge
